[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malloy-publisher-sdk"
version = "0.1.0"
requires-python = ">=3.9"
description = "Auto-generated Python client for the Malloy Publisher REST API"
authors = [
    {name = "Malloy Publisher", email = "xxx@ms2.co"}
]
maintainers = [
    {name = "Malloy Publisher", email = "xxx@ms2.co"}
]
license = {text = "MIT"}
readme = "README.md"
homepage = "https://github.com/malloydata/publisher"
repository = "https://github.com/malloydata/publisher"
documentation = "https://malloydata.github.io/malloy/"
keywords = ["malloy", "api", "client", "sdk", "rest", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]

# Runtime dependencies generated client relies on
dependencies = [
    "httpx>=0.25.0",
    "attrs>=23.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.1",  # for mocking httpx
    "hypothesis>=6.82.0"  # property-based testing
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.22.0"
]
dev = [
    "openapi-python-client>=0.18.0",
    "openapi-spec-validator>=0.7.1",
    "black>=24.4.0",
    "ruff>=0.4.1",
    "pyright>=1.1.360"
]

[project.urls]
"Bug Reports" = "https://github.com/malloydata/publisher/issues"
"Source" = "https://github.com/malloydata/publisher"
"Documentation" = "https://malloydata.github.io/malloy/"

[tool.pytest.ini_options]
addopts = "--cov=malloy_publisher_sdk"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]

[tool.coverage.run]
source = ["malloy_publisher_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
# Można dodać opcję generowania raportu XML dla CI:
# xml = "coverage.xml"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pyright]
typeCheckingMode = "strict"

[tool.hatch.metadata]
allow-direct-references = true

# Almost none of this package is in git. .gitignore here is
# `malloy_publisher_sdk/*` with `!malloy_publisher_sdk/__init__.py`, because
# everything else under that directory is generated from ../../api-doc.yaml by
# scripts/build-python-sdk.sh and is not committed.
#
# Hatchling's default file selection CONSULTS .gitignore, so without ignore-vcs
# the generated client is excluded from the artifacts even when it is sitting
# right there on disk. Measured: a build with client.py and api/ present ships a
# wheel containing exactly __init__.py — which then imports .client and raises
# ModuleNotFoundError on the user's first import. `packages` alone does NOT fix
# it; the ignore rules still apply. This mattered the moment release.yml started
# publishing this package, because a PyPI filename can never be reused.
[tool.hatch.build]
ignore-vcs = true

# ignore-vcs stops .gitignore from excluding anything, so both targets say
# explicitly what to ship. Otherwise .venv/, dist/, __pycache__ and *.bak become
# candidates. Verified against a tree containing all four.
[tool.hatch.build.targets.wheel]
packages = ["malloy_publisher_sdk"]

[tool.hatch.build.targets.sdist]
include = ["malloy_publisher_sdk", "pyproject.toml", "README.md", "LICENSE"]
