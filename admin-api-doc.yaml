openapi: 3.1.0
info:
  title: Malloy Publisher - Admin API
  description: |
    The operator's surface. It holds two kinds of thing, neither of which a user
    of a running server should call: the DuckLake catalogs in one Postgres
    database, as resources (a catalog, its schemas, the tables in them, and its
    snapshots), and controls of this server's own process that only an operator
    or a local developer uses (watch mode).

    **Catalogs** are resources the server manages but does not own. Create a
    catalog deliberately (encrypted, with the schemas you want), load a file into
    a table, see what a catalog holds and how much, drop tables, and reclaim the
    storage behind its history. None of this touches this server's environments,
    packages or connections: a model reads a catalog through a DuckLake
    connection, and a build writes one through a storage destination, in the
    main API (`api-doc.yaml`).

    **Watch mode** is for local development; `--watch-env` at boot is the usual
    way to turn it on. The live-reload event stream an open dashboard listens to
    stays on the main API.

    **Configuration, not requests, says where the catalogs are.** The listener
    starts only when `PUBLISHER_ADMIN_PORT` is set. `PUBLISHER_ADMIN_CATALOG_DATABASE`
    is a libpq connection string for the Postgres database holding the catalogs,
    and `PUBLISHER_ADMIN_STORAGE_*` is the credential for their data paths. No
    request carries a credential and no response returns one.

    **A catalog is found, not registered.** Every schema of the catalog database
    that holds DuckLake's `ducklake_metadata` table is a catalog, named by that
    schema. Its data path, encryption, format version and settings are what it
    recorded at its creation. When the configured role is not the schema's
    owner, every session acts as the owner (libpq `options=-crole=<owner>`), so
    tables keep the ownership and grants their catalog was set up with.

    **Security.** The listener is unauthenticated and binds loopback unless
    `PUBLISHER_ADMIN_HOST` widens it, which `PUBLISHER_HOST` does not do. It can
    drop tables, so keep it on loopback or behind an authenticating proxy.
  version: v0
servers:
  - url: http://localhost:4050/api/v0
    description: Admin listener (PUBLISHER_ADMIN_PORT)

tags:
  - name: catalogs
    description: DuckLake catalogs and their settings
  - name: schemas
    description: The schemas of a catalog
  - name: tables
    description: The tables in a catalog's schemas
  - name: snapshots
    description: A catalog's history, and the storage behind it
  - name: watch-mode
    description: File watching for local development, an operator's control of this process

paths:
  /catalogs:
    get:
      tags: [catalogs]
      operationId: list-catalogs
      summary: List the catalogs in the catalog database
      description: |
        Every DuckLake catalog in the configured catalog database, in name order,
        with what each records and the bytes it holds. One catalog is read at a
        time, so a long list never becomes many concurrent queries on the
        catalog database.
      responses:
        "200":
          description: The catalogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Catalog"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [catalogs]
      operationId: create-catalog
      summary: Create a catalog
      description: |
        Creates a DuckLake catalog in the schema `name`, with its data under
        `dataPath`. Encryption is fixed now and cannot be changed later; the
        inlining limit and file-deletion grace are recorded in the catalog and
        can be changed with PATCH. With no `dataInliningRowLimit` the catalog
        records 0, so every table is written as files. Each schema named is created. The schema may
        already exist, empty (created by whoever provisioned its owner role); the
        catalog's tables are then owned by that role. `409 CATALOG_EXISTS` when a
        catalog is already there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCreate"
      responses:
        "201":
          description: The catalog, as it records itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}:
    parameters:
      - $ref: "#/components/parameters/catalogName"
    get:
      tags: [catalogs]
      operationId: get-catalog
      summary: Get a catalog
      description: What the catalog records, the bytes it holds, and its schemas.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [catalogs]
      operationId: update-catalog
      summary: Change a catalog's settings
      description: |
        Records a new inlining limit or file-deletion grace in the catalog, where
        every later attach reads it. Encryption and the data path are fixed at
        creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogUpdate"
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/schemas/{schemaName}:
    parameters:
      - $ref: "#/components/parameters/catalogName"
      - $ref: "#/components/parameters/schemaName"
    put:
      tags: [schemas]
      operationId: put-schema
      summary: Create a schema
      description: |
        Creates the schema. The name is lowercase
        (`[a-z_][a-z0-9_]*`) and not reserved (`main`, `memory`,
        `information_schema`, `pg_catalog`, `temp`, `system`, or a name starting
        `__ducklake_metadata_`: `400 SCHEMA_RESERVED`). The request has
        no body; a body is `400 INVALID_REQUEST`. `201` when the schema is new,
        `200` when it already existed; with `If-None-Match: *` an existing
        schema, including one a concurrent request created first, is refused
        with `412 SCHEMA_EXISTS`.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: "`*` to create only, refusing a schema that exists."
          schema:
            type: string
            enum: ["*"]
      responses:
        "200":
          description: The schema already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schema"
        "201":
          description: The schema, created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schema"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: "`If-None-Match: *` and the schema exists (`SCHEMA_EXISTS`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [schemas]
      operationId: delete-schema
      summary: Drop a schema and its tables
      description: |
        Drops the schema and every table in it. A schema that does not exist
        answers 204 as well, so a retried drop is free. A reserved name is `400
        SCHEMA_RESERVED`. Data files stay until a snapshot delete reclaims
        them, as for a dropped table.
      responses:
        "204":
          description: The schema is dropped, or did not exist
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/tables:
    parameters:
      - $ref: "#/components/parameters/catalogName"
    get:
      tags: [tables]
      operationId: list-catalog-tables
      summary: List the tables in every schema of a catalog
      description: |
        Every table of the catalog's schemas, in schema then name order, each
        with the bytes its live files hold. The engine's own schemas are left out.
      responses:
        "200":
          description: The tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogTableSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/schemas/{schemaName}/tables:
    parameters:
      - $ref: "#/components/parameters/catalogName"
      - $ref: "#/components/parameters/schemaName"
    get:
      tags: [tables]
      operationId: list-tables
      summary: List the tables in a schema
      description: The schema's tables in name order, each with the bytes its live files hold.
      responses:
        "200":
          description: The tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/schemas/{schemaName}/tables/{tableName}:
    parameters:
      - $ref: "#/components/parameters/catalogName"
      - $ref: "#/components/parameters/schemaName"
      - $ref: "#/components/parameters/tableName"
    get:
      tags: [tables]
      operationId: get-table
      summary: Get a table
      description: The table's columns, its partition spec, and its row count when the catalog records one.
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [tables]
      operationId: put-table
      summary: Create or replace a table from a source
      description: |
        Writes the table from `source`: one CSV, Parquet, Excel or JSON object
        under the catalog's data path, the only location the session can read;
        or a table of a catalog in the same catalog database (a migration's
        copy: from another catalog, attached read-only as its own owner, or
        from within this one). A missing source catalog, schema or table is
        `404 SOURCE_NOT_FOUND`; a source catalog owned by a role the configured
        role cannot act as is `409 CATALOG_OWNER_UNSUPPORTED`; and a copy from an
        encrypted catalog into an unencrypted one is refused (`400
        INVALID_REQUEST`), since it would write the rows unencrypted. A copy
        keeps the source table's partition spec and writes its rows in
        partition order; a partitioned table copied onto itself is refused
        (`400 INVALID_REQUEST`). Either way
        the bytes are rewritten as the catalog's own Parquet, never registered
        in place and never left as rows in the catalog database, so an
        encrypted catalog stays encrypted. One DuckLake transaction:
        a reader sees the old table or the new one. A file the reader refuses
        (not the format it claims, a value it cannot convert, an Excel `sheet`
        the workbook lacks or a sheet with no rows) or an object that does not
        exist is `422 OBJECT_UNREADABLE` carrying the reader's own
        message, with the object named by its file name: the request is
        well-formed but the named data cannot be applied, so correct the
        object, don't retry. A `500` is a failure a
        retry may cure (storage unavailable or throttled, a refused credential,
        a full spill disk), and a retry is safe: it writes the whole table from
        the same object again. `201` when the table is new,
        `200` when it replaced one; with `If-None-Match: *` an existing table is
        refused with `412 TABLE_EXISTS`. Synchronous: it answers when the table
        is written.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: "`*` to create only, refusing a table that exists."
          schema:
            type: string
            enum: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableWrite"
      responses:
        "200":
          description: The table, replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "201":
          description: The table, created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A copy's source catalog is owned by a role the configured role cannot act as (`CATALOG_OWNER_UNSUPPORTED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: "`If-None-Match: *` and the table exists (`TABLE_EXISTS`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The source object is missing, is not the format it claims, or holds a value its column cannot (`OBJECT_UNREADABLE`); nothing was written, and a retry fails the same way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No catalog database is configured (`CATALOG_DATABASE_NOT_CONFIGURED`), or this server is already running a load or copy (`LOAD_BUSY`); the write was refused, not queued, so retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [tables]
      operationId: delete-table
      summary: Drop a table
      description: |
        Drops the table. A table that does not exist answers 204 as well, so a
        retried drop is free. Its data files stay until a snapshot delete
        reclaims them, which is also the window in which the table can still be
        read at an earlier snapshot.
      responses:
        "204":
          description: The table is dropped, or did not exist
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/schemas/{schemaName}/tables/{tableName}/loads:
    parameters:
      - $ref: "#/components/parameters/catalogName"
      - $ref: "#/components/parameters/schemaName"
      - $ref: "#/components/parameters/tableName"
    post:
      tags: [tables]
      operationId: load-table
      summary: Apply Parquet objects to a table by key
      description: |
        Applies Parquet objects under the catalog's data path to the table,
        creating it when it does not exist. `merge` upserts the objects' rows by
        `key`; `replace` makes the table equal to the objects, by `key` when one
        is given and as a whole table when not (a replace is the whole stream in
        one call). A replace that would delete more rows than `maxDeletedRows`
        is refused and writes nothing.

        Rows the objects do not change are left as they are, so a load repeated
        after it committed, with no other load of the same table committed in
        between, finds nothing to do, writes nothing and takes no snapshot. It
        reports the same `rowCount` and `cursorMax` as the first call, with
        every row counted in `rowsUnchanged` and none inserted, replaced or
        deleted, and still answers `201`. A retry is safe because it finds
        nothing to change.
        Of two rows of one key, the later one wins: the later object in
        `objects`, then the later row of an object. A key stored more than once
        is rewritten once.

        The objects are checked against the table's columns before anything is
        written. A column the table lacks is added, even when no row changes.
        A column it has keeps its type when the objects type it the same or
        narrower, losslessly, and is widened to the objects' type when that is
        a lossless widening of the table's: a wider integer, a decimal with no
        fewer integer or fraction digits, an integer into a decimal or DOUBLE
        that holds all its digits, FLOAT into DOUBLE, a longer varying text.
        The widening is recorded in the same commit as the rows and rewrites no
        file already written; a table's type never narrows. Objects that type one column differently
        (BIGINT in one, DOUBLE in another) must each widen losslessly into the
        type they are read together as. Every `key` column must be a column of
        both; no key may be NULL; and `cursor`, when given, must be an integer,
        DATE or TIMESTAMP column. A column of the table the objects lack is
        written NULL. A column typed NULL in every object (as a Parquet writer
        writes an all-NULL column) is ignored, and objects that leave no column
        are refused. A column of the table named `__publisher_…` is refused.
        Refusals are `422 LOAD_COLUMN_MISMATCH`, whose `detail` names the column
        and why.

        One table loads at a time, across every replica of this server (a
        Postgres advisory lock in the catalog database), and one load runs at a
        time on this server (the same slot a table PUT's load or copy takes). A
        load that finds either busy is refused with `503 LOAD_BUSY` and nothing
        written, never queued: retry it. A load whose lock is lost before it
        commits rolls back and answers the same. The load reads the table inside
        the transaction that writes it, so one that races a table PUT or DELETE
        of the same table, or a schema drop, on another replica is refused by
        DuckLake at its commit and answers `409 LOAD_CONFLICT`: nothing was
        written, and a retry is safe. A schema dropped before that transaction
        begins answers `404 SCHEMA_NOT_FOUND`.

        A load runs in a session bounded to `PUBLISHER_ADMIN_MEMORY_LIMIT` of
        memory (default 1.5 GB) or the operator's lower
        `PUBLISHER_DUCKDB_MEMORY_LIMIT`, and `PUBLISHER_ADMIN_MAX_TEMP_DIRECTORY_SIZE`
        of spill (default 6 GiB). A keyed load stays within the spill limit by
        comparing columns in passes; a keyless replace of a table larger than
        the session's memory can exceed it, so give a large stream a `key`. A
        load that outgrows either limit answers `500`. A `500` before the
        commit writes nothing; one from the flush after it may follow a
        committed load. Either way a retry after any `500` is safe.

        Synchronous: it answers `201` once the rows are committed, with the
        counts of what changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadRequest"
      responses:
        "201":
          description: The load's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Load"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DuckLake refused the commit because another request changed the table (replaced, dropped or created it) while the load ran (`LOAD_CONFLICT`); nothing was written, retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The load was refused, and nothing was written: the objects' columns do not
            match the table's (`LOAD_COLUMN_MISMATCH`, with `detail`), a replace would delete more
            rows than allowed (`LOAD_DELETE_LIMIT_EXCEEDED`, with `detail`), or an object could
            not be read (`OBJECT_UNREADABLE`, naming the object by its index, not its URI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No catalog database is configured (`CATALOG_DATABASE_NOT_CONFIGURED`), or another load of this table or on this server is running (`LOAD_BUSY`); the load was refused, not queued, so retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /catalogs/{catalogName}/snapshots:
    parameters:
      - $ref: "#/components/parameters/catalogName"
    get:
      tags: [snapshots]
      operationId: list-snapshots
      summary: List a catalog's snapshots
      description: The newest first, each with its time, what it changed, and its author and commit message when it has them.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many, from 1 to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [snapshots]
      operationId: delete-snapshots
      summary: Delete old snapshots, and the storage only they held
      description: |
        Expires every snapshot older than `olderThan` (never the latest), which
        retires the data files only those snapshots referenced. Then deletes the
        files that have been retired for longer than the catalog's
        `fileDeletionGrace` (`1 day` when it records none), so a reader still
        scanning a file of a just-expired snapshot is not cut off; files this
        call retires go on a later call. Only files the catalog itself recorded
        and retired are deleted, never an untracked file under the data path.
      parameters:
        - name: olderThan
          in: query
          required: true
          description: Expire the snapshots taken before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: What was reclaimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDeletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /watch-mode:
    get:
      tags: [watch-mode]
      operationId: get-watch-mode
      summary: Get watch mode
      description: |
        What this process watches for local development: whether watching is on,
        the environment, and the path it monitors. `--watch-env` at boot is the
        usual way to turn it on.
      responses:
        "200":
          description: Watch mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchMode"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [watch-mode]
      operationId: put-watch-mode
      summary: Set the watched environment
      description: |
        Watches the named environment's package directories and reloads a package
        when its files change, replacing any other watch: one environment at a
        time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchModeUpdate"
      responses:
        "200":
          description: Watch mode, now watching the environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchMode"
        "400":
          description: No environment name, or one that is not a safe name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such environment, or one with no packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [watch-mode]
      operationId: delete-watch-mode
      summary: Turn watch mode off
      description: Stops watching and releases its resources. Idempotent.
      responses:
        "204":
          description: Watch mode is off
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    catalogName:
      name: catalogName
      in: path
      required: true
      description: The catalog's name, the schema of the catalog database that holds it.
      schema:
        $ref: "#/components/schemas/Identifier"
    schemaName:
      name: schemaName
      in: path
      required: true
      description: A schema in the catalog (`main` is DuckLake's default).
      schema:
        $ref: "#/components/schemas/Identifier"
    tableName:
      name: tableName
      in: path
      required: true
      description: A table in the schema.
      schema:
        $ref: "#/components/schemas/Identifier"

  responses:
    BadRequest:
      description: The request is malformed, including a catalog, schema or table name that is not a plain identifier (`INVALID_REQUEST`), or names an object outside the catalog's data path (`OBJECT_OUTSIDE_DATA_PATH`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such catalog (`CATALOG_NOT_FOUND`), schema (`SCHEMA_NOT_FOUND`) or table (`TABLE_NOT_FOUND`), or no such source for a table write (`SOURCE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The catalog already exists (`CATALOG_EXISTS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotConfigured:
      description: No catalog database is configured (`CATALOG_DATABASE_NOT_CONFIGURED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: The server encountered an internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Identifier:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      description: A plain identifier

    Catalog:
      type: object
      description: A DuckLake catalog, as it records itself
      required: [name, dataPath, encrypted, formatVersion, sizeBytes]
      properties:
        name:
          type: string
          description: The schema of the catalog database that holds it
        dataPath:
          type: string
          description: Where its files live, recorded at its creation
        encrypted:
          type: boolean
          description: Whether its files are encrypted; fixed at its creation
        formatVersion:
          type: string
          description: DuckLake's catalog format version
        dataInliningRowLimit:
          type: integer
          description: Writes of up to this many rows are kept in the catalog database rather than as files
        fileDeletionGrace:
          type: string
          description: How long a retired file is kept before a snapshot delete removes it, e.g. `1 day`
        sizeBytes:
          type: integer
          format: int64
          description: |
            Bytes the catalog holds: every data and delete file it records, live
            or retired but not yet deleted, plus rows inlined in the catalog
            database
        schemas:
          type: array
          items:
            type: string
          description: Its schemas; on a single catalog's read only

    CatalogCreate:
      type: object
      required: [name, dataPath]
      properties:
        name:
          $ref: "#/components/schemas/Identifier"
        dataPath:
          type: string
          description: Where its files will live, e.g. `s3://bucket/prefix` or a local directory
        encrypted:
          type: boolean
          default: true
        dataInliningRowLimit:
          type: integer
          minimum: 0
        fileDeletionGrace:
          type: string
          description: An interval like `1 day` or `12 hours`
        schemas:
          type: array
          items:
            type: string
            pattern: "^[a-z_][a-z0-9_]*$"
          description: Schemas to create beside `main`, named as for a schema PUT (a reserved name is `400 SCHEMA_RESERVED`)

    CatalogUpdate:
      type: object
      properties:
        dataInliningRowLimit:
          type: integer
          minimum: 0
        fileDeletionGrace:
          type: string
          description: An interval like `1 day` or `12 hours`

    Schema:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CatalogTableSummary:
      allOf:
        - type: object
          required: [schema]
          properties:
            schema:
              type: string
        - $ref: "#/components/schemas/TableSummary"

    TableSummary:
      type: object
      required: [name, sizeBytes]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
          description: Bytes its live files hold

    Table:
      type: object
      required: [schema, name, columns, partitionedBy]
      properties:
        schema:
          type: string
        name:
          type: string
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
        rowCount:
          type: integer
          format: int64
          description: When the catalog records one
        partitionedBy:
          type: array
          description: The table's partition spec in key order; empty when it is not partitioned
          items:
            $ref: "#/components/schemas/PartitionKey"

    PartitionKey:
      type: object
      required: [column, transform]
      properties:
        column:
          type: string
        transform:
          type: string
          description: >-
            DuckLake's transform for the column: one of `identity`, `year`,
            `month`, `day`, `hour` or `bucket(N)`

    TableWrite:
      type: object
      required: [source]
      properties:
        source:
          oneOf:
            - $ref: "#/components/schemas/ObjectSource"
            - $ref: "#/components/schemas/CatalogTableSource"

    ObjectSource:
      type: object
      required: [uri, format]
      description: One object under the catalog's data path
      properties:
        uri:
          type: string
        format:
          type: string
          enum: [csv, parquet, xlsx, json]
        options:
          type: object
          description: An allowlist of typed reader options
          properties:
            header:
              type: boolean
            delimiter:
              type: string
            sheet:
              type: string
            skip:
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false

    CatalogTableSource:
      type: object
      required: [catalog, schema, table]
      description: |
        A table of a catalog in the same catalog database: the target catalog
        itself, or another one the configured role can act as the owner of.
        Added for one migration, moving an orchestrator's tables out of its
        legacy per-organization catalogs into per-database ones without
        rebuilding them; it can be removed once those legacy catalogs are dropped.
      properties:
        catalog:
          $ref: "#/components/schemas/Identifier"
        schema:
          $ref: "#/components/schemas/Identifier"
        table:
          $ref: "#/components/schemas/Identifier"
      additionalProperties: false

    LoadRequest:
      type: object
      required: [mode, objects]
      description: |
        A merge needs `key` and refuses `maxDeletedRows`; a replace needs
        `maxDeletedRows` and is keyless when `key` is omitted.
      properties:
        commitMessage:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000]*$'
          description: |
            The message of the snapshot the load commits, listed by
            `GET /snapshots` beside the author `publisher-admin`. `load
            <schema>.<table>` when absent. A load that changes nothing writes no
            snapshot, so records nothing. A message holding Malloy's statement
            separator (`-- hack: split on this`) is refused.
        mode:
          type: string
          enum: [merge, replace]
          description: |
            `merge` upserts by `key`. `replace` makes the table equal to this
            call's rows, by `key` when given, otherwise as a whole table.
        key:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z_][a-z0-9_]*$"
          description: The columns that identify a row; they are never NULL
        objects:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
          description: |
            Parquet objects under the catalog's data path. Their order decides
            which of two rows of one key is later: the later object's.
        cursor:
          type: string
          pattern: "^[a-z_][a-z0-9_]*$"
          description: An integer, DATE or TIMESTAMP column whose greatest value among the rows loaded is reported
        maxDeletedRows:
          type: integer
          minimum: 0
          description: |
            The most stored rows a replace may delete (the net shrink, for a
            keyless one); more is refused with `LOAD_DELETE_LIMIT_EXCEEDED`
      additionalProperties: false

    Load:
      type: object
      required:
        [
          rowsInserted,
          rowsReplaced,
          rowsUnchanged,
          rowsDeleted,
          rowCount,
          cursorMax,
        ]
      description: |
        What a load did, in rows. `rowCount` is the table's rows after the load,
        which is its rows before, plus `rowsInserted`, less `rowsDeleted`.
      properties:
        rowsInserted:
          type: integer
          format: int64
          description: Rows of keys the table did not have
        rowsReplaced:
          type: integer
          format: int64
          description: Rows written over a stored row of the same key, because a column differed
        rowsUnchanged:
          type: integer
          format: int64
          description: Rows the objects held that the table already held, left alone
        rowsDeleted:
          type: integer
          format: int64
          description: |
            Stored rows removed: the rows of keys a replace's objects lack, and
            the copies beyond one of a key that was stored more than once
        rowCount:
          type: integer
          format: int64
        cursorMax:
          type: ["string", "null"]
          description: |
            The greatest value of the request's `cursor` over the rows the load
            kept, as text: an integer in decimal, exact past 2^53; a DATE as
            `YYYY-MM-DD`; a TIMESTAMP as ISO 8601, in UTC with a `Z` when it has
            a time zone. Null when no `cursor` was given or every value is NULL.
        cursorType:
          type: string
          description: The cursor column's type as DuckDB names it (`BIGINT`, `DATE`, `TIMESTAMP WITH TIME ZONE`); present when a `cursor` was given

    Snapshot:
      type: object
      required: [id, time, changes]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        changes:
          type: object
          additionalProperties: true
          description: What it changed, as DuckLake records it (e.g. `tables_created`)
        author:
          type: ["string", "null"]
          description: Who committed it, as DuckLake records it (`publisher-admin` for a load); null when none was set
        commitMessage:
          type: ["string", "null"]
          description: The message the commit carried, such as a load's `commitMessage`; null when none was set

    SnapshotDeletion:
      type: object
      required: [snapshotsExpired, filesDeleted]
      properties:
        snapshotsExpired:
          type: integer
        filesDeleted:
          type: integer

    WatchMode:
      type: object
      description: What this process watches for local development
      required: [enabled, environmentName, watchingPath]
      properties:
        enabled:
          type: boolean
        environmentName:
          type: string
          description: The environment being watched; empty when off
        watchingPath:
          type: string
          description: The path being monitored; empty when off

    WatchModeUpdate:
      type: object
      required: [environmentName]
      properties:
        environmentName:
          type: string
          description: The environment to watch

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP status code, repeated in the body
        message:
          type: string
        reason:
          type: string
          description: |
            Machine-readable: CATALOG_NOT_FOUND, CATALOG_EXISTS,
            CATALOG_DATABASE_NOT_CONFIGURED, CATALOG_OWNER_UNSUPPORTED,
            CATALOG_SETTING_UNREADABLE, SCHEMA_NOT_FOUND, TABLE_NOT_FOUND,
            SOURCE_NOT_FOUND, TABLE_EXISTS, OBJECT_OUTSIDE_DATA_PATH,
            INVALID_REQUEST, SCHEMA_EXISTS, SCHEMA_RESERVED, LOAD_BUSY,
            LOAD_CONFLICT, LOAD_COLUMN_MISMATCH, LOAD_DELETE_LIMIT_EXCEEDED,
            OBJECT_UNREADABLE.
            `SCHEMA_EXISTS`: a create-only schema PUT found the schema.
            `SCHEMA_RESERVED`: the schema name is one the engine owns, `main`,
            or a name starting `__ducklake_metadata_`. `LOAD_BUSY` (503): another load of the table, or another
            load on this server, is running; nothing was written, retry.
            `LOAD_CONFLICT` (409): DuckLake refused the commit because
            another request (a table PUT or DELETE, a schema drop) changed
            the table while the load ran; nothing was written, retry. A schema
            dropped before the load's transaction began is `SCHEMA_NOT_FOUND` (404).
            `LOAD_COLUMN_MISMATCH` (422): the objects' columns do not match
            the table's; `detail` is a `ColumnMismatchDetail`.
            `LOAD_DELETE_LIMIT_EXCEEDED` (422): a replace would delete more rows than
            `maxDeletedRows`; `detail` is a `DeleteLimitDetail`.
            `OBJECT_UNREADABLE` (422, a table PUT or a load): an object is
            missing, not in the format it claims, or holds a value its column's
            type cannot. The request is well-formed but the named data cannot
            be applied: correct the object, don't retry. The message is
            DuckDB's, with each URI replaced by `objects[i]` (a file name on a
            PUT), and a load's `detail` is an `ObjectUnreadableDetail`.
            A storage failure (unavailable, throttled, a refused credential)
            or a full spill disk is a `500` instead, to retry.
            Treat an unrecognized value as absent.
        detail:
          description: Present on the refusals that carry what a caller can act on; its shape is per `reason`
          oneOf:
            - $ref: "#/components/schemas/ColumnMismatchDetail"
            - $ref: "#/components/schemas/DeleteLimitDetail"
            - $ref: "#/components/schemas/ObjectUnreadableDetail"

    ColumnMismatchDetail:
      type: object
      description: The `detail` of `LOAD_COLUMN_MISMATCH`, naming the column that breaks the table's contract and how
      required: [column, tableType, loadType, violation]
      properties:
        column:
          type: string
          description: The offending column; the folded name for a `case_collision`, and `""` for `no_columns`
        tableType:
          type: ["string", "null"]
          description: The table's type of the column; null when the table has no such column
        loadType:
          type: ["string", "null"]
          description: The objects' type of the column; null when the objects have no such column
        violation:
          type: string
          enum:
            - null_key
            - missing_key
            - missing_cursor
            - cursor_type
            - type_change
            - reserved_name
            - case_collision
            - no_columns
          description: |
            `null_key`: a `key` column is NULL in a row of the objects.
            `missing_key`: a `key` column is not a column of the objects, or of
            the table when it exists. `missing_cursor`:
            the `cursor` is not a column of the objects. `cursor_type`: the
            `cursor` is not an integer, DATE or TIMESTAMP column.
            `type_change`: a type that does not widen losslessly, against the
            table's column, or between two objects (`tableType` is then null).
            `reserved_name`: a column name starting `__publisher_` (in the
            objects, or in the table), or `file_row_number`, `rowid` or one
            holding a NUL. `case_collision`: two names, in one object or two,
            that differ only by case, or one name twice in an object.
            `no_columns`: the objects leave no column.

    DeleteLimitDetail:
      type: object
      description: The `detail` of `LOAD_DELETE_LIMIT_EXCEEDED`
      required: [wouldDelete, rowsBefore, maxDeletedRows]
      properties:
        wouldDelete:
          type: integer
          format: int64
          description: The stored rows the replace would delete
        rowsBefore:
          type: integer
          format: int64
          description: The table's rows before the load
        maxDeletedRows:
          type: integer
          format: int64
          description: The request's limit

    ObjectUnreadableDetail:
      type: object
      description: The `detail` of a load's `OBJECT_UNREADABLE`. Absent when the reader's message names no object of the request
      required: [object]
      properties:
        object:
          type: integer
          minimum: 0
          description: The index of the unreadable object in the request's `objects`
