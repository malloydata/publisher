      weaknesses before 0.23.0. Publisher runs no thrift server, and the Databricks
      client sends only operator-configured headers to the operator-configured
      warehouse host. Fixed in thrift 0.23.0, unreachable until the Malloy Databricks
      driver moves to @databricks/sql 2.x.
