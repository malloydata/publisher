  - id: CVE-2026-41636
    paths: ["bun.lock", "publisher/node_modules/thrift/package.json"]
    expired_at: 2026-12-31
    statement: >
      thrift 0.16.0, via @malloydata/db-databricks -> @databricks/sql 1.15.0.
      Uncontrolled recursion in the Node.js skip(), reached only when decoding a
      response from a Databricks endpoint, which an operator configures on a
      Databricks connection. Denial of service by a malicious or compromised
      warehouse, not by a query caller. Fixed in thrift 0.23.0, unreachable until the
      Malloy Databricks driver moves to @databricks/sql 2.x.
  - id: CVE-2026-43870
    paths: ["bun.lock", "publisher/node_modules/thrift/package.json"]
