  # HIGH, runtime. extract-zip 2.0.1 is the latest release and neither CVE has a fix.
  # Both need a symlink entry in the archive, and unzipEnvironment in
  # packages/server/src/service/environment_store.ts refuses any archive containing
  # one before it is written (environment_store_unzip.spec.ts), which is the
  # compensating control. The expiry forces a decision on replacing extract-zip with
  # yauzl directly rather than carrying the guard indefinitely.
  - id: CVE-2026-19693
    paths: ["bun.lock", "publisher/node_modules/extract-zip/package.json"]
    expired_at: 2027-03-31
    statement: >
      extract-zip 2.0.1, a direct dependency of packages/server, used to unzip
      environment and package archives. Arbitrary file write through a symlink entry
      followed by a same-named file. Mitigated, not fixed: the server rejects any
      archive with a symlink entry before extracting it, and removes the partial
      extract. No patched extract-zip release exists.
  - id: CVE-2026-56876
    paths: ["bun.lock", "publisher/node_modules/extract-zip/package.json"]
    expired_at: 2027-03-31
    statement: >
      extract-zip 2.0.1, a direct dependency of packages/server, used to unzip
      environment and package archives. Symlink targets are not validated, so a
      symlink entry can point outside the destination. Mitigated, not fixed: the
      server rejects any archive with a symlink entry before extracting it. No patched
      extract-zip release exists.
  # HIGH, runtime, held by Malloy's exact pins: @malloydata/db-databricks 0.0.434 (the
