# syntax=dhi.io/build:2-debian13

# Docker Hardened Images catalog definition for Malloy Publisher: the file a
# PR to github.com/docker-hardened-images/catalog carries, at
# image/malloy-publisher/debian-13/0.yaml. The dev variant beside it
# (0-dev.yaml) is generated from this file by ../../../render-dev.py; edit
# this one. docker/dhi-catalog/README.md says how to build it locally and how
# the submission works.
#
# It builds the same thing the root Dockerfile builds, in the catalog's own
# pipeline language: Publisher from its release tag, the DuckDB extensions
# baked, the Snowflake ADBC driver behind its shim, the DuckDB CLI, git. What
# differs from the Dockerfile is only where things come from: packages from the
# DHI Debian repository, Bun verified against its signed checksums the way
# dhi.io/bun does it, and ownership set by `paths` rather than chown.

name: Malloy Publisher 0.x
image: dhi.io/malloy-publisher
variant: runtime
tags:
  - "0"
  - "0.9"
  - 0.9.12
  - 0-debian
  - 0-debian13
  - 0.9-debian
  - 0.9-debian13
  - 0.9.12-debian
  - 0.9.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-15"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.9"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.9.12
  VERSION: 0.9.12
  # The commit the v0.9.12 tag names, pinned so the tag cannot move under the build.
  COMMIT_SHA: de73e2314612c5b3367fdad931a9a34014324b57
  BUN_VERSION: 1.4.3
  BUN_ARCH: '#{ target.arch == "amd64" ? "x64-baseline" : "aarch64" }'
  # The DuckDB CLI version is the query engine's (@duckdb/node-api in the
  # release's bun.lock); scripts/duckdb-version.js in the source tree derives
  # it. Bump it with the release.
  DUCKDB_VERSION: 1.5.5
  DUCKDB_SHA256: '#{ target.arch == "amd64" ? "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05" : "02163197027a42149147364d31fa67cac82108517a4be43304a1cc226eaef07a" }'
  ADBC_SNOWFLAKE_VERSION: 1.12.0
  ADBC_SHA256: '#{ target.arch == "amd64" ? "9f3b44bd2c5d1a84acd1dadf7b9995e47bad78ca37f799c9e8460ac196fd319c" : "7648311005788d9576ee06ced1efd0f4f5849a5e70ef9946abad08588e312283" }'
  ADBC_HEADER_SHA256: b6ce3eb8394d4877af1693654d34bc11648a2dfb1f0eacc0c47d062ca69feb71
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - coreutils
    - libstdc++6
    # A `github` package location is cloned through git (simple-git shells out
    # to it). The runtime has nothing else from the git image: no curl, no
    # git-lfs.
    - git
    - libcurl3t64-gnutls
    - libpcre2-8-0
  builds:
    # Bun, verified the way dhi.io/bun verifies it: the release's SHASUMS256
    # signed by the Bun release key.
    - name: bun
      contents:
        packages:
          - bash
          - coreutils
          - unzip
          - grep
          - gpg
          - gpg-agent
        files:
          - url: https://keys.openpgp.org/vks/v1/by-fingerprint/F3DCC08A8572C0749B3E18888EAB4D40A7B22B59
            path: ${source.dir}/keys/bun-key.asc
            uid: 0
            gid: 0
          - url: https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/SHASUMS256.txt.asc
            path: ${source.dir}/SHASUMS256.txt.asc
            uid: 0
            gid: 0
          - url: https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-${BUN_ARCH}.zip
            path: ${source.dir}/bun-linux-${BUN_ARCH}.zip
            spdx:
              name: bun
              version: ${BUN_VERSION}
              packages:
                - name: bun
                  purl: pkg:dhi/bun@${BUN_VERSION}
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME

            gpg --batch --import "${source.dir}/keys/bun-key.asc"
            gpg --batch --decrypt --output "${source.dir}/SHASUMS256.txt" "${source.dir}/SHASUMS256.txt.asc"

            grep " bun-linux-${BUN_ARCH}.zip\$" "${source.dir}/SHASUMS256.txt" | sha256sum -c -
            unzip "${source.dir}/bun-linux-${BUN_ARCH}.zip"

            mkdir -p "${target.dir}/usr/local/bin"
            mv "bun-linux-${BUN_ARCH}/bun" "${target.dir}/usr/local/bin/bun"
            chmod +x "${target.dir}/usr/local/bin/bun"

            ln -s "bun" "${target.dir}/usr/local/bin/bunx"
            mkdir -p "${target.dir}/usr/local/bun-node-fallback-bin"
            ln -s "../bin/bun" "${target.dir}/usr/local/bun-node-fallback-bin/node"
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bun-node-fallback-bin
          target: /usr/local/bun-node-fallback-bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom
          target: /opt/docker/sbom
          uid: 0
          gid: 0

    # Publisher itself: the server bundle, the console, the production
    # node_modules, the baked DuckDB extensions, the Snowflake ADBC driver and
    # its shim, the DuckDB CLI, and the RDS CA bundle.
    - name: malloy-publisher
      work-dir: ${source.dir}/publisher
      caches:
        - path: /root/.bun/install/cache
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - gcc
          - git
          - gpg
          - gpg-agent
          - grep
          - gzip
          - libc6-dev
          - openjdk-21-jdk-headless
          - sed
          - tar
          - unzip
        files:
          - url: git+https://github.com/malloydata/publisher.git#v${VERSION}
            checksum: ${COMMIT_SHA}
            path: ${source.dir}/publisher
            spdx:
              name: malloy-publisher
              version: ${VERSION}
              packages:
                - name: malloy-publisher
                  purl: pkg:dhi/malloy-publisher@${VERSION}
                  license: MIT
            uid: 0
            gid: 0
          # The same Bun the runtime gets, to build with. Verified against the
          # same signed checksum list.
          - url: https://keys.openpgp.org/vks/v1/by-fingerprint/F3DCC08A8572C0749B3E18888EAB4D40A7B22B59
            path: ${source.dir}/keys/bun-key.asc
            uid: 0
            gid: 0
          - url: https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/SHASUMS256.txt.asc
            path: ${source.dir}/SHASUMS256.txt.asc
            uid: 0
            gid: 0
          - url: https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-${BUN_ARCH}.zip
            path: ${source.dir}/bun-linux-${BUN_ARCH}.zip
            uid: 0
            gid: 0
          # The Snowflake ADBC driver: a 16MB native library dlopen'd into the
          # server, pinned by digest because a release asset can be re-uploaded
          # under its tag.
          - url: https://github.com/adbc-drivers/snowflake/releases/download/go/v${ADBC_SNOWFLAKE_VERSION}/snowflake_linux_${target.arch}_v${ADBC_SNOWFLAKE_VERSION}.tar.gz
            checksum: sha256:${ADBC_SHA256}
            path: ${source.dir}/adbc-snowflake.tar.gz
            spdx:
              name: adbc-driver-snowflake
              version: ${ADBC_SNOWFLAKE_VERSION}
              packages:
                - name: adbc-driver-snowflake
                  purl: pkg:github/adbc-drivers/snowflake@go/v${ADBC_SNOWFLAKE_VERSION}
                  license: Apache-2.0
            uid: 0
            gid: 0
          # The DuckDB CLI, at the engine's version so it reads the same
          # ~/.duckdb/extensions/v<version>/ directory the server bakes.
          - url: https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-${target.arch}.zip
            checksum: sha256:${DUCKDB_SHA256}
            path: ${source.dir}/duckdb_cli.zip
            spdx:
              name: duckdb-cli
              version: ${DUCKDB_VERSION}
              packages:
                - name: duckdb-cli
                  purl: pkg:github/duckdb/duckdb@v${DUCKDB_VERSION}
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bun for the build
          runs: |
            set -eux -o pipefail

            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            gpg --batch --import "${source.dir}/keys/bun-key.asc"
            gpg --batch --decrypt --output "${source.dir}/SHASUMS256.txt" "${source.dir}/SHASUMS256.txt.asc"
            grep " bun-linux-${BUN_ARCH}.zip\$" "${source.dir}/SHASUMS256.txt" | (cd "${source.dir}" && sha256sum -c -)

            mkdir -p "${source.dir}/bin"
            (cd "${source.dir}" && unzip -q "bun-linux-${BUN_ARCH}.zip")
            mv "${source.dir}/bun-linux-${BUN_ARCH}/bun" "${source.dir}/bin/bun"
            chmod +x "${source.dir}/bin/bun"
            ln -s bun "${source.dir}/bin/bunx"
            ln -s bun "${source.dir}/bin/node"
            "${source.dir}/bin/bun" --version

        # Network: bun install fetches from npm, and the server build's last
        # step (bake-duckdb-extensions) fetches from extensions.duckdb.org.
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail
            # The JDK package lands under /usr/lib/jvm without an alternatives
            # link for /usr/bin/java in this build environment; the OpenAPI
            # generator finds it through JAVA_HOME and PATH.
            JAVA_HOME="$(ls -d /usr/lib/jvm/java-21-openjdk-*)"
            export JAVA_HOME
            export PATH="${source.dir}/bin:${JAVA_HOME}/bin:${PATH}"
            export NODE_ENV=production
            java -version

            bun install
            (cd packages/sdk && bun run build)
            (cd packages/app && NODE_OPTIONS='--max-old-space-size=4096' bun run build:server)
            (cd packages/server && bun run build:server-only)

            test -d "${HOME}/.duckdb/extensions"

        # The ADBC driver behind its shim (packages/server/adbc-shim in the
        # source tree). The shim is compiled against this stage's glibc and
        # self-tested here, both as a dlopen of the real driver and of a stub;
        # the runtime is the same Debian release, so the same glibc.
        - name: adbc driver and shim
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/adbc"
            tar -xzf "${source.dir}/adbc-snowflake.tar.gz" -C "${source.dir}/adbc" libadbc_driver_snowflake.so
            mv "${source.dir}/adbc/libadbc_driver_snowflake.so" "${source.dir}/adbc/libadbc_driver_snowflake.real.so"

            shim=packages/server/adbc-shim
            echo "${ADBC_HEADER_SHA256}  $shim/adbc.h" | sha256sum -c -
            gcc -O2 -Wall -Wextra -shared -fPIC -o "${source.dir}/adbc/libadbc_driver_snowflake.so" "$shim/shim.c" -ldl
            gcc -O2 -Wall -Wextra -o "${source.dir}/adbc/selftest" "$shim/selftest.c" -ldl
            "${source.dir}/adbc/selftest" "${source.dir}/adbc/libadbc_driver_snowflake.so"
            mkdir -p "${source.dir}/adbc/stub"
            gcc -O2 -Wall -Wextra -I"$shim" -shared -fPIC -o "${source.dir}/adbc/stub/libadbc_driver_snowflake.real.so" "$shim/stub_driver.c"
            ADBC_REAL_DRIVER="${source.dir}/adbc/stub/libadbc_driver_snowflake.real.so" "${source.dir}/adbc/selftest" "${source.dir}/adbc/libadbc_driver_snowflake.so"

        # Network: bun install --production, and the RDS CA bundle.
        - name: assemble
          privileged: true
          runs: |
            set -eux -o pipefail
            export PATH="${source.dir}/bin:${PATH}"
            export NODE_ENV=production

            app="${target.dir}/publisher"
            mkdir -p "$app/packages/app" "$app/packages/server" "$app/packages/sdk" \
              "$app/publisher_data" "$app/ducklake_data"
            cp package.json bun.lock "$app/"
            cp -r patches "$app/patches"
            cp -r packages/app/dist "$app/packages/app/dist"
            cp packages/app/package.json "$app/packages/app/package.json"
            cp -r packages/server/dist "$app/packages/server/dist"
            cp packages/server/package.json "$app/packages/server/package.json"
            cp -r packages/sdk/dist "$app/packages/sdk/dist"
            cp packages/sdk/package.json "$app/packages/sdk/package.json"
            (cd "$app" && bun install --production)

            # The extensions the server build baked, under the runtime user's
            # home, with the driver and shim beside every snowflake extension.
            ext="${target.dir}/home/nonroot/.duckdb/extensions"
            mkdir -p "${target.dir}/home/nonroot/.duckdb"
            cp -r "${HOME}/.duckdb/extensions" "$ext"
            find "$ext" -name snowflake.duckdb_extension -printf '%h\n' | while read -r d; do
              cp "${source.dir}/adbc/libadbc_driver_snowflake.so" "${source.dir}/adbc/libadbc_driver_snowflake.real.so" "$d/"
            done
            n=$(find "$ext" -name snowflake.duckdb_extension | wc -l)
            test "$n" -gt 0
            test "$(find "$ext" -name libadbc_driver_snowflake.so | wc -l)" -eq "$n"
            test "$(find "$ext" -name libadbc_driver_snowflake.real.so | wc -l)" -eq "$n"

            # The DuckDB CLI, which must report the version the engine is.
            cli="${target.dir}/home/nonroot/.duckdb/cli/${DUCKDB_VERSION}"
            mkdir -p "$cli"
            unzip -q "${source.dir}/duckdb_cli.zip" -d "$cli"
            chmod 0755 "$cli/duckdb"
            test "$("$cli/duckdb" -noheader -list -c 'SELECT version();')" = "v${DUCKDB_VERSION}"

            # Amazon RDS root CAs, appended to Bun's bundled CA set through
            # NODE_EXTRA_CA_CERTS so Postgres-on-RDS verifies out of the box.
            mkdir -p "${target.dir}/etc/ssl/certs" "${target.dir}/etc/publisher"
            curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
              -o "${target.dir}/etc/ssl/certs/rds-global-bundle.pem"
      outputs:
        - source: ${target.dir}/publisher
          target: /publisher
          uid: 0
          gid: 0
        - source: ${target.dir}/home/nonroot/.duckdb
          target: /home/nonroot/.duckdb
          uid: 65532
          gid: 65532
        - source: ${target.dir}/etc/ssl/certs/rds-global-bundle.pem
          target: /etc/ssl/certs/rds-global-bundle.pem
          uid: 0
          gid: 0
          mode: "0644"
        - source: ${target.dir}/etc/publisher
          target: /etc/publisher
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/malloy-publisher
          target: /opt/docker/sbom/malloy-publisher
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
# Application files stay root-owned; the server owns the three directories it
# writes to. publisher.db is created directly in /publisher, which is why the
# server root itself is its.
paths:
  - type: directory
    path: /publisher
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /publisher/publisher_data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /publisher/ducklake_data
    uid: 65532
    gid: 65532
    mode: "0755"
work-dir: /publisher
environment:
  BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
  BUN_VERSION: ${BUN_VERSION}
  HOME: /home/nonroot
  NODE_ENV: production
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/rds-global-bundle.pem
  # No .mcp.json written into the working directory on boot: nothing starts an
  # agent session inside a container.
  PUBLISHER_NO_MCP_CONFIG: "1"
  PATH: /home/nonroot/.duckdb/cli/${DUCKDB_VERSION}:/usr/local/bun-node-fallback-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
annotations:
  org.opencontainers.image.description: A minimal Malloy Publisher image
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.source: https://github.com/malloydata/publisher
  org.opencontainers.image.documentation: https://github.com/malloydata/publisher/blob/main/packages/server/README.docker.md
# --server_root explicitly, so the bundled-sample default that `npx` users get
# does not clone from GitHub inside a container that was given no config.
cmd:
  - bun
  - run
  - ./packages/server/dist/server.mjs
  - --server_root
  - /publisher
ports:
  - 4000/tcp
  - 4040/tcp
tests:
  - name: duckdb cli is the engine version
    commands:
      - duckdb -noheader -list -c "SELECT version();"
    output: v${DUCKDB_VERSION}
    exit-code: 0
  - name: git runs
    commands:
      - git --version
    exit-code: 0
  - name: the server bundle loads under bun
    commands:
      - bun run ./packages/server/dist/server.mjs --help
    exit-code: 0
