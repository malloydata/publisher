        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /environments/{environmentName}/packages/{packageName}/connections/{connectionName}/sqlSource:
    post:
      tags:
        - connections
      operationId: post-sqlsource-in-package
      summary: Create SQL source from statement (per-package)
      description: |
        Creates a Malloy source from a SQL statement using the specified
        connection, resolved in the context of the named package.
      parameters:
        - name: environmentName
          in: path
          description: Name of the environment
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
        - name: packageName
          in: path
          description: Name of the package whose connection context to use
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
        - name: connectionName
          in: path
          description: Name of the connection
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
      requestBody:
        description: SQL statement to fetch the SQL source
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sqlStatement:
                  type: string
      responses:
        "200":
          description: SQL source information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /environments/{environmentName}/packages/{packageName}/connections/{connectionName}/sqlQuery:
    post:
      tags:
        - connections
      operationId: post-querydata-in-package
      summary: Execute SQL query (per-package)
      description: |
        Executes a SQL statement against the specified database connection,
        resolved in the context of the named package, and returns the results.

        Subject to the same PUBLISHER_MAX_QUERY_ROWS row cap as the
        environment-level sqlQuery endpoint.
      parameters:
        - name: environmentName
          in: path
          description: Name of the environment
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
        - name: packageName
          in: path
          description: Name of the package whose connection context to use
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
        - name: connectionName
          in: path
          description: Name of the connection
          required: true
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
      requestBody:
        description: SQL statement to execute
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sqlStatement:
                  type: string
                options:
                  type: string
                  description: Options
                queryMetadata:
                  $ref: "#/components/schemas/QueryMetadata"
                  description: >-
                    Per-query metadata to attach to this statement, overriding
                    the connection default property by property. A bag that
                    violates the contract is rejected with 400.
                    (`options.queryMetadata` is honored too, since `options` is
                    forwarded as `RunSQLOptions`, but this field is the
                    documented surface and wins when both are present.)
                queryClass:
                  $ref: "#/components/schemas/QueryClass"
                  description: >-
                    What class of work this statement belongs to, attached as the
                    `class` property. Defaults to `ops`: raw SQL against a
                    connection is platform maintenance unless the caller says
                    otherwise.
      responses:
        "200":
          description: Query execution results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /environments/{environmentName}/packages/{packageName}/connections/{connectionName}/sqlTemporaryTable:
    post:
      tags:
        - connections
      operationId: post-temporarytable-in-package
      summary: Create temporary table (per-package)
      description: |
        Creates a temporary table from a SQL statement using the specified
        database connection, resolved in the context of the named package.
      parameters:
