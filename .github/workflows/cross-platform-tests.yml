# Where the test suites run. Two shapes, chosen by the caller:
#
# - `linux` (build.yml, every PR and every push to main): the whole suite on
#   Linux, split across parallel jobs so a PR waits about as long as its
#   slowest group rather than the sum. The `Platform: (ubuntu-latest)` job
#   needs every one of them and is the single required status check for the
#   lot, so splitting or rebalancing the groups never touches branch
#   protection.
# - `macos_windows` (cross-platform-nightly.yml nightly, on a PR labelled
#   `cross-platform` and on dispatch; release.yml before it publishes): the
#   whole suite in one job per OS, as every leg ran before the split.
#
# Both default to what build.yml wants, so a bare `uses:` runs the Linux split.

name: Cross Platform Tests

on:
  workflow_call:
    inputs:
      linux:
        description: Run the whole suite on Linux, split into parallel jobs.
        type: boolean
        required: false
        default: true
      macos_windows:
        description: Run the whole suite on macOS and on Windows, one job each.
        type: boolean
        required: false
        default: false
      restore_cache:
        description: >-
          Restore and save the Bun install cache. release.yml passes false: a
          run that gates a publish reads no Actions cache (CONTEXT.md).
        type: boolean
        required: false
        default: true

permissions: {}

# Bun bug in Windows: https://github.com/oven-sh/bun/issues/17011#issuecomment-2769196629
# We need to use a custom userprofile and cache directory for Windows. And also need to disable the Defender real-time monitoring.
# There is no solution for this yet (but a couple of active issues), so we need to use this workaround for faster CI runs.
#
# The same D: profile is set on the steps that bake and load DuckDB extensions.
# DuckDB keeps them under %USERPROFILE%\.duckdb\extensions on Windows, and the
# runner's C: drive is slow remote storage: the bake writes them quickly and they
# stay in memory, but the tests' first LOAD, minutes later, reads the whole file
# back from C:. That cost 82s for bigquery, 35s for snowflake and 39s for azure,
# against under a second on Linux and macOS. Build and both server test steps
# must share the profile, or the tests look for the extensions somewhere the
# bake did not put them and fetch them again.

env:
  BUN_VERSION: 1.4.4
  WINDOWS_USERPROFILE: "D:\\"
  WINDOWS_BUN_CACHE_DIR: "D:\\.bun\\install\\cache"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------- Linux ---
  #
  # Each server layer runs alone on its own runner. Before the split the three
  # ran side by side on one 4-vCPU machine for about 22 minutes, the component
  # suite the long pole. Component and unit are sharded with bun's `--shard`,
  # balanced by the per-file durations in packages/server/tests/shard-timings.json.
  # A file missing from it (a new spec) still runs; it is only placed without a
  # weight. Every shard uploads its measured durations as a `shard-timings-*`
  # artifact; CONTEXT.md has the one-liner that merges them back into the file
  # when the shards drift apart.
  #
  # Each job builds for itself (about 100s) rather than waiting on one shared
  # build job, which would put that build in series in front of every group.

  linux_server_component:
    name: "Linux: server component (${{ matrix.shard }}/3)"
    if: inputs.linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: ./.github/actions/setup-workspace
        with:
          restore-cache: ${{ inputs.restore_cache }}
      # Component specs: real DuckDB, compiler and worker pool, but no fixed
      # ports.
      - name: Run server component tests
        run: |
          cp packages/server/tests/shard-timings.json "$RUNNER_TEMP/shard-timings.json"
          bun run --cwd packages/server test:component \
            --shard=${{ matrix.shard }}/3 \
            --timings="$RUNNER_TEMP/shard-timings.json" --update-timings
        shell: bash
      - name: Upload measured shard timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-timings-component-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-timings.json
          if-no-files-found: ignore

  linux_server_unit:
    name: "Linux: server unit (${{ matrix.shard }}/2)"
    if: inputs.linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: ./.github/actions/setup-workspace
        with:
          restore-cache: ${{ inputs.restore_cache }}
      # Unit specs under src/, with coverage (`test:coverage`, configured in
      # packages/server/bunfig.toml). Reported, not enforced: no threshold can
      # fail the job. Each shard reports the files it ran.
      - name: Run server unit tests
        run: |
          cp packages/server/tests/shard-timings.json "$RUNNER_TEMP/shard-timings.json"
          bun run --cwd packages/server test:coverage --serial \
            --shard=${{ matrix.shard }}/2 \
            --timings="$RUNNER_TEMP/shard-timings.json" --update-timings
        shell: bash
      # The lcov for tools that read it; the text summary is at the end of the
      # step above. Uploaded on a failure too, since the run still measured
      # what it executed.
      - name: Upload server unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-coverage-${{ matrix.shard }}
          path: packages/server/coverage/lcov.info
          if-no-files-found: warn
      - name: Upload measured shard timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-timings-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-timings.json
          if-no-files-found: ignore

  linux_server_integration:
    name: "Linux: server integration"
    if: inputs.linux
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: ./.github/actions/setup-workspace
        with:
          restore-cache: ${{ inputs.restore_cache }}
      # Real servers and sockets, run serially. No network: packages come from
      # the repo and its fixtures, and the build baked the DuckDB extensions.
      # The specs gated on a real Postgres (PUBLISHER_TEST_POSTGRES_URL and
      # friends) skip here, as they always have, and run against a Postgres
      # service in connection-integration-tests.yml.
      - name: Run server integration tests
        run: bun run --cwd packages/server test:integration --serial
        shell: bash

  linux_clients:
    name: "Linux: SDK, Console, skills, examples, scripts, CLI, scaffolder"
    if: inputs.linux
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: ./.github/actions/setup-workspace
        with:
          restore-cache: ${{ inputs.restore_cache }}
      # Component and hook specs render against a DOM registered in a bun
      # preload (packages/sdk/test/setup.ts).
      - name: Run SDK tests
        run: bun run --cwd packages/sdk test
        shell: bash
      # The Console's routing specs, on the same DOM preload as the SDK's
      # (packages/app/test/setup.ts). They import the built SDK.
      - name: Run Console tests
        run: bun run --cwd packages/app test
        shell: bash
      # Why two zones, and why these two: scripts/ci-sdk-tests-in-zone.sh.
      - name: Run SDK tests east of UTC
        run: scripts/ci-sdk-tests-in-zone.sh Australia/Sydney "AUS Eastern Standard Time"
        shell: bash
      - name: Run SDK tests west of UTC
        run: scripts/ci-sdk-tests-in-zone.sh America/Los_Angeles "Pacific Standard Time"
        shell: bash
      # Every `bun test` in this repo passes a path filter; see the macOS and
      # Windows leg below for why the guard runs on every OS.
      - name: Run test-path-filter guard
        run: bun run test:scripts
        shell: bash
      - name: Run skills package tests
        run: bun run --cwd packages/skills test
        shell: bash
      - name: Run example package tests
        run: scripts/ci-example-tests.sh
        shell: bash
      # Its pretest builds the skills package first, so the skillsDir it
      # copies from exists.
      - name: Run create-malloy-package tests
        run: bun run --cwd packages/create-malloy-package test
        shell: bash
      # The CLI's unit tests import its own generated API client, which the
      # repo-wide generate-api-types does not produce (it covers the SDK and
      # server only), so test:cli generates it first.
      - name: Run CLI tests
        run: bun run test:cli
        shell: bash
      # The real malloy-pub binary against a real server booted from source
      # (on OS-assigned ports, in a temp server root), so it catches a server
      # change the CLI has not followed. Linux only, like the e2e step below.
      - name: Run CLI integration tests
        run: bun run --cwd packages/cli test:integration
        shell: bash
      # The only specs that prove a generated config is one a real server
      # actually serves: they boot the server bin built above against the
      # scaffolded workspace. Linux only, because booting a server per spec
      # run is too slow and too flaky to repeat on three OSes.
      - name: Run create-malloy-package e2e tests
        run: bun run --cwd packages/create-malloy-package test:e2e
        shell: bash

  # The required status check for the Linux suite, under the name the single
  # Linux leg had before the split, so branch protection did not change for
  # it. Green only when every Linux job above passed: a failed, cancelled or
  # skipped group fails it. `!cancelled()` rather than `always()`, so a
  # cancelled run reports this check cancelled, not red.
  cross_platform_test_linux:
    name: "Platform: (ubuntu-latest)"
    if: ${{ !cancelled() && inputs.linux }}
    needs:
      - linux_server_component
      - linux_server_unit
      - linux_server_integration
      - linux_clients
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every Linux group to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Linux test groups did not pass: $failed"
            exit 1
          fi
        shell: bash

  # ------------------------------------------------------ macOS and Windows ---
  #
  # The whole suite in one job per OS. Not on every PR: it took 28-32 minutes
  # median per OS, up to 66, against 10-12 for the Linux split. It runs
  # nightly, on a PR labelled `cross-platform`, on dispatch
  # (cross-platform-nightly.yml), and in front of every release (release.yml).
  # Never on Credible's runners, which are Linux x64 only.
  cross_platform_test:
    name: >-
      Platform: (${{ matrix.os }})
    if: inputs.macos_windows
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Configure Temp Directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TEMP_DIR = "$env:WINDOWS_USERPROFILE\Temp"
          New-Item -ItemType Directory -Force -Path $TEMP_DIR | Out-Null
          "TEMP=$TEMP_DIR" >> $env:GITHUB_ENV
          "TMP=$TEMP_DIR"  >> $env:GITHUB_ENV

      - name: Disable Windows Defender (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - uses: ./.github/actions/setup-workspace
        with:
          restore-cache: ${{ inputs.restore_cache }}

      # Prints what the D: profile above relies on, so a slow extension LOAD
      # can be told apart from extensions that landed on C: or a Defender that
      # is still scanning. Reports only; it never fails the job.
      - name: Report DuckDB extension location and Defender state (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected, AMRunningMode | Format-List
          foreach ($root in @("$env:WINDOWS_USERPROFILE.duckdb\extensions", "$env:USERPROFILE\.duckdb\extensions")) {
            "== $root"
            Get-ChildItem -Recurse -File -Path $root -ErrorAction SilentlyContinue |
              Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } |
              Format-Table -AutoSize
          }

      # Component and hook specs render against a DOM registered in a bun
      # preload (packages/sdk/test/setup.ts). Run on every OS because a preload
      # path and a DOM shim are exactly the sort of thing that resolves on
      # Linux and not on Windows.
      - name: Run SDK tests
        run: bun run --cwd packages/sdk test
        shell: bash

      # The Console's routing specs, on the same DOM preload as the SDK's
      # (packages/app/test/setup.ts). They import the built SDK.
      - name: Run Console tests
        run: bun run --cwd packages/app test
        shell: bash

      # Why two zones, and how Windows is switched: scripts/ci-sdk-tests-in-zone.sh.
      - name: Run SDK tests east of UTC
        run: scripts/ci-sdk-tests-in-zone.sh Australia/Sydney "AUS Eastern Standard Time"
        shell: bash

      - name: Run SDK tests west of UTC
        run: scripts/ci-sdk-tests-in-zone.sh America/Los_Angeles "Pacific Standard Time"
        shell: bash

      # Every `bun test` in this repo passes a path filter, and a filter is a
      # substring unless it is anchored with "./". The guard runs here, not only
      # under lint_format in build.yml, because it shells out to bun to check
      # that the anchor actually holds: a platform that did not honour it would
      # fall back to a substring and match anyway, so the anchoring would
      # quietly stop applying while every other suite stayed green. Windows is
      # the platform that matters.
      - name: Run test-path-filter guard
        run: bun run test:scripts
        shell: bash

      # The skills package copies a directory tree and resolves it back by
      # path, so it is exactly the kind of code that breaks on Windows only.
      - name: Run skills package tests
        run: bun run --cwd packages/skills test
        shell: bash

      - name: Run example package tests
        run: scripts/ci-example-tests.sh
        shell: bash

      # The scaffolder copies the skills tree into a generated project and
      # resolves it by path too, so it has the same cross-platform exposure. Its
      # pretest builds the skills package first, so the skillsDir it copies from
      # exists.
      - name: Run create-malloy-package tests
        run: bun run --cwd packages/create-malloy-package test
        shell: bash

      - name: Run CLI tests
        run: bun run test:cli
        shell: bash

      # Split into three bun-test invocations (three processes), one per layer:
      # unit specs under src/, component specs (tests/component: real DuckDB,
      # compiler and worker pool, but no fixed ports), and integration specs
      # (tests/integration: real servers and sockets, run serially).
      #
      # The three processes run at the same time. They share no state: the
      # integration servers own packages/server's publisher.db and
      # publisher_data/, and every unit or component spec that touches storage
      # uses a temp directory or a directory of its own under the working
      # directory. Each process loads Malloy and DuckDB once, as it would alone,
      # so running them side by side takes about as long as the longest rather
      # than their sum. Splitting further does not pay on one machine:
      # `bun test --parallel` reloads those modules for every file and made the
      # unit suite slower, not faster.
      #
      # The unit and component suites run in the background into logs that
      # are printed once all three have finished, so the outputs do not
      # interleave; the step fails if any suite does.
      - name: Run unit, component and integration tests
        env:
          USERPROFILE: ${{ runner.os == 'Windows' && env.WINDOWS_USERPROFILE || '' }}
        run: |
          unit_log="$RUNNER_TEMP/server-unit-tests.log"
          bun run --cwd packages/server test:unit --serial > "$unit_log" 2>&1 &
          unit_pid=$!
          component_log="$RUNNER_TEMP/server-component-tests.log"
          bun run --cwd packages/server test:component > "$component_log" 2>&1 &
          component_pid=$!

          if bun run --cwd packages/server test:integration --serial; then
            integration_status=0
          else
            integration_status=$?
          fi

          if wait "$unit_pid"; then unit_status=0; else unit_status=$?; fi
          if wait "$component_pid"; then component_status=0; else component_status=$?; fi

          # bun leaves the step's stdout pipe non-blocking. Off Windows, a
          # multi-megabyte `cat` into it then fails with "write error:
          # Resource temporarily unavailable" as soon as the runner reads
          # slower than cat writes, so make the pipe blocking again first.
          if [ "$RUNNER_OS" != "Windows" ]; then
            python3 -c 'import fcntl, os; fcntl.fcntl(1, fcntl.F_SETFL, fcntl.fcntl(1, fcntl.F_GETFL) & ~os.O_NONBLOCK)'
          fi
          echo "===== Unit tests (ran alongside the integration tests above) ====="
          cat "$unit_log"
          echo "===== Component tests (ran alongside the integration tests above) ====="
          cat "$component_log"

          echo "unit tests exit $unit_status, component tests exit $component_status, integration tests exit $integration_status"
          [ "$unit_status" -eq 0 ] && [ "$component_status" -eq 0 ] && [ "$integration_status" -eq 0 ]
        shell: bash
