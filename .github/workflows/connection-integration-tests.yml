name: Connection Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/server/src/service/connection.ts"
      - "packages/server/src/service/connection.spec.ts"
      - "packages/server/src/service/ducklake_init_race.spec.ts"
      - "packages/server/src/service/ducklake_attach_race_postgres.spec.ts"
      - "packages/server/src/service/duckdb_lockdown.ts"
      - "packages/server/src/service/duckdb_instance_sharing.ts"
      - "packages/server/src/service/ducklake_catalog_unavailable.ts"
      - "packages/server/src/service/proxy.ts"
      # The harnesses and fixtures every spec below is built on.
      - "packages/server/src/test_helpers/**"
      - "packages/server/tests/component/storage_build_bigquery.component.spec.ts"
      - "packages/server/tests/component/storage_build_bigquery_cancel.component.spec.ts"
      # The metadata bag's own contract, and the dialect-aware escaper the
      # Snowflake lookup builds its literal with.
      - "packages/server/src/service/query_metadata.ts"
      - "packages/server/src/service/introspection_sql.ts"
      # The admin API's catalog routes, whose tests (tests/integration/admin_catalogs)
      # run against this job's Postgres.
      - "packages/server/src/service/catalog_admin.ts"
      - "packages/server/src/service/statement_usage.ts"
      - "packages/server/tests/integration/admin_catalogs/**"
      # statement_usage records on a real server, against this job's Postgres.
      - "packages/server/src/service/query_execution.ts"
      - "packages/server/src/service/model_serving.ts"
      - "packages/server/src/controller/connection.controller.ts"
      - "packages/server/src/controller/legacy_report.controller.ts"
      - "packages/server/src/service/query_metadata.ts"
      - "packages/server/tests/integration/statement_usage/**"
      # Materialization: the manifest's read-cost value, each dialect's
      # catalog read of a database table's column types, and the specs that
      # need a real Postgres (a DuckLake catalog, a Postgres warehouse, the run
      # store's Postgres semantics), with everything they exercise. The
      # environment holds the lock a version's rebind races a refresh under.
      - "packages/server/src/service/materialization/**"
      - "packages/server/src/service/environment.ts"
      - "packages/server/src/storage/**"
      - "packages/server/tests/component/materialization_key_check_rebind.component.spec.ts"
      - "packages/server/tests/component/materialization_stale_chain.component.spec.ts"
      - "packages/server/tests/component/database_table_alter_at_bind.component.spec.ts"
      - "packages/server/tests/component/database_truncation_types.component.spec.ts"
      - "packages/server/tests/component/r4/**"
      - "packages/server/tests/integration/materialization/**"
      # The capability table observed on a real engine (domain/dialect_evidence.ts).
      - "packages/server/tests/conformance/**"
      # The passthrough surfaces this job exists to catch are provided by the
      # DuckDB extensions, which move with a dependency bump rather than with any
      # file above.
      - "packages/server/package.json"
      - "bun.lock"
      - ".github/workflows/connection-integration-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/server/src/service/connection.ts"
      - "packages/server/src/service/connection.spec.ts"
      - "packages/server/src/service/ducklake_init_race.spec.ts"
      - "packages/server/src/service/ducklake_attach_race_postgres.spec.ts"
      - "packages/server/src/service/duckdb_lockdown.ts"
      - "packages/server/src/service/duckdb_instance_sharing.ts"
      - "packages/server/src/service/ducklake_catalog_unavailable.ts"
      - "packages/server/src/service/proxy.ts"
      # The harnesses and fixtures every spec below is built on.
      - "packages/server/src/test_helpers/**"
      - "packages/server/tests/component/storage_build_bigquery.component.spec.ts"
      - "packages/server/tests/component/storage_build_bigquery_cancel.component.spec.ts"
      # The metadata bag's own contract, and the dialect-aware escaper the
      # Snowflake lookup builds its literal with.
      - "packages/server/src/service/query_metadata.ts"
      - "packages/server/src/service/introspection_sql.ts"
      # The admin API's catalog routes, whose tests (tests/integration/admin_catalogs)
      # run against this job's Postgres.
      - "packages/server/src/service/catalog_admin.ts"
      - "packages/server/src/service/statement_usage.ts"
      - "packages/server/tests/integration/admin_catalogs/**"
      # statement_usage records on a real server, against this job's Postgres.
      - "packages/server/src/service/query_execution.ts"
      - "packages/server/src/service/model_serving.ts"
      - "packages/server/src/controller/connection.controller.ts"
      - "packages/server/src/controller/legacy_report.controller.ts"
      - "packages/server/src/service/query_metadata.ts"
      - "packages/server/tests/integration/statement_usage/**"
      # Materialization: the manifest's read-cost value, each dialect's
      # catalog read of a database table's column types, and the specs that
      # need a real Postgres (a DuckLake catalog, a Postgres warehouse, the run
      # store's Postgres semantics), with everything they exercise. The
      # environment holds the lock a version's rebind races a refresh under.
      - "packages/server/src/service/materialization/**"
      - "packages/server/src/service/environment.ts"
      - "packages/server/src/storage/**"
      - "packages/server/tests/component/materialization_key_check_rebind.component.spec.ts"
      - "packages/server/tests/component/materialization_stale_chain.component.spec.ts"
      - "packages/server/tests/component/database_table_alter_at_bind.component.spec.ts"
      - "packages/server/tests/component/database_truncation_types.component.spec.ts"
      - "packages/server/tests/component/r4/**"
      - "packages/server/tests/integration/materialization/**"
      # The capability table observed on a real engine (domain/dialect_evidence.ts).
      - "packages/server/tests/conformance/**"
      # The passthrough surfaces this job exists to catch are provided by the
      # DuckDB extensions, which move with a dependency bump rather than with any
      # file above.
      - "packages/server/package.json"
      - "bun.lock"
      - ".github/workflows/connection-integration-tests.yml"
  workflow_dispatch:

env:
  BUN_VERSION: 1.4.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

# One run per pull request: a new push to a PR cancels that PR's run still in
# flight, since only its newest commit can merge. Every other event (a push to
# main, workflow_run, schedule, workflow_dispatch) gets a group of its own
# keyed on the run id, so it is never cancelled and never replaced while it
# waits: every merged commit is tested. (Keying those on github.ref with
# cancel-in-progress off would still drop runs, because a group holds only one
# pending run and a newer one cancels it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  connection-integration-tests:
    name: Connection Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on fork PRs: pull_request runs from a fork don't have access
    # to repo secrets, so the BQ_PRESTO_TRINO_KEY / BIGQUERY_PUBLIC_DATA_SA
    # `if [ -z ... ]; then exit 1; fi` checks below would hard-fail with
    # a confusing red CI for an external contributor whose change had
    # nothing to do with credentials. Push to main and same-repo PRs
    # still run normally; workflow_dispatch bypasses the gate.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malloy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
        ports:
          - 3306:3306
      # Trino's coordinator takes tens of seconds to accept queries; its image
      # ships the health check. Bounded: about three minutes, then the job
      # fails rather than waits.
      trino:
        image: trinodb/trino:476
        options: >-
          --health-cmd /usr/lib/trino/bin/health-check
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 36
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: scripts/ci-install-with-retry.sh bun install

      - name: Setup BigQuery credentials
        env:
          BQ_PRESTO_TRINO_KEY: ${{ secrets.BQ_PRESTO_TRINO_KEY }}
        run: |
          if [ -z "$BQ_PRESTO_TRINO_KEY" ]; then
            echo "BQ_PRESTO_TRINO_KEY is not set"
            exit 1
          fi
          # Detect base64 vs JSON
          if echo "$BQ_PRESTO_TRINO_KEY" | grep -qE '^\s*eyJ'; then
            echo "Detected Base64 credentials. Decoding..."
            echo "$BQ_PRESTO_TRINO_KEY" | base64 --decode > /tmp/bq-credentials.json
          else
            echo "Detected raw JSON credentials."
            echo "$BQ_PRESTO_TRINO_KEY" > /tmp/bq-credentials.json
          fi
          # Validate JSON
          jq . /tmp/bq-credentials.json > /dev/null
          # Export for rest of job
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/bq-credentials.json" >> $GITHUB_ENV
          echo "BIGQUERY_TEST_PROJECT_ID=$(jq -r '.project_id' /tmp/bq-credentials.json)" >> $GITHUB_ENV
          echo "BigQuery credentials file written to /tmp/bq-credentials.json"

      # Separate from BQ_PRESTO_TRINO_KEY above. The new
      # BIGQUERY_PUBLIC_DATA_SA service account has read-only access to
      # `bigquery-public-data` and is what the
      # `BigQuery direct connection (public-data)` describe block in
      # connection.spec.ts uses to round-trip a real query against
      # `bigquery-public-data.samples.shakespeare`. Kept on its own env
      # vars (`BIGQUERY_PUBLIC_DATA_*`) so the existing BQ tests against
      # the org-internal SA continue to pass without interference.
      - name: Setup BigQuery public-data credentials
        env:
          BIGQUERY_PUBLIC_DATA_SA: ${{ secrets.BIGQUERY_PUBLIC_DATA_SA }}
        run: |
          if [ -z "$BIGQUERY_PUBLIC_DATA_SA" ]; then
            echo "BIGQUERY_PUBLIC_DATA_SA is not set on the publisher repo"
            exit 1
          fi
          # Detect base64 vs raw JSON (mirrors the BQ_PRESTO_TRINO_KEY
          # handling above; this SA is uploaded as raw JSON but stay
          # symmetric with the existing pattern).
          if echo "$BIGQUERY_PUBLIC_DATA_SA" | grep -qE '^\s*eyJ'; then
            echo "Detected Base64 credentials. Decoding..."
            echo "$BIGQUERY_PUBLIC_DATA_SA" | base64 --decode > /tmp/bq-public-data-credentials.json
          else
            echo "Detected raw JSON credentials."
            echo "$BIGQUERY_PUBLIC_DATA_SA" > /tmp/bq-public-data-credentials.json
          fi
          jq . /tmp/bq-public-data-credentials.json > /dev/null
          echo "BIGQUERY_PUBLIC_DATA_CREDENTIALS=/tmp/bq-public-data-credentials.json" >> $GITHUB_ENV
          echo "BIGQUERY_PUBLIC_DATA_PROJECT_ID=$(jq -r '.project_id' /tmp/bq-public-data-credentials.json)" >> $GITHUB_ENV
          echo "BigQuery public-data credentials file written to /tmp/bq-public-data-credentials.json"

      - name: Run connection integration tests
        env:
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: "5432"
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgres
          POSTGRES_TEST_DATABASE: malloy_test
          BIGQUERY_TEST_DATASET: ${{ secrets.BIGQUERY_TEST_DATASET }}
          BIGQUERY_TEST_TABLE: ${{ secrets.BIGQUERY_TEST_TABLE }}
        run: |
          cd packages/server
          bun test --timeout 100000 ./src/service/connection.spec.ts

      # Builds attaching one DuckLake catalog that does not exist yet, at once,
      # on this job's Postgres: every one must write into it, not lose the
      # create race. Skipped everywhere this variable is not set.
      - name: Run DuckLake catalog-create race test
        env:
          PUBLISHER_TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/malloy_test"
        run: |
          cd packages/server
          bun test --timeout 120000 ./src/service/ducklake_init_race.spec.ts

      # Overlapping first lookups of one DuckLake storage destination with an
      # S3 secret, on this job's Postgres: the catalog stays attached, and a
      # locked instance that lost it reopens. Skipped everywhere this variable
      # is not set.
      - name: Run DuckLake destination attach race test
        env:
          PUBLISHER_TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/malloy_test"
        run: |
          cd packages/server
          bun test --timeout 120000 ./src/service/ducklake_attach_race_postgres.spec.ts

      # The admin API's catalogs against a real catalog database: creates,
      # loads, ownership through the owner role, error reasons, snapshot
      # deletion. Skipped everywhere this variable is not set.
      - name: Run admin catalog integration tests
        env:
          PUBLISHER_TEST_ADMIN_SUPERUSER: "host=localhost port=5432 user=postgres password=postgres"
        run: |
          cd packages/server
          bun test --timeout 120000 ./tests/integration/admin_catalogs

      # Each metered statement's statement_usage record, read from a real
      # server's log: one per statement, and bytes_out equal to the bytes of the
      # result it returned, on a managed DuckLake connection over this Postgres.
      - name: Run statement usage integration tests
        env:
          PUBLISHER_TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/malloy_test"
        run: |
          cd packages/server
          bun test --timeout 300000 ./tests/integration/statement_usage

      # Each dialect's catalog read of a database table's column types, and the
      # big-integer cast it feeds, served against live on real Postgres, MySQL
      # and Trino (a memory catalog). Skipped where these variables are unset.
      - name: Run database native-type integration tests
        env:
          PUBLISHER_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/malloy_test
          PUBLISHER_TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306
          PUBLISHER_TEST_TRINO_URL: http://localhost:8080
        run: |
          cd packages/server
          bun test --timeout 100000 ./src/service/materialization/run/database_native_types.spec.ts

      # The MySQL and Trino rows of the capability table observed on this job's
      # servers (their conformance specs, the probes domain/dialect_evidence.ts
      # names): a database and a grant-limited user on MySQL, a schema in
      # Trino's memory catalog. Skipped where these variables are unset.
      - name: Run MySQL and Trino conformance tests
        env:
          PUBLISHER_TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306
          PUBLISHER_TEST_TRINO_URL: http://localhost:8080
        run: |
          cd packages/server
          bun test --timeout 100000 ./tests/conformance/mysql.conformance.spec.ts ./tests/conformance/trino.conformance.spec.ts

      # The materialization specs that skip unless a Postgres is reachable:
      # DuckLake destinations on a Postgres catalog, a Postgres warehouse's
      # native column types, cross-package tables, the v1 cutover and its
      # leftover views, the rebind and stale-chain races, and the Postgres
      # tiers of the database served-copy specs (a database table altered
      # after its build among them, and a stored time truncation, which is not
      # drift), rollup conformance on a Postgres origin, built in Postgres
      # and in a DuckLake destination, an incremental delta reading rows that
      # land late, a Postgres `real` served from both tiers as live writes
      # it, and a storage= copy's string order and groups under the source
      # column's collation (en_US, ICU, nondeterministic, C), and the Postgres
      # row of the capability table observed on this server (its conformance
      # spec, the probes domain/dialect_evidence.ts names).
      - name: Run Postgres-gated materialization tests
        env:
          PUBLISHER_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/malloy_test
        run: |
          cd packages/server
          bun test --timeout 200000 --max-workers=1 ./src/service/materialization/run/v1_cutover_postgres.spec.ts ./src/service/materialization/run/leftover_name_views_postgres.spec.ts ./src/service/materialization/run/case_variant_renames_postgres.spec.ts ./tests/component/materialization_key_check_rebind.component.spec.ts ./tests/component/materialization_stale_chain.component.spec.ts ./tests/integration/materialization/cross_package_tables.integration.spec.ts ./tests/integration/materialization/storage_postgres_native_types.integration.spec.ts ./tests/integration/materialization/storage_postgres_decimal_precision.integration.spec.ts ./tests/integration/materialization/storage_sandbox_source.integration.spec.ts ./tests/integration/materialization/storage_ducklake_postgres_bigint.integration.spec.ts ./src/service/materialization/run/database_served_copy.spec.ts ./tests/component/r4/database_storage_parity.component.spec.ts ./tests/component/r4/served_big_integers.component.spec.ts ./tests/component/r4/served_copy_database.component.spec.ts ./tests/component/r4/served_copy_pair_counts.component.spec.ts ./tests/component/r4/materialize_storage_type_drift.component.spec.ts ./tests/component/database_table_alter_at_bind.component.spec.ts ./tests/component/database_truncation_types.component.spec.ts ./tests/component/materialization_rollup_over_incremental_base.component.spec.ts ./tests/component/database_table_drift_substituted.component.spec.ts ./tests/component/database_table_drift_value_loss.component.spec.ts ./tests/component/r4/rollup_postgres_parity.component.spec.ts ./tests/component/materialization_incremental_late_rows.component.spec.ts ./tests/component/r4/served_float4.component.spec.ts ./tests/component/r4/storage_string_order_collation.component.spec.ts ./tests/component/r4/ducklake_lost_catalog_serve.component.spec.ts ./tests/component/r4/colocated_postgres_types.component.spec.ts ./tests/conformance/postgres.conformance.spec.ts

      # The storage= build's warehouse read reaches BigQuery job records the unit
      # suite cannot: bigquery_execute's returned job id, the child job a
      # parentJobId listing finds, and the anonymous result table it names. Those
      # tests drive it through a session that returns the expected shape, so if
      # any of that moves they all still pass and every real build breaks.
      #
      # Uses the public-data SA and a plain local DuckDB destination — no DuckLake
      # catalog, no Postgres, no object storage. That SA needs
      # bigquery.readsessions.create: the passthrough streams results over the
      # Storage Read API on every path, tagged or not.
      - name: Run storage= build integration tests
        run: |
          cd packages/server
          bun test --timeout 100000 ./tests/component/storage_build_bigquery.component.spec.ts


      # A cancelled storage= build over BigQuery cancels its BigQuery job, not
      # only DuckDB's wait for it (F-22). Uses the BQ_PRESTO_TRINO_KEY service
      # account set up above (GOOGLE_APPLICATION_CREDENTIALS and
      # BIGQUERY_TEST_PROJECT_ID); the read is compute-only, so 0 bytes billed.
      - name: Run storage= build BigQuery cancel test
        run: |
          cd packages/server
          bun test --timeout 200000 ./tests/component/storage_build_bigquery_cancel.component.spec.ts
