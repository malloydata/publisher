# Temporary experiment, removed before merge. Runs the server unit and
# integration suites on Ubuntu five times side by side and five times one
# after the other, to tell whether running them together causes the package
# load in dashboard_join_lint.spec.ts to hang.

name: Server suites experiment

on:
  push:
    branches: [sagark/ci-concurrent-server-suites]
    paths: [.github/workflows/server-suites-experiment.yml]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  measure:
    name: "${{ matrix.mode }} rep=${{ matrix.rep }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [concurrent, serial]
        rep: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --prefer-offline
        shell: bash

      - name: Generate API types
        run: bun run generate-api-types
        shell: bash

      - name: Build
        run: bun run build
        shell: bash

      - name: Unit and integration, side by side
        if: matrix.mode == 'concurrent'
        run: |
          start=$(date +%s)
          unit_log="$RUNNER_TEMP/server-unit-tests.log"
          bun run --cwd packages/server test:unit --serial > "$unit_log" 2>&1 &
          unit_pid=$!
          integration_status=1
          for attempt in 1 2 3; do
            if bun run --cwd packages/server test:integration --serial; then
              integration_status=0
              break
            fi
            echo "Integration tests failed on attempt $attempt."
          done
          if wait "$unit_pid"; then unit_status=0; else unit_status=$?; fi
          python3 -c 'import fcntl, os; fcntl.fcntl(1, fcntl.F_SETFL, fcntl.fcntl(1, fcntl.F_GETFL) & ~os.O_NONBLOCK)'
          echo "===== Unit tests ====="
          cat "$unit_log"
          echo "RESULT mode=concurrent rep=${{ matrix.rep }} unit=$unit_status integration=$integration_status seconds=$(( $(date +%s) - start ))"
        shell: bash

      - name: Unit, then integration
        if: matrix.mode == 'serial'
        run: |
          start=$(date +%s)
          if bun run --cwd packages/server test:unit --serial; then unit_status=0; else unit_status=$?; fi
          integration_status=1
          for attempt in 1 2 3; do
            if bun run --cwd packages/server test:integration --serial; then
              integration_status=0
              break
            fi
            echo "Integration tests failed on attempt $attempt."
          done
          echo "RESULT mode=serial rep=${{ matrix.rep }} unit=$unit_status integration=$integration_status seconds=$(( $(date +%s) - start ))"
        shell: bash
