name: python-sdk

on:
  push:
    branches: [main]
    paths:
      - "api-doc.yaml"
      - "packages/python-client/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "api-doc.yaml"
      - "packages/python-client/**"
      # This file, so a change to `check_version` below is exercised by the PR
      # that makes it — the same reason skills-npm.yml and
      # create-malloy-package-npm.yml list their own files. It does mean a
      # YAML-only edit also runs `build`, which installs uv and regenerates the
      # client; that is a few minutes on a rare kind of PR, and the alternative
      # is a check nothing ever runs before it is relied on.
      - ".github/workflows/python-sdk.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

jobs:
  # The sibling of skills-npm.yml's and create-malloy-package-npm.yml's bump
  # checks, against PyPI instead of npm. Same predicate, same fail-closed
  # behaviour, different registry and a different place to read the version from
  # (`[project] version` in pyproject.toml, not a package.json).
  #
  # READ THIS BEFORE TRUSTING IT: today this check cannot catch a missing bump,
  # because `malloy-publisher-sdk` is not on PyPI at all. The `publish` job below
  # is gated on a `refs/tags/sdk-python-*` ref, but this workflow's `on: push`
  # names `branches:` and no `tags:` — so a tag push does not trigger the
  # workflow and that job has never run. Nothing has ever been published, the
  # project URL 404s, and this check reads that as "the version is free", which
  # is the correct answer to the question it asks. It is here so the rule is
  # uniform across all three published trains and so the coverage exists the
  # day the Python client actually ships; it is NOT evidence that anything is
  # currently guarded. It can still go red — an unreadable pyproject.toml, a
  # version that is not major.minor.patch, or a registry answering neither 200
  # nor 404 — so a green here is "nothing to check", not "nothing to fix".
  # `.github/workflows/CONTEXT.md` records the trigger gap, including the one
  # way that publish job IS reachable today (a `workflow_dispatch` on a tag ref).
  check_version:
    name: Require a version bump when the published content changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs this PR against its base, which needs the merge base
          # in the clone. The default depth-1 checkout of a pull_request is a
          # merge commit with no parents fetched, so `origin/<base>` does not
          # resolve and the diff cannot be computed.
          fetch-depth: 0

      # For tomllib, which is stdlib from 3.11. The same reason and the same
      # version the build job below pins.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version against PyPI
        env:
          # Through env rather than interpolated into the script body, as every
          # other registry-facing step in this repo does.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Scoped to what the published wheel is built FROM, which for a
          # generated client is two things: the package directory, and the
          # OpenAPI spec it is generated out of (build-python-sdk.sh runs
          # openapi-python-client against ../../api-doc.yaml). This workflow file
          # is in the `paths:` trigger and deliberately not here: editing it
          # changes no published byte.
          PATHS=(api-doc.yaml packages/python-client)

          # Assert every entry exists: `git diff -- does/not/exist` exits 0 with
          # EMPTY output, which lands in the skip branch below and reports "no
          # published content changed", so a typo or a rename silently switches
          # this check off for good while the trigger keeps firing.
          for p in "${PATHS[@]}"; do
            [ -e "$p" ] && continue
            echo "::error title=Version::watched path '${p}' does not exist in this checkout, so the scoping diff can never match it and this check would silently pass everything. Fix the PATHS list in this workflow."
            exit 1
          done

          # Fails CLOSED: if the diff cannot be computed the check RUNS, it does
          # not skip. A skip is the outcome that lets an unbumped change through,
          # so it has to be reached deliberately and never by accident.
          SCOPED=1
          CHANGED=""
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            echo "::warning title=Version::could not resolve origin/${BASE_REF}, so this PR's changed paths are unknown; checking the version regardless"
            SCOPED=0
          elif ! CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${PATHS[@]}")"; then
            echo "::warning title=Version::could not diff against origin/${BASE_REF}, so this PR's changed paths are unknown; checking the version regardless"
            SCOPED=0
          fi

          if [ "$SCOPED" = 1 ] && [ -z "$CHANGED" ]; then
            echo "::notice title=Version::no published python-client content changed in this PR (checked ${PATHS[*]}); no version bump required"
            exit 0
          fi

          # The same tomllib read build-python-sdk.sh uses for the version it
          # stamps into __init__.py, so the two cannot disagree about where the
          # version lives. Name, version and the URL slug in one interpreter
          # start; the slug is PEP 503 normalisation (runs of `-_.` collapse to a
          # single `-`, lowercased). `tr -s '_.-' '-'` would do that correctly, but
          # the name has to come out of the TOML anyway, so a second process buys
          # only a second place for the normalisation to drift from the spec — and
          # a slug that is subtly wrong builds a URL that 404s for the wrong
          # reason, which this check would then read as "nothing published".
          read -r NAME DECLARED SLUG <<<"$(python -c '
          import re, tomllib
          with open("packages/python-client/pyproject.toml", "rb") as f:
              p = tomllib.load(f)["project"]
          print(p["name"], p["version"], re.sub(r"[-_.]+", "-", p["name"]).lower())
          ')"
          if [ -z "$NAME" ] || [ -z "$DECLARED" ] || [ -z "$SLUG" ]; then
            echo "::error title=Version::could not read name and version from packages/python-client/pyproject.toml"
            exit 1
          fi

          # VALIDATED before it reaches a URL, a `sort -V` or an annotation, the
          # same way the npm siblings validate theirs, and for the same three
          # reasons. It is interpolated into the PyPI URL below, so a value with a
          # slash or a `?` asks a different question than the one this check
          # reports. It is echoed into ::error lines, and it comes from the PR's
          # own pyproject.toml, so a newline plus `::` forges workflow commands.
          # And `sort -V` needs two comparable versions or the ahead-of-latest
          # test is meaningless.
          #
          # Byte-for-byte the npm siblings' pattern, deliberately, so "what is a
          # version here" has one answer across all three trains. PEP 440 is much
          # wider (`1!2.0`, `0.2.0.post1`, `1.0b2`) and every one of those is
          # refused: the release machinery derives and compares plain
          # major.minor.patch, and `sort -V` does not implement PEP 440 ordering,
          # so a version this lets through would be ranked by rules nobody
          # intended. Widen it here, in the npm siblings and in release.yml
          # together, or not at all.
          if [[ ! "$DECLARED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf '%s\n' "$DECLARED" | sed 's/^/[pyproject] /'
            echo "::error title=Version::the version in packages/python-client/pyproject.toml (logged above) is not a plain major.minor.patch with an optional -prerelease or +build, so it cannot be compared with PyPI"
            exit 1
          fi

          # Only the status code is ever printed; a JSON body would be untrusted
          # text. No `--fail`: a 404 is an ANSWER here, not a failure, so the
          # code is read rather than the exit status. A transport failure prints
          # 000, and `${code:-000}` covers a curl that printed nothing at all.
          pypi_status() {
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/$1/json" 2>/dev/null)" || true
            printf '%s' "${code:-000}"
          }

          # Nothing published at all. Distinguished from "this version is free"
          # because it is the state today and a reader who sees a green check
          # should know which of the two it means.
          PROJECT_STATUS="$(pypi_status "$SLUG")"
          if [ "$PROJECT_STATUS" = "404" ]; then
            echo "::notice title=Version::$NAME is not on PyPI at all, so $DECLARED is free. Nothing is currently enforced by this check — see the comment on this job."
            exit 0
          fi
          if [ "$PROJECT_STATUS" != "200" ]; then
            echo "::error title=Version::PyPI answered $PROJECT_STATUS for $NAME; an unanswered registry is not a green light"
            exit 1
          fi

          # Named once, so the error below cannot claim this PR touched published
          # content when the scoping diff is the very thing that failed.
          if [ "$SCOPED" = 1 ]; then
            WHY="this PR changes published python-client content"
          else
            WHY="this PR's changed paths could not be determined"
          fi

          # Is this exact version already released? Per-version 404 is the
          # free-version answer, the same shape as npm's E404.
          VERSION_STATUS="$(pypi_status "$SLUG/$DECLARED")"
          if [ "$VERSION_STATUS" = "200" ]; then
            echo "::error title=Version::${WHY}, and $NAME $DECLARED is already on PyPI. Bump the version in packages/python-client/pyproject.toml."
            exit 1
          fi
          if [ "$VERSION_STATUS" != "404" ]; then
            echo "::error title=Version::PyPI answered $VERSION_STATUS for $NAME $DECLARED; an unanswered registry is not a green light"
            exit 1
          fi

          # And is it above the latest release? A free version can still be below
          # it, and publishing that would leave `pip install malloy-publisher-sdk`
          # resolving something newer than what this repo declares.
          if ! LATEST="$(curl -sS "https://pypi.org/pypi/$SLUG/json" \
                 | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')" \
             || [ -z "$LATEST" ]; then
            echo "::error title=Version::could not read $NAME's latest version from PyPI"
            exit 1
          fi
          if [ "$DECLARED" != "$(printf '%s\n%s\n' "$LATEST" "$DECLARED" | sort -V | tail -1)" ]; then
            echo "::error title=Version::packages/python-client/pyproject.toml declares $DECLARED, which is BELOW PyPI's latest ($LATEST). Bump above $LATEST."
            exit 1
          fi

          echo "::notice title=Version::$NAME $DECLARED is free and above PyPI's latest ($LATEST)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build + test SDK
        run: packages/python-client/scripts/build-python-sdk.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-python-')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build
          cd packages/python-client
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          cd packages/python-client
          twine upload dist/* --non-interactive 