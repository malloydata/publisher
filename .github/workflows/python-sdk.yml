# Builds the Python SDK (`malloy-publisher-sdk`): generates the client from
# api-doc.yaml, tests it, builds the wheel and sdist, verifies them and uploads
# dist/ as the `python-client-dist` artifact. It publishes nothing and tests
# nothing against a server; those are its callers' jobs:
#
# - build.yml calls it on every PR into main and push to main, then its
#   python_sdk_smoke_test drives a server built from the same checkout through
#   the wheel, the way docker_smoke_test boots the image.
# - release.yml calls it on the release branch, then its publish-python-sdk
#   uploads the artifact to PyPI. The upload cannot live here: PyPI does not
#   support trusted publishing from a reusable workflow. CONTEXT.md, *Publishing
#   to PyPI*, has the rest.
#
# The version is not this workflow's to check either. The SDK releases in
# lockstep with sdk/app/server: release.yml's prepare stamps the release version
# into packages/python-client/pyproject.toml on the release branch, so there is
# no bump for a PR to forget.

name: python-sdk

on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to build; the caller's own ref when empty"
        required: false
        default: ""
        type: string
  # Build and verify on any branch by hand. It publishes nothing.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

jobs:
  # Generates the client, runs its tests, builds the wheel and sdist and
  # verifies them. Called from build.yml on every PR into main (ahead of its
  # python_sdk_smoke_test), and from release.yml on the release branch for that
  # release's PyPI upload. One path for both, so a green PR has built and
  # verified exactly the kind of artifact a release uploads, rather than the
  # guards first running on the day a PyPI filename is spent.
  #
  # Holds NO publishing credential, and must not gain one. This is the build
  # half of the split PyPI's trusted-publishing security model asks for:
  # `id-token: write` lets ANY step in a job mint a PyPI upload token, and this
  # job executes a lot of third-party code — uv, the generator, black, ruff,
  # pyright, pytest and the wheel's own runtime dependencies in the importability
  # check. Here a compromised one can at worst produce a bad artifact, which the
  # guards below and build.yml's smoke test exist to catch; in a job holding
  # id-token it could mint a token and upload anything under this project's
  # name. The upload itself is release.yml's `publish-python-sdk`, which runs
  # no repository code.
  build:
    name: Build and verify the wheel and sdist
    runs-on: ubuntu-latest
    # Bounded for the reason its siblings are, and generously, because it does
    # the most work here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The release branch when release.yml calls this, so the wheel is
          # generated from the api-doc.yaml of the server being released; the
          # caller's own ref (the PR) otherwise.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `pip install build && python -m build` is NOT enough here, and got this
      # wrong for as long as the old publish job was unreachable. Almost none of
      # this package is in git: packages/python-client/.gitignore is
      # `malloy_publisher_sdk/*` with `!malloy_publisher_sdk/__init__.py`, so a
      # checkout contains exactly ONE tracked python file, and that file's line 6
      # is `from .client import AuthenticatedClient, Client` — a module generated
      # from api-doc.yaml and never committed.
      #
      # Measured against a `git archive` of the tracked tree: `python -m build`
      # SUCCEEDS, the wheel installs, and `import malloy_publisher_sdk` raises
      # ModuleNotFoundError: No module named 'malloy_publisher_sdk.client'. So the
      # first upload would have been a dead package under a filename PyPI can
      # never reuse.
      #
      # Run the one script that knows how to produce this package instead.
      # BUILD_PACKAGE=true is what makes its step 9 emit dist/, and it validates
      # the spec, regenerates the client, formats it and runs the tests on the
      # way.
      - name: Generate, test, and build the wheel and sdist
        env:
          BUILD_PACKAGE: "true"
        run: packages/python-client/scripts/build-python-sdk.sh

      # The guard that makes the above impossible to regress silently. Asserting
      # "we remembered to regenerate" is what failed before; this asserts the
      # artifact, by installing the actual wheel into a throwaway venv and
      # importing it. That import is exactly what a user's first `pip install`
      # does, it is the statement that was broken, and it costs seconds.
      #
      # Deliberately BEFORE the upload, and in this job rather than the publish
      # one, because a PyPI filename cannot be reused: a check afterwards would
      # only tell you which version you had burned.
      - name: Verify the wheel is importable before uploading it
        run: |
          set -euo pipefail
          cd packages/python-client
          # A glob array, not `ls`: shellcheck's SC2012, and it also makes the
          # count and the chosen file come from one expansion so they cannot
          # disagree.
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          if [ "${#WHEELS[@]}" -eq 0 ]; then
            echo "::error title=Publish::no wheel in packages/python-client/dist/, so there is nothing to verify or upload"
            exit 1
          fi
          # Exactly one, or the check attests to a file the publish job may not
          # be uploading: it uploads everything in dist/. build-python-sdk.sh
          # does `rm -rf dist/` first, so more than one means something else put
          # a wheel there.
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            printf '[dist] %s\n' "${WHEELS[@]}"
            echo "::error title=Publish::expected exactly one wheel in dist/, found ${#WHEELS[@]}; it is not clear which one would be published"
            exit 1
          fi
          WHEEL="${WHEELS[0]}"

          # The sdist too, because the publish job ships BOTH and a PyPI filename
          # can never be reused for either. Almost nothing resolves an
          # sdist for a pure-python wheel, which is why this is a containment
          # check rather than an install: it asserts the generated client is
          # actually inside the tarball, which is the failure that motivated all
          # of this. One sdist, for the same reason as one wheel.
          SDISTS=(dist/*.tar.gz)
          if [ "${#SDISTS[@]}" -ne 1 ]; then
            printf '[dist] %s\n' "${SDISTS[@]}"
            echo "::error title=Publish::expected exactly one sdist in dist/, found ${#SDISTS[@]}"
            exit 1
          fi
          # Listed ONCE into a variable rather than piped into `grep -q`, and
          # that is not a style preference. `grep -q` exits on its first match;
          # malloy_publisher_sdk/client.py is the SECOND of ~230 entries, so tar
          # takes EPIPE on its next write, `pipefail` reports the pipeline as
          # failed, and the check announces the file is missing WHILE LOGGING IT
          # AS PRESENT. It is a race — whether tar has already emptied its
          # listing into the pipe buffer decides it — which is why the harness
          # for this step passed and the first real run failed with
          # `tar: stdout: write error` above a listing containing client.py.
          # Reading it once also makes the logged listing the same bytes the
          # check ran against, rather than a second tar that could differ.
          # Captured through `if !` rather than left to `set -e`, so a tarball
          # that cannot be read at all still gets an annotation naming what
          # happened. Left bare, that case aborts the step with only tar's
          # stderr, and "missing client" would have been the wrong diagnosis
          # for it anyway.
          if ! SDIST_LISTING="$(tar -tzf "${SDISTS[0]}")"; then
            echo "::error title=Publish::${SDISTS[0]} could not be listed as a gzipped tarball, so the sdist that would be uploaded is unreadable. NOTHING was uploaded."
            exit 1
          fi
          if ! grep -qE '/malloy_publisher_sdk/client\.py$' <<<"$SDIST_LISTING"; then
            while IFS= read -r entry; do printf '[sdist] %s\n' "$entry"; done <<<"$SDIST_LISTING"
            echo "::error title=Publish::${SDISTS[0]} does not contain malloy_publisher_sdk/client.py, so the sdist is missing the generated client (logged above). NOTHING was uploaded."
            exit 1
          fi
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet "$WHEEL"
          # From /tmp, so the source tree on disk cannot satisfy the import and
          # make an empty wheel look fine.
          if ! (cd /tmp && /tmp/wheelcheck/bin/python -c '
          import malloy_publisher_sdk as m
          from malloy_publisher_sdk import AuthenticatedClient, Client
          print("import ok:", m.__name__)
          '); then
            echo "::error title=Publish::the built wheel ${WHEEL} does not import. The generated client is almost certainly missing — packages/python-client/malloy_publisher_sdk/ is gitignored except __init__.py, so the wheel must be built by scripts/build-python-sdk.sh and not by a bare \`python -m build\` on a checkout. NOTHING was uploaded."
            exit 1
          fi

      # Only after every guard above has passed, so nothing downstream can be
      # handed a dist/ that was not verified: build.yml's python_sdk_smoke_test
      # on a PR, release.yml's publish-python-sdk (which holds id-token) on a
      # release.
      - name: Hand the verified dist/ on
        uses: actions/upload-artifact@v4
        with:
          name: python-client-dist
          path: packages/python-client/dist/
          if-no-files-found: error
          # Long enough to "Re-run failed jobs" on a release whose PyPI upload
          # failed at the registry, which reuses this artifact rather than
          # rebuilding it.
          retention-days: 7
