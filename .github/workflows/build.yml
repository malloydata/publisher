name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: 1.3.13
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# self contained tests
# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

jobs:
  lint:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        # Building the SDK is necessary to generate the .d.ts files used for type checking.
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - name: Typecheck
        run: |
          if [ "${{ steps.bun-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit! Using cached dependencies..."
            bun install --frozen-lockfile --no-summary
          else
            echo "Cache miss! Installing dependencies..."
            bun install --frozen-lockfile
          fi
          bun run generate-api-types
          bun run build:sdk
          bun run typecheck
  lint_format:
    name: Lint and check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        run: |
          echo "Bun cache hit: ${{ steps.bun-cache.outputs.cache-hit }}"
          bun install --frozen-lockfile
      - name: Check formatting
        run: bunx prettier './packages/**/*.{ts,tsx}' --check
      - name: Lint
        run: bun run lint
      # Fail the build if the DuckDB CLI version baked at build time has drifted
      # from the @duckdb/node-api query engine. Without this, a Malloy bump that
      # moves the engine to a new DuckDB version silently leaves the CLI behind,
      # so baked extensions land in a directory the runtime never reads and it
      # re-fetches them from the network at query time (which fails on runners
      # that cannot reach extensions.duckdb.org).
      - name: Check DuckDB version consistency
        run: bun run validate-duckdb-sync
      # Fail the build if the pinned pg resolution has drifted from the version
      # @malloydata/db-postgres declares. pg is transitive via db-postgres; #786
      # pins it in resolutions to keep the driver deterministic. A Malloy bump
      # should keep pg in step with the connector (via upgrade-malloy.sh /
      # sync-pg-version.js), not leave the resolution out of sync with it.
      - name: Check pg version consistency
        run: bun run validate-pg-sync
      # The root `test` script is not run in CI, and `scripts/release-notes.mjs`
      # is otherwise exercised only by a real release — on `main`, after npm and
      # Docker have already published, where a bug is discovered by reading a
      # wrong release page. Hence its own step here rather than a file alone.
      #
      # The smoke check is the half that catches an authoring mistake. `extract`
      # fails on a heading it cannot read a title from, so running it against the
      # repo's actual RELEASE_NOTES.md fails the PR that wrote the bad heading,
      # rather than the release that would silently fall back to the PR list.
      - name: Run script tests
        run: |
          set -euo pipefail
          bun run test:scripts
          node scripts/release-notes.mjs extract >/dev/null
      # The skills ship Python that no other suite touches: the ledger contract
      # (event types and the grandfathering of legacy shapes), the retrieval
      # scorer, the contamination check, the REST parse. It is
      # stdlib-only and sub-second, so it rides here rather than earning a job.
      # The runner's own python3 is enough; there is nothing to install.
      # The same command runs locally (`bun run test:skills-python`), and it
      # discovers `*_test.py` rather than listing them, so a new one is picked
      # up without editing this file.
      - name: Run skills Python tests
        run: bun run test:skills-python
  # Smoke-tests the built server under two invocation scenarios.
  #
  # Note on scope: the published `bin` entry uses `#!/usr/bin/env node`, so the
  # CLI install paths (`npx malloy-publisher` and `bunx malloy-publisher`) both
  # require Node on PATH to resolve the shebang. Bun as a runtime works fine,
  # but the CLI wrapper currently goes through Node. These two legs test the
  # two layers separately:
  #
  #   npx        — End-user install path. Runs `npx malloy-publisher` against
  #                the locally linked package. Exercises bin resolution, the
  #                `#!/usr/bin/env node` shebang, and Node's ESM execution of
  #                the bundled `dist/server.mjs`. Node is required.
  #
  #   bun-direct — Runtime-level Bun compatibility. Removes Node from the
  #                runner and invokes `bun run ./dist/server.mjs` directly —
  #                bypassing the shebang. Proves that the ESM bundle itself
  #                executes correctly under Bun without any Node dependency
  #                at runtime.
  #
  # Future work: if the community asks for it, add support for
  # `bunx malloy-publisher` on a Node-less machine (would require a different
  # shebang strategy, e.g. a runtime-selecting shell launcher or a dedicated
  # Bun bin entry).
  runtime_test:
    name: ${{ matrix.runtime }} test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node-user install path: shebang-driven `npx` invocation.
          - runtime: npx
            port: 4002
          # Bun runtime compatibility: Node stripped from runner, `bun run` on
          # the built bundle. See the block comment above for why `bunx` is
          # not tested here.
          - runtime: bun-direct
            port: 4003
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Setup Node.js
        if: matrix.runtime == 'npx'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - name: build server
        run: |
          echo "Bun cache hit: ${{ steps.bun-cache.outputs.cache-hit }}"
          bun install --frozen-lockfile
          bun run build
        env:
          BUN_CONFIG_SKIP_POSTINSTALL_SCRIPTS: "1"
      - name: Remove Node.js (direct Bun leg only)
        if: matrix.runtime == 'bun-direct'
        run: |
          # The ubuntu-latest runner ships with Node preinstalled. Remove it so
          # the direct Bun leg genuinely proves Bun-only compatibility — no Node can
          # be shimmed in via PATH lookup or shebang resolution.
          sudo apt-get remove -y --purge nodejs nodejs-doc npm || true
          sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
          sudo rm -rf /opt/hostedtoolcache/node
          hash -r
          if command -v node >/dev/null 2>&1; then
            echo "✗ 'node' is still on PATH at $(command -v node) — cannot prove Bun-only compatibility"
            exit 1
          fi
          echo "✓ Node removed; PATH=$PATH"
          command -v bun && bun --version
      - name: Link local package (npx only)
        if: matrix.runtime == 'npx'
        working-directory: packages/server
        run: |
          echo "→ npm link"
          npm link
      - name: Start server via ${{ matrix.runtime }}
        working-directory: packages/server
        run: |
          if [ "${{ matrix.runtime }}" = "bun-direct" ]; then
            # Bypass the `#!/usr/bin/env node` shebang by invoking Bun directly
            # on the bundled entry file. This validates direct Bun execution of
            # the built server artifact without depending on Node.
            echo "→ bun run ./dist/server.mjs"
            bun run ./dist/server.mjs --port ${{ matrix.port }} --server_root ./ \
              > /tmp/server.log 2>&1 &
          else
            echo "→ npx malloy-publisher (uses #!/usr/bin/env node shebang)"
            npx malloy-publisher --port ${{ matrix.port }} --server_root ./ \
              > /tmp/server.log 2>&1 &
          fi
          echo $! > /tmp/server.pid
          echo "Server PID: $(cat /tmp/server.pid)"
      - name: Wait for server to reach 'serving' state
        run: |
          SERVER_PID=$(cat /tmp/server.pid)
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "✗ Server process died"
              echo "--- server log ---"
              cat /tmp/server.log
              exit 1
            fi
            status=$(curl -sf http://localhost:${{ matrix.port }}/api/v0/status || true)
            state=$(echo "$status" | jq -r '.operationalState // empty')
            echo "[${i}s] operationalState=${state:-<no response>}"
            if [ "$state" = "serving" ]; then
              echo "✓ Server is serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server did not reach 'serving' within 60s"
          echo "--- server log ---"
          cat /tmp/server.log
          exit 1
      - name: Test list environments
        run: |
          response=$(curl -s http://localhost:${{ matrix.port }}/api/v0/environments)
          echo "API Response: $response"
          if echo "$response" | jq -e '. | length == 1' > /dev/null; then
            echo "✓ API test passed: Found 1 environment"
          else
            echo "✗ API test failed: Expected 1 envrionment, got different response"
            echo "--- server log ---"
            cat /tmp/server.log
            exit 1
          fi

  # Smoke-tests the production Docker image: builds it locally with the same
  # Dockerfile used for releases, runs it with the publisher port exposed, and
  # polls /api/v0/status until the server reports operationalState=serving.
  # This proves the image produced by `docker build` actually boots — not just
  # that the bundled .mjs executes under Bun (which runtime_test covers).
  docker_smoke_test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Version-contract gate that pairs with the offline LOAD smoke test below:
      # that step proves the DuckLake extension is baked and loads offline; this
      # one proves the catalog-format RANGE that engine supports (1.0 <= format
      # <= its max) is still covered by the migration matrix. Derived purely from
      # the pinned @duckdb/node-api version — it fails the build the moment a
      # Malloy bump moves the engine to a minor line whose max DuckLake catalog
      # format has not been verified and recorded (never an enumerated list).
      - name: Check DuckLake catalog-format range contract
        run: bun run validate-ducklake-catalog-range
      # Derive the DuckDB CLI version from the engine Malloy resolves
      # (@duckdb/node-api in bun.lock) so the image's baked CLI/extensions
      # always match the runtime, regardless of the Dockerfile ARG default.
      - name: Resolve DuckDB version from Malloy
        id: duckdb
        run: echo "version=$(node scripts/duckdb-version.js)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            DUCKDB_VERSION=${{ steps.duckdb.outputs.version }}
          tags: malloy-publisher:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image metadata
        run: |
          # Lock in the Dockerfile claims made for audit findings #7 and #8:
          # both runtime ports must be EXPOSEd, and the OCI image labels
          # that surface mount-path docs must be present. A LABEL syntax
          # typo or a dropped EXPOSE line would otherwise only surface to
          # users at deploy time.
          set -e
          exposed=$(docker inspect malloy-publisher:smoke-test \
            --format='{{json .Config.ExposedPorts}}')
          echo "ExposedPorts: $exposed"
          echo "$exposed" | jq -e '."4000/tcp"' >/dev/null \
            || { echo "✗ Missing EXPOSE 4000"; exit 1; }
          echo "$exposed" | jq -e '."4040/tcp"' >/dev/null \
            || { echo "✗ Missing EXPOSE 4040"; exit 1; }
          echo "✓ All runtime ports declared"
          labels=$(docker inspect malloy-publisher:smoke-test \
            --format='{{json .Config.Labels}}')
          echo "Labels: $labels"
          for key in title description source documentation licenses; do
            echo "$labels" | jq -e --arg k "org.opencontainers.image.$key" \
              '.[$k] | strings | length > 0' >/dev/null \
              || { echo "✗ Missing/empty OCI label: org.opencontainers.image.$key"; exit 1; }
          done
          echo "✓ All five OCI image labels present"
          # Nobody starts an agent session inside the container, so the
          # .mcp.json the server writes into its working directory could never
          # be read there. The git-working-tree guard that would otherwise
          # cover /publisher cannot fire, because .dockerignore excludes .git
          # from the image, so this ENV is the only thing suppressing it. A new
          # final stage or a stage reorder would drop it with nothing going
          # red. Scope: this checks the smoke image built here. docker-image.yml
          # builds its own from the same default final stage and asserts
          # nothing, so a release built from an unchecked ref is not covered.
          env_json=$(docker inspect malloy-publisher:smoke-test \
            --format='{{json .Config.Env}}')
          echo "$env_json" | jq -e 'index("PUBLISHER_NO_MCP_CONFIG=1")' >/dev/null \
            || { echo "✗ Image does not set PUBLISHER_NO_MCP_CONFIG=1"; exit 1; }
          echo "✓ .mcp.json creation suppressed in the image"
      - name: Verify baked DuckDB extensions
        run: |
          # The image bakes the DuckDB extensions the server loads at runtime
          # (packages/server build runs bake-duckdb-extensions; the builder's
          # ~/.duckdb/extensions is copied into the final image). This asserts
          # they are actually present and LOAD *offline* -- with the network cut
          # off, so a load can only succeed from the baked on-disk cache, never a
          # fallback download. Catches a broken bake, a version mismatch between
          # the baked dir and the CLI, or the snowflake bundled-driver regression
          # (we removed the external ADBC driver install).
          set -e
          version="${{ steps.duckdb.outputs.version }}"

          # 1. The CLI version must match the version we baked against, or the
          #    baked v<version>/ dir is invisible to it.
          cli_version=$(docker run --rm --entrypoint duckdb \
            malloy-publisher:smoke-test -noheader -list -c "SELECT version();")
          echo "CLI version: $cli_version (expected v$version)"
          echo "$cli_version" | grep -q "v$version" \
            || { echo "✗ DuckDB CLI version != baked version"; exit 1; }

          # 2. Each core extension must LOAD with no network (--network none).
          #    INSTALL is a no-op when already baked; LOAD proves it's usable.
          for ext in httpfs aws azure postgres ducklake excel; do
            docker run --rm --network none --entrypoint duckdb \
              malloy-publisher:smoke-test -c "INSTALL $ext; LOAD $ext;" \
              || { echo "✗ core extension '$ext' failed to load offline"; exit 1; }
            echo "✓ $ext loads offline"
          done

          # 3. The community extensions (bigquery, snowflake) must load offline too.
          for ext in bigquery snowflake; do
            docker run --rm --network none --entrypoint duckdb \
              malloy-publisher:smoke-test -c "LOAD $ext;" \
              || { echo "✗ community extension '$ext' failed to load offline"; exit 1; }
            echo "✓ $ext loads offline"
          done

          # 4. snowflake does NOT self-provide its ADBC driver, whatever an earlier
          #    version of this comment asserted. The extension is a wrapper over
          #    libadbc_driver_snowflake.so, which the image installs separately.
          #    LOAD succeeds without it and only snowflake_query() fails, so step 3
          #    cannot see it missing -- which is how the image came to ship unable
          #    to run a single Snowflake query.
          #
          #    4a. Structural: a driver beside EVERY directory holding the
          #    extension. The Dockerfile places one per directory and asserts that
          #    at least one exists; "at least one" and "one beside each" diverge if
          #    a copy fails in a non-final loop iteration, because a pipeline's
          #    status is its last command's. The explicit zero-match guard matters
          #    for the same reason: `find | while read` succeeds vacuously when the
          #    loop body never runs.
          docker run --rm --entrypoint sh malloy-publisher:smoke-test -c '
            n=$(find /root/.duckdb/extensions -name snowflake.duckdb_extension -printf "%h\n" | wc -l)
            [ "$n" -gt 0 ] || { echo "no snowflake.duckdb_extension in the image"; exit 1; }
            find /root/.duckdb/extensions -name snowflake.duckdb_extension -printf "%h\n" \
              | while read -r d; do
                  [ -f "$d/libadbc_driver_snowflake.so" ] || { echo "no driver beside $d"; exit 1; }
                done' \
            || { echo "✗ ADBC Snowflake driver not co-located with the extension"; exit 1; }
          echo "✓ ADBC driver sits beside every snowflake.duckdb_extension"

          #    4b. Functional: the driver actually LOADS. Presence cannot show that
          #    -- a truncated or wrong-architecture .so sits there and fails to
          #    dlopen, which 4a reports as perfectly fine.
          #
          #    Asserted by PROGRESS rather than by message. Offline with a bogus
          #    secret the query fails whatever happens; what differs is how far it
          #    gets. With the driver loaded it clears ADBC init and enters
          #    Snowflake's login retry loop, so it is still running when the timeout
          #    kills it (124). A missing or unloadable driver dies immediately.
          #
          #    Two properties follow, both measured against a real image, one with
          #    the driver deleted and one with it truncated. It cannot rot: no error
          #    text is matched, so a reworded message cannot quietly stop the check
          #    from checking -- the failure this step exists to correct. And it
          #    costs ~10s rather than the ~3.5 MINUTES that letting the login
          #    retries exhaust takes. That wait is the retry loop itself and is not
          #    avoidable by pointing the secret at loopback (measured: identical).
          rc=0
          docker run --rm --network none --entrypoint bash \
            malloy-publisher:smoke-test -c \
            "timeout 10 duckdb -c \"LOAD snowflake;
               CREATE SECRET s (TYPE snowflake, ACCOUNT 'x', USER 'y', PASSWORD 'z');
               SELECT * FROM snowflake_query('SELECT 1','s');\" >/dev/null 2>&1" \
            >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "✗ snowflake_query() died before reaching the network (exit $rc)"
            echo "  the ADBC driver is missing or failed to load"
            exit 1
          fi
          echo "✓ ADBC driver loads (a real query reaches Snowflake's login retry)"
          echo "✓ All baked DuckDB extensions load offline"
      - name: Start container
        run: |
          docker run -d --name malloy-publisher-smoke \
            -p 4000:4000 \
            malloy-publisher:smoke-test
          echo "Container ID: $(docker ps -q -f name=malloy-publisher-smoke)"
      - name: Wait for server to reach 'serving' state
        run: |
          for i in $(seq 1 90); do
            if ! docker ps -q -f name=malloy-publisher-smoke | grep -q .; then
              echo "✗ Container exited"
              echo "--- container logs ---"
              docker logs malloy-publisher-smoke || true
              exit 1
            fi
            status=$(curl -sf http://localhost:4000/api/v0/status || true)
            state=$(echo "$status" | jq -r '.operationalState // empty')
            echo "[${i}s] operationalState=${state:-<no response>}"
            if [ "$state" = "serving" ]; then
              echo "✓ Server is serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server did not reach 'serving' within 90s"
          echo "--- container logs ---"
          docker logs malloy-publisher-smoke || true
          exit 1
      - name: Test /api/v0/environments
        run: |
          response=$(curl -s http://localhost:4000/api/v0/environments)
          echo "API Response: $response"
          if echo "$response" | jq -e '. | type == "array"' > /dev/null; then
            echo "✓ /api/v0/environments returned a JSON array"
          else
            echo "✗ /api/v0/environments did not return a JSON array"
            echo "--- container logs ---"
            docker logs malloy-publisher-smoke || true
            exit 1
          fi
      - name: Container logs (always)
        if: always()
        run: docker logs malloy-publisher-smoke || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f malloy-publisher-smoke || true

  cross_platform_test:
    name: Cross Platform Tests
    uses: ./.github/workflows/cross-platform-tests.yml
