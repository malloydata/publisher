# TEMPORARY: calibration runs for the main-thread regression check. Removed
# before merge.
name: mtr-calibration

on:
  pull_request:
    paths:
      - ".github/workflows/mtr-calibration.yml"

env:
  BUN_VERSION: 1.4.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  ab:
    name: ${{ matrix.pair }} ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pair: ["120-vs-121", "120-vs-125", "126-vs-126", "126-vs-131", "126-vs-main", "main-vs-main"]
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: A/B
        working-directory: packages/server
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          main=44fbcb53357c5671d0ace9f72c98041271d6164b
          case "$PAIR" in
            120-vs-121) b=git:v0.12.0; c=git:v0.12.1 ;;
            120-vs-125) b=git:v0.12.0; c=git:v0.12.5 ;;
            126-vs-126) b=git:v0.12.6; c=git:v0.12.6 ;;
            126-vs-131) b=git:v0.12.6; c=git:v0.13.1 ;;
            126-vs-main) b=git:v0.12.6; c=git:$main ;;
            main-vs-main) b=git:$main; c=git:$main ;;
          esac
          bun tests/perf/main-thread/run.ts --baseline "$b" --candidate "$c" \
            --rounds 2 --out "$RUNNER_TEMP/mtr" --expect-cpus 4 || echo "exit $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal-${{ matrix.pair }}-${{ matrix.n }}
          path: |
            ${{ runner.temp }}/mtr/*.json
            ${{ runner.temp }}/mtr/*.md
          if-no-files-found: ignore
          retention-days: 5
