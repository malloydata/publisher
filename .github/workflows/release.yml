name: Release (NPM + Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (optional — defaults to npm patch bump of
          current sdk version)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      branch_name: ${{ steps.bump.outputs.branch_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

      - name: Bump version and create branch
        id: bump
        run: |
          set -euo pipefail

          PKGS="packages/sdk/package.json packages/app/package.json packages/server/package.json"

          # Rewrite the top-level "version" field in each workspace package.json.
          # We can't use `npm version --workspaces` here: this repo uses Bun's
          # `workspace:*` dependency protocol, which npm rejects with
          # EUNSUPPORTEDPROTOCOL. A direct, format-preserving replace avoids npm
          # entirely.
          set_version() {
            local ver="$1" f
            for f in $PKGS; do
              node -e '
                const fs = require("fs");
                const [p, ver] = process.argv.slice(1);
                const s = fs
                  .readFileSync(p, "utf8")
                  .replace(/("version"\s*:\s*")[^"]*(")/, `$1${ver}$2`);
                fs.writeFileSync(p, s);
              ' "$f" "$ver"
            done
          }

          # Refuses anything that is not a plain major.minor.patch, rather than
          # bumping it into nonsense. Splitting "0.0.250-rc.1" on "." gives
          # ["0","0","250-rc","1"], and Number("250-rc") is NaN, so the naive
          # form of this returned `0.0.NaN` and the walk below would have gone on
          # to publish it. No prerelease can reach here today — npm-sdk.yml
          # routes a hyphenated version to the `next` dist-tag, so one never
          # becomes `latest` — but the floor is now read from the registry rather
          # than from a file in this repo, and the registry is not ours to
          # constrain.
          bump_patch() {
            node -e '
              const v = process.argv[1];
              const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
              if (!m) {
                console.error(
                  `cannot patch-bump "${v}": expected exactly major.minor.patch`,
                );
                process.exit(1);
              }
              console.log(`${m[1]}.${m[2]}.${Number(m[3]) + 1}`);
            ' "$1"
          }

          # A version is taken once its release branch or release tag exists, so
          # reruns don't collide with a previously prepared release.
          version_taken() {
            local v="$1"
            if git ls-remote --exit-code --heads origin "release/sdk-${v}" >/dev/null 2>&1; then
              return 0
            fi
            if git ls-remote --exit-code --tags origin "v${v}" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          if [ -n "${{ inputs.version }}" ]; then
            NEW_VERSION="${{ inputs.version }}"
            NEW_VERSION="${NEW_VERSION#v}"
            NEW_VERSION="$(echo "$NEW_VERSION" | tr -d '[:space:]')"
            echo "::notice title=Version::Using provided version $NEW_VERSION"
            if version_taken "$NEW_VERSION"; then
              echo "::error title=Version::release/sdk-${NEW_VERSION} or tag v${NEW_VERSION} already exists"
              exit 1
            fi
          else
            echo "::notice title=Version::No version provided — performing patch bump"

            # The floor is what npm holds, not what main declares. Release
            # branches are never merged back, so packages/sdk/package.json lags
            # the registry permanently, and walking up from it stops at the
            # first version whose branch and tag are FREE — which is not the
            # same as one above `latest`. Skip a number (any explicit
            # `-f version=` that jumps ahead does) and the walk later drops into
            # the gap, publishes below `latest`, and moves the dist-tag
            # BACKWARDS with nothing failing.
            #
            # `npm view <pkg> version` returns the version behind the `latest`
            # dist-tag — deliberately, and NOT the highest version published.
            # Those differ for this package, so the distinction is load-bearing
            # rather than pedantic: `@malloy-publisher/sdk@1.0.1` really is on
            # npm (an old off-line publish `latest` has long since moved off), so
            # it is the maximum by version sort while `latest` sits on the 0.0.x
            # line. "Correcting" this to the maximum (`npm view … versions` piped
            # through a sort) would make the next release 1.0.2 and take the whole
            # project's version line with it, permanently. `latest` is the tag
            # `npm install` resolves and the one this release is about to move,
            # so it is the right floor.
            #
            # Fail closed when the registry will not answer. The alternative is
            # falling back to the stale file, which is the bug this exists to
            # prevent, and the explicit-version path above is unaffected.
            PUBLISHED="$(npm view @malloy-publisher/sdk version 2>/dev/null || true)"
            if [ -z "$PUBLISHED" ]; then
              echo "::error title=Version::could not read the published sdk version from npm, so the next version cannot be derived safely. Re-run with an explicit version input."
              exit 1
            fi
            DECLARED="$(node -p "require('./packages/sdk/package.json').version")"
            CURRENT="$(printf '%s\n%s\n' "$PUBLISHED" "$DECLARED" | sort -V | tail -1)"
            # Annotate before bump_patch refuses it. A failing command
            # substitution under `set -e` kills the step where it stands, so the
            # function's own guard would abort with a bare stack trace and no
            # annotation to read. Only the floor needs this: every later
            # bump_patch input is a previous bump_patch output.
            if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::the floor resolved to '${CURRENT}' (npm ${PUBLISHED}, main ${DECLARED}), which is not a plain major.minor.patch, so patch-bumping it is meaningless. Re-run with an explicit version input."
              exit 1
            fi
            echo "::notice title=Version::floor is ${CURRENT} (npm ${PUBLISHED}, main ${DECLARED})"
            NEW_VERSION="$(bump_patch "$CURRENT")"
            while version_taken "$NEW_VERSION"; do
              echo "::notice title=Version::release/sdk-${NEW_VERSION} already exists — bumping again"
              NEW_VERSION="$(bump_patch "$NEW_VERSION")"
            done
          fi

          set_version "$NEW_VERSION"

          BRANCH_NAME="release/sdk-${NEW_VERSION}"
          git checkout -b "$BRANCH_NAME"

          git add $PKGS
          git commit -s -m "Release SDK/App version ${NEW_VERSION}"

          git push origin "$BRANCH_NAME"

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          echo "::notice title=Prepared Release::Version ${NEW_VERSION} on branch ${BRANCH_NAME}"

  publish-npm:
    needs: prepare
    uses: ./.github/workflows/npm-sdk.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.branch_name }}

  publish-docker:
    needs: prepare
    uses: ./.github/workflows/docker-image.yml
    secrets: inherit
    with:
      current_version: ${{ needs.prepare.outputs.new_version }}
      ref: ${{ needs.prepare.outputs.branch_name }}

  # skills and create-malloy-package version on their own lines, so this job
  # triggers them rather than versioning them.
  #
  # It triggers them but does NOT align their version numbers with sdk/app/
  # server, and that is not an omission to be tidied up later. malloydata/malloy
  # gets one shared number across its packages from Lerna fixed mode; these two
  # were already published on their own lines before this job existed, and npm
  # versions are immutable, so there is no path back to a shared number. Each
  # package therefore publishes at the version its own package.json declares,
  # and is skipped when that version is already on npm.
  #
  # They are DISPATCHED through the Actions API rather than called with
  # workflow_call, deliberately. npm allows one trusted publisher per package
  # and matches it against the TOP-LEVEL workflow filename, so a workflow_call
  # would make npm see release.yml and every entry would have to be re-pointed
  # here. Standalone dispatch of either child would then stop being able to
  # publish, which is the capability skills-npm.yml exists to provide. A
  # dispatched run is its own top-level run, so each child keeps its own npm
  # entry, and no npm setting has to change for this job to work.
  #
  # Deliberately NOT in gh-release's needs. These packages are independent of
  # the sdk/app/server artifacts, and prepare walks the patch version forward on
  # a re-run rather than resuming, so gating the tag on them would turn a failed
  # package publish into a partial release that cannot be re-run at the same
  # version. A failure here still reddens the run.
  publish-packages:
    name: Publish independently-versioned packages
    # Ordering and abort-on-failure only: a failed version bump should not
    # publish anything. This job reads prepare's version solely for the
    # prerelease check below, and deliberately checks out main rather than the
    # release branch (see the checkout below).
    needs: prepare
    runs-on: ubuntu-latest
    # Two full poll budgets (25m each, below) plus checkout and setup, with
    # margin. Keep this above 2 x POLL_BUDGET_SECONDS or a second package timing
    # out is killed by the job cap before it can print which package failed.
    timeout-minutes: 60
    permissions:
      contents: read
      # For the workflow-dispatch API. Not id-token: this job never publishes,
      # it only asks the registry and triggers the children.
      #
      # actions: write cannot be narrowed to "dispatch these two workflows"; it
      # also covers cancelling runs and deleting run logs repo-wide. Keep this
      # job dependency-free for that reason: checkout and setup-node only, no
      # bun install and no third-party actions, so there is nothing here for a
      # compromised dependency to execute with that scope.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main, never needs.prepare.outputs.branch_name. prepare bumps only
          # sdk/app/server, so the release branch's copies of these two packages
          # are identical to main, and both children guard on
          # github.ref == 'refs/heads/main'. Dispatched on a release branch their
          # publish jobs SKIP, and a skipped job reports success, so the release
          # would go green having published nothing.
          ref: main
          # Nothing here authenticates to git: the only local git call is
          # rev-parse, and the live sha comes over the API. Without this,
          # checkout leaves a token carrying this job's actions: write scope in
          # .git/config for the life of the job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish skills, then create-malloy-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, not interpolated into the script body.
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail

          echo "## Independently-versioned packages" >> "$GITHUB_STEP_SUMMARY"

          # Skip on a prerelease. These packages carry their own versions, which
          # have no hyphen, so their publish workflows would tag them `latest`
          # even though the release cutting them is a prerelease. gh-release
          # skips prereleases for the same reason.
          #
          # Checked here rather than as a job-level `if:` so that it announces
          # itself. A skipped job writes no summary and no annotation, and a
          # skipped job still reports success, so gating it that way would make
          # a green release that published nothing completely invisible.
          if [[ "$NEW_VERSION" == *-* ]]; then
            echo "::notice title=Independently-versioned packages::Skipped for prerelease version ${NEW_VERSION}. Publish these from an ordinary release, or dispatch skills-npm.yml and then create-malloy-package-npm.yml on main."
            echo "Skipped for prerelease version \`${NEW_VERSION}\`. Publish these from an ordinary release, or dispatch their workflows on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Wait for the version to land on npm rather than watching the child
          # run: a child whose publish job was skipped reports success, so the
          # run's conclusion would not catch it, and asking the registry has no
          # correlation race with a concurrent manual dispatch.
          #
          # Size the budget against the whole child run, not one job of it. Its
          # publish job needs check_pack first (a full frozen-lockfile install of
          # the monorepo, a build, and the package's tests, which has taken over
          # six minutes on its own), and then repeats the install in the publish
          # job itself, with no cache in either. Add dispatch queue time and npm
          # CDN visibility lag. Timing out early is expensive in the wrong way:
          # the release goes red for a publish that in fact succeeded, and
          # because the failure stops the sequence the second package is never
          # dispatched at all.
          #
          # A wall-clock deadline rather than an attempt count, so npm latency
          # cannot stretch the budget past the job's timeout-minutes and cost us
          # the diagnostic below.
          POLL_BUDGET_SECONDS=1500
          POLL_SLEEP=15
          # How many consecutive unexpected registry answers end the wait. One
          # is not enough: a single 5xx or DNS blip says almost nothing about
          # whether the child published, and giving up on it would reintroduce
          # exactly the failure the budget comment above is about, with the
          # second package never dispatched.
          POLL_MAX_REGISTRY_ERRORS=3

          # Registry and API output can contain anything, including a line starting with
          # "::" that the runner would parse as a workflow command. Prefix every
          # line with a non-whitespace marker: the runner trims leading
          # whitespace before it looks for "::", so indenting would not help.
          echo_untrusted_output() {
            printf '%s\n' "$1" | sed 's/^/[npm] /'
          }

          # The sha this job verified its versions against. Fixed for the whole
          # job by definition: it is what the checkout above contains, and
          # nothing here commits or pulls. Re-reading it per package would
          # return the same value and fix nothing, which is why the staleness
          # problem is solved by scoping the comparison (below) rather than by
          # moving this line.
          if ! CHECKOUT_SHA="$(git rev-parse HEAD)"; then
            echo "::error title=Independently-versioned packages::could not read this checkout's sha, so nothing can be verified against main. Neither package was dispatched."
            echo "- nothing dispatched: could not read the checkout's sha" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          publish_pkg() {
            local dir="$1" wf="$2" name version spec out deadline live_sha errors
            local changed file_count relevant file path
            local -a paths
            # Read through `if !`, and validate. A bare assignment under set -e
            # dies with a raw Node stack trace, no annotation and no summary
            # line, which is the silent failure the summary lines exist to
            # prevent. And `node -p` prints the string "undefined" with exit 0
            # for a missing field, so a manifest that lost its name would build
            # the spec `undefined@0.1.3`; the package named `undefined` exists on
            # npm, so that spec can resolve and be read as "already published".
            if ! name="$(node -p "require('./packages/${dir}/package.json').name" 2>&1)" \
               || ! version="$(node -p "require('./packages/${dir}/package.json').version" 2>&1)"; then
              echo_untrusted_output "${name}${version}"
              echo "::error title=${dir}::could not read packages/${dir}/package.json, so ${wf} was not dispatched"
              echo "- \`${dir}\` NOT dispatched: could not read its package.json" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if [ -z "$name" ] || [ "$name" = "undefined" ] || [ -z "$version" ] || [ "$version" = "undefined" ]; then
              echo "::error title=${dir}::packages/${dir}/package.json declares name='${name}' version='${version}'; refusing to publish an unnamed or unversioned package. ${wf} was not dispatched."
              echo "- \`${dir}\` NOT dispatched: its package.json has no usable name or version" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            spec="${name}@${version}"

            # The paths this package's PUBLISHED content is built from, which is
            # not the same as the paths it lives in.
            #
            # skills packs the repo-root skills/ tree as well as its own
            # directory, so it has both.
            #
            # create-malloy-package ships dist/ and templates/ built from its own
            # directory, PLUS a dependency range its publish job bakes in by
            # reading packages/skills/package.json from main at dispatch time.
            # That file therefore belongs in its list even though its contents
            # never enter the tarball. Scoped to the one file rather than the
            # skills directory: a skill edit cannot change what the scaffolder
            # publishes, only a version change can.
            #
            # The child workflow file is in both lists because a dispatch runs
            # whatever definition main holds at dispatch time, not the one this
            # job read.
            # skills additionally watches the root install inputs, and the
            # asymmetry with the scaffolder is deliberate. Its dist/ is emitted
            # by `tsc`, whose version bun resolves from the root lockfile, so a
            # lockfile-only bump changes the published bytes. The scaffolder's
            # dist/ comes from `bun build --packages external`, where the bun
            # version is pinned by BUN_VERSION in its own (watched) workflow file
            # and nothing from node_modules enters the bundle.
            case "$dir" in
              skills) paths=("skills/" "packages/skills/" "bun.lock" "package.json") ;;
              create-malloy-package) paths=("packages/${dir}/" "packages/skills/package.json") ;;
              *) paths=("packages/${dir}/") ;;
            esac
            paths+=(".github/workflows/${wf}")

            # The whole guard rests on the trailing-slash convention below, and
            # both ways of getting it wrong disable an entry silently rather than
            # loudly: a directory written without its slash becomes an exact-file
            # comparison that can never fire, and a file written with one becomes
            # a prefix that can never fire. Check the convention against the
            # checkout instead of trusting whoever edits the list next.
            for path in "${paths[@]}"; do
              case "$path" in
                */) [ -d "${path%/}" ] && continue ;;
                *) [ -f "$path" ] && continue ;;
              esac
              echo "::error title=${name}::watched path '${path}' does not match its kind in this checkout (a trailing slash means a directory, none means a file). ${wf} was NOT dispatched, because an entry that cannot match silently stops guarding."
              echo "- \`${spec}\` NOT dispatched: watched path '${path}' is malformed" >> "$GITHUB_STEP_SUMMARY"
              return 1
            done

            # Three outcomes, matching create-malloy-package-npm.yml: published
            # means there is nothing to do; E404 means the version is free;
            # anything else means the registry did not answer, which is not the
            # same as a green light.
            # Exit 0 AND non-empty output. npm answers some queries with exit 0
            # and nothing on stdout, which is not a yes: this repo already says
            # so in two places, `create-malloy-package-npm.yml`'s pinned-skills
            # check and `check-pack.ts` ("an empty stdout is a no, not a yes"),
            # and this was the one caller that took exit 0 alone as definitive.
            # Empty output now falls through to "the registry did not answer",
            # which is the only honest reading of it.
            if out="$(npm view "$spec" version --prefer-online 2>&1)" && [ -n "$out" ]; then
              echo "::notice title=${name}::${spec} is already published; nothing to do"
              echo "- \`${spec}\` was already on npm, skipped" >> "$GITHUB_STEP_SUMMARY"
              return 0
            elif [[ "$out" == *E404* ]]; then
              : # the version is free, carry on
            else
              echo_untrusted_output "$out"
              echo "::error title=${name}::could not ask npm whether ${spec} is taken (no E404, and no version in the answer)"
              echo "- \`${spec}\` NOT dispatched: npm did not answer whether it is already published" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            # Fail closed on a content change, not just a version change: skills
            # publishes the repo-root skills/ tree, so a commit that leaves the
            # version untouched can still change what ships under it, and npm
            # versions are immutable.
            #
            # Scoped to this package's paths rather than to any movement at all.
            # The second package's check runs after the first has finished a full
            # dispatch-and-wait, up to POLL_BUDGET_SECONDS, so comparing bare shas
            # failed the scaffolder whenever anything at all merged inside that
            # window, including changes that could not affect it. That is a
            # likely event on a busy day and it stops the sequence.
            # `if !` rather than a bare assignment. Under set -e a failing
            # command substitution kills the step outright, before the check
            # below can run, so a gh crash here produced no annotation and an
            # empty job summary: the exact silent failure the summary lines
            # exist to prevent. The regex below only catches a gh that SUCCEEDS
            # and returns something that is not a sha.
            if ! live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>&1)"; then
              echo_untrusted_output "$live_sha"
              echo "::error title=${name}::could not reach the GitHub API to read main's current sha (logged above); ${wf} was not dispatched"
              echo "- \`${spec}\` NOT dispatched: could not reach the API to read main's sha" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if [[ ! "$live_sha" =~ ^[0-9a-f]{40}$ ]]; then
              # Through the prefixer, not inlined: this is the branch where the
              # value FAILED validation, so it is exactly the case where it may
              # not be a bare sha. Same reasoning as the count below.
              echo_untrusted_output "$live_sha"
              echo "::error title=${name}::could not read main's current sha as 40 hex characters (logged above); ${wf} was not dispatched"
              echo "- \`${spec}\` NOT dispatched: could not read main's sha" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            if [ "$live_sha" != "$CHECKOUT_SHA" ]; then
              # Every branch from here fails closed. A wrong "proceed" publishes
              # an immutable version whose content nobody verified; a wrong
              # "stop" costs a re-run.
              #
              # One request, and deliberately NOT --paginate. The compare
              # endpoint paginates its `commits` array; `files` is capped at 300
              # and comes back whole on every page, so --paginate would emit the
              # same filenames once per commit page. That inflates the count
              # below and would trip the cap check on a wide-enough release
              # window: a false failure of exactly the kind this whole change
              # exists to remove.
              #
              # The count comes from the same response as the names, in one
              # --jq program, so the two cannot disagree and it stays a single
              # round trip. Line prefixes because filenames are untrusted text.
              # The `type` assertion is not decoration. Without it a response
              # carrying no `files` array yields `COUNT 0` from `null | length`
              # before it errors, and the whole point of this block is that
              # "zero relevant files" means "go ahead and publish".
              # `previous_filename` as well as `filename`, and that is not
              # belt and braces. The compare API reports a rename under its NEW
              # path only, so moving packages/skills/foo.md to docs/foo.md
              # changes what the skills tarball contains while reporting a path
              # that matches nothing here. Emitting both makes a rename OUT of a
              # watched directory count, which is the fail-closed direction. A
              # deletion already reports the old path, so it was never affected.
              # `.status` is checked FIRST and is not defensive padding. This is
              # a three-dot compare, so it is merge-base relative: if main was
              # rewritten and live_sha is no longer a descendant of the
              # checkout, `files` describes merge-base to live_sha and simply
              # omits every commit that existed at checkout and no longer does.
              # A rewind returns an empty list. Both read as "nothing relevant
              # changed", which is the one wrong answer that publishes.
              # Requiring "ahead" makes anything other than a fast-forward abort.
              if ! changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${CHECKOUT_SHA}...${live_sha}" --jq 'if .status != "ahead" then error("main is not a fast-forward ahead of this checkout (status=\(.status)); the file list would be incomplete") elif (.files | type) != "array" then error("compare response has no files array") else ("COUNT \(.files | length)"), (.files[] | "FILE \(.filename)"), (.files[] | select(.previous_filename) | "FILE \(.previous_filename)") end' 2>&1)"; then
                echo_untrusted_output "$changed"
                echo "::error title=${name}::main moved from ${CHECKOUT_SHA} to ${live_sha} and the compare API did not answer, so whether it touched ${dir} is unknown. ${wf} was NOT dispatched."
                echo "- \`${spec}\` NOT dispatched: main moved and the compare API did not answer" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi

              file_count="$(printf '%s\n' "$changed" | sed -n 's/^COUNT //p')"
              if [[ ! "$file_count" =~ ^[0-9]+$ ]]; then
                # Print the value through the prefixer rather than inlining it in
                # the annotation. It is derived from filenames, a filename may
                # contain a newline, and two forged COUNT lines would otherwise
                # put attacker text at the start of a line inside this ::error,
                # where the runner reads it as a workflow command.
                echo_untrusted_output "$file_count"
                echo "::error title=${name}::could not read a single numeric changed-file count from the compare of ${CHECKOUT_SHA}...${live_sha} (logged above), so a change to ${dir} cannot be ruled out. ${wf} was NOT dispatched."
                echo "- \`${spec}\` NOT dispatched: unreadable compare response" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi

              # The compare endpoint caps files at 300 and signals that only by
              # returning exactly that many, so a diff at the cap may be
              # truncated and a relevant file may be missing from it.
              if [ "$file_count" -ge 300 ]; then
                echo "::error title=${name}::main moved from ${CHECKOUT_SHA} to ${live_sha} across at least 300 files, which is the compare API's cap, so the file list may be truncated and cannot rule out a change to ${dir}. ${wf} was NOT dispatched."
                echo "- \`${spec}\` NOT dispatched: compare diff hit the 300-file cap" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi

              relevant=""
              while IFS= read -r file; do
                # Only FILE lines; the COUNT line above shares this stream.
                case "$file" in FILE\ *) file="${file#FILE }" ;; *) continue ;; esac
                [ -n "$file" ] || continue
                # A trailing slash means "this directory and everything under
                # it"; anything else is one exact file. Without the distinction
                # a bare filename also matches its own neighbours by prefix, so
                # packages/skills/package.json.bak would count as a change to
                # packages/skills/package.json.
                for path in "${paths[@]}"; do
                  case "$path" in
                    # A directory entry also has to match the directory's own
                    # path with the slash stripped. Replace the skills/ tree with
                    # a file or a symlink and git reports the blob at `skills`,
                    # which the prefix form alone would miss.
                    */) case "$file" in
                          "$path"* | "${path%/}") relevant="${relevant}  ${file}"$'\n'; break ;;
                        esac ;;
                    *) [ "$file" = "$path" ] && { relevant="${relevant}  ${file}"$'\n'; break; } ;;
                  esac
                done
              done <<< "$changed"

              if [ -n "$relevant" ]; then
                # Deliberately does not claim nothing was published: on the second
                # package, the first may already have been dispatched and confirmed.
                # The job summary records what actually shipped.
                echo "::error title=${name}::main moved from ${CHECKOUT_SHA} to ${live_sha} during this release and touched files ${spec} is built from, so ${wf} would not publish what this job verified. It was NOT dispatched; see the job summary for what already shipped. Re-run THIS JOB (Re-run failed jobs), or dispatch ${wf} on main directly. Do not re-run the whole release: that bumps and republishes sdk/app/server."
                printf '%s\n' "$relevant" | sed 's/^/[changed] /'
                echo "- \`${spec}\` NOT dispatched: main moved under its own paths" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi

              echo "::notice title=${name}::main moved from ${CHECKOUT_SHA} to ${live_sha} during this release, but nothing under ${paths[*]} changed, so ${spec} is still what ${wf} will publish"
            fi

            # The dispatch API returns no run id, and picking one out of
            # gh run list right afterwards can select an older or concurrent
            # run, so link the filtered workflow view rather than a wrong run.
            local runs_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/${wf}?query=branch%3Amain"

            echo "::notice title=${name}::dispatching ${wf} on main to publish ${spec} (${runs_url})"
            # Aborting here is right: polling 25 minutes for a run that was never
            # created helps nobody. But under `set -e` a bare command would exit
            # the step with only gh's stderr and the notice above to go on, which
            # is the one exit from this function with no explanation of its own.
            if ! out="$(gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main 2>&1)"; then
              echo_untrusted_output "$out"
              echo "::error title=${name}::could not dispatch ${wf} on main, so ${spec} was not published and nothing is waiting for it. Check that the workflow exists on main and still declares workflow_dispatch, then dispatch it yourself at ${runs_url}."
              echo "- \`${spec}\` NOT dispatched: the dispatch API call failed" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            deadline=$((SECONDS + POLL_BUDGET_SECONDS))
            errors=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              sleep "$POLL_SLEEP"
              # Keep the same three-way distinction the check above makes. A
              # registry that cannot answer is not the same as a child that did
              # not publish, and reporting it as the latter would send the
              # operator to a child run they will find green. Require the
              # condition to persist, though: a single blip is not evidence, and
              # giving up on one would strand the second package undispatched.
              # Exit 0 AND non-empty, for the reason given on the check above.
              # This is the more dangerous of the two sites: an empty answer read
              # as success would print "published", write "published" to the job
              # summary, and return 0, so on the second package the release ends
              # GREEN asserting a publish that never happened. An empty answer is
              # counted as a registry that did not answer, not as a yes and not
              # as a no.
              if out="$(npm view "$spec" version --prefer-online 2>&1)" && [ -n "$out" ]; then
                echo "::notice title=${name}::${spec} published"
                echo "- \`${spec}\` published" >> "$GITHUB_STEP_SUMMARY"
                return 0
              elif [[ "$out" == *E404* ]]; then
                errors=0
              else
                errors=$((errors + 1))
                echo_untrusted_output "$out"
                if [ "$errors" -ge "$POLL_MAX_REGISTRY_ERRORS" ]; then
                  echo "::error title=${name}::npm stopped answering while waiting for ${spec} (${errors} consecutive answers that were neither a version nor an E404); the ${wf} run may have published it. Check ${runs_url} and npm before re-dispatching."
                  echo "- \`${spec}\` dispatched, then npm stopped answering; check ${runs_url} and npm" >> "$GITHUB_STEP_SUMMARY"
                  return 1
                fi
              fi
            done

            echo "::error title=${name}::${spec} did not appear on npm within $((POLL_BUDGET_SECONDS / 60))m. Check ${runs_url}. If that run failed, fix it and dispatch ${wf} on main; do not re-run the whole release, which bumps and republishes sdk/app/server."
            echo "- \`${spec}\` dispatched but did not appear on npm, see ${runs_url}" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          # Order is not optional. create-malloy-package pins its skills
          # dependency from the monorepo and then asks the registry whether that
          # range resolves, so skills has to be ON NPM before the scaffolder is
          # dispatched. Dispatching both at once races and fails the scaffolder.
          publish_pkg skills skills-npm.yml
          publish_pkg create-malloy-package create-malloy-package-npm.yml

  gh-release:
    needs: [ prepare, publish-npm, publish-docker ]
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` covers everything this job does: the tag, the release,
      # and the stamp branch. It does NOT need `pull-requests: write`, because
      # the stamp step deliberately stops at pushing a branch — see the long
      # comment on that step for why a bot-opened PR is the wrong shape here.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.new_version }}
          BRANCH: ${{ needs.prepare.outputs.branch_name }}
          # The list of narrative headings this step puts on the release page,
          # handed to the stamp step below. Under $RUNNER_TEMP and not in the
          # repo: the stamp step checks out a fresh branch from `origin/main`,
          # which would discard an in-tree file before it could be read. Note
          # this file does not survive the run, which is why the manual recovery
          # in the publisher-release skill cannot simply pass `--titles`.
          TITLES_FILE: ${{ runner.temp }}/release-notes-titles.txt
        run: |
          TAG="v${VERSION}"

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## Release v${VERSION}

          ### 📦 NPM packages
          - [\`@malloy-publisher/sdk@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/sdk/v/${VERSION})
          - [\`@malloy-publisher/app@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/app/v/${VERSION})
          - [\`@malloy-publisher/server@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/server/v/${VERSION})

          ### 🐳 Docker image
          \`\`\`
          docker pull ms2data/malloy-publisher:${VERSION}
          docker pull ms2data/malloy-publisher:latest
          \`\`\`

          ### ℹ️ Details
          - Release branch: \`${BRANCH}\`
          - Triggered by: @${{ github.actor }}
          EOF

          # Append the hand-written narrative, if this release has any.
          #
          # --generate-notes below lists the merged PRs, which is enough for a
          # routine patch but says nothing about a breaking change, a deprecation
          # or a metric whose meaning moved. Those live in RELEASE_NOTES.md's
          # `## [Unreleased]` sections, and used to reach the release page only
          # if a human remembered to paste them after the fact. Nobody did for
          # 0.0.243 through 0.0.247.
          #
          # Read from this checkout, which is the release branch: `prepare`
          # touches only the three package.json files, so its RELEASE_NOTES.md is
          # main's. Empty output is the normal case and adds nothing.
          #
          # `--titles` records the exact heading lines that go on the page, so
          # the stamp step can rewrite those and only those. Without it, `extract`
          # reads the release branch's snapshot and `stamp` rewrites whatever main
          # became several minutes later, and a section merged inside that window
          # is stamped with a version it never shipped in — off this page, and
          # ineligible for every later one, because its heading no longer says
          # [Unreleased].
          #
          # Read through `if !`, not a bare assignment. This step has no `set -e`
          # of its own, but the runner's default shell is `bash -e {0}`, so a
          # non-zero exit from the substitution kills the step HERE — after npm
          # and Docker have published and before `gh release create` runs, so the
          # release would never be cut, over a docs-formatting problem. A missing
          # narrative is not worth that: warn, and let the generated PR list stand
          # alone. `publish-packages` uses the same form a few hundred lines up,
          # for the same reason.
          #
          # stderr goes to a file rather than through `2>&1`: merging it would put
          # anything the script ever writes there straight onto the public release
          # page.
          EXTRACT_LOG="$(mktemp)"
          EXTRACT_OK=1
          if ! NARRATIVE="$(node scripts/release-notes.mjs extract --titles "$TITLES_FILE" 2>"$EXTRACT_LOG")"; then
            # Prefixed, not inlined: this is untrusted-shaped output on the
            # failure path, and a line of it starting with `::` would otherwise be
            # read by the runner as a workflow command.
            sed 's/^/[release-notes] /' "$EXTRACT_LOG"
            echo "::warning title=Release notes::could not read RELEASE_NOTES.md (logged above); this release's page carries the generated PR list only, and nothing is stamped on main"
            echo "- release notes: narrative NOT attached and nothing stamped — \`release-notes.mjs extract\` failed" >> "$GITHUB_STEP_SUMMARY"
            NARRATIVE=""
            EXTRACT_OK=0
            # An empty titles file, so the stamp step below finds no sections to
            # rewrite instead of failing to read the artifact at all.
            : > "$TITLES_FILE"
          elif [ -s "$EXTRACT_LOG" ]; then
            sed 's/^/[release-notes] /' "$EXTRACT_LOG"
          fi
          if [ -n "$NARRATIVE" ]; then
            printf '\n%s\n' "$NARRATIVE" >> "$NOTES_FILE"
            echo "::notice title=Release notes::attached $(grep -c '^## ' <<< "$NARRATIVE") narrative section(s) from RELEASE_NOTES.md"
          elif [ "$EXTRACT_OK" = 1 ]; then
            # Only when the file was actually read. Saying "no sections" after a
            # failed read describes the wrong situation, and it is the one a
            # reader is most likely to skim past.
            echo "::notice title=Release notes::no [Unreleased] sections; the generated PR list stands alone"
          fi

          if [[ "$VERSION" == *-* ]]; then
            echo "::notice title=GitHub Release::Skipping release creation for prerelease version ${VERSION}"
            echo "## 🏷️ GitHub Release" >> $GITHUB_STEP_SUMMARY
            echo "Skipped for prerelease version \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Pin the changelog base to the immediately preceding release tag.
          # Each release is cut from a fresh release/sdk-* branch that is never
          # merged back to main, so prior release tags are not ancestors of this
          # release's commit. Left to --generate-notes alone, GitHub's ancestor
          # walk skips every diverged sibling tag and lands on the last tag still
          # in the mainline ancestry, producing a changelog spanning hundreds of
          # PRs. Selecting the previous tag by version sort and passing it as the
          # explicit start tag scopes the notes to just this release's changes.
          # Prerelease tags (containing a hyphen) are excluded so the base is
          # always the last stable release, consistent with the prerelease skip
          # above.
          git fetch --tags --force
          PREV_TAG="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -vx "$TAG" | tail -1)"

          NOTES_START_ARGS=()
          if [ -n "$PREV_TAG" ]; then
            echo "::notice title=Changelog::Generating notes from ${PREV_TAG} to ${TAG}"
            NOTES_START_ARGS=(--notes-start-tag "$PREV_TAG")
          else
            echo "::notice title=Changelog::No previous tag found; using default note generation"
          fi

          gh release create "$TAG" \
            --target "$BRANCH" \
            --title "v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --generate-notes \
            "${NOTES_START_ARGS[@]}"

          echo "## 🏷️ GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "Created release [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY

      # Prepare the stamp for the sections this release just shipped.
      #
      # Deliberately AFTER `gh release create`: the stamp records what shipped,
      # so a release that failed to cut must not leave main claiming a version
      # that does not exist. Two things enforce that ordering, and neither is a
      # `set -e` in the step above — it has none. The runner's default shell is
      # `bash -e {0}`, so a failing command there exits the step non-zero; and
      # this step's `if:` has no `always()`, so its implicit `success()` is what
      # keeps it from running. Adding `always()` to that condition — or
      # `continue-on-error` to the step above — removes the guarantee while this
      # comment still claims it.
      #
      # Failure here is not made fatal. The release is already public and correct
      # by this point, and reddening a finished release over a docs commit would
      # send someone hunting a publishing problem that does not exist. But the
      # cost is NOT just a heading that still reads [Unreleased]. That heading is
      # what the next release's `extract` matches, so the next release re-appends
      # this release's narrative to its own page, and so does every release after
      # it, until someone notices. Hence the annotations and summary lines below:
      # a skipped stamp has to be visible without opening the logs.
      #
      # A note on timing that is invisible from this job: `publish-packages` is
      # NOT in this job's `needs`, so it may still be polling npm while the step
      # below runs, and its "main moved during this release" guard aborts a
      # dispatch when main moves under a watched path.
      #
      # The step below cannot trip it: it pushes a branch, and main does not
      # move. But do NOT conclude the path list stopped mattering, because the
      # release does not end here — the operator is then told to open and merge
      # the stamp PR, and `publish-packages` can still be inside its npm poll
      # budget when they do. That merge moves main mid-release, and it is
      # harmless for one reason only: RELEASE_NOTES.md is in none of the paths
      # that guard watches. Adding a watched path that RELEASE_NOTES.md matches,
      # without re-reading this comment, would turn every narrative release into
      # an aborted package dispatch.
      - name: Push a branch stamping the shipped sections
        if: ${{ !contains(needs.prepare.outputs.new_version, '-') }}
        # A backstop, not the error handling: every failure below is reported
        # explicitly, as a ::warning and a job-summary line, because a stamp that
        # silently did not happen is re-shipped as narrative on the next release.
        # This only keeps an unanticipated one from reddening a finished release.
        continue-on-error: true
        env:
          VERSION: ${{ needs.prepare.outputs.new_version }}
          # Written by the step above: the exact heading lines that reached the
          # release page. See that step for why it lives under $RUNNER_TEMP.
          TITLES_FILE: ${{ runner.temp }}/release-notes-titles.txt
          COMPARE_BASE: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          set -euo pipefail

          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

          BRANCH="release-notes-stamp-${VERSION}"
          STAMP_LOG="$(mktemp)"
          FAILURE=""
          STAMPED=0
          OUTCOME=""

          # This step prepares a branch and hands a human a link. It deliberately
          # does neither of the two more automatic things, and the reasons are
          # worth keeping because both look better than they are.
          #
          # NOT `git push origin main`, which is what this step did until 0.0.250
          # and which never once worked: main is protected and requires a pull
          # request, so every attempt was rejected with GH006, retry included.
          # 0.0.249 is the worked example — six sections on its release page, none
          # stamped. A bypass cannot be granted from inside the workflow; it is a
          # change to the branch protection itself, by someone with admin.
          #
          # NOT `gh pr create` either, though that was the obvious replacement.
          # Opening a PR with GITHUB_TOKEN requires the repo/org setting "Allow
          # GitHub Actions to create and approve pull requests", which is OFF by
          # default, and reading it needs admin — so from here it is unverifiable.
          # Depending on an unverifiable permission is exactly how the GH006 bug
          # got written: the old code assumed a push it was never allowed to make,
          # and the comment above it admitted the assumption was unconfirmed.
          # Repeating that shape would have failed the same way, silently, at the
          # next release.
          #
          # A branch push, by contrast, is PROVEN on this token: `prepare` pushes
          # `release/sdk-<version>` every single release. And letting a human open
          # the PR is not merely safer, it is better — a PR opened by a person
          # triggers `pull_request`, so its checks actually run and any maintainer
          # can merge it. A bot-authored PR never triggers workflows, so its
          # required checks would sit at `expected` forever and only an admin
          # could merge. The cost is one click, and it buys back the check suite.
          #
          # Each git command is checked rather than left to `set -e`. A bare
          # failure would exit the step, and `continue-on-error` would then report
          # it as a success with nothing in the summary — the silent skip this
          # whole step exists to end. The two passes cover a transient fetch,
          # stamp or push failure; nothing here has a side effect that a second
          # attempt could duplicate, which is what makes retrying safe now that
          # no PR is created.
          for pass in 1 2; do
            # Names the actual reason, before it is cleared. A retry is usually a
            # flaky fetch, but a stamp or a push can fail into it too.
            if [ "$pass" = 2 ]; then
              echo "::notice title=Release notes::${FAILURE}; retrying"
            fi
            FAILURE=""

            # A fresh main, not this checkout: this job is on the release branch,
            # and main may have moved since the release started.
            git fetch origin main || { FAILURE="could not fetch main"; continue; }
            git checkout -B "$BRANCH" origin/main || { FAILURE="could not check out ${BRANCH}"; continue; }

            if ! STAMPED="$(node scripts/release-notes.mjs stamp "$VERSION" --titles "$TITLES_FILE" 2>"$STAMP_LOG")"; then
              sed 's/^/[release-notes] /' "$STAMP_LOG"
              FAILURE="release-notes.mjs stamp failed (logged above)"
              continue
            fi
            # Non-empty on success means a section that reached the release page
            # was edited or removed on main during the release window, so there is
            # no heading left to stamp. Nothing to undo — the narrative is already
            # public — but it should not pass unremarked.
            if [ -s "$STAMP_LOG" ]; then
              sed 's/^/[release-notes] /' "$STAMP_LOG"
              echo "::warning title=Release notes::a section on the release page is no longer in RELEASE_NOTES.md on main (logged above) and was not stamped"
            fi
            if [ "$STAMPED" = "0" ]; then
              OUTCOME="nothing"
              break
            fi

            git add RELEASE_NOTES.md || { FAILURE="could not stage RELEASE_NOTES.md"; continue; }
            if git diff --cached --quiet; then
              OUTCOME="already"
              break
            fi
            git commit -s -m "docs: stamp the release notes shipped in ${VERSION}" \
              || { FAILURE="could not commit the stamp"; continue; }

            # NOT forced. A stamp branch already on the remote may carry a
            # human's conflict resolution — the documented fix when main has
            # moved under RELEASE_NOTES.md — and force-pushing the freshly
            # recomputed stamp over it would discard that work with no warning.
            # So a rejected push is inspected rather than overridden: a branch
            # that already exists is left exactly as it is and reported.
            if git push origin "$BRANCH" 2>"$STAMP_LOG"; then
              OUTCOME="pushed"
              break
            fi
            sed 's/^/[git push] /' "$STAMP_LOG"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              OUTCOME="existing"
              break
            fi
            FAILURE="could not push ${BRANCH} (logged above)"
          done

          # Every outcome writes a summary line, including the no-op ones. An
          # empty "Release notes" section would be indistinguishable from this
          # step dying before it wrote anything, and the whole point of the
          # annotations is that a skipped stamp is visible without opening logs.
          COMPARE_URL="${COMPARE_BASE}/main...${BRANCH}?expand=1"
          echo "## 📝 Release notes" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FAILURE" ]; then
            echo "::warning title=Release notes::${FAILURE}, so RELEASE_NOTES.md on main is NOT stamped. Its heading still reads [Unreleased], which means the NEXT release re-appends this release's narrative to its own page, and so does every release after it. Recovery is in the publisher-release skill, step 3 — do NOT run an unscoped stamp, it rewrites every [Unreleased] section including ones this release did not ship."
            {
              echo "⚠️ **Not stamped on \`main\`** — ${FAILURE}."
              echo
              echo "\`RELEASE_NOTES.md\` still reads \`[Unreleased]\`, so the next release will re-append this release's narrative to its page."
              echo
              echo "Check whether the branch reached the remote anyway — if \`release-notes-stamp-${VERSION}\` is there, the stamp is computed correctly and only needs a PR: [open it](${COMPARE_URL}). If it is not, follow step 3 of the \`publisher-release\` skill. **Do not run \`release-notes.mjs stamp\` without \`--titles\`**: unscoped it stamps every \`[Unreleased]\` section, including ones this release did not ship."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$OUTCOME" in
            pushed|existing)
              # The annotation and the summary line are emitted separately on
              # purpose: redirecting the whole if/else to $GITHUB_STEP_SUMMARY
              # captures the `::notice` too, so GitHub never sees the annotation
              # and the summary carries a raw `::notice` line instead.
              if [ "$OUTCOME" = existing ]; then
                echo "::notice title=Release notes::${BRANCH} was already on the remote and was left untouched; open ${COMPARE_URL}"
                LEAD="Branch \`${BRANCH}\` was **already on the remote** and has been left exactly as it was, in case it carries a fix someone pushed. Check it, then open the PR."
              else
                echo "::notice title=Release notes::pushed ${BRANCH} stamping ${STAMPED} section(s) as ${VERSION}; open ${COMPARE_URL}"
                LEAD="Pushed \`${BRANCH}\`, stamping ${STAMPED} section(s) as \`${VERSION}\`."
              fi
              {
                echo "$LEAD"
                echo
                echo "👉 **[Open the pull request](${COMPARE_URL}) and merge it before the next release.**"
                echo
                echo "This last step is a human's on purpose. A PR opened by a person triggers \`pull_request\`, so its checks run and any maintainer can merge it; one opened by this workflow would never trigger them, leaving required checks at \`expected\` and an admin as the only person who could merge. Left unopened, the headings on \`main\` still read \`[Unreleased]\` — which is exactly what the next release's \`extract\` matches, so ${VERSION}'s narrative lands on the next release's page too, and on every one after that."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            nothing)
              echo "::notice title=Release notes::nothing to stamp on main"
              echo "No \`[Unreleased]\` sections to stamp — this release's page carries its generated PR list only. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
              ;;
            already)
              echo "::notice title=Release notes::already stamped on main"
              echo "Already stamped as \`${VERSION}\` on \`main\` — someone got there first. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
