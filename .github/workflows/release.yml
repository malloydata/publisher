name: Release (NPM + Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (optional — defaults to bumping npm's
          current latest by the `bump` level below)"
        required: false
        type: string
      # Which part of npm's current `latest` to increment when `version` is
      # empty. `version` wins outright if given, so this only ever chooses
      # between patch and minor on the derived path.
      #
      # There is deliberately no `major`. Publisher is pre-1.0 by policy
      # (0.MINOR.PATCH, minor = breaking) and 1.0.0 and 1.0.1 are already
      # published and immutable, so a 1.x line could not start below 1.0.2 —
      # which makes a major a deliberate decision to be made with an explicit
      # `version`, not a dropdown choice. `.github/workflows/CONTEXT.md` and the
      # publisher-release skill both carry the policy.
      bump:
        description: "How to bump when no version is given: patch, or minor for a
          breaking release"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      branch_name: ${{ steps.bump.outputs.branch_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

      - name: Bump version and create branch
        id: bump
        env:
          # Through env, not interpolated into the script body. `version` a few
          # lines below still is, which is pre-existing and is why this one is
          # not: an `inputs.*` expression is substituted before bash parses the
          # line, so it belongs here.
          #
          # `|| 'patch'` because a `workflow_dispatch` fired through the API
          # without this field sends no value at all, and the input default only
          # fills the UI form. Without it BUMP would be empty and the case guard
          # below would fail a release that asked for nothing unusual.
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          PKGS="packages/sdk/package.json packages/app/package.json packages/server/package.json"

          # Rewriting the top-level "version" field in each workspace
          # package.json lives in scripts/set-version.mjs rather than a shell
          # function here, so it can be tested. It kept this
          # function's reasoning with it — the short version being that
          # `npm version --workspaces` rejects this repo's `workspace:*`
          # protocol with EUNSUPPORTEDPROTOCOL, so the replace is hand-rolled
          # and format-preserving — and gained the two assertions this function
          # was missing: it refuses a version that would corrupt the JSON, and
          # it fails rather than rewriting a file whose "version" field it could
          # not find. That second one mattered: this function wrote such a file
          # back byte-identical and exited 0, so the release published the OLD
          # version under the new tag. scripts/set-version.spec.ts covers it,
          # and `build.yml`'s lint_format runs that on every PR.

          # bump_version <patch|minor> <version>
          #
          # Refuses anything that is not a plain major.minor.patch, rather than
          # bumping it into nonsense. Splitting "0.0.250-rc.1" on "." gives
          # ["0","0","250-rc","1"], and Number("250-rc") is NaN, so the naive
          # form of this returned `0.0.NaN` and the walk below would have gone on
          # to publish it. No prerelease can reach here today — npm-sdk.yml
          # routes a hyphenated version to the `next` dist-tag, so one never
          # becomes `latest` — but the floor is now read from the registry rather
          # than from a file in this repo, and the registry is not ours to
          # constrain.
          #
          # One function taking the level, rather than a bump_patch beside a
          # bump_minor: the guard above is the whole substance of it, and a second
          # copy is a second thing to forget to fix.
          #
          # A minor resets the patch to 0 — that is what makes `^0.MINOR.0` a
          # usable range for a consumer, which is the point of the policy in
          # CONTEXT.md.
          bump_version() {
            node -e '
              const [level, v] = process.argv.slice(1);
              const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
              if (!m) {
                console.error(
                  `cannot ${level}-bump "${v}": expected exactly major.minor.patch`,
                );
                process.exit(1);
              }
              const [major, minor, patch] = m.slice(1).map(Number);
              if (level === "minor") {
                console.log(`${major}.${minor + 1}.0`);
              } else {
                console.log(`${major}.${minor}.${patch + 1}`);
              }
            ' "$1" "$2"
          }

          # A version is taken once its release branch or release tag exists, so
          # reruns don't collide with a previously prepared release.
          #
          # Release branches were named `release/sdk-<v>` through 0.9.6. A
          # release that failed before its tag left only that branch, so an
          # explicit `-f version=` naming such a number must still be refused.
          version_taken() {
            local v="$1"
            local branch
            for branch in "release/v${v}" "release/sdk-${v}"; do
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                return 0
              fi
            done
            if git ls-remote --exit-code --tags origin "v${v}" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          if [ -n "${{ inputs.version }}" ]; then
            NEW_VERSION="${{ inputs.version }}"
            NEW_VERSION="${NEW_VERSION#v}"
            NEW_VERSION="$(echo "$NEW_VERSION" | tr -d '[:space:]')"
            echo "::notice title=Version::Using provided version $NEW_VERSION"
            if version_taken "$NEW_VERSION"; then
              echo "::error title=Version::a release branch (release/v${NEW_VERSION} or release/sdk-${NEW_VERSION}) or tag v${NEW_VERSION} already exists"
              exit 1
            fi
          else
            # Read through env below, but validated here rather than trusted: a
            # `type: choice` input is enforced by the dispatch UI and the API,
            # and this is the one place that assumption would turn into an
            # unintended release if it were ever wrong.
            case "$BUMP" in
              patch|minor) ;;
              *)
                echo "::error title=Version::bump input is '${BUMP}'; expected 'patch' or 'minor'. For anything else, pass an explicit version."
                exit 1
                ;;
            esac
            echo "::notice title=Version::No version provided — performing ${BUMP} bump"

            # The floor is what npm holds, not only what main declares. Main's
            # packages/sdk/package.json catches up only when a release's PR
            # merges (and lagged npm by 41 patches before that PR existed), and
            # walking up from a stale number stops at the first version whose
            # branch and tag are FREE — which is not the same as one above
            # `latest`. Skip a number (any explicit
            # `-f version=` that jumps ahead does) and the walk later drops into
            # the gap, publishes below `latest`, and moves the dist-tag
            # BACKWARDS with nothing failing.
            #
            # `npm view <pkg> version` returns the version behind the `latest`
            # dist-tag — deliberately, and NOT the highest version published.
            # Those differ for this package, so the distinction is load-bearing
            # rather than pedantic: `@malloy-publisher/sdk@1.0.1` really is on
            # npm (an old off-line publish `latest` has long since moved off), so
            # it is the maximum by version sort while `latest` sits on the 0.0.x
            # line. "Correcting" this to the maximum (`npm view … versions` piped
            # through a sort) would make the next release 1.0.2 and take the whole
            # project's version line with it, permanently. `latest` is the tag
            # `npm install` resolves and the one this release is about to move,
            # so it is the right floor.
            #
            # Fail closed when the registry will not answer. The alternative is
            # falling back to the stale file, which is the bug this exists to
            # prevent, and the explicit-version path above is unaffected.
            PUBLISHED="$(npm view @malloy-publisher/sdk version 2>/dev/null || true)"
            if [ -z "$PUBLISHED" ]; then
              echo "::error title=Version::could not read the published sdk version from npm, so the next version cannot be derived safely. Re-run with an explicit version input."
              exit 1
            fi
            DECLARED="$(node -p "require('./packages/sdk/package.json').version")"
            CURRENT="$(printf '%s\n%s\n' "$PUBLISHED" "$DECLARED" | sort -V | tail -1)"
            # Annotate before bump_version refuses it. A failing command
            # substitution under `set -e` kills the step where it stands, so the
            # function's own guard would abort with a bare stack trace and no
            # annotation to read. Only the floor needs this: every later
            # bump_version input is a previous bump_version output.
            if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::the floor resolved to '${CURRENT}' (npm ${PUBLISHED}, main ${DECLARED}), which is not a plain major.minor.patch, so ${BUMP}-bumping it is meaningless. Re-run with an explicit version input."
              exit 1
            fi
            echo "::notice title=Version::floor is ${CURRENT} (npm ${PUBLISHED}, main ${DECLARED})"
            NEW_VERSION="$(bump_version "$BUMP" "$CURRENT")"
            # The chosen level is applied ONCE, and the walk past taken versions
            # is always by patch. The walk's job is to find a free number above
            # the floor, not to keep asserting "breaking": with bump=minor and
            # 0.3.0 already taken, 0.3.1 is free and above the floor, while
            # bumping the minor again would abandon the whole 0.3.x line and
            # burn a minor per collision.
            while version_taken "$NEW_VERSION"; do
              echo "::notice title=Version::${NEW_VERSION} already has a release branch or tag — bumping the patch again"
              NEW_VERSION="$(bump_version patch "$NEW_VERSION")"
            done
          fi

          # Unquoted $PKGS, as the `git add` below is: the word splitting is the
          # point. The script exits non-zero on anything it could not set, and
          # `set -euo pipefail` is in force, so a failure stops here rather than
          # pushing a branch that still declares the old version.
          # shellcheck disable=SC2086
          node scripts/set-version.mjs "$NEW_VERSION" $PKGS >/dev/null

          # A release whose version main already declares has nothing to bump.
          # It is reachable when neither `release/v<v>` nor `v<v>` exists: a
          # hand-edit of those three files, or a release branch AND its tag both
          # deleted. `version_taken` above catches every other route here. It
          # would fail closed regardless, so this buys a readable message.
          # shellcheck disable=SC2086
          if git diff --quiet -- $PKGS; then
            echo "::error title=Version::main already declares ${NEW_VERSION}, so there is nothing to commit for this release. Either it has already shipped (check npm and the tags) or those three package.json files were edited by hand. Pick the next free version instead."
            exit 1
          fi

          # Stamp this release's narrative in the same commit as the version.
          # Merging this branch back into main is then the whole post-release
          # step, and `gh-release` reads the narrative from exactly the tree
          # that npm and Docker published. A section merged to main while this
          # release runs is not on this branch, so it stays `[Unreleased]` and
          # ships next time.
          #
          # A prerelease or `+build` version skips the stamp. It gets no GitHub
          # release and no PR back to main, so its number must not label a
          # section; `+` is included because `sort -V` ranks `0.4.0+ci` above
          # `0.4.0`, and the floor above refuses anything that is not a plain
          # major.minor.patch.
          STAMPED=0
          if [[ "$NEW_VERSION" != *[-+]* ]]; then
            if ! STAMPED="$(node scripts/release-notes.mjs stamp "$NEW_VERSION")"; then
              echo "::error title=Release notes::could not stamp RELEASE_NOTES.md with ${NEW_VERSION} (logged above). Nothing has been published."
              exit 1
            fi
          fi

          BRANCH_NAME="release/v${NEW_VERSION}"
          git checkout -b "$BRANCH_NAME"

          # The title is what main's history records: the repo squash-merges,
          # and a one-commit PR's squash title is the commit's title.
          # shellcheck disable=SC2086
          git add $PKGS RELEASE_NOTES.md
          git commit -s -m "chore(release): ${NEW_VERSION}" \
            -m "Stamps ${STAMPED} release-note section(s) and sets sdk, app and server to ${NEW_VERSION}."

          git push origin "$BRANCH_NAME"

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          echo "::notice title=Prepared Release::Version ${NEW_VERSION} on branch ${BRANCH_NAME}, stamping ${STAMPED} release-note section(s)"

  publish-npm:
    needs: prepare
    # What npm-sdk.yml's publish job declares; a caller cannot grant less.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-sdk.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.branch_name }}

  publish-docker:
    needs: prepare
    # What docker-image.yml's merge job declares to sign the image; a caller
    # cannot grant less.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-image.yml
    secrets: inherit
    with:
      current_version: ${{ needs.prepare.outputs.new_version }}
      ref: ${{ needs.prepare.outputs.branch_name }}

  # skills, create-malloy-package and python-client version on their own lines,
  # so this job triggers them rather than versioning them. The first two publish
  # to npm through publish_indep_pkg, which decides their version at release
  # time (scripts/independent-version.mjs) rather than reading one committed to
  # their package.json; python-client publishes to PyPI through the older
  # publish_pkg, which still reads its version straight from pyproject.toml.
  # Both share publish_resolved for the registry-agnostic tail: the watched-path
  # guard, the "main moved" compare, the dispatch, and the poll loop.
  #
  # It triggers them but does NOT align their version numbers with sdk/app/
  # server, and that is not an omission to be tidied up later. malloydata/malloy
  # gets one shared number across its packages from Lerna fixed mode; these two
  # were already published on their own lines before this job existed, and npm
  # versions are immutable, so there is no path back to a shared number. skills
  # is skipped when its published content is unchanged since npm latest's
  # gitHead; create-malloy-package publishes on every non-prerelease release
  # and is skipped only on a re-run (its publisherServer already matches);
  # python-client is paused. A computed version already on npm is an error for
  # either, never a skip.
  #
  # They are DISPATCHED through the Actions API rather than called with
  # workflow_call, deliberately. npm allows one trusted publisher per package
  # and matches it against the TOP-LEVEL workflow filename, so a workflow_call
  # would make npm see release.yml and every entry would have to be re-pointed
  # here. Standalone dispatch of either child would then stop being able to
  # publish, which is the capability skills-npm.yml exists to provide. A
  # dispatched run is its own top-level run, so each child keeps its own npm
  # entry, and no npm setting has to change for this job to work.
  #
  # Deliberately NOT in gh-release's needs. These packages are independent of
  # the sdk/app/server artifacts, and prepare walks the patch version forward on
  # a re-run rather than resuming, so gating the tag on them would turn a failed
  # package publish into a partial release that cannot be re-run at the same
  # version. A failure here still reddens the run.
  publish-packages:
    name: Publish independently-versioned packages
    # Ordering and abort-on-failure only: a failed version bump should not
    # publish anything. This job reads prepare's version solely for the
    # prerelease check below, and deliberately checks out main rather than the
    # release branch (see the checkout below).
    #
    # `publish-npm` is in here for create-malloy-package's sake, and dropping it
    # silently breaks that package's release. Its publish workflow DERIVES the
    # SERVER_VERSION it pins from @malloy-publisher/server's npm `latest` at
    # publish time — and on `needs: prepare` alone this job races publish-npm, so
    # that `latest` would still be the previous release and every workspace the
    # published scaffolder generates would pin the previous server. Nothing would
    # go red; it is a silent wrong answer.
    #
    # It was worse before the pin was derived, and the history is why this
    # `needs:` exists at all: the pin was hand-maintained and the publish job
    # refused to ship unless it EQUALLED npm's `latest`, which under the race was
    # unwinnable rather than unlucky — pin the outgoing version and the guard
    # failed because npm was still a release behind; pin the previous one and it
    # failed once npm caught up. In 0.0.250 the guard ran at 15:07:55 against a
    # `latest` that did not become 0.0.250 until 15:09:13, so the scaffolder could
    # never publish in a release that bumped the server.
    #
    # This `needs:` is necessary but NOT sufficient. npm can take minutes to
    # show a version after `npm publish` returns: in 0.7.0, publish-npm finished
    # at 19:09 and `latest` read 0.7.0 only at 19:16, so the scaffolder pinned
    # 0.6.0. publish-packages.sh therefore also waits for `latest` to read this
    # release's version before dispatching the scaffolder
    # (wait_for_server_latest).
    needs: [ prepare, publish-npm ]
    runs-on: ubuntu-latest
    # THREE full poll budgets (25m each, below), plus the scaffolder's wait for
    # the server's `latest` (SERVER_LATEST_BUDGET_SECONDS, 15m), plus checkout
    # and setup, with margin. Keep this above the sum of those budgets, or the
    # LAST package timing out is killed by the job cap before it can print which
    # package failed — which is the one diagnostic that says whether a publish
    # happened. A fourth package means raising this too.
    timeout-minutes: 105
    permissions:
      contents: read
      # For the workflow-dispatch API. Not id-token: this job never publishes,
      # it only asks the registry and triggers the children.
      #
      # actions: write cannot be narrowed to "dispatch these three workflows"; it
      # also covers cancelling runs and deleting run logs repo-wide. Keep this
      # job dependency-free for that reason: checkout and setup-node only, no
      # bun install and no third-party actions, so there is nothing here for a
      # compromised dependency to execute with that scope.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main, never needs.prepare.outputs.branch_name. prepare bumps only
          # sdk/app/server, so the release branch's copies of these three
          # packages are identical to main, and all three children guard on
          # github.ref == 'refs/heads/main'. Dispatched on a release branch their
          # publish jobs SKIP, and a skipped job reports success, so the release
          # would go green having published nothing. python-sdk.yml gained that
          # guard when it joined this job; its old gate was an unreachable tag
          # ref, which would have skipped here too, and just as silently.
          ref: main
          # Nothing here authenticates to git: the only local git call is
          # rev-parse, and the live sha comes over the API. Without this,
          # checkout leaves a token carrying this job's actions: write scope in
          # .git/config for the life of the job.
          persist-credentials: false
          # Full history, not the default shallow clone: deciding skills'
          # version needs to `git cat-file`/`git diff` against npm latest's
          # gitHead, an arbitrary past commit a shallow checkout would not have.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # python-client's PyPI publish is paused (work in progress); see the end of
      # scripts/publish-packages.sh.
      - name: Publish skills and create-malloy-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, not interpolated into the script body.
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: scripts/publish-packages.sh
  gh-release:
    needs: [ prepare, publish-npm, publish-docker ]
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` covers the tag and the release. No
      # `pull-requests: write`: this job links the PR for release/v<v>
      # into main and a person (or the agent driving the publisher-release
      # skill, on their credentials) opens it. A PR opened with GITHUB_TOKEN
      # triggers no workflows, so main's required checks would sit at
      # `expected` and only an admin could merge it; opening one also needs
      # the off-by-default "Allow GitHub Actions to create and approve pull
      # requests" setting.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.new_version }}
          BRANCH: ${{ needs.prepare.outputs.branch_name }}
          COMPARE_BASE: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          TAG="v${VERSION}"

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## Release v${VERSION}

          ### 📦 NPM packages
          - [\`@malloy-publisher/sdk@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/sdk/v/${VERSION})
          - [\`@malloy-publisher/app@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/app/v/${VERSION})
          - [\`@malloy-publisher/server@${VERSION}\`](https://www.npmjs.com/package/@malloy-publisher/server/v/${VERSION})

          ### 🐳 Docker image
          \`\`\`
          docker pull ms2data/malloy-publisher:${VERSION}
          docker pull ms2data/malloy-publisher:latest
          \`\`\`

          ### ℹ️ Details
          - Release branch: \`${BRANCH}\`
          - Triggered by: @${{ github.actor }}
          EOF

          # Append the hand-written narrative, if this release has any.
          #
          # --generate-notes below lists the merged PRs, which is enough for a
          # routine patch but says nothing about a breaking change, a deprecation
          # or a metric whose meaning moved. Those live in RELEASE_NOTES.md's
          # `## [Unreleased]` sections, and used to reach the release page only
          # if a human remembered to paste them after the fact. Nobody did for
          # 0.0.243 through 0.0.247.
          #
          # Read from this checkout, which is the release branch: `prepare`
          # stamped those sections `[<version>]` on it, so the page carries
          # exactly the sections this commit ships. Empty output is the normal
          # case and adds nothing.
          #
          # Read through `if !`, not a bare assignment. This step has no `set -e`
          # of its own, but the runner's default shell is `bash -e {0}`, so a
          # non-zero exit from the substitution kills the step HERE — after npm
          # and Docker have published and before `gh release create` runs, so the
          # release would never be cut, over a docs-formatting problem. A missing
          # narrative is not worth that: warn, and let the generated PR list stand
          # alone. `publish-packages` uses the same form a few hundred lines up,
          # for the same reason.
          #
          # stderr goes to a file rather than through `2>&1`: merging it would put
          # anything the script ever writes there straight onto the public release
          # page.
          EXTRACT_LOG="$(mktemp)"
          EXTRACT_OK=1
          if ! NARRATIVE="$(node scripts/release-notes.mjs extract "$VERSION" 2>"$EXTRACT_LOG")"; then
            # Prefixed, not inlined: this is untrusted-shaped output on the
            # failure path, and a line of it starting with `::` would otherwise be
            # read by the runner as a workflow command.
            sed 's/^/[release-notes] /' "$EXTRACT_LOG"
            echo "::warning title=Release notes::could not read RELEASE_NOTES.md (logged above); this release's page carries the generated PR list only. The sections are still stamped on ${BRANCH}; paste them onto the release page by hand."
            echo "- release notes: narrative NOT attached — \`release-notes.mjs extract ${VERSION}\` failed; the sections are stamped on \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
            NARRATIVE=""
            EXTRACT_OK=0
          elif [ -s "$EXTRACT_LOG" ]; then
            sed 's/^/[release-notes] /' "$EXTRACT_LOG"
          fi
          if [ -n "$NARRATIVE" ]; then
            printf '\n%s\n' "$NARRATIVE" >> "$NOTES_FILE"
            echo "::notice title=Release notes::attached $(grep -c '^## ' <<< "$NARRATIVE") narrative section(s) from RELEASE_NOTES.md"
          elif [ "$EXTRACT_OK" = 1 ]; then
            # Only when the file was actually read. Saying "no sections" after a
            # failed read describes the wrong situation, and it is the one a
            # reader is most likely to skim past.
            echo "::notice title=Release notes::no sections stamped ${VERSION}; the generated PR list stands alone"
          fi

          if [[ "$VERSION" == *-* ]]; then
            echo "::notice title=GitHub Release::Skipping release creation for prerelease version ${VERSION}"
            echo "## 🏷️ GitHub Release" >> $GITHUB_STEP_SUMMARY
            echo "Skipped for prerelease version \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Pin the changelog base to the immediately preceding release tag.
          # Each release is cut from a fresh release/v* branch that returns
          # to main only as a squash commit, so prior release tags are not
          # ancestors of this release's commit. Left to --generate-notes alone,
          # GitHub's ancestor walk skips every diverged sibling tag and lands on
          # the last tag still
          # in the mainline ancestry, producing a changelog spanning hundreds of
          # PRs. Selecting the previous tag by version sort and passing it as the
          # explicit start tag scopes the notes to just this release's changes.
          # Prerelease tags (containing a hyphen) are excluded so the base is
          # always the last stable release, consistent with the prerelease skip
          # above.
          git fetch --tags --force
          PREV_TAG="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -vx "$TAG" | tail -1)"

          NOTES_START_ARGS=()
          if [ -n "$PREV_TAG" ]; then
            echo "::notice title=Changelog::Generating notes from ${PREV_TAG} to ${TAG}"
            NOTES_START_ARGS=(--notes-start-tag "$PREV_TAG")
          else
            echo "::notice title=Changelog::No previous tag found; using default note generation"
          fi

          gh release create "$TAG" \
            --target "$BRANCH" \
            --title "v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --generate-notes \
            "${NOTES_START_ARGS[@]}"

          echo "## 🏷️ GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "Created release [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY

          # The one step the release leaves to a person: merging the release
          # branch back. It carries the version bump and the stamped notes, so
          # until it merges main still reads [Unreleased] for what just shipped,
          # and release-sync.yml fails on main and on every PR. Not
          # for a `+build` version: merging it would write
          # `0.4.0+ci` into main's manifests, which the next `prepare` refuses as
          # a floor, so that version never goes back to main.
          if [[ "$VERSION" == *+* ]]; then
            echo "Not merged back to main: \`${VERSION}\` is a build-metadata version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COMPARE_URL="${COMPARE_BASE}/main...${BRANCH}?expand=1"
          echo "::notice title=Merge the release back::open a pull request from ${BRANCH} into main titled 'chore(release): ${VERSION}' and merge it before the next release: ${COMPARE_URL}"
          {
            echo
            echo "## 🔀 Merge the release back into main"
            echo
            echo "👉 **[Open the pull request](${COMPARE_URL})** from \`${BRANCH}\` into \`main\`, titled \`chore(release): ${VERSION}\`, and merge it. It carries the version bump and this release's stamped \`RELEASE_NOTES.md\` headings. Until it merges, the \`Release sync\` check fails on every pull request."
          } >> "$GITHUB_STEP_SUMMARY"
