name: App Playwright E2E

# Every pull request, whatever its base, as build.yml does: a PR stacked on
# another PR's branch changes the Console as much as one into main.
on:
  pull_request:

env:
  BUN_VERSION: 1.3.13

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

# One run per pull request: a new push to a PR cancels that PR's run still in
# flight, since only its newest commit can merge. Every other event (a push to
# main, workflow_run, schedule, workflow_dispatch) gets a group of its own
# keyed on the run id, so it is never cancelled and never replaced while it
# waits: every merged commit is tested. (Keying those on github.ref with
# cancel-in-progress off would still drop runs, because a group holds only one
# pending run and a newer one cancels it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (packages/app)
    # Pinned: `ubuntu-latest` began resolving to ubuntu-26.04 on 2026-10-30, and
    # `playwright install --with-deps chromium` refuses that image ("does not
    # support chromium on ubuntu26.04"), failing the job before any test runs.
    # On Credible's donated runners when DONATED_RUNNERS is on.
    runs-on: ${{ vars.DONATED_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_SKIP_POSTINSTALL_SCRIPTS: "1"

      - name: Generate API types
        run: bun run generate-api-types

      - name: Build SDK + server
        run: bun run build

      - name: Build app
        run: bun run build:app

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      # Tests in packages/app/tests/playwright/environment-connections.spec.ts
      # assume the examples environment exposes a top-level `bigquery`
      # connection (rows for list/edit/delete affordances). The committed
      # default config ships only DuckDB sandboxes for first-run UX, so
      # inject a stub BigQuery connection into the existing default before
      # the suite runs. We deliberately don't swap in the full
      # publisher.config.example.bigquery.json fixture — that adds a fourth
      # sample package (bigquery-hackernews) whose extra clone + failed
      # compile (no GCP credentials) pushes cold-init past the 5-min
      # global-setup timeout in CI. The connection-row tests only need the
      # connection metadata to be present; they don't query BigQuery. To
      # enable real bigquery-hackernews query tests later, follow the
      # decode-and-expose pattern already used in
      # `connection-integration-tests.yml` and `k6-tests.yml` (decode the
      # BQ secret to `/tmp/bq-credentials.json`, then export
      # `GOOGLE_APPLICATION_CREDENTIALS`).
      - name: Inject BigQuery connection (CI fixture for connection-row tests)
        run: |
          jq '.environments[0].connections = [{"name":"bigquery","type":"bigquery","bigqueryConnection":{}}]' \
            packages/server/publisher.config.json > /tmp/publisher.config.json
          mv /tmp/publisher.config.json packages/server/publisher.config.json

      # playwright.config.ts spawns `npm run start:init` from the repo root as
      # its webServer, polls /api/v0/status in global-setup until the publisher
      # reaches operationalState=serving, then runs the suite.
      - name: Run Playwright suite
        id: suite
        working-directory: packages/app
        run: bunx playwright test --config=playwright.config.ts
        env:
          CI: "true"
          DISABLE_RESPONSE_LOGGING: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/app/test-results
          retention-days: 7

      # The model viewer's specs: the suite above runs against a
      # server on the default model page, the Explorer, so they skip
      # themselves there. Run them again against a server of their own with
      # PUBLISHER_MODEL_PAGE=viewer; EXPECT_MODEL_PAGE makes them fail rather
      # than skip if the server reports another page.
      - name: Run the model viewer specs with PUBLISHER_MODEL_PAGE=viewer
        id: model-viewer
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        working-directory: packages/app
        run: bunx playwright test --config=playwright.config.ts --output=test-results-model-viewer tests/playwright/model-page-literals.spec.ts tests/playwright/model-page-givens.spec.ts tests/playwright/model-viewer.spec.ts
        env:
          CI: "true"
          DISABLE_RESPONSE_LOGGING: true
          PUBLISHER_MODEL_PAGE: viewer
          EXPECT_MODEL_PAGE: viewer

      - name: Upload the model viewer report and results
        if: failure() && steps.model-viewer.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-model-viewer
          path: |
            packages/app/playwright-report
            packages/app/test-results-model-viewer
          retention-days: 7
