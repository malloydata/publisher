name: App Playwright E2E

# Every pull request, whatever its base, as build.yml does: a PR stacked on
# another PR's branch changes the Console as much as one into main.
on:
  pull_request:

env:
  BUN_VERSION: 1.4.4
  # Playwright's browsers go here, where the cache below can save and restore
  # them. Credible's runners set PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright,
  # which no step caches, so the default path saved nothing and every run
  # downloaded Chromium again.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

# One run per pull request: a new push to a PR cancels that PR's run still in
# flight, since only its newest commit can merge. Every other event (a push to
# main, workflow_run, schedule, workflow_dispatch) gets a group of its own
# keyed on the run id, so it is never cancelled and never replaced while it
# waits: every merged commit is tested. (Keying those on github.ref with
# cancel-in-progress off would still drop runs, because a group holds only one
# pending run and a newer one cancels it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite in three shards, each on its own runner with its own Publisher
  # (playwright.config.ts starts one through `webServer`), so no state is
  # shared between them; inside a shard it still runs on one worker. The
  # spec files each shard runs are listed in
  # packages/app/tests/playwright/shards.json, balanced by measured per-file
  # durations; shards.mjs fails the shard when a spec is in no group or in two.
  # Each shard builds for itself rather than waiting on one shared build job,
  # which would put that build in series in front of every shard.
  #
  # None of these is the required check: the `playwright` gate below is.
  playwright_shard:
    name: "Playwright shard (${{ matrix.shard }}/3)"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Pinned: `ubuntu-latest` began resolving to ubuntu-26.04 on 2026-10-30, and
    # `playwright install --with-deps chromium` refuses that image ("does not
    # support chromium on ubuntu26.04"), failing the job before any test runs.
    # On Credible's donated runners when CREDIBLE_RUNNERS is on.
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      # Before the build, so a spec missing from shards.json fails in seconds.
      - name: Check every spec is in exactly one shard
        working-directory: packages/app
        run: node tests/playwright/shards.mjs check

      # Bun, the retried install, API types, and `bun run build`, which builds
      # the SDK, the app and the server. The app needs no build of its own.
      - uses: ./.github/actions/setup-workspace

      - name: Read the Playwright version
        id: playwright-version
        working-directory: packages/app
        run: echo "version=$(bun -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, which pins the browser build: no
      # restore-keys, since another version's browser is never the one needed.
      - name: Cache Playwright's headless Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-shell-${{ steps.playwright-version.outputs.version }}

      # Headless shell only: the suite runs headless, so the full Chromium is
      # never launched. System packages: GitHub's ubuntu-24.04 image lacks some
      # of Chromium's (nine on 2026-11-18), so it takes --with-deps. Credible's
      # image has them all (apt reported 0 newly installed), so there the step
      # skips apt, which took 4-32s and once over four minutes, and installs
      # the packages only if the browser is missing a shared library.
      - name: Install Playwright's headless Chromium
        working-directory: packages/app
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            bunx playwright install --with-deps --only-shell chromium
            exit 0
          fi
          bunx playwright install --only-shell chromium
          shell=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name headless_shell | head -n 1)
          if [ -z "$shell" ]; then
            echo "::error::No headless_shell under $PLAYWRIGHT_BROWSERS_PATH after install"
            exit 1
          fi
          if ldd "$shell" | grep 'not found'; then
            echo "::warning::This runner image lacks Chromium's system packages; installing them"
            bunx playwright install-deps chromium
          fi

      # Tests in packages/app/tests/playwright/environment-connections.spec.ts
      # assume the examples environment exposes a top-level `bigquery`
      # connection (rows for list/edit/delete affordances). The committed
      # default config ships only DuckDB sandboxes for first-run UX, so
      # inject a stub BigQuery connection into the existing default before
      # the suite runs. We deliberately don't swap in the full
      # publisher.config.example.bigquery.json fixture — that adds a fourth
      # sample package (bigquery-hackernews) whose extra clone + failed
      # compile (no GCP credentials) pushes cold-init past the 5-min
      # global-setup timeout in CI. The connection-row tests only need the
      # connection metadata to be present; they don't query BigQuery. To
      # enable real bigquery-hackernews query tests later, follow the
      # decode-and-expose pattern already used in
      # `connection-integration-tests.yml` and `k6-tests.yml` (decode the
      # BQ secret to `/tmp/bq-credentials.json`, then export
      # `GOOGLE_APPLICATION_CREDENTIALS`).
      - name: Inject BigQuery connection (CI fixture for connection-row tests)
        run: |
          jq '.environments[0].connections = [{"name":"bigquery","type":"bigquery","bigqueryConnection":{}}]' \
            packages/server/publisher.config.json > /tmp/publisher.config.json
          mv /tmp/publisher.config.json packages/server/publisher.config.json

      # playwright.config.ts spawns `npm run start:init` from the repo root as
      # its webServer, polls /api/v0/status in global-setup until the publisher
      # reaches operationalState=serving, then runs this shard's spec files.
      - name: Run Playwright suite
        id: suite
        working-directory: packages/app
        # An assignment, not a process substitution: if shards.mjs fails, the
        # step fails, rather than running Playwright with no file arguments,
        # which would run the whole suite. Spec names hold no spaces.
        run: |
          specs=$(node tests/playwright/shards.mjs files ${{ matrix.shard }})
          # shellcheck disable=SC2086
          bunx playwright test --config=playwright.config.ts $specs
        env:
          CI: "true"
          PUBLISHER_LOGGING_RESPONSE_BODIES_ENABLED: "false"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/app/playwright-report
          retention-days: 7

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: packages/app/test-results
          retention-days: 7

      # The model viewer's specs, in shard 2, which carries the least of the
      # suite above. That suite runs against a server on the default model
      # page, the Explorer, so they skip themselves there. Run them again
      # against a server of their own with PUBLISHER_MODEL_PAGE=viewer;
      # EXPECT_MODEL_PAGE makes them fail rather than skip if the server
      # reports another page.
      - name: Run the model viewer specs with PUBLISHER_MODEL_PAGE=viewer
        id: model-viewer
        if: ${{ matrix.shard == 2 && !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        working-directory: packages/app
        run: bunx playwright test --config=playwright.config.ts --output=test-results-model-viewer tests/playwright/model-page-literals.spec.ts tests/playwright/model-page-givens.spec.ts tests/playwright/model-viewer.spec.ts
        env:
          CI: "true"
          PUBLISHER_LOGGING_RESPONSE_BODIES_ENABLED: "false"
          PUBLISHER_MODEL_PAGE: viewer
          EXPECT_MODEL_PAGE: viewer

      - name: Upload the model viewer report and results
        if: failure() && steps.model-viewer.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-model-viewer
          path: |
            packages/app/playwright-report
            packages/app/test-results-model-viewer
          retention-days: 7

  # The required status check, under the name the single job had before the
  # split, so branch protection did not change. Green only when every shard
  # passed: a failed, cancelled or skipped shard fails it. `!cancelled()`
  # rather than `always()`, so a cancelled run (a newer push to the PR)
  # reports this check cancelled, not red. Never give a shard this name.
  playwright:
    name: Playwright (packages/app)
    if: ${{ !cancelled() }}
    needs:
      - playwright_shard
    runs-on: ${{ vars.CREDIBLE_RUNNERS == 'true' && 'credible-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require every Playwright shard to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Playwright shards did not pass: $failed"
            exit 1
          fi
        shell: bash
