name: Publish Docker Image to Docker Hub

on:
  workflow_call:
    inputs:
      current_version:
        description: "Version tag for the Docker image (optional, defaults to version from package.json)"
        required: false
        type: string
      ref:
        description: "Git ref to check out (branch, tag, or SHA)"
        required: false
        type: string

env:
  REGISTRY_IMAGE: ms2data/malloy-publisher
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The GITHUB_TOKEN is read-only for every job here; a job that needs more
# declares it itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Install iptables
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      # `context: git` takes `sha` and `ref` from the checkout above rather than from
      # the event, so the image's revision label names the commit that is built. On a
      # release that is `inputs.ref`, not the commit the release was dispatched on.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          context: git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        name: Login to Docker Hub
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derive the DuckDB CLI version from the engine Malloy resolves
      # (@duckdb/node-api in bun.lock) so the published image's baked
      # CLI/extensions match the runtime, regardless of the Dockerfile default.
      - name: Resolve DuckDB version from Malloy
        id: duckdb
        run: echo "version=$(node scripts/duckdb-version.js)" >> "$GITHUB_OUTPUT"
        shell: bash

      # The UTC date, passed as APT_REFRESH so the Dockerfile's `apt-get upgrade`
      # layer rebuilds daily instead of being served from the build cache forever.
      # Daily rather than weekly so a Debian fix published mid-week is picked up by
      # the next build instead of waiting for the week to roll over.
      - name: Date for the apt refresh
        id: day
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push tag
        id: build
        uses: docker/build-push-action@v6
        with:
          # Build from the checkout. Without `context`, the action builds from a git
          # context at the event's commit and ignores the checkout, so a release built
          # the commit it was dispatched on rather than `inputs.ref`, and the image's
          # SBOM and provenance described that commit instead of the tagged one.
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUCKDB_VERSION=${{ steps.duckdb.outputs.version }}
            APT_REFRESH=${{ steps.day.outputs.value }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # Attach an SPDX SBOM and SLSA provenance to each platform image as
          # BuildKit attestations. They are stored as attestation manifests next to
          # the image in the per-platform index, and the merge job's
          # `imagetools create` carries them into the published tag. Provenance is
          # set explicitly because the action's default depends on repository
          # visibility (max for public, min for private). SBOM has no default and is
          # off unless requested. Max provenance publishes every build arg, so a
          # secret must reach this build through `secrets:`, never `build-args`.
          sbom: true
          provenance: mode=max
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    # id-token: write lets cosign request a GitHub OIDC token, which Fulcio exchanges
    # for a short-lived certificate naming this workflow. release.yml's
    # publish-docker job must grant the same, or this job fails to start.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show current version
        id: version_step
        run: |
          if [ -n "${{ inputs.current_version }}" ]; then
            CURRENT_VERSION="${{ inputs.current_version }}"
          else
            CURRENT_VERSION=$(cat packages/sdk/package.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')
          fi

          # Pre-release versions (e.g. 0.0.189-dev, 1.0.0-rc.1) must not update the "latest" tag.
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "::notice title=Current Version::Publishing SDK version $CURRENT_VERSION (prerelease=$IS_PRERELEASE)"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version_step.outputs.current_version }}
            type=raw,value=latest,enable=${{ steps.version_step.outputs.is_prerelease == 'false' }}
            type=raw,value=next,enable=${{ steps.version_step.outputs.is_prerelease == 'true' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          echo "Meta outputs:"
          echo "JSON: ${{ steps.meta.outputs.json }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Current version: ${{ steps.version_step.outputs.current_version }}"

          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "No tags generated, using fallback tags"
            TAGS="-t ${{ env.REGISTRY_IMAGE }}:${{ steps.version_step.outputs.current_version }}"
            if [ "${{ steps.version_step.outputs.is_prerelease }}" = "false" ]; then
              TAGS="$TAGS -t ${{ env.REGISTRY_IMAGE }}:latest"
            else
              TAGS="$TAGS -t ${{ env.REGISTRY_IMAGE }}:next"
            fi
          else
            TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')
          fi

          docker buildx imagetools create $TAGS \
            --metadata-file "${{ runner.temp }}/imagetools-metadata.json" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      # The digest of the manifest list just pushed, read from what `imagetools
      # create` wrote rather than by resolving a tag, which could move between the
      # push and the signature.
      - name: Resolve pushed digest
        id: pushed
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.descriptor".digest // empty' "${{ runner.temp }}/imagetools-metadata.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=No manifest list digest::imagetools create wrote no digest to its metadata file; got '${digest}'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.3

      # Keyless signing: the certificate names this workflow file and the ref it
      # ran from, and the signature is recorded in the public Rekor log. Signing the
      # manifest list covers the platform images and their SBOM and provenance
      # attestation manifests too, since the list references each of them by digest.
      # A failure here leaves the tags pushed but unsigned and fails the release
      # before gh-release; re-running the failed jobs re-pushes the same list and
      # signs it.
      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}@${{ steps.pushed.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # Verify against the workflow identity a consumer checks, so a signature that
      # would not verify fails the release instead of shipping. Fulcio puts the
      # reusable workflow (job_workflow_ref) in the certificate, so the identity
      # names this file, not release.yml. The ref is matched loosely here and
      # printed, so the exact identity is visible in the run.
      - name: Verify signature
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}@${{ steps.pushed.outputs.digest }}
        run: |
          set -euo pipefail
          identity=$(cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker-image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq -r '.[0].optional.Subject')
          echo "::notice title=Image signed::${IMAGE} signed by ${identity}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
