# Temporary experiment, removed before merge. Compares the DuckDB extension
# cache under the default Windows profile (C:) against the D: profile, with the
# file cache emptied before the tests so each first LOAD reads from disk.

name: Windows DuckDB extension experiment

on:
  push:
    branches: [sagark/windows-ci-duckdb-extensions-on-d]
    paths: [.github/workflows/windows-duckdb-experiment.yml]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13
  WINDOWS_USERPROFILE: "D:\\"
  WINDOWS_BUN_CACHE_DIR: "D:\\.bun\\install\\cache"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  measure:
    name: "profile=${{ matrix.profile }} rep=${{ matrix.rep }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [d, default]
        rep: [1, 2, 3, 4, 5]
    steps:
      - name: Configure Temp Directory
        shell: pwsh
        run: |
          $TEMP_DIR = "$env:WINDOWS_USERPROFILE\Temp"
          New-Item -ItemType Directory -Force -Path $TEMP_DIR | Out-Null
          "TEMP=$TEMP_DIR" >> $env:GITHUB_ENV
          "TMP=$TEMP_DIR"  >> $env:GITHUB_ENV

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        env:
          USERPROFILE: ${{ env.WINDOWS_USERPROFILE }}
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ env.WINDOWS_BUN_CACHE_DIR }}
          BUN_CONFIG_SKIP_POSTINSTALL_SCRIPTS: "1"
        run: bun install --frozen-lockfile --prefer-offline
        shell: bash

      - name: Generate API types
        run: bun run generate-api-types
        shell: bash

      # Only the d arm moves the profile. The default arm leaves USERPROFILE
      # untouched rather than setting it empty, which would leave DuckDB with
      # no home directory at all.
      - name: Use the D profile
        if: matrix.profile == 'd'
        shell: pwsh
        run: '"USERPROFILE=$env:WINDOWS_USERPROFILE" >> $env:GITHUB_ENV'

      - name: Build
        run: bun run build
        shell: bash

      - name: Fetch RAMMap
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/RAMMap.zip -OutFile "$env:RUNNER_TEMP\RAMMap.zip"
          Expand-Archive "$env:RUNNER_TEMP\RAMMap.zip" -DestinationPath "$env:RUNNER_TEMP\rammap" -Force

      - name: Cold read of the bigquery extension file
        shell: pwsh
        run: |
          $rm = "$env:RUNNER_TEMP\rammap\RAMMap64.exe"
          foreach ($f in '-Em', '-Et') { Start-Process -Wait -FilePath $rm -ArgumentList '-accepteula', $f }
          $file = Get-ChildItem -Recurse -File -Path "$env:USERPROFILE\.duckdb\extensions" -Filter bigquery.duckdb_extension | Select-Object -First 1
          $mb = [math]::Round($file.Length / 1MB, 1)
          $cold = (Measure-Command { [IO.File]::ReadAllBytes($file.FullName) | Out-Null }).TotalMilliseconds
          $warm = (Measure-Command { [IO.File]::ReadAllBytes($file.FullName) | Out-Null }).TotalMilliseconds
          "RESULT profile=${{ matrix.profile }} rep=${{ matrix.rep }} file=$($file.FullName) mb=$mb cold_read_ms=$([math]::Round($cold)) warm_read_ms=$([math]::Round($warm))"
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected | Format-List

      - name: Empty the file cache
        shell: pwsh
        run: |
          $rm = "$env:RUNNER_TEMP\rammap\RAMMap64.exe"
          foreach ($f in '-Em', '-Et') { Start-Process -Wait -FilePath $rm -ArgumentList '-accepteula', $f }

      - name: Extension load tests
        if: always()
        working-directory: packages/server
        run: bun test --timeout 200000 ./tests/unit/duckdb/attached_databases.test.ts
        shell: bash

      - name: DuckLake connection tests
        if: always()
        working-directory: packages/server
        run: bun test --timeout 200000 ./tests/unit/ducklake/ducklake.test.ts
        shell: bash

      - name: Concurrent package tests
        if: always()
        working-directory: packages/server
        run: bun test --timeout 200000 ./tests/integration/concurrent_package/concurrent_package.integration.spec.ts
        shell: bash
