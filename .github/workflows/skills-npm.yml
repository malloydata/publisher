name: skills

# The skills package versions on its own line. release.yml bumps sdk, app, and
# server in lockstep and deliberately does not version this package: a skill
# edit should not need a server release, which is the whole point of splitting
# the package out.
#
# release.yml DOES trigger this workflow, so one release publishes every
# package. It dispatches this file rather than calling it with workflow_call, so
# that both entry points keep working; do not change that without reading
# .github/workflows/CONTEXT.md first, because it is a one-way door. release.yml
# decides whether to dispatch this workflow at all (scripts/independent-version.mjs):
# it skips skills when nothing publishable changed since npm latest's recorded
# gitHead, so an unchanged skills package is skipped rather than reddening the
# release.
#
# The published version is decided here, at dispatch time, not by a bump
# committed to packages/skills/package.json: release.yml passes the version it
# computed (scripts/independent-version.mjs) as the `version` input, and a hand
# dispatch with no input publishes one patch above the highest published
# version. See "Resolve version to publish" in the publish job below.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/skills/**"
      - ".github/workflows/skills-npm.yml"
  pull_request:
    paths:
      - "skills/**"
      - "packages/skills/**"
      - ".github/workflows/skills-npm.yml"
  workflow_dispatch:
    inputs:
      # Set by release.yml's publish-packages to the version it decided
      # (scripts/independent-version.mjs). Left empty on a hand dispatch, which
      # publishes one patch above the highest published version instead.
      version:
        description: "Version to publish (release use; leave empty to publish one patch above the highest published version)"
        required: false
        default: ""

env:
  BUN_VERSION: 1.3.13
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_pack:
    # A frozen-lockfile install, a build, and the package's suite. Bounded for
    # the reason its siblings are: a hung step would sit on a runner for
    # GitHub's 6-hour default, blocking a PR on a check that can neither pass
    # nor fail.
    timeout-minutes: 30
    name: Verify the published tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # npm (bundled with Node) is what "Check pack contents" shells out to for
      # `npm pack`/`npm view`; nothing else in this job needs Node over Bun.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A skills/ dir that failed to copy packs as nothing at all, with exit 0
      # and no warning, so this is the only thing standing between a bad refactor
      # and publishing an empty package.
      - name: Check pack contents
        run: bun run --cwd packages/skills check-pack

      - name: Test
        run: bun run --cwd packages/skills test

  publish:
    name: Publish to NPM
    # Bounded like the jobs above, and this one holds id-token: write.
    timeout-minutes: 30
    # workflow_dispatch offers every branch in the ref dropdown, and the
    # definition that runs is the one on the ref you pick. npm's trusted
    # publisher matches on this file's name, so the filename is effectively the
    # credential and `needs: check_pack` is no protection: that job would verify
    # the same branch's tarball. Without this check, dispatching from a stale or
    # half-finished branch publishes that branch's code under the real name.
    #
    # A guardrail, not a boundary, and CONTEXT.md says what would actually be
    # one (a branch-restricted GitHub Environment) and the ordering that has to
    # be respected if anyone adds it. release.yml dispatches this workflow on
    # main, so the guard holds on that path too; create-malloy-package-npm.yml
    # carries the same one.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check_pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Decide what to publish, before installing anything: the input if the
      # dispatch named one (release.yml always does), else one patch above the
      # highest published plain version. Refuses anything at or below that
      # ceiling, since a hand dispatch is the one path nothing else gates.
      # Must run before "Apply resolved version" writes
      # packages/skills/package.json's version, and before anything packs:
      # prepack (copy-skills.ts) stamps that version into every SKILL.md, so
      # the resolved version has to be in the manifest first.
      - name: Resolve version to publish
        id: resolve_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The full published-versions list, not just `latest`: `latest` can
          # be rolled back by hand (`npm dist-tag add ... latest`) after a bad
          # release while the newer version stays published, and computing
          # off `latest` alone would recompute that already-published version
          # and abort below at "Verify this version is not already
          # published". The JSON can span many lines, so stdout is captured
          # on its own (not folded with stderr and tail -n1'd, which would
          # silently truncate it), and npm can still write warnings to stderr
          # on a successful run, so those are logged rather than discarded.
          NPM_VERSIONS_ERR="$(mktemp)"
          if VERSIONS_JSON="$(npm view @malloy-publisher/skills versions --json --prefer-online 2>"$NPM_VERSIONS_ERR")"; then
            NPM_OK=1
          else
            NPM_OK=0
          fi
          NPM_VERSIONS_ERR_CONTENT="$(cat "$NPM_VERSIONS_ERR")"
          rm -f "$NPM_VERSIONS_ERR"
          if [ "$NPM_OK" != 1 ]; then
            if [[ "$NPM_VERSIONS_ERR_CONTENT" == *E404* ]]; then
              VERSIONS_JSON="[]"
            else
              printf '%s\n' "$NPM_VERSIONS_ERR_CONTENT" | sed 's/^/[npm] /'
              echo "::error title=Version::could not ask npm for @malloy-publisher/skills's published versions"
              exit 1
            fi
          elif [ -n "$NPM_VERSIONS_ERR_CONTENT" ]; then
            printf '%s\n' "$NPM_VERSIONS_ERR_CONTENT" | sed 's/^/[npm] /'
          fi

          HIGHEST=""
          if [ "$VERSIONS_JSON" != "[]" ]; then
            if ! HIGHEST="$(VERSIONS_JSON="$VERSIONS_JSON" node scripts/independent-version.mjs highest-plain 2>&1)"; then
              printf '%s\n' "$HIGHEST" | sed 's/^/[version] /'
              echo "::error title=Version::could not compute the highest published version for @malloy-publisher/skills from npm's versions list"
              exit 1
            fi
          fi

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$HIGHEST" ]; then
            if ! VERSION="$(VERSIONS_JSON="$VERSIONS_JSON" node scripts/independent-version.mjs next-after-highest 2>&1)"; then
              printf '%s\n' "$VERSION" | sed 's/^/[version] /'
              echo "::error title=Version::could not compute a next version for @malloy-publisher/skills from npm's versions list"
              exit 1
            fi
          else
            echo "::error title=Version::@malloy-publisher/skills has never been published, so there is no highest published version to compute a next patch from; dispatch this workflow with version set explicitly"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf '%s\n' "$VERSION" | sed 's/^/[version] /'
            echo "::error title=Version::the resolved version (logged above) is not a plain major.minor.patch with an optional -prerelease or +build"
            exit 1
          fi

          # A hand-dispatched `version` still has to clear this: nothing else
          # here stands between a typo'd input and moving the latest dist-tag
          # backwards. `sort -V` ranks a PRERELEASE ABOVE
          # its own release (verified: `printf '0.2.0\n0.2.0-rc.1\n' | sort -V
          # | tail -1` is `0.2.0-rc.1`), so a prerelease is exempted rather
          # than compared: it publishes under the "next" dist-tag below and
          # cannot move "latest" backwards regardless.
          if [ -n "$HIGHEST" ]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::notice title=Version::$VERSION is a prerelease; skipping the above-highest test because it does not move the latest dist-tag"
            elif [ "$VERSION" != "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" ]; then
              echo "::error title=Version::$VERSION is at or below the highest published version ($HIGHEST); refusing to publish it"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::resolved skills version to publish: $VERSION"

      - name: Apply resolved version
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION" packages/skills/package.json

      # Read the version and ask the registry BEFORE installing anything. Both
      # steps need only node, and putting them ahead of the install is the
      # difference between failing a version already on npm in seconds and
      # failing it after a full frozen-lockfile install.
      - name: Read version
        id: version_step
        run: |
          CURRENT_VERSION="$(node -p "require('./packages/skills/package.json').version")"

          # Stable versions publish under "latest"; any pre-release under "next".
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "::notice title=Current Version::Publishing skills version $CURRENT_VERSION under npm dist-tag '$NPM_TAG'"

      # "Read version" takes the version straight from package.json and never
      # asks the registry, so a dispatch that forgot the bump would otherwise get
      # through check_pack and only die at the last step, on npm publish, with
      # EPUBLISHCONFLICT. Ask up front, the same way create-malloy-package-npm.yml
      # does.
      #
      # This is for the human path. release.yml decides whether to dispatch this
      # workflow at all (scripts/independent-version.mjs), skipping skills when
      # nothing publishable changed since npm latest's recorded gitHead, so an
      # unchanged skills package never reaches this step from that path.
      - name: Verify this version is not already published
        env:
          # Through env rather than interpolated into the script body: a ${{ }}
          # expression is substituted before bash parses the line, so a crafted
          # version string in package.json would become code in a job that holds
          # id-token: write.
          CURRENT_VERSION: ${{ steps.version_step.outputs.current_version }}
        run: |
          # Read the name rather than hardcoding it, so a rename cannot leave
          # this quietly checking a package nobody is publishing.
          NAME="$(node -p "require('./packages/skills/package.json').name")"
          SPEC="$NAME@$CURRENT_VERSION"
          # npm view exits non-zero with an E404 both for a version that does not
          # exist and for a package that does not exist at all, and either one
          # means this version is free. Any other failure means the registry did
          # not answer, which is not the same as a green light.
          if PUBLISHED="$(npm view "$SPEC" version 2>&1)"; then
            echo "::error title=Version::$SPEC is already published; re-dispatch this workflow with no version input (publishes one patch above the highest published version) or with version set higher than $CURRENT_VERSION"
            exit 1
          elif [[ "$PUBLISHED" != *E404* ]]; then
            # Registry output is untrusted text, and a line starting with "::"
            # would otherwise be parsed as a workflow command. Prefix rather than
            # indent: the runner trims leading whitespace before matching.
            printf '%s\n' "$PUBLISHED" | sed 's/^/[npm] /'
            echo "::error title=Version::could not ask npm whether $SPEC is taken"
            exit 1
          fi
          echo "::notice title=Version::$SPEC is not on npm yet"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Trusted publishing (OIDC); there is no NPM_TOKEN fallback in this repo.
      #
      # npm configures trusted publishing per package, on the package's own
      # settings page, so the package has to exist before the entry can be
      # created. The first publish of a new name is therefore manual, by an
      # @malloy-publisher owner. Order: publish once by hand, add the
      # trusted-publisher entry naming this workflow file, then every release
      # after that is a dispatch here. Run before that entry exists and npm's
      # OIDC helper returns undefined rather than raising, so this falls through
      # to the empty token and fails with a bare ENEEDAUTH.
      #
      # Run that manual publish with scripts ENABLED. prepack is what copies
      # skills/ into the package, so `npm publish --ignore-scripts`, or an
      # ignore-scripts=true in your own npmrc, ships three files and no skills
      # at all, without an error.
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/skills
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}
