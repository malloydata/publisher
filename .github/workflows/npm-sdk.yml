name: Publish SDK/APP to NPM

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (branch, tag, or SHA)"
        required: false
        type: string

env:
  BUN_VERSION: 1.4.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # No Actions cache in a publishing job: any run on main can write main's cache
          # entries, and this job would run whatever one it restored held.
          no-cache: true

      - name: Read current version
        id: version_step
        run: |
          CURRENT_VERSION=$(cat packages/sdk/package.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')

          # Stable versions publish under "latest"; any pre-release (0.0.189-dev,
          # 1.0.0-rc.1, 2.0.0-beta.2, etc.) publishes under "next".
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "::notice title=Current Version::Publishing SDK version $CURRENT_VERSION under npm dist-tag '$NPM_TAG'"

      - name: Install dependencies
        run: scripts/ci-install-with-retry.sh bun install

      - name: Resolve workspace:* for publishing (in-memory only, not committed)
        run: |
          sed -i "s/\"@malloy-publisher\/sdk\": \"workspace:\*\"/\"@malloy-publisher\/sdk\": \"^${{ steps.version_step.outputs.current_version }}\"/" packages/app/package.json

      - name: Build SDK package
        run: |
          cd packages/sdk
          NODE_ENV=production bun run build

      - name: Build App package
        run: |
          cd packages/app
          NODE_ENV=production bun run build

      # The CLI (`malloy-pub`) is on the same lockstep version as sdk/app/server:
      # `release.yml`'s `prepare` sets packages/cli/package.json with the other
      # three, whether or not it publishes. Everything that can go wrong with it
      # short of `npm publish` itself happens HERE, before anything ships: the
      # registry checks and the build (`prebuild` fetches the API generator and
      # generates the client from api-doc.yaml). A failure in this step fails the
      # job with nothing published; only the final "Publish CLI package" step
      # runs after sdk/app/server are on npm.
      #
      # `cli_action` decides that last step:
      #  - `skip_missing`: npm has no @malloy-publisher/cli at all (E404). npm
      #    takes a trusted-publisher entry only for an existing package, so an
      #    OIDC publish cannot succeed until the first version is published by
      #    hand. Warn with the setup and stay green rather than fail publish-npm
      #    after three packages shipped, which would skip gh-release and
      #    publish-packages.
      #  - `skip_published`: this exact version is already on npm, i.e. a
      #    re-run of a release whose CLI publish landed. Notice and stay green.
      #  - `publish`: the package exists and this version does not.
      # Any other `npm view` failure (registry down, auth) cannot tell those
      # apart, so it fails the step, still before anything is published.
      - name: Check and build CLI package
        id: cli_step
        env:
          CLI_VERSION: ${{ steps.version_step.outputs.current_version }}
        run: |
          set -euo pipefail
          # Prefixed so a line of npm's output starting with `::` is not read as
          # a workflow command.
          registry_error() {
            sed 's/^/[npm view] /' "$VIEW_LOG"
            echo "::error title=CLI publish::could not ask npm about $1 (logged above). Nothing has been published; re-run once the registry answers."
            exit 1
          }
          VIEW_LOG="$(mktemp)"

          if ! npm view @malloy-publisher/cli version >/dev/null 2>"$VIEW_LOG"; then
            grep -q 'E404' "$VIEW_LOG" || registry_error "@malloy-publisher/cli"
            echo "::warning title=CLI not published::@malloy-publisher/cli does not exist on npm yet, so ${CLI_VERSION} will NOT be published (sdk, app and server will). One-time setup: publish the first version by hand (cd packages/cli && bun run build && npm publish --access public), then register its npm trusted publisher naming repository malloydata/publisher and workflow release.yml. See .github/workflows/CONTEXT.md, 'The CLI rides the lockstep train'."
            echo "cli_action=skip_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version the package lacks is an E404 on current npm and an empty
          # answer on older npm; both mean "publish".
          if PUBLISHED="$(npm view "@malloy-publisher/cli@${CLI_VERSION}" version 2>"$VIEW_LOG")"; then
            if [ "$PUBLISHED" = "$CLI_VERSION" ]; then
              echo "::notice title=CLI already published::@malloy-publisher/cli@${CLI_VERSION} is already on npm (a re-run of this release); skipping its publish."
              echo "cli_action=skip_published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            grep -q 'E404' "$VIEW_LOG" || registry_error "@malloy-publisher/cli@${CLI_VERSION}"
          fi

          cd packages/cli
          NODE_ENV=production bun run build
          echo "cli_action=publish" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/sdk
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

          cd ../app
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

      - name: Build & publish Server package
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/server
          NODE_ENV=production bun run build
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

      # The one CLI step after sdk/app/server have shipped: built and checked
      # above, so only the publish itself can fail here, and a failure of it is
      # real (a missing or mis-named trusted publisher, a registry outage).
      - name: Publish CLI package
        if: steps.cli_step.outputs.cli_action == 'publish'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/cli
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}
