name: Publish SDK/APP to NPM

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (branch, tag, or SHA)"
        required: false
        type: string

env:
  BUN_VERSION: 1.4.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # No Actions cache in a publishing job: any run on main can write main's cache
          # entries, and this job would run whatever one it restored held.
          no-cache: true

      - name: Read current version
        id: version_step
        run: |
          CURRENT_VERSION=$(cat packages/sdk/package.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')

          # Stable versions publish under "latest"; any pre-release (0.0.189-dev,
          # 1.0.0-rc.1, 2.0.0-beta.2, etc.) publishes under "next".
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "::notice title=Current Version::Publishing SDK version $CURRENT_VERSION under npm dist-tag '$NPM_TAG'"

      - name: Install dependencies
        run: scripts/ci-install-with-retry.sh bun install

      - name: Resolve workspace:* for publishing (in-memory only, not committed)
        run: |
          sed -i "s/\"@malloy-publisher\/sdk\": \"workspace:\*\"/\"@malloy-publisher\/sdk\": \"^${{ steps.version_step.outputs.current_version }}\"/" packages/app/package.json

      - name: Build SDK package
        run: |
          cd packages/sdk
          NODE_ENV=production bun run build

      - name: Build App package
        run: |
          cd packages/app
          NODE_ENV=production bun run build

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/sdk
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

          cd ../app
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

      - name: Build & publish Server package
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd packages/server
          NODE_ENV=production bun run build
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}

      # The CLI (`malloy-pub`) is on the same lockstep version as sdk/app/server:
      # `release.yml`'s `prepare` sets packages/cli/package.json with the other
      # three, whether or not this step publishes. `build`'s `prebuild`
      # generates the API client from api-doc.yaml first, and the bundle carries
      # its dependencies, so the tarball needs Node only.
      #
      # Guarded on the package existing. npm takes a trusted-publisher entry only
      # for a package that already exists, so until the first version is
      # published by hand an OIDC publish here cannot succeed, and failing would
      # fail publish-npm after sdk/app/server are on npm, skipping gh-release
      # and publish-packages: a half-published release. So a package npm says
      # does not exist (E404) skips with a warning and the job stays green.
      # Anything else `npm view` fails on is a real error and fails the step, as
      # does any failure of the publish itself once the package exists.
      - name: Build & publish CLI package
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          VIEW_LOG="$(mktemp)"
          if npm view @malloy-publisher/cli version >/dev/null 2>"$VIEW_LOG"; then
            :
          elif grep -q 'E404' "$VIEW_LOG"; then
            echo "::warning title=CLI not published::@malloy-publisher/cli does not exist on npm yet, so ${{ steps.version_step.outputs.current_version }} was NOT published (sdk, app and server were). One-time setup: publish the first version by hand (cd packages/cli && bun run build && npm publish --access public), then register its npm trusted publisher naming repository malloydata/publisher and workflow release.yml. See .github/workflows/CONTEXT.md, 'The CLI rides the lockstep train'."
            exit 0
          else
            # Prefixed so a line of npm's output starting with `::` is not
            # read as a workflow command.
            sed 's/^/[npm view] /' "$VIEW_LOG"
            echo "::error title=CLI publish::could not ask npm whether @malloy-publisher/cli exists (logged above), so it was not published."
            exit 1
          fi

          cd packages/cli
          NODE_ENV=production bun run build
          npm publish --access public --tag ${{ steps.version_step.outputs.npm_tag }}
