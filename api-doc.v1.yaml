        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    put:
      operationId: write-report
      tags:
        - reports
      summary: Write a report's text, making a new version
      description: "The report builder's save. The text must carry a model-level `## artifact` tag. The root `index.malloy`,
        anything under `public/`, a file that is not a report, and a report whose `readOnly` is set answer 409
        `FILE_NOT_WRITABLE`. The text is compiled first (400 `COMPILE_ERROR` with `problems`). On a stored version the
        write makes version `<parent>+edit.N` and moves `latestVersionId` to it unless `ServerStatus.versionPromotion`
        is `explicit`; on a live package it writes through to the author's directory. The body is a `Report`: `content`,
        the file's text, and `contentHash` as read; the rest is read-only and ignored. Without `contentHash` it creates
        the file (201; 409 `FILE_EXISTS` if one is there); with it, it replaces the file (200; 409 `CONTENT_CHANGED`,
        with the current hash in `details`, when the file no longer hashes to it). Either way it answers with the report
        as it now reads in the version the write made, which its `resource` and the `Location` header name. A write
        whose `content` equals the file's current text answers 200 with the current report and makes no version, so a
        retried write that already succeeded is a no-op; it also accepts `Idempotency-Key`. Only the package's latest
        version (named directly, as `latest`, or `live`) can be written: any other answers 409 `VERSION_NOT_LATEST`, so
        a write never forks an older version or moves `latestVersionId` back. An archived version answers 410
        `VERSION_ARCHIVED`, which comes before any 409, as on every content operation. Loads the version when it is not
        loaded (a hydrate when the compiled-model store has an entry)."
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Report"
      responses:
        "200":
          description: Replaced, or unchanged when `content` equals the current text (no version made).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "201":
          description: Created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`,
            `COMPILE_ERROR`."
