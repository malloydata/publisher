components:
  parameters:
    environmentName:
      name: environmentName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: The environment's name.
    packageName:
      name: packageName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: The package's name, unique in its environment.
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VersionRef"
      description: A version id, `latest`, or `live`. Every content read is of exactly one version; the response carries the
        id `latest` resolved to. A content read of a version that is not loaded loads it first, as a hydrate when the
        compiled-model store has an entry; `GET /status`, `GET …/versions`, `GET …/versions/{versionId}`, its
        `…/status`, `…/index` and `:unload` never load, and every operation that loads says so in its description.
        `VersionStatus.status` says what a read will cost. A version that cannot load answers 424 `VERSION_LOAD_FAILED`
        on every operation that loads it.
    connectionName:
      name: connectionName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: The connection's name, unique in its environment.
    schemaName:
      name: schemaName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: A schema as the warehouse names it, percent-encoded (a BigQuery dataset is `project.dataset`). Not an
        identifier Publisher chose, so it has no pattern.
    tableName:
      name: tableName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: A table as the warehouse names it inside the schema, percent-encoded.
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: "The run's id, as `Run.runId` returned it: opaque, assigned by the server."
    agentName:
      name: agentName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: The agent's name, as the version's `publisher.json` declares it.
    skillName:
      name: skillName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: "The skill's name: its directory under the version's `skills/`."
    path:
      name: path
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PathPattern"
      x-multi-segment: true
      description: "A file's version-relative path, as the listing returned it. It spans the remaining segments: send each `/`
        literally, never as `%2F`, and percent-encode only within a segment (a space as `%20`). An action's `:verb`
        follows the last segment."
    dryRun:
      name: dryRun
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: "Run every check the write would run and store nothing. Every dry run answers 200, never with a `Location`,
        and ignores `Idempotency-Key`. A connection's answers its test result, every failure (unreachable, refused
        credentials, timeout) a 200 with `ok: false`; a publish's answers the `Version` the publish would make, with no
        `resource`, `revision` or timestamps and no `ETag`, or the current one when it would make nothing."
    tableNames:
      name: name
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: Only tables with one of these names.
    tableInclude:
      name: include
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - columns
      description: Larger parts to include in each table. `columns` lists each table's columns, as a read of the table does.
    includeHidden:
      name: includeHidden
      in: query
      schema:
        type: boolean
        default: false
      description: Also return files and sources the package's `index.malloy` does not expose.
    includeHiddenResolve:
      name: includeHidden
      in: query
      schema:
        type: boolean
        default: false
      description: Also resolve sources and files the package's `index.malloy` does not expose, so the text may name them.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Page size.
    after:
      name: after
      in: query
      schema:
        $ref: "#/components/schemas/Cursor"
      description: Continue after this cursor.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Makes a retried create, start or report write safe. A request that repeats a key this server saw in the
        last 24 hours, with the same body, answers with the first request's response and does nothing again; the same
        key with a different body answers 409 `IDEMPOTENCY_KEY_REUSED`. Use a fresh UUID per logical request.
    force:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Required to delete a resource that holds other resources, which are deleted with it. Without it such a
        delete answers 409 `RESOURCE_NOT_EMPTY` and deletes nothing.
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: An `ETag` from an earlier read. When the representation still matches, the answer is 304 with no body.
    requestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: An id for this request, echoed in the response's `X-Request-Id` and in its access record. Without it the
        server uses the trace id of a W3C `traceparent`, else makes one.
    ifMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: "The resource's `ETag` as last read (`\"<revision>\"`). The write is refused with 412 when it no longer
        matches. Optional: a write without it is unconditional."


  headers:
    ETag:
      description: "A strong validator, quoted: the resource's revision on a mutable resource (send it back as `If-Match` on a
        `PATCH` or `DELETE`), or a digest of the representation on any other read (send it back as `If-None-Match` to
        revalidate)."
      schema:
        type: string
    CacheControl:
      description: "`private, no-cache` on every read, which a client may store but must revalidate with `If-None-Match`,
        since a compiled model under a concrete version can still change with `:reload`; `no-store` on `/status`, a
        current snapshot. Always `private`, because the gateway in front authenticates the caller."
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: "This request's id: the caller's `X-Request-Id` when it sent one, else the trace id of its W3C
        `traceparent`, else one the server made. Every response carries it and every error body repeats it as
        `requestId`."
      schema:
        type: string
    Location:
      description: "The resource the write made, relative to the API's base path as `resource` is and equal to the body's
        `resource`: the created resource, or for the report write the report in the version the write made, which on a
        stored version is not the URL written to."
      schema:
        type: string


  responses:
    BadRequest:
      description: The request is malformed, or the Malloy or SQL in it was refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Forbidden:
      description: Refused by policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    NotFound:
      description: Something the request names does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Conflict:
      description: The request conflicts with the state of what it names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    PreconditionFailed:
      description: "`If-Match` did not match the resource's revision (`REVISION_MISMATCH`; `details.currentRevision` carries it)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Gone:
      description: The version is archived (`VERSION_ARCHIVED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    PayloadTooLarge:
      description: "The request body, or on a query or SQL operation the result, exceeds a size limit. Each operation names
        its reasons: `PAYLOAD_TOO_LARGE` is the request body (send less); `RESULT_TOO_LARGE` is the result (narrow the
        query or lower `rowLimit`; `details.capType` says which cap)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    DependencyFailed:
      description: Something the operation depends on failed, so nothing changed. Fix the dependency; retrying fails the same way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    DatabaseUnreachable:
      description: The database could not be reached (`CONNECTION_FAILED`), so nothing ran. Retry once, then report it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    GatewayTimeout:
      description: The database did not answer in time (`GATEWAY_TIMEOUT`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Internal:
      description: The server failed (`INTERNAL`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    Unavailable:
      description: The server is initializing, draining, or refusing load under memory back-pressure (`UNAVAILABLE`,
        `ADMISSION_REFUSED`). Retry after `Retry-After` seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    RateLimited:
      description: Too many requests from this caller (`RATE_LIMITED`). Retry after `Retry-After` seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    NotModified:
      description: The representation matches `If-None-Match`; there is no body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"


  schemas:
    Agent:
      description: An agent a package declares, resolved to its instructions, skill files and schedules. Adopt it only when
        the user asks for it by name.
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          required:
            - instructions
            - skills
            - warnings
            - definitionHash
            - contentHash
          properties:
            instructions:
              type: string
              description: The instructions file's Markdown, at most 16 KB.
            skills:
              type: array
              description: "The agent's own skills, each a `Skill` read as `GET …/skills/{skillName}` reads one: its `content`
                (`SKILL.md` text) always, and its `files` (reference files and assets) with their content only with
                `?include=files`."
              items:
                $ref: "#/components/schemas/Skill"
            warnings:
              type: array
              description: What resolving the agent found wrong but survivable, for example a skill it names that the version lacks.
              items:
                $ref: "#/components/schemas/Problem"
            definitionHash:
              type: string
              description: SHA-256 (hex) over this agent's canonical config, instructions, skill files and task files, so a runner can
                prove which definition ran. Editing another agent, or a model, does not move it.
            contentHash:
              type: string
              description: "SHA-256 (hex) of the version's content this definition was read from: the version's
                `VersionStatus.contentHash`."
      readOnly: true

    AgentBudget:
      type: object
      readOnly: true
      description: "The run limits an agent declares. Validated and exposed only: the server never enforces them. A platform
        that runs the agent decides how to apply them and may clamp each to its own maximum. Every field is optional and
        only the fields `publisher.json` sets are present; an unset field keeps the platform's default. Absent when
        `publisher.json` sets none."
      properties:
        turns:
          type: integer
          minimum: 1
          description: The model turns one run may take.
        wallClockMinutes:
          type: integer
          minimum: 1
          description: The elapsed minutes one run may take, from its start to its end.
        llmTokens:
          type: integer
          minimum: 1
          description: The LLM tokens one run may spend.

    AgentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    AgentSchedule:
      type: object
      readOnly: true
      description: "A cron schedule an agent declares. Validated and exposed only: the server never runs it."
      properties:
        cron:
          type: string
          description: A 5-field UNIX cron expression, evaluated in UTC.
        taskContent:
          type: string
          description: The task file's Markdown. Only on the resolved agent, not the listing.
        taskPath:
          type: string
          description: Version-relative path of the task file, as written in `publisher.json`.
      required:
        - cron
        - taskPath

    AgentSummary:
      type: object
      readOnly: true
      description: One agent a package declares, without its instructions or skills.
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: "The agent's name (its key in `publisher.json`'s `agents` object): lowercase letters and digits in
            hyphen-separated words."
        description:
          type: string
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/AgentSchedule"
        budget:
          $ref: "#/components/schemas/AgentBudget"
          readOnly: true
        llmModel:
          type: string
          description: The LLM the agent asks for; `inherit` when `publisher.json` sets none.
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      required:
        - resource
        - name
        - description
        - llmModel
        - schedules
        - versionId

    AttachedDatabase:
      type: object
      description: Attached DuckDB database
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          example: sales_db
          description: "The database's name in the DuckDB session, unique within the connection. It is the entry's identity: an
            update matches each entry to its stored one by `name`, which is how withheld credentials inside it are
            kept."
        type:
          type: string
          description: Type of database connection
          enum:
            - bigquery
            - snowflake
            - postgres
            - gcs
            - s3
            - azure
        bigquery:
          $ref: "#/components/schemas/BigqueryConnection"
        snowflake:
          $ref: "#/components/schemas/SnowflakeConnection"
        postgres:
          $ref: "#/components/schemas/PostgresConnection"
        gcs:
          $ref: "#/components/schemas/GcsConnection"
        s3:
          $ref: "#/components/schemas/S3Connection"
        azure:
          $ref: "#/components/schemas/AzureConnection"
      required:
        - name
        - type
      additionalProperties: false

    AzureConnection:
      type: object
      description: Azure Data Lake Storage (ADLS Gen2) or Blob Storage connection configuration. Supports `https://`,
        `http://`, `abfss://` and `az://` URLs.
      properties:
        authType:
          type: string
          enum:
            - service_principal
            - sas_token
          description: Authentication method for Azure Storage
        tenantId:
          type: string
          description: Azure AD tenant ID (required for service_principal)
        clientId:
          type: string
          description: Azure AD application (client) ID (required for service_principal)
        clientSecret:
          type: string
          description: Azure AD client secret (required for service_principal)
          writeOnly: true
        accountName:
          type: string
          description: Azure Storage account name, for `service_principal` auth. Required only when `fileUrl` names no account.
        fileUrl:
          type: string
          description: The Azure file URL to query, without a SAS token, for either `authType`. Supports a single file, a
            directory glob (`*.ext`) or a recursive (`**`) pattern, for example
            `https://account.blob.core.windows.net/container/path/**`. It reads back as sent, so a `sas_token`
            connection shows where it reads.
        sasToken:
          type: string
          writeOnly: true
          description: The SAS token (the query string after `?` in a SAS URL), for `sas_token` auth. Write-only; required on
            create for `sas_token`.
      required:
        - authType
      additionalProperties: false

    BigqueryConnection:
      type: object
      description: Google BigQuery database connection configuration
      properties:
        defaultProjectId:
          type: string
          description: Default BigQuery project ID for queries
        billingProjectId:
          type: string
          description: BigQuery project ID for billing purposes
        location:
          type: string
          description: BigQuery dataset location/region
        serviceAccountKeyJson:
          type: string
          description: JSON string containing Google Cloud service account credentials
          writeOnly: true
        impersonateServiceAccount:
          type: string
          description: Email of a Google Cloud service account this connection impersonates for every BigQuery call, via
            short-lived tokens from the IAM Service Account Credentials API. The publisher's own credential (ADC) must
            hold roles/iam.serviceAccountTokenCreator on the target service account, and iamcredentials.googleapis.com
            must be enabled in the calling project. Mutually exclusive with serviceAccountKeyJson; set billingProjectId
            explicitly, since project auto-detection resolves through the impersonated credential. Not supported on
            DuckDB attachedDatabases entries or federated builds from a BigQuery source through DuckDB, which require a
            service account key.
        maximumBytesBilled:
          type: string
          pattern: ^[0-9]+$
          description: The most bytes a query may bill, as a decimal string (BigQuery's int64 form); a query over it fails instead
            of running.
        dbmeta:
          type: boolean
          default: false
          description: Copy table and column descriptions from BigQuery onto the schema as `#(dbmeta)` annotations.
        queryTimeoutMs:
          type: integer
          description: Query timeout in milliseconds.
      additionalProperties: false

    Binding:
      description: What a version serves for one source right now, and the table it reads.
      allOf:
        - $ref: "#/components/schemas/TableAddress"
        - type: object
          required:
            - sourceEntityId
            - sourceName
            - origin
            - tableId
            - boundAt
          properties:
            sourceEntityId:
              type: string
            sourceName:
              type: string
              description: The source served, as the manifest entry names it.
            modelPath:
              type: string
            origin:
              type: string
              enum:
                - run
                - external
              description: "What bound the table: `run`, a run's committed manifest; `external`, the manifest
                `Version.manifestLocation` names."
            runId:
              type: string
              description: The run whose manifest entry this binding points at. Present exactly when `origin` is `run`.
            tableId:
              type: string
              description: The table's stable identity, as the manifest entry's `tableId`.
            boundAt:
              type: string
              format: date-time
              readOnly: true
              description: When this version bound the table.
      readOnly: true

    BuildGraph:
      type: object
      required:
        - levels
      properties:
        levels:
          type: array
          description: "The graph's sources in build order, as levels: every source in one level can build once the levels before
            it have, so a level's sources may build in parallel."
          items:
            type: array
            items:
              $ref: "#/components/schemas/BuildNode"
      description: One connected group of persisted sources in the build plan, in build order.
      readOnly: true

    BuildInstruction:
      type: object
      description: One source an orchestrated run builds, and the table it builds it into.
      required:
        - sourceEntityId
        - tableName
        - realization
      properties:
        sourceEntityId:
          type: string
        callerTableId:
          type: string
          description: The caller's own id for the table, echoed on the manifest entry's and the source failure's `callerTableId`.
        tableName:
          type: string
          description: Logical, fully-qualified, unquoted table name to create; the server quotes each segment for the dialect.
        destinationName:
          type: string
          description: The destination to build into. Absent means the source's own connection (colocated).
        realization:
          $ref: "#/components/schemas/Realization"
        reseed:
          type: boolean
          default: false
          description: Rebuild this source from scratch and re-derive its boundary. `RunOptions.reseed` reseeds it too; either is
            enough.

    BuildInstructions:
      type: object
      description: An orchestrated run's orders, derived from the version's build plan.
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BuildInstruction"
        upstreamTables:
          type: array
          description: Already-materialized upstreams the built sources may read but which this run does not rebuild.
          items:
            $ref: "#/components/schemas/UpstreamTable"
        strictUpstreams:
          type: boolean
          default: false
          description: Fail a built source whose persisted upstream is neither built by this run nor listed in `upstreamTables`,
            instead of recomputing that upstream inline from its definition.
        incrementalBoundaries:
          type: array
          description: The incremental boundaries for this run, supplied by a caller that owns the ledger. Present (even empty),
            it replaces the server's.
          items:
            $ref: "#/components/schemas/IncrementalBoundaryInput"

    BuildNode:
      type: object
      required:
        - sourceEntityId
        - dependsOnSourceEntityIds
      properties:
        sourceEntityId:
          type: string
          description: The source this node builds.
        dependsOnSourceEntityIds:
          type: array
          description: The `sourceEntityId`s of the sources on the tables this source reads. Sources on one table (a source and
            its extensions) read none of each other. A source Malloy cannot plan, which is refused rather than built,
            lists none.
          items:
            type: string
      description: One source in a build graph, and the sources it must wait for.
      readOnly: true

    BuildPlan:
      type: object
      description: The version's persist build plan, as the last load derived it. A read, never a command.
      required:
        - resource
        - status
        - versionId
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        status:
          type: string
          enum:
            - ready
            - empty
            - deferred
            - unavailable
          description: "`ready`: the plan is present. `empty`: the version declares no persist source. `deferred`: the version was
            published with `profile=light` and the plan is being derived now that it was read; read again.
            `unavailable`: the plan could not be derived at load (see `error`); reload the version to derive it again."
        error:
          $ref: "#/components/schemas/EmbeddedError"
          description: Why the plan is `unavailable`.
          readOnly: true
        sources:
          type: object
          description: "The plan per persisted source, keyed by its `sourceEntityId`: the source's content-addressed build
            identity, the key across plan, instructions, manifest and bindings. Unrelated to `…/entities`, which lists
            what a model declares."
          additionalProperties:
            $ref: "#/components/schemas/PersistSourcePlan"
        refusedSources:
          type: array
          description: The sources the package declared `#@ persist` on that are ineligible to build, so they have no entry in
            `sources`. A refused source has no `sourceEntityId`; it is identified by `sourceName` and, where known,
            `modelPath`.
          items:
            $ref: "#/components/schemas/RefusedSource"
        graphs:
          type: array
          description: The build order, one graph per connected group of sources.
          items:
            $ref: "#/components/schemas/BuildGraph"
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      readOnly: true

    Classification:
      type: object
      readOnly: true
      required:
        - resource
        - sources
        - versionId
      description: "Server-computed, read-only, as `GET …/versions/{versionId}/classification` returns it: for each exposed
        entry point, the classes its `#(carries)` declares and how many of its fields carry each class
        (`#(classification)`, declared or inherited). Covers only the sources discovery shows, so it reveals nothing
        curation hides; a source locked to every caller is left out. A field's own classes, and what they were inherited
        from, are on its `get_context` card. `sources` is empty when no exposed field carries a class."
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        sources:
          type: array
          description: Sorted by model path, then name.
          items:
            $ref: "#/components/schemas/ClassificationSource"
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.

    ClassificationSource:
      type: object
      readOnly: true
      required:
        - modelPath
        - name
        - fieldCount
        - unclassifiedCount
        - classCounts
      properties:
        modelPath:
          type: string
        name:
          type: string
        carries:
          type: array
          description: The classes the source's `#(carries)` lists, sorted, inherited through `extend` like a gate. Absent when it
            declares none.
          items:
            type: string
        classCounts:
          type: object
          description: How many of those fields carry each class, keyed by class. A field under several classes counts under each.
          additionalProperties:
            type: integer
        fieldCount:
          type: integer
          description: The dimensions and measures a caller can reach from the source, through joins included.
        unclassifiedCount:
          type: integer
          description: How many of those carry no class.
      description: "One exposed entry point in a version's classification summary: the classes its `#(carries)` declares, and
        how many of its reachable fields carry each."

    Column:
      type: object
      description: A column as the warehouse describes it.
      properties:
        name:
          type: string
          description: The column's name.
        type:
          type: string
          description: The warehouse's own type name (for example Postgres's `timestamp with time zone`), not a Malloy type.
      required:
        - name
        - type

    CompiledDocument:
      type: object
      description: The document a compiled text describes, in the shape it serves once saved. Present only when the text
        carries a model-level `## artifact` tag and compiled far enough to read.
      required:
        - layout
        - title
        - tiles
        - givens
        - preamble
      properties:
        layout:
          $ref: "#/components/schemas/ReportLayout"
          readOnly: true
        title:
          type: string
          description: "The report's title: the `## artifact` tag's title, else the file's `#\"` doc comment, else the file's name."
          readOnly: true
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/ReportTile"
          readOnly: true
        columnCount:
          type: integer
          description: Grid width in columns; 1 on a linear report. Absent on a grid report that sets none, which the viewer lays
            out at its default width.
          readOnly: true
        startingGivens:
          $ref: "#/components/schemas/EncodedGivenValues"
          readOnly: true
        autorun:
          type: boolean
          default: true
          description: Run the tiles as soon as the report opens and on every control change. `false` batches control changes
            behind an Apply button.
          readOnly: true
        givens:
          type: array
          description: The control row, one entry per given the tiles read.
          items:
            $ref: "#/components/schemas/Given"
          readOnly: true
        preamble:
          type: string
          description: "The text a tile's `run:` is appended to when it is run or exported on its own: the document's definitions,
            in file order. Never an `import`, a `##!` flag or a `given:`, which the model supplies, and never a
            definition the caller may not read. Empty when the document defines nothing."
          readOnly: true

    CompileErrorDetails:
      type: object
      description: "`details` of a `COMPILE_ERROR`: the problems, each located by `modelPath` and `range` in the file or
        submitted text that failed."
      required:
        - problems
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
      readOnly: true

    CompileRequest:
      type: object
      description: Request body for compiling Malloy source code
      properties:
        source:
          type: string
          description: Malloy source code to compile; never executed. Required at scope "append" and "file"; optional at scope
            "package", where it acts as a what-if replacement for the model in the URL.
        scope:
          type: string
          enum:
            - append
            - file
            - package
          default: append
          description: >
            What the source means, and how far the check reaches. "append" (default) appends the source to the model in
            the URL and compiles it in that namespace — right for NEW definitions; an edit to an existing definition
            collides ("Cannot redefine"), and diagnostic positions land in the concatenated virtual file. "file"
            compiles the source AS that model, replacing its on-disk content for the check — validates an edit before
            saving, at true file coordinates. "package" runs the same worker compiler and file selection as reload over
            every .malloy file, without swapping the result into the served package; with a source, importers compile
            against the replacement. It also reports the render-tag findings (code "render-tag") and the report, given
            and drill findings (code "report-lint") a reload would put on the package's warnings, at their own severity
            and with no position. The package's other warnings (storage, persist, materialization, explores, surface and
            discovery warnings, among others) are not reported. Package diagnostics can name files hidden from
            discovery. No rows or SQL are returned, and caller-provided source remains subject to authorize gates.
            `include: ["sql"]` is not available at `package`.

            "append" text is checked against the model's EXPOSED surface, so it may not declare its own data roots:
            import, connection.table(…), connection.sql(…), given:, ##! compiler flags and the raw-SQL function forms
            (name!type(…), sql_number, sql_string and the rest of that family) are refused with a 400. Those belong in a
            model file, so validate text declaring them at "file" or "package", which are not restricted. "append" text
            must also stand alone as top-level Malloy: a bare view:, dimension: or measure:, and anything that only
            parses as a continuation of the model's last statement, is refused with a 400, because the check reads the
            submitted text by itself. Wrap a view body in a top-level query:, or a field in a throwaway source: check is
            <source> extend { … }. Compiling at "append" also requires the model named in the URL to load: a model that
            does not compile is a 400 carrying that model's own problems, and a model that does not exist is a 400 that
            deliberately says only that it could not be loaded. An invalid scope value is rejected with a 400 naming the
            valid set.

            "append" text that carries a model-level `## artifact` tag is a document, which other viewers run, and is
            also refused with a 400 for `# image`, `# link`, markup in a `# label`, `@env.` in an annotation, an
            annotation the tag parser rejects or that exceeds 8,192 characters, `except:` or `rename:` followed by a
            declaration of the same name in the same extend chain, and more than 1,000 annotations or 64 KB of them.
            Plain "append" text without that tag keeps those tags; a model file defines them itself, and its edit is
            checked at "file".
        givens:
          $ref: "#/components/schemas/GivenValues"
        files:
          type: array
          description: "Package files read instead of, or beside, the package's own for this compile only, at scope \"file\" or
            \"package\" (a 400 at \"append\", which checks text against the version as stored): an entry whose path
            names a package file replaces it, and one naming a new file adds it, so an import of it resolves. Nothing is
            written, cached or served to another request. At \"file\", an entry for the model in the URL may stand in
            for `source`; giving both is a 400. Overlay files are author content, read exactly as the package's own
            files: they are not restricted like ad-hoc text, and their `#(authorize)` and `#(access_filter)` annotations
            gate as written, so a host must offer `files` only to callers who may edit the package. An empty list is no
            overlay. Only `.malloy` files can be overlaid; data files and `publisher.json` are read from the version as
            stored. A path that is absolute, has a \".\" or \"..\" segment or a backslash, names another kind of file,
            or appears twice is a 400; more than 500 files or 8 MiB of text is a 413."
          items:
            $ref: "#/components/schemas/OverlayFile"
        include:
          type: array
          items:
            type: string
            enum:
              - sql
          description: Larger parts to include. `sql` returns the generated SQL, at scope `append` or `file`, when the compile
            succeeds and the text holds a runnable query.

    CompileResult:
      type: object
      description: Result of a Malloy source compilation check
      properties:
        problems:
          type: array
          description: The problems the compile found, errors and warnings; empty when it found none. The compile failed exactly
            when a problem has `severity` `error`.
          items:
            $ref: "#/components/schemas/Problem"
        sql:
          type: string
          description: 'Generated SQL for the compiled query. Only present with `include: ["sql"]` and compilation succeeds with a
            runnable query.'
        document:
          $ref: "#/components/schemas/CompiledDocument"
        versionId:
          $ref: "#/components/schemas/VersionId"
          description: The version the text was compiled against, with `latest` resolved.
      required:
        - problems
        - versionId
      readOnly: true

    ConfigStamp:
      type: string
      maxLength: 255
      description: "An opaque stamp the caller sets with each configuration it pushes, credentials included, and changes
        whenever any part of that configuration changes (a rotated password among them). The server stores it and
        returns it on every read and on `/status` exactly as sent, and never interprets it, compares it or folds it into
        a build id, so changing it alone rebuilds nothing. An orchestrator compares what a server echoes with what it
        last pushed to find a server still holding an old configuration, whose credentials a read never shows. The one
        exception to merge-patch: an update that leaves it out clears the stored stamp rather than keeping it, because
        that update replaced the configuration the stamp described."

    Connection:
      type: object
      description: "A warehouse handle the models read. Builds write to destinations, which are not connections
        (`Environment.destinations`). Credential fields are write-only: accepted on create and update, never returned,
        and named in `withheldFields` so an editor can tell a set credential from an absent one. The dialect block named
        by `type` (`postgres` for `type: postgres`, …) carries the configuration; a block rejects a field it does not
        define."
      required:
        - resource
        - name
        - type
        - createdAt
        - updatedAt
        - revision
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          x-immutable: true
          description: Set on create; a write that changes it answers 400 `INVALID_REQUEST`.
          $ref: "#/components/schemas/IdentifierPattern"
        type:
          type: string
          description: The dialect. Set on create and carried on every read, as `Destination.type` is; an environment push may
            name a stored connection without it to keep it as stored (`Environment.connections`).
          enum:
            - postgres
            - bigquery
            - snowflake
            - trino
            - databricks
            - mysql
            - sqlserver
            - duckdb
            - motherduck
            - ducklake
            - publisher
        scope:
          type: string
          enum:
            - environment
            - version
          readOnly: true
          description: "`environment` for a connection of the environment. `version` for the one connection every loaded version
            has, its package-local DuckDB sandbox named `duckdb`, listed at `GET …/versions/{versionId}/connections` and
            read-only. It is `version` exactly when `versionId` is present."
        withheldFields:
          $ref: "#/components/schemas/WithheldFields"
          readOnly: true
        fingerprint:
          type: string
          description: Opaque, stable fingerprint of the data the connection reaches, excluding credentials, so it survives a
            credential rotation; part of every content-addressed build id. It must change with anything that changes
            which data the connection reaches, the impersonated identity included. Derived locally when omitted; absent
            on a read unless a caller set it.
        configStamp:
          $ref: "#/components/schemas/ConfigStamp"
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
          description: "Default per-query metadata for every statement this connection issues: the least specific layer,
            overridden per property by a package, model-file or source declaration or a per-request value. For
            properties true of the whole connection (which deployment, which team owns it). Not a secret: it round-trips
            like any plain field."
        queryMetadataEnforced:
          $ref: "#/components/schemas/QueryMetadata"
          description: "Per-query metadata this deployment owns: applied to every statement the connection issues, not overridable
            by a package, model-file, source or per-request declaration, and the last given up when a bag has to shrink.
            For the properties a host bills or audits by, where writing a connection is an operator's job and publishing
            a package is not, so a tenant cannot relabel a connection's traffic. That split lives in the gateway in
            front; Publisher does not authenticate it. The server's own context (`class`, `environment`, `query_id`, …)
            still wins over it. Same contract and 20-property budget as `queryMetadata`; a write that violates the
            contract answers 400."
        proxy:
          $ref: "#/components/schemas/ConnectionProxy"
        postgres:
          $ref: "#/components/schemas/PostgresConnection"
        bigquery:
          $ref: "#/components/schemas/BigqueryConnection"
        snowflake:
          $ref: "#/components/schemas/SnowflakeConnection"
        trino:
          $ref: "#/components/schemas/TrinoConnection"
        databricks:
          $ref: "#/components/schemas/DatabricksConnection"
        mysql:
          $ref: "#/components/schemas/MysqlConnection"
        sqlserver:
          $ref: "#/components/schemas/SqlserverConnection"
        duckdb:
          $ref: "#/components/schemas/DuckdbConnection"
        motherduck:
          $ref: "#/components/schemas/MotherduckConnection"
        ducklake:
          $ref: "#/components/schemas/DucklakeConnection"
        publisher:
          $ref: "#/components/schemas/PublisherConnection"
        revision:
          $ref: "#/components/schemas/Revision"
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: "For the version's `duckdb` sandbox (`scope: version`), the version's own, or on `live`, which has no
            record, the package's; likewise `updatedAt` and `revision`."
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, on a read under a version; absent at environment scope.

    ConnectionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    ConnectionProxy:
      type: object
      description: Optional network proxy through which the connection is reached. Applies to any connection type whose
        database is not directly reachable (e.g. behind a bastion). The proxy is established below the driver, so the
        driver connects to a local endpoint transparently. Modeled as a discriminated union on `type` so additional
        proxy mechanisms can be added later. The trust control is host-key pinning (fail-closed); a proxy is authorized
        by whoever configures the connection, not by an env-flag gate.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ssh
          description: Proxy mechanism. Currently only SSH local port-forwarding.
        ssh:
          $ref: "#/components/schemas/SshProxy"

    ConnectionTestResult:
      type: object
      description: What a connection's dry run found. Every failure is a 200 with `ok` false and `error` saying why.
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          description: Why the test failed, redacted against the connection. Absent when `ok`.
          allOf:
            - $ref: "#/components/schemas/EmbeddedError"
            - type: object
              properties:
                reason:
                  type: string
                  enum:
                    - CONNECTION_FAILED
                    - CONNECTION_AUTH_FAILED
                    - GATEWAY_TIMEOUT
                  description: "`CONNECTION_FAILED`: the database could not be reached. `CONNECTION_AUTH_FAILED`: it refused the
                    credentials. `GATEWAY_TIMEOUT`: it did not answer in time."
      readOnly: true

    ContentChangedDetails:
      type: object
      description: "`details` of a `CONTENT_CHANGED`: the hash the file has now. Read the report again, merge, and write with
        this `contentHash`."
      required:
        - currentContentHash
      properties:
        currentContentHash:
          type: string
          description: SHA-256 (hex) of the file's current text.
      readOnly: true

    Cursor:
      type: string
      description: Opaque position in a list. Send it back as `after` to continue; a list with no `nextCursor` is complete.

    DataApp:
      type: object
      description: An HTML page under the version's `public/`. The page and the files it loads are served outside the API, at
        `url`; it has no API read of its own, so it carries no `resource`.
      required:
        - path
        - title
        - url
        - versionId
      properties:
        path:
          type: string
          description: The HTML file's path relative to the version's `public/` directory (`dashboard.html`), the one path in the
            API that is not version-relative, since a page is served under `…/public/`.
        url:
          type: string
          description: "Where the page is served: root-relative, outside the API base, and pinned to the version that answered
            (`/environments/acme/packages/sales/versions/1.4.0/public/dashboard.html`). Open it in a browser or a frame;
            its relative URLs resolve beside it in the same version."
        title:
          type: string
        fit:
          type: string
          enum:
            - viewport
          description: '`viewport`: the page asks to fill the viewport (`<meta name="publisher:fit" content="viewport">`). Absent:
            the page is shown at its natural height.'
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      readOnly: true

    DataAppList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataApp"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    DatabricksConnection:
      type: object
      description: Databricks SQL warehouse connection configuration
      properties:
        host:
          type: string
          description: Databricks workspace host (e.g. dbc-xxxxxxxx-xxxx.cloud.databricks.com)
        path:
          type: string
          description: SQL warehouse HTTP path (e.g. /sql/1.0/warehouses/<warehouse-id>)
        token:
          type: string
          description: Personal access token for authentication
          writeOnly: true
        oauthClientId:
          type: string
          description: OAuth M2M client ID (service principal)
        oauthClientSecret:
          type: string
          description: OAuth M2M client secret (service principal)
          writeOnly: true
        defaultCatalog:
          type: string
          description: Default Unity Catalog to use for queries
        defaultSchema:
          type: string
          description: Default schema to use for queries
        setupSql:
          type: string
          description: SQL statements to run when the connection is established. Withheld from responses like a credential; an
            update that omits it keeps the stored script, and `null` removes it.
          writeOnly: true
      additionalProperties: false

    DataFile:
      type: object
      description: A data file embedded in the version (CSV, Parquet, JSON, Excel) that its models read through the version's
        DuckDB connection.
      required:
        - path
        - format
        - versionId
      properties:
        path:
          $ref: "#/components/schemas/PathPattern"
          description: The file's version-relative path.
        format:
          type: string
          enum:
            - csv
            - parquet
            - json
            - ndjson
            - xlsx
          description: The file's format, from its extension (`.jsonl` and `.ndjson` are `ndjson`).
        rowCount:
          type: integer
          description: Rows in the file. Absent while `rowCountStatus` is `deferred`, and when `error` is present.
        rowCountStatus:
          type: string
          enum:
            - ready
            - deferred
          default: ready
          description: "`ready`: `rowCount` is counted. `deferred`: the version was published with `profile=light` and the file is
            not counted yet; the count starts on this list read, so read again. The same word as `BuildPlan.status` and
            `DiscoveryIndex.status`."
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        error:
          $ref: "#/components/schemas/EmbeddedError"
          description: Present when the file could not be read; `rowCount` and `columns` are then absent.
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      readOnly: true

    DataFileList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataFile"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    Destination:
      type: object
      description: "Where `#@ persist storage=<name>` builds write and their tables are served from. Not a connection: models
        cannot name it, the connection routes cannot reach it, and its name is independent of the connections'.
        Credential fields are write-only and named in `withheldFields`, as on a connection."
      required:
        - name
        - type
      properties:
        name:
          x-immutable: true
          description: The name `#@ persist storage=` uses. Set on create; a write that changes it answers 400 `INVALID_REQUEST`.
          $ref: "#/components/schemas/IdentifierPattern"
        type:
          type: string
          enum:
            - ducklake
          description: The kinds of warehouse a build can write to; today only DuckLake.
        ducklake:
          $ref: "#/components/schemas/DucklakeDestination"
        configStamp:
          $ref: "#/components/schemas/ConfigStamp"
        withheldFields:
          $ref: "#/components/schemas/WithheldFields"
          readOnly: true

    DiscoveryIndex:
      type: object
      description: The state of a semantic discovery index, which `get_context` ranks against. Until the derived store is
        keyed by content, it is the package's latest loaded version's index whatever the path names, and `versionId` and
        `resource` name that version, which may differ from the path. With no version of the package loaded, `status` is
        `lexical` and `versionId` is absent.
      required:
        - resource
        - status
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        status:
          type: string
          enum:
            - lexical
            - deferred
            - indexing
            - ready
            - failed
          description: "`lexical`: retrieval ranks lexically, with no semantic index; the steady state when no embedding provider
            is configured, the state with no version loaded, and the state after a build that stopped short (`error`
            says why). `deferred`: the version was published with `profile=light` and its build starts on first use;
            read again. `indexing`: a build is in progress. `ready`: the semantic index serves. `failed`: the build
            failed (`error` says why)."
        builtAt:
          type: string
          format: date-time
          description: When the semantic index last finished building. Absent when none has.
          readOnly: true
        error:
          description: Present when `status` is `failed`, or when the last build stopped short and the index serves `lexical`.
          allOf:
            - $ref: "#/components/schemas/EmbeddedError"
            - type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - INDEX_COOLDOWN
                    - TOO_MANY_ENTITIES
                    - PROVIDER_ERROR
                  description: "`INDEX_COOLDOWN`: the embedding provider is rate-limiting; retry at `retryAt`. `TOO_MANY_ENTITIES`: the
                    version exceeds `retrieval.indexing.maxEntities`; retrying will not help. `PROVIDER_ERROR`: the
                    provider failed."
                retryAt:
                  type: string
                  format: date-time
                  readOnly: true
                  description: When a retry may succeed. Absent when retrying will not help.
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version whose index state this is, with `latest` resolved; it may differ from the path. Absent when no
            version of the package is loaded.
      readOnly: true

    DuckdbConnection:
      type: object
      description: >
        DuckDB database connection configuration: attached foreign databases, and optional setup SQL for anything they
        do not cover (e.g. ATTACH commands for external lakehouses). Setup SQL must be enabled with
        PUBLISHER_ALLOW_DUCKDB_SETUP_SQL=true and is refused under EXTENSION_FETCH_POLICY=local-only. Database files,
        working directories, filesystem/network policy, extension loading, temp directories, and resource knobs remain
        owned by Publisher.
      properties:
        attachedDatabases:
          type: array
          items:
            $ref: "#/components/schemas/AttachedDatabase"
        setupSql:
          type: string
          description: >
            Optional initialization SQL script executed against the DuckDB session upon connection (e.g. ATTACH commands
            for external lakehouses). Multiple statements must be separated by a semicolon and newline (;\n). Use
            absolute paths: a relative path resolves against the server's working directory. Withheld from responses
            like a credential; an update that omits it keeps the stored script, and `null` removes it, as merge-patch
            clears any field. Refused unless the deployment sets PUBLISHER_ALLOW_DUCKDB_SETUP_SQL=true.
          writeOnly: true
      additionalProperties: false

    DucklakeCatalog:
      type: object
      required:
        - postgres
      description: The database that holds a DuckLake catalog's metadata; today a Postgres database.
      properties:
        postgres:
          $ref: "#/components/schemas/PostgresConnection"
          description: The Postgres database holding the catalog's metadata.
        metadataSchema:
          type: string
          description: >-
            Optional schema in the catalog database holding this DuckLake's metadata (`ducklake_*`) tables, passed to
            ATTACH as METADATA_SCHEMA. Absent means DuckLake's default — the catalog connection's default schema,
            typically `public` — which is the pre-existing behavior. Set it to run several independent DuckLake catalogs
            against ONE catalog database: each keeps its metadata in its own schema, so a catalog reads only the tables
            recorded in the schema it names. DuckLake creates the schema on a read-write attach if it does not exist; a
            read-only attach cannot, and fails until it does. Separating metadata does not separate data — give each
            catalog its own `storage.dataPath` prefix as well, since data-path-based maintenance (e.g.
            `ducklake_delete_orphaned_files`) treats a co-tenant catalog's files under a shared prefix as orphaned.

            This is an ORGANIZATIONAL boundary, not an access-control one. The separation is which schema a
            configuration names, so any config whose catalog role can reach a sibling schema could name it and read that
            catalog's metadata — and therefore its data-file paths. Where catalogs must be isolated from one another
            rather than merely kept tidy, grant each its own role with `USAGE` limited to its own schema; a
            database-per-catalog remains the strongest separation.

            Setting this on a catalog whose metadata already lives elsewhere does not move it: a read-write attach with
            a configured `storage.dataPath` CREATES a new empty catalog in the named schema (and materializes into it),
            while any other attach fails because there is nothing there yet. Must be a plain identifier
            (`[A-Za-z_][A-Za-z0-9_]*`) — the value reaches both a quoted string literal in the ATTACH and an identifier
            position in the catalog-format preflight, so it is validated at config load rather than escaped for two
            different contexts.
      additionalProperties: false

    DucklakeConnection:
      type: object
      description: DuckLake lakehouse connection configuration
      properties:
        storage:
          $ref: "#/components/schemas/DucklakeStorage"
          description: Where the catalog's data files live, and how to reach them.
        catalog:
          $ref: "#/components/schemas/DucklakeCatalog"
        readOnly:
          type: boolean
          default: true
          description: >
            Whether the serve-path attach is read-only. Absent or true keeps the pre-existing read-only attach, which
            every DuckLake connection a person registers should keep. False attaches the connection read-write, and then
            everything that runs on it runs read-write: every query, `.sql()` source, `sql_*` expression and the
            connection's SQL endpoints can create, drop and overwrite tables, write files with the storage credential
            (`COPY … TO`) and change the catalog's settings. Set it only where something else decides who may run SQL on
            the connection. A storage destination's build sessions attach read-write regardless; this field governs only
            the connection.
        managed:
          type: boolean
          default: false
          description: "Serve this DuckLake connection as a catalog of its own tables, as an orchestrator that provisions catalogs
            does: the session's search path is set to the catalog, each statement is metered, and raw SQL runs only as a
            single `SELECT` (anything else answers 400)."
      required:
        - catalog
      additionalProperties: false

    DucklakeDestination:
      type: object
      required:
        - catalog
      description: "A destination's DuckLake catalog: where its builds write and its tables are served from. A build session
        attaches it read-write."
      properties:
        storage:
          $ref: "#/components/schemas/DucklakeStorage"
          description: Where the catalog's data files live, and how to reach them.
        catalog:
          $ref: "#/components/schemas/DucklakeCatalog"
        destinationSchema:
          type: string
          description: "The schema a destination builds its tables into and binds them from, so an orchestrator can keep the
            tables it owns apart from a catalog's `main` (where people put their own). Absent means `main`, the
            pre-existing layout. The schema must already exist in the catalog: a build does not create it. A `#@ persist
            name=` that already names a schema keeps that schema. Must be a plain identifier (`[A-Za-z_][A-Za-z0-9_]*`).
            Serving reads the schema configured now, not the one a table was built into, so changing it on a destination
            re-points every bound table at once: rebuild or rebind as you change it."
      additionalProperties: false

    DucklakeStorage:
      type: object
      required:
        - type
      description: Where a DuckLake catalog keeps its data files. `type` names the object store, and the block of that name
        carries its settings.
      properties:
        type:
          type: string
          enum:
            - s3
            - gcs
          description: "The object store: `s3` (AWS S3 or an S3-compatible store) or `gcs` (Google Cloud Storage)."
        dataPath:
          type: string
          description: "The catalog's data path, DuckLake's `DATA_PATH`: a URL of the storage location (for example
            `s3://my-bucket/path` or `gs://my-bucket/path`). Given, it is the path every attach uses, and the first
            read-write attach of a catalog that does not exist yet creates it there. Omitted, the catalog must already
            exist, every attach uses the data path the catalog recorded at its creation, and no attach ever creates a
            catalog: the shape for a catalog created elsewhere, through the admin API (admin-api-doc.v1.yaml) or by
            another tool. Either way the storage secret is scoped to the data path, the given one or the recorded one: a
            read of any other object through this connection is unsigned, and on S3 the host's AWS_* environment never
            signs it either. A catalog with neither is not attached."
        s3:
          $ref: "#/components/schemas/S3Connection"
          description: AWS S3 settings, when `type` is `s3`.
        gcs:
          $ref: "#/components/schemas/GcsConnection"
          description: Google Cloud Storage settings, when `type` is `gcs`.
      additionalProperties: false

    EmbeddedError:
      type: object
      description: "An error carried inside a successful response, about one part of it: `message` for a person, and on uses
        that name one, a `reason` from that use's closed list. Each use that has a `reason` adds it with its own enum."
      required:
        - message
      properties:
        message:
          type: string
          description: What went wrong, for a person.
      readOnly: true

    EncodedGivenValues:
      type: object
      description: "Given values encoded as strings, the form that survives a URL: a map of given name to value. Every value
        is a string whatever the given's type, and a `filter<…>` value is the filter body (`WN`), not the `f'…'` literal
        (`f'WN'`). `Given.default` differs: it is the default as Malloy source, exactly as the model writes it.
        `Report.startingGivens` and `CompiledDocument.startingGivens` carry this shape, URL parameters override it, and
        the result is decoded against the declarations into `GivenValues`."
      additionalProperties:
        type: string

    EntityField:
      type: object
      readOnly: true
      description: One public field of a source. See `ModelEntities.fields`.
      required:
        - name
        - sourceName
        - kind
        - definition
        - annotations
      properties:
        name:
          type: string
          description: The field's name, or its join-qualified path (`people.name`) when it is reached through a join.
        kind:
          $ref: "#/components/schemas/FieldKind"
        annotations:
          type: array
          items:
            type: string
          description: The field's annotations, trimmed, empty ones left out.
        doc:
          type: string
          description: The field's `#(doc)` text, when it has any.
        join:
          $ref: "#/components/schemas/EntityJoin"
          readOnly: true
        indexFingerprint:
          $ref: "#/components/schemas/IndexFingerprint"
          readOnly: true
        sourceName:
          type: string
          description: The runnable source to query the field from. For a join field it is the source declaring the join; when
            that source is itself reached through a join the value is dotted (`orders.customer`), the join path from the
            runnable source at its root, which is not itself a runnable source.
        type:
          type: string
          description: The field's Malloy type, when it has one.
        definition:
          type: string
          description: The Malloy text that declares the field.
        hidden:
          type: boolean
          default: false
          description: The source hides the field with a `# hidden` tag. `kind` still says what the field is.

    EntityGate:
      type: object
      readOnly: true
      required:
        - expression
        - givenNames
        - route
      properties:
        expression:
          type: string
          description: The gate's expression as the model writes it, or a whole-body `true` or `false`.
        givenNames:
          type: array
          items:
            type: string
          description: The `$NAME` givens the expression references.
        route:
          type: string
          enum:
            - authorize
            - access_filter
          description: Which kind of gate this is.
        terms:
          type: array
          description: On an `access_filter` gate, its `field <op> $GIVEN` terms, present only when the source's whole row filter
            reduces to such terms on queryable fields.
          items:
            $ref: "#/components/schemas/EntityGateTerm"
      description: "One access gate on a source, `#(authorize)` or `#(access_filter)`: what it states and the givens it reads.
        Whether a caller passes is decided per request."

    EntityGateTerm:
      type: object
      readOnly: true
      required:
        - fieldPath
        - givenName
        - op
      properties:
        fieldPath:
          type: string
        op:
          type: string
          enum:
            - =
            - in
          description: "How `fieldPath` is compared with the given: `=` or `in`."
        givenName:
          type: string
      description: One `field <op> $GIVEN` term of an `access_filter` gate.

    EntityJoin:
      type: object
      readOnly: true
      description: What a join field joins. Present only on a `join` field.
      required:
        - nested
      properties:
        sourceName:
          type: string
          description: The source the join reads, absent for a join read straight from a table.
        nested:
          type: boolean
          description: Whether the joined source exists only inside this join (an inline `extend` or a table read), so its fields
            are listed through it.
        modelPath:
          type: string
          description: Version-relative path of the file declaring that source.

    EntitySourceAddress:
      type: object
      readOnly: true
      description: "The served source a non-queryable source stands for: a report's import of a served source, or a source it
        derives from one."
      required:
        - modelPath
        - sourceName
      properties:
        modelPath:
          type: string
        sourceName:
          type: string

    EntityTable:
      type: object
      readOnly: true
      description: The table the source reads, split from its table path. Every part is absent when the source is not read
        from a table.
      properties:
        name:
          type: string
        connectionName:
          type: string
        schemaName:
          type: string
        catalogName:
          type: string

    Environment:
      type: object
      description: A namespace for packages and connections; the unit of tenancy.
      required:
        - resource
        - name
        - createdAt
        - updatedAt
        - revision
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          x-immutable: true
          description: Set on create; a write that changes it answers 400 `INVALID_REQUEST`.
          $ref: "#/components/schemas/IdentifierPattern"
        readme:
          type: string
          description: Markdown shown on the environment's page.
        connections:
          type: array
          description: On a read, the environment's connections with credentials withheld. On `PATCH`, the whole list, which
            replaces what is stored; a connection named with no config is kept as stored. Absent means untouched.
          items:
            $ref: "#/components/schemas/Connection"
        destinations:
          type: array
          description: "Where materialization builds write: the `#@ persist storage=<name>` targets. Read and written as
            `connections` is, credentials withheld on a read. A destination is not a connection: no model can name it,
            no connection route reaches it, and its name is independent of the connections', so a connection and a
            destination may share a name and mean two configurations of one catalog (for example a read-only reader and
            a writer)."
          items:
            $ref: "#/components/schemas/Destination"
        revision:
          $ref: "#/components/schemas/Revision"
          description: The environment's revision. It advances on any change to the environment's own fields, its connections or
            its destinations, whichever route made it, so `If-None-Match` never answers 304 over a changed connection
            and an `If-Match` push fails with 412 after a concurrent connection edit.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the environment, one of its connections or one of its destinations last changed.

    EnvironmentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    EnvironmentStatus:
      type: object
      description: One environment on `/status`, its connections and destinations without their configuration, and every
        package with each version this server knows.
      required:
        - resource
        - name
        - connections
        - destinations
        - packages
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          description: The environment's path (`environments/{environmentName}`), which `GET` reads as an `Environment`.
          readOnly: true
        name:
          type: string
        connections:
          type: array
          description: The environment's connections, by name, without their configuration; empty when it has none.
          items:
            $ref: "#/components/schemas/WarehouseHandleStatus"
        destinations:
          type: array
          description: The environment's destinations, by name, without their configuration; empty when it has none.
          items:
            $ref: "#/components/schemas/WarehouseHandleStatus"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageStatus"
      readOnly: true

    Error:
      type: object
      description: "The one error body every operation answers with. Branch on `status` and `reason`, never on `message`: the
        message is for people, may change between releases, and is fixed text wherever the driver's own words could name
        a host or a user. `details` is typed per reason where a client acts on it."
      required:
        - status
        - reason
        - message
        - requestId
      properties:
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        requestId:
          type: string
          description: The request's id, as its `X-Request-Id` response header carries it. Quote it when reporting the error; it
            names the server's log lines and access record for this request.
        reason:
          $ref: "#/components/schemas/ErrorReason"
        message:
          type: string
          description: What went wrong, for a person.
        details:
          description: "Typed per reason, for the reasons a client acts on; absent for the rest. `COMPILE_ERROR`:
            `CompileErrorDetails`. `REVISION_MISMATCH`: `RevisionMismatchDetails`. `INVALID_TRANSITION`:
            `InvalidTransitionDetails`. `TABLE_OWNED_ELSEWHERE`: `TableOwnedElsewhereDetails`. `INVALID_REQUEST`:
            `InvalidRequestDetails`, when one field is at fault. `RESULT_TOO_LARGE`: `ResultTooLargeDetails`.
            `CONTENT_CHANGED`: `ContentChangedDetails`. `VERSION_LOAD_FAILED`: `VersionLoadFailedDetails`. Pick the
            shape by `reason`."
          oneOf:
            - $ref: "#/components/schemas/CompileErrorDetails"
            - $ref: "#/components/schemas/RevisionMismatchDetails"
            - $ref: "#/components/schemas/InvalidTransitionDetails"
            - $ref: "#/components/schemas/TableOwnedElsewhereDetails"
            - $ref: "#/components/schemas/InvalidRequestDetails"
            - $ref: "#/components/schemas/ResultTooLargeDetails"
            - $ref: "#/components/schemas/ContentChangedDetails"
            - $ref: "#/components/schemas/VersionLoadFailedDetails"
      readOnly: true

    ErrorReason:
      type: string
      description: The machine-readable reasons. Each operation's error responses list the reasons it answers. A new reason is
        an additive change within v1, so a client treats a reason it does not know as the status's generic case.
      enum:
        - INVALID_REQUEST
        - FORBIDDEN
        - READ_ONLY
        - NOT_FOUND
        - CONFLICT
        - REVISION_MISMATCH
        - CONTENT_CHANGED
        - INVALID_TRANSITION
        - COMPILE_ERROR
        - QUERY_REJECTED
        - PAYLOAD_TOO_LARGE
        - RESULT_TOO_LARGE
        - INTERNAL
        - UNAVAILABLE
        - ADMISSION_REFUSED
        - RATE_LIMITED
        - CONNECTION_FAILED
        - CONNECTION_AUTH_FAILED
        - CONNECTION_NOT_FOUND
        - TABLE_NOT_FOUND
        - GATEWAY_TIMEOUT
        - PACKAGE_VERSION_MISSING
        - PACKAGE_VERSION_INVALID
        - VERSION_NOT_FOUND
        - VERSION_CONFLICT
        - VERSION_ARCHIVED
        - VERSION_IS_LATEST
        - VERSION_IS_LAST_ACTIVE
        - VERSION_BUILDING
        - VERSION_NOT_LATEST
        - PACKAGE_IS_LIVE
        - RESOURCE_NOT_EMPTY
        - IDEMPOTENCY_KEY_REUSED
        - MANIFEST_UNAVAILABLE
        - VERSION_LOAD_FAILED
        - FILE_EXISTS
        - FILE_NOT_WRITABLE
        - RUN_ACTIVE
        - TABLE_OWNED_ELSEWHERE

    FieldKind:
      type: string
      enum:
        - dimension
        - column
        - measure
        - view
        - join
      description: "What a field is. `column` is a dimension read straight from the table; `dimension` is one the model
        defines with `is`. A later release may add a kind: skip a field whose kind you do not know."

    Freshness:
      type: object
      description: "A freshness objective: how stale a materialized source may be, and what a query does past that. Each use
        says whose objective it is."
      properties:
        fallback:
          type: string
          enum:
            - warehouse
            - serve_expired
            - fail
          description: "What a query does when the freshness window is missed: serve from the warehouse (`publisher.json` spells
            it `live`), serve the table past its window (`publisher.json` spells it `stale_ok`), or fail the query."
        windowSeconds:
          type: integer
          description: The maximum acceptable staleness of the package's materialized sources, in seconds. An orchestrator
            schedules refreshes to meet it. `publisher.json` writes it as a duration (`"24h"`).
      readOnly: true

    GcsConnection:
      type: object
      description: Google Cloud Storage connection configuration for DuckDB
      properties:
        keyId:
          type: string
          description: GCS HMAC access key ID
        secret:
          type: string
          description: GCS HMAC secret key. Required on create.
          writeOnly: true
      required:
        - keyId
      additionalProperties: false

    Given:
      type: object
      description: >-
        A runtime parameter a Malloy model declares with `given:`. Given declarations appear in three places:
        `Model.givens`, `ModelEntities.givens` and a report's control row (`CompiledDocument.givens`). Values keyed by
        given name are `GivenValues` (`EncodedGivenValues` in the form that survives a URL), and a bare list of names is
        `givenNames`.


        A given also says how to present it as an input control (`label`, `description`, `control`, `rangeMin`,
        `rangeMax`, `suggest`), read from the declaration's own tags, so a report and an SDK host draw the same control.
        Each of the six is present only when the declaration carries the tag it reads. A tag value outside this contract
        (an unknown `control`, a `rangeMin` that is not a number) is dropped the same way rather than reported.


        A given with no `default` is required: a query that reads it fails until a value is supplied, so a report's
        reader asks for it before running the tiles that read it.
      properties:
        name:
          type: string
          description: Name as declared in the model
        type:
          type: string
          description: Rendered Malloy type for the given (e.g. string, number, boolean, date, timestamp, filter<string>)
        annotations:
          type: array
          description: Annotations attached to the given declaration
          items:
            type: string
        secure:
          type: boolean
          description: "True when the declaration carries `#(secure)`: its value is the host's to set. The builder withholds its
            control only when it edits a document held as text; a saved report renders it as before. Absent otherwise."
        default:
          type: string
          description: The given's default value as a Malloy source literal (e.g. `'WN'`, `2003`, `@2024-01-01`, `f'WN'`), exactly
            as written in the model. Omitted when the given declares no default. Consumers render or prefill it per the
            given's `type` (e.g. unquote a string literal for a text input).
        label:
          type: string
          description: Display label from the declaration's `# label=` tag
        description:
          type: string
          description: Helper text from the declaration's `# description=` tag. Distinct from the older `#(description="…")`
            annotation, which is not derived into this field and instead stays on `annotations` for the client that
            already parses it. The tag form is also the one that compiles without a `malformed-route` warning, because
            Malloy reads an annotation's route up to the first whitespace.
        control:
          type: string
          enum:
            - select
            - multiselect
          description: How the control renders when the choice is between a single-pick and a multi-pick list. Omitted means infer
            from the given's type. A slider is not one of these values; it is signalled by `rangeMin` and `rangeMax`
            instead, per the rule on those fields.
        rangeMin:
          type: number
          description: Slider lower bound from `# range_min=`. The two bounds are what signal a slider, so a `number` or
            `filter<number>` given renders as one when BOTH are present and as a plain number input otherwise, so a lone
            bound changes nothing about the control.
        rangeMax:
          type: number
          description: Slider upper bound from `# range_max=`. See `rangeMin` for the rule that turns the pair into a slider.
        suggest:
          $ref: "#/components/schemas/GivenSuggest"
          readOnly: true
      required:
        - name
        - type
      readOnly: true

    GivenSuggest:
      type: object
      description: "Where a select or multiselect control gets its options: a named query (`queryName`), a `sourceName` and
        `dimensionName` pair, or a `queryName` with a `dimensionName` naming which of its columns to read. All three run
        through the ordinary query operation. With `queryName` alone the first column of each row is used, so a
        single-column `group_by` needs no `dimensionName`; give one when the query returns more than one column."
      properties:
        givenNames:
          type: array
          items:
            type: string
          description: |
            The givens the suggest query needs in its request to run: the ones
            the source it reads is scoped by (a source-level `where: … ~ $X`)
            or gated by (an authorize gate reading `$X`), plus, for the `query`
            form, the named query's own. A client sends the current values of
            exactly these, so a gated source's options load while the option
            list still does not depend on the page's other filters. Absent
            when the query needs none.
        sourceName:
          type: string
        queryName:
          type: string
        dimensionName:
          type: string
      readOnly: true

    GivenValues:
      type: object
      description: |
        Given *values* keyed by given name: what a caller sends, as distinct
        from `Given`, which describes what the model *accepts*. A collection of
        declarations is a plain array of `Given`, never this.

        Values are decoded and must match the declared type: a `number` given
        takes a JSON number, a `date` takes a bare `YYYY-MM-DD` string, a
        `timestamp` an ISO string with no zone, a `timestamptz` a full ISO
        string. `EncodedGivenValues` is the string-encoded counterpart.
      additionalProperties: true

    IdentifierPattern:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: Standard identifier pattern for resource names

    IncrementalBoundary:
      type: object
      description: For a table refreshed incrementally, the boundary in force (`coveredThrough`, where the next refresh
        starts) and the `watermark` and `mergeKeys` it was measured with. A caller that owns the ledger stores it and
        sends it back on the next run in `BuildInstructions.incrementalBoundaries`.
      required:
        - coveredThrough
        - coveredThroughType
        - watermark
      properties:
        coveredThrough:
          type: string
          description: The exclusive upper end of the watermark range the table holds, as canonical scalar text. The next delta
            starts here.
        coveredThroughType:
          type: string
          enum:
            - date
            - timestamp
            - number
            - string
          description: The Malloy type of `coveredThrough`.
        watermark:
          type: string
          description: The source's `watermark=` dimension, which the boundary measures.
        mergeKeys:
          type: array
          items:
            type: string
          description: The source's `merge_key=` dimensions, in declared order. A delta merges on them when present, and replaces
            the watermark range when absent (a keyless source).
        advancedByRunId:
          type: string
          readOnly: true
          description: The run that last moved the boundary.
        advancedAt:
          type: string
          format: date-time
          description: When the boundary last moved.
          readOnly: true

    IncrementalBoundaryInput:
      description: An `IncrementalBoundary` a previous run reported, with the table it belongs to and the source definition it
        was measured under, as a caller that owns the ledger sends it back.
      allOf:
        - $ref: "#/components/schemas/TableAddress"
        - type: object
          required:
            - sourceEntityId
          properties:
            sourceEntityId:
              type: string
              description: The source's content address when the boundary was measured, the manifest entry's `sourceEntityId`. A
                boundary is applied only while it still matches, so it never applies to a table whose definition has
                moved on.
        - $ref: "#/components/schemas/IncrementalBoundary"

    IndexFingerprint:
      type: object
      readOnly: true
      description: "The definitional fingerprint of an `#(index)`-tagged dimension's value index: a Malloy `#(index)`
        dimension index, not the discovery index (`…/index`). Two loads that compile the dimension's canonical index
        query to the same SQL report the same fingerprint, so a host can reuse one index across versions and across
        sources that extend each other. Absent when that query did not compile."
      required:
        - sqlHash
        - partitionDimensionNames
      properties:
        sqlHash:
          type: string
          description: Lowercase hex SHA-256 of the compiled index query's SQL.
        partitionDimensionNames:
          type: array
          items:
            type: string
          description: "The dimensions the index is partitioned by: the source's required filters, in declaration order, then its
            `#(access_filter)` term columns."

    InvalidRequestDetails:
      type: object
      description: "`details` of an `INVALID_REQUEST` that one field caused."
      required:
        - field
      properties:
        field:
          type: string
          description: The dotted path of the request field that failed validation (`postgres.port`), or the query parameter's name.
      readOnly: true

    InvalidTransitionDetails:
      type: object
      description: "`details` of an `INVALID_TRANSITION`: the status the run is in now. Only `update-run` answers it."
      required:
        - currentStatus
      properties:
        currentStatus:
          $ref: "#/components/schemas/RunStatus"
      readOnly: true

    LoadError:
      type: object
      description: One version on `/status` that did not load, or that serves a model older than its content (`stale`).
      required:
        - environmentName
        - error
      properties:
        environmentName:
          type: string
          description: The environment the version is in.
        packageName:
          type: string
          description: The package the version is of. Absent when the environment itself did not load.
        versionId:
          $ref: "#/components/schemas/VersionId"
          description: The version that did not load. Absent when the failure is not one version's.
        error:
          $ref: "#/components/schemas/EmbeddedError"
          description: Why the version did not load, or, when `stale`, why its newer content did not compile.
          readOnly: true
        stale:
          type: boolean
          description: The version still serves its last successful compile; `error` says why the newer content did not compile.
        failedAt:
          type: string
          format: date-time
          description: When the load or compile failed.
          readOnly: true
      readOnly: true

    ManifestBinding:
      type: object
      description: Whether a version serves from materialized tables, and from which manifest.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - unbound
            - bound
            - bind_failed
          description: "`unbound`: no manifest, the version serves from the warehouse. `bound`: the configured manifest was
            applied. `bind_failed`: the configured manifest could not be fetched or bound, so the version keeps serving
            the binding before, which `location` names."
        location:
          type: string
          description: The manifest actually bound, which after a failed rebind differs from the configured one.
        entryCount:
          type: integer
          description: The entries of the bound manifest the version serves.
      readOnly: true

    ManifestEntry:
      description: "One source a run built, and the table it landed in. An external manifest, the file `manifestLocation`
        names, is a JSON array of these with the read-only fields left out: each entry carries the table's address
        (`tableName`, and `connectionName` or `destinationName`), `sourceEntityId`, `sourceName` and `realization`, and
        may carry `modelPath`, `kind`, `columns`, `rowCount` and `callerTableId`. The server sets the rest, `tableId`
        when it binds the file."
      allOf:
        - $ref: "#/components/schemas/TableAddress"
        - type: object
          required:
            - sourceEntityId
            - sourceName
            - tableId
            - realization
          properties:
            sourceEntityId:
              type: string
              description: Content address of the source definition; the identity across plan, instructions, manifest and bindings.
            sourceName:
              type: string
            modelPath:
              type: string
            kind:
              $ref: "#/components/schemas/PersistedSourceKind"
              default: persist
              description: "What declared the source, as on `PersistSourcePlan.kind`: `persist`, or `preaggregate` for a synthesized
                rollup."
            tableId:
              type: string
              readOnly: true
              description: The physical table's stable identity across the runs that write it; `tableName` is its name in the
                warehouse.
            callerTableId:
              type: string
              description: "The caller's own id for the table, from the build instruction that made it; absent for a run with `mode:
                auto`."
            realization:
              $ref: "#/components/schemas/Realization"
            columns:
              type: array
              description: The built table's columns.
              items:
                $ref: "#/components/schemas/Column"
            rowCount:
              type: integer
              description: Rows in the built table. Absent when not counted.
            buildDurationMs:
              type: integer
              readOnly: true
              description: How long this source's build took, in milliseconds.
            scannedBytes:
              type: integer
              readOnly: true
              description: Warehouse bytes the build scanned, as the backend reported them. Absent when not reported.
            upstreamReuse:
              readOnly: true
              type: string
              enum:
                - reused
                - recomputed
              description: "For a source that reads another persisted source, how this table's rows were computed from it. `reused`:
                every persisted upstream was read from its materialized table, so the rows are consistent with those
                snapshots. `recomputed`: at least one upstream was recomputed from its definition and inlined into this
                build, because its table could not be read (`upstreamRecomputeMessage` says which and why); the table
                then reflects the warehouse at this build's time, not the upstream's snapshot. Absent for a source that
                reads no persisted upstream."
            upstreamRecomputeMessage:
              type: string
              readOnly: true
              description: "Present only when `upstreamReuse` is `recomputed`: which upstream was not read from its table, and the
                compiler's or engine's words for why, redacted against the connections involved."
            dataAsOf:
              type: string
              format: date-time
              readOnly: true
              description: "The moment the table's rows reflect: when the build read the warehouse (`copy`), or the moment the clone
                or snapshot was taken (`snapshot`)."
            freshness:
              $ref: "#/components/schemas/Freshness"
              readOnly: true
              description: The freshness objective the entry was built under, resolved as on `PersistSourcePlan.freshness`.
            incremental:
              $ref: "#/components/schemas/IncrementalBoundary"
              readOnly: true
            refreshed:
              readOnly: true
              type: string
              enum:
                - delta
                - full
                - none
              description: 'What this run did to the table of a source declaring `refresh="incremental"`: advanced it in place by a
                bounded range (`delta`), rebuilt it (`full`, which every fallback such as a missing boundary or `reseed`
                also reports), or applied nothing because the watermark had not moved (`none`; the boundary in
                `incremental` stays in force). Present exactly when the source refreshes incrementally.'

    MaterializationConfig:
      type: object
      description: The package's materialization policy from `publisher.json`'s `materialization` block, read verbatim so an
        orchestrator can schedule re-materialization without reading the files. A field the block does not declare is
        absent.
      properties:
        schedule:
          type: string
          description: The cron schedule the package declares for re-materialization.
        freshness:
          $ref: "#/components/schemas/Freshness"
          description: The freshness objective `publisher.json` declares in `materialization.freshness`; absent when none is
            declared.
          readOnly: true
        scope:
          $ref: "#/components/schemas/SlotScope"
          default: package
          description: "`materialization.scope`: what one run at a time builds, the package (`package`) or each version
            (`version`). Absent when `publisher.json` declares none, which means `package`. The deprecated root `scope`
            is read into it too."
      readOnly: true

    Model:
      type: object
      description: "One model file compiled: its sources, named queries and givens. Larger parts are included on request with
        `?include=`."
      required:
        - resource
        - path
        - imports
        - sources
        - queries
        - givens
        - versionId
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        path:
          $ref: "#/components/schemas/PathPattern"
          description: The file's version-relative path.
        imports:
          type: array
          items:
            type: string
          description: The version-relative paths of the files this model imports, directly; empty when it imports none.
        hidden:
          type: boolean
          description: True when the package's `index.malloy` does not expose the file; it is read only with `includeHidden`.
        report:
          type: boolean
          description: True when the file carries an `## artifact` tag and is also a report.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        queries:
          type: array
          items:
            $ref: "#/components/schemas/Query"
        givens:
          type: array
          items:
            $ref: "#/components/schemas/Given"
        content:
          type: string
          description: The file's Malloy text, verbatim. Included with `?include=content`; omitted when the text names a source
            the file does not expose, unless `includeHidden` is set.
        modelInfo:
          type: object
          additionalProperties: true
          description: Malloy's own model structure, as an object. Included with `?include=modelInfo`. Its shape is the
            compiler's, not this API's.
        sourceInfos:
          type: array
          description: Malloy's own per-source structure, as objects. Included with `?include=sourceInfos`.
          items:
            type: object
            additionalProperties: true
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      readOnly: true

    ModelEntities:
      type: object
      readOnly: true
      description: What one `.malloy` model file declares, in the form an indexer reads. See `GET …/entities`.
      required:
        - modelPath
        - fields
        - sources
        - givens
        - sourceSchemas
        - versionId
      properties:
        modelPath:
          type: string
          description: Version-relative path of the model file.
        error:
          description: Present when the model has no entities; every other list is then empty.
          allOf:
            - $ref: "#/components/schemas/EmbeddedError"
            - type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - COMPILE_ERROR
                    - EXTRACTION_FAILED
                  description: "`COMPILE_ERROR`: the model did not compile, which its author fixes. `EXTRACTION_FAILED`: it compiled but
                    the server could not extract its entities, a server fault an indexer should not read as the model
                    having none."
        fields:
          type: array
          description: Every field of every source the model surfaces, its imported sources included, `# hidden` ones marked
            `hidden`. A field reachable only through a join (a joined source declared inline, or one the model's imports
            do not surface on their own) is listed under the runnable source it is reached from, its `name` the
            join-qualified path.
          items:
            $ref: "#/components/schemas/EntityField"
        sources:
          type: array
          description: "The facts the model states about each of its sources: docs, visibility, queryability, filters and access
            gates. Includes a source reached only through a join, with `joinOnly: true`, when the model gates or
            declares givens for it."
          items:
            $ref: "#/components/schemas/SourceEntities"
        givens:
          type: array
          description: Every given the model surfaces, those its imports surface included. They apply to every source in `sources`.
          items:
            $ref: "#/components/schemas/Given"
        sourceSchemas:
          type: array
          description: "The schema of each source the model surfaces, in declaration order: its own annotations and its public
            fields, a join's fields nested under it. The slim form of Malloy's `SourceInfo` that the discovery index
            embeds."
          items:
            $ref: "#/components/schemas/SourceSchema"
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.

    ModelEntitiesList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelEntities"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    ModelList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    ModelSummary:
      type: object
      description: One model file as the version's model list shows it.
      required:
        - resource
        - path
        - versionId
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        path:
          $ref: "#/components/schemas/PathPattern"
          description: The file's version-relative path, its identity.
        hidden:
          type: boolean
          description: "True for a file listed only because the request set `includeHidden`: one the package's `index.malloy` does
            not expose."
        report:
          type: boolean
          description: True when the file carries an `## artifact` tag and is also listed under `reports`.
        error:
          $ref: "#/components/schemas/EmbeddedError"
          description: Present when the file did not compile.
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      readOnly: true

    MotherduckConnection:
      type: object
      description: MotherDuck database connection configuration
      properties:
        accessToken:
          type: string
          description: MotherDuck access token
          writeOnly: true
        database:
          type: string
          description: MotherDuck database name
      additionalProperties: false

    MysqlConnection:
      type: object
      description: MySQL database connection configuration
      properties:
        host:
          type: string
          description: MySQL server hostname or IP address
        port:
          type: integer
          description: MySQL server port number
        database:
          type: string
          description: Name of the MySQL database
        user:
          type: string
          description: MySQL username for authentication
        password:
          type: string
          description: MySQL password for authentication
          writeOnly: true
      additionalProperties: false

    OverlayFile:
      type: object
      description: One file of a request's `files` overlay.
      required:
        - path
        - content
      properties:
        path:
          $ref: "#/components/schemas/PathPattern"
          description: The file's path relative to the version's root, `/`-separated, ending in `.malloy`.
          example: orders/orders.malloy
        content:
          type: string
          description: The file's whole text.

    Package:
      type: object
      description: "A package's identity and pointers. It holds no content: content is a Version. `PATCH` changes its own
        fields (`description`, `latestVersionId`); `source` is set on create and moves only with a publish from a new
        source."
      required:
        - resource
        - name
        - source
        - createdAt
        - updatedAt
        - revision
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          x-immutable: true
          description: Set on create; a write that changes it answers 400 `INVALID_REQUEST`.
          $ref: "#/components/schemas/IdentifierPattern"
        description:
          type: string
          description: On a read, the description set with `PATCH`, or, while none is set, the latest version's `publisher.json`
            description, which the server resolves so a reader needs no fallback of its own. `PATCH` sets it; `null`
            clears the one set, and reads show the latest version's again.
        source:
          $ref: "#/components/schemas/PackageSource"
          x-immutable: true
          description: Where the package's versions are fetched from. Set on create; a `PATCH` that changes it answers 400
            `INVALID_REQUEST`. A publish with a body `source` publishes from it and records it here, the one way to move
            it.
        latestVersionId:
          $ref: "#/components/schemas/VersionId"
          description: The version served when a request names `latest`. Who moves it is `ServerStatus.versionPromotion`; under
            `explicit` it is absent until one is set. Moved with `PATCH`, which with `If-Match` is a compare-and-swap;
            moving it back to a parent version is the undo of a server-made version. A create that sends it answers 400
            `INVALID_REQUEST`, since no version exists yet.
        revision:
          $ref: "#/components/schemas/Revision"
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    PackageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Package"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    PackageSource:
      type: object
      description: Where a package's content comes from.
      required:
        - location
      properties:
        location:
          type: string
          description: A local path, a git or GitHub URL, a `gs://` or `s3://` URI, or a `.zip`. What `POST …/versions` fetches
            when given no source. For a live package, the local directory the server watches and reads in place.

    PackageStatus:
      type: object
      description: One package on `/status`, with every version of it this server knows.
      required:
        - resource
        - name
        - versions
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          description: The package record's path (`…/packages/{packageName}`), which `GET` reads as a `Package`.
          readOnly: true
        name:
          type: string
        latestVersionId:
          $ref: "#/components/schemas/VersionId"
          description: Absent while no version is latest, which under `ServerStatus.versionPromotion` `explicit` lasts until one
            is set.
        versions:
          type: array
          description: One entry per version this server knows, loaded or not.
          items:
            $ref: "#/components/schemas/VersionStatus"
      readOnly: true

    PathPattern:
      type: string
      minLength: 1
      pattern: ^(?!\.\.?(?:/|$))[^/\\:\x00-\x1f\x7f]+(?:/(?!\.\.?(?:/|$))[^/\\:\x00-\x1f\x7f]+)*$
      description: "A version-relative file path: `/`-separated segments, none empty, `.` or `..`, with no leading `/`. A
        segment may hold any character but `/`, `\\`, `:` and control characters, so a listed `q3 report.malloy` reads
        back by its own path."

    PersistedSourceKind:
      type: string
      enum:
        - persist
        - preaggregate
      description: "What declared a persisted source: `persist`, the modeler's `#@ persist` on it, or `preaggregate`, a rollup
        the server synthesized from `#@ preaggregate` annotations."

    PersistSourcePlan:
      type: object
      required:
        - sourceName
        - connectionName
        - columns
      properties:
        connectionName:
          type: string
        dialect:
          type: string
        preaggregate:
          $ref: "#/components/schemas/PreaggregatePlan"
          description: What the synthesized rollup covers, its base source, grain and measures. Present only when `kind` is
            `preaggregate`.
          readOnly: true
        refresh:
          type: string
          enum:
            - full
            - incremental
          description: The source's declared `#@ persist refresh=` policy. Absent when unset, which means `full`.
        freshness:
          $ref: "#/components/schemas/Freshness"
          description: The source's effective freshness objective after most-specific-wins resolution (source, then model file,
            then package). Absent when unset at every level; the orchestrator then applies its default.
          readOnly: true
        columns:
          type: array
          description: Output schema of the source.
          items:
            $ref: "#/components/schemas/Column"
        annotationFields:
          type: object
          additionalProperties:
            type: string
          description: "The `#@ persist` keys the server does not recognize, as `key=value` strings read from the effective merged
            tag (a source extending a persisted parent inherits its keys, its own merging over them per key), so a new
            directive needs no server change. Each is also reported as a `VersionStatus.warnings` entry, never a
            rejection. Every key the server recognizes has its own field (`tableName`, `realization`, `destinationName`,
            `refresh`, `watermark`, `mergeKeys`) and is not repeated here. For a synthesized rollup (`kind:
            preaggregate`) the annotation was generated rather than typed, and is reported the same way."
        modelPath:
          type: string
          description: "Version-relative path of the `.malloy` model that declares this source (for example
            `order_rollup.malloy`), so a caller can link the source back to its model. A synthesized rollup (`kind:
            preaggregate`) is declared by no model, so this is the model of its base: the file holding the `#@
            preaggregate` annotations it was synthesized from."
        sourceName:
          type: string
        kind:
          $ref: "#/components/schemas/PersistedSourceKind"
          description: "What declared the source: `persist`, the modeler's `#@ persist` on it, or `preaggregate`, a rollup the
            server synthesized from `#@ preaggregate` annotations on `preaggregate.baseSourceName`'s measures; both
            build alike."
        tableName:
          type: string
          description: The table name the annotation's `name=` declares, as written (it may carry a dialect container path such as
            `dataset.table`). Absent when the annotation names none and the server chooses it.
        realization:
          $ref: "#/components/schemas/Realization"
          description: The annotation's `realization=`. Absent when unset.
        destinationName:
          type: string
          description: The destination the annotation's `storage=` names, for a `storage` build. Absent for a `colocated` build in
            the source's own connection.
        watermark:
          type: string
          description: "The annotation's `watermark=`: one output dimension, monotone non-decreasing, from which each incremental
            refresh derives its half-open range. Required by `refresh: incremental`; validated at publish against
            `columns`."
        mergeKeys:
          type: array
          items:
            type: string
          description: "The annotation's `merge_key=` dimensions, in declared order, none of them the watermark: the row identity
            of a source whose rows are restated with a later watermark, which selects a merge; absent, a delta replaces
            its range. Validated at publish. Neither this nor `watermark` is part of `sourceEntityId`."
      description: One persisted source's build plan, the value of `BuildPlan.sources` under its `sourceEntityId`.
      readOnly: true

    Position:
      type: object
      description: A 0-based line and character in a file.
      required:
        - line
        - character
      properties:
        line:
          type: integer
          minimum: 0
        character:
          type: integer
          minimum: 0
      readOnly: true

    PostgresConnection:
      type: object
      description: PostgreSQL database connection configuration
      properties:
        host:
          type: string
          description: PostgreSQL server hostname or IP address
        port:
          type: integer
          description: PostgreSQL server port number
        password:
          type: string
          description: PostgreSQL password for authentication
          writeOnly: true
        connectionString:
          type: string
          description: Complete PostgreSQL connection string (alternative to individual parameters)
          writeOnly: true
        sslmode:
          type: string
          enum:
            - disable
            - no-verify
            - verify-ca
            - verify-full
          description: TLS mode for the connection, in node-postgres's vocabulary (`no-verify` is libpq's `require`). On a
            connection reached through a `proxy` (SSH bastion), the driver connects to a local tunnel endpoint, so the
            cert hostname can't be checked from the tunnel address alone; use `verify-full` to check it against the real
            host. `verify-ca` validates the server cert chain against the trusted CA bundle (e.g. the baked Amazon RDS
            roots) without the hostname, `verify-full` validates the chain AND the hostname against the real host
            (verified via SNI through the tunnel; requires the target's CA to be trusted by Node's bundled CA roots or
            NODE_EXTRA_CA_CERTS), `no-verify` encrypts without verifying, and `disable` uses no TLS. A `storage=` build
            of a proxied source applies the same mode through its own tunnel, `verify-full` included. Note `verify-full`
            trusts a broader CA set than `verify-ca` here — ambient roots plus NODE_EXTRA_CA_CERTS, rather than the
            pinned NODE_EXTRA_CA_CERTS bundle that `verify-ca` uses — so it is intentionally not a strict superset; it
            adds the hostname check without narrowing CA trust. The server defaults it to `no-verify` when a proxy is
            set (so a force-SSL target isn't rejected for plaintext) — a server-applied default, not a schema default.
            On a direct connection the same modes apply against the configured host; when omitted, the deployment
            PGSSLMODE applies. Ignored when connectionString is set, which carries its own sslmode. Applies to a
            DuckLake catalog connection as well.
        database:
          type: string
          description: Name of the PostgreSQL database
        user:
          type: string
          description: PostgreSQL username for authentication
        statementTimeoutMs:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Maximum run time of each statement on the database, in milliseconds. The database cancels a statement that
            exceeds it. When omitted, the database's own statement_timeout applies. Not applied to a DuckLake catalog
            connection.
      additionalProperties: false

    PreaggregatePlan:
      type: object
      description: >-
        Provenance for a rollup source synthesized from `#@ preaggregate` annotations. A query never names a rollup,
        never changes shape because one exists, and gets the same answer whether one is used or not, so this is the only
        place the set of rollups and the coverage of each is visible at all.


        **This object describes ONE rollup table, at ONE grain.** A rollup is a single `GROUP BY`, so a grain is a
        property of the table, not of the individual measures in it: `grainDimensionNames` lists the dimensions of that
        one grain, and `measureNames` are the measures served at it.


        That inverts how the grain was authored, which is worth knowing before reading a plan. The modeler declares per
        measure — `#@ preaggregate grain="order_day, category"` — and may declare a measure at SEVERAL grains by writing
        several annotation lines on it, each of which is its own rollup. The publisher then packs every measure
        declaring the same (grain, connection, base source) into a single synthesized source, because ten measures at
        one grain should be one table and one CTAS rather than ten. So the plan has one entry per DISTINCT grain
        declared anywhere on the source, which is neither the number of annotated measures nor the number of
        annotations: a measure declared at two grains appears in two entries, and two measures sharing a grain appear in
        one. To recover the per-measure view that was written, iterate `BuildPlan.sources`, keep the `kind:
        preaggregate` entries, and invert each entry's grain-to-measures pairing.


        Choosing between two rollups and one at the combined grain is a size judgement, not a correctness one — see
        `grainDimensionNames`.
      required:
        - baseSourceName
        - grainDimensionNames
        - measureNames
      properties:
        baseSourceName:
          type: string
          description: The source whose measures carry the `#@ preaggregate` annotations this rollup was synthesized from. Queries
            name THIS source; the rollup is selected behind it, or bypassed, per grain coverage.
        grainDimensionNames:
          type: array
          items:
            type: string
          description: >-
            The dimensions of the ONE grain this rollup is built at — the parsed form of a single `grain=` annotation
            value, so `grain="order_day, category"` reports as two entries here and not as two grains.


            **Every entry is a dimension the base source itself declares**, never a truncation written inline.
            `grain="order_time.day"` is refused at publish: a stored column of truncated values either shadows the
            base's own `order_time` and answers untruncated queries from truncated rows, or is named something no query
            references and serves nothing. So time grains are reached by declaring `dimension: order_day is
            order_time.day` on the source and naming `order_day` here.


            **Sorted, and canonically so.** Synthesis derives the rollup's name and identity from the sorted grain, so
            two authors who write the same dimensions in different orders get one table rather than two. Compare grains
            as sets using this list; never by the annotation's original string, which is not canonical.


            A query can be answered here only if this grain covers it: every dimension the query groups by is in this
            list, or is a coarser truncation of one (a `month` of a stored `order_day` is derivable and does route; a
            `day` of a stored `order_month` is not). Which makes the set of grains ACROSS a package the whole
            performance story, and the reason adding a rollup per query shape is the documented way to spend more on
            builds than you save.


            Note that covering does not require an exact match: a query grouping by a SUBSET of these dimensions — or by
            none of them — is served here too, by re-aggregating across the ones it omits. So one rollup at the finest
            grain an author needs does subsume every coarser one, and a combined grain is often the economical choice.


            That subsumption is about coverage, though, not cost, and it is why a measure may still be declared at
            several grains. A combined grain has roughly the PRODUCT of its dimensions' cardinalities, so `customer_id,
            order_day` can approach the base table's row count and save almost nothing, while `order_day` alone is tiny.
            Two rollups then beat one, each query reading the smallest that covers it, at the price of two tables to
            build and refresh. Correctness is identical either way; the choice is size against build cost.
        measureNames:
          type: array
          items:
            type: string
          description: >-
            The measures served at this rollup's grain, under their original names — the names a query uses, not the
            names of the partial-aggregate columns stored to serve them. A query using only these, at a grain this
            rollup covers, is eligible to be served from its table.


            These are the measures whose `#@ preaggregate` named THIS grain. A measure declared at a different grain is
            not missing: it is in the plan entry for that grain. Do not read this list as the base source's full set of
            pre-aggregated measures — that is the union of these lists across every entry sharing a `baseSourceName`.


            **Every measure that declared this grain is here.** There is no partial rollup and no per-measure omission
            to check: a measure that cannot be correctly re-aggregated is refused at publish, so a rollup that exists
            carries everything that asked to be in it.
      readOnly: true

    Problem:
      type: object
      description: "One diagnostic: a compile problem, a load warning on a version, a render log message, or a finding on an
        agent. `severity` and `message` are always present; the rest locate it."
      required:
        - severity
        - message
      properties:
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
          description: What the problem is, for a person.
        code:
          type: string
          description: "A stable kebab-case name of the check that made the problem (for example `field-not-found`,
            `report-layout-unknown`, or `render-tag` on every render-tag finding; a report finding whose check names
            none carries `report-lint`). Absent when the check names none. The set is open: treat a code you do not know
            as a problem like any other."
        modelPath:
          type: string
          description: The version-relative path of the file the problem is in. A problem in text a compile check appended (scope
            `append`) names the model the text extends, and its `range` counts on from that model's last line. Absent
            for a finding on no file.
        sourceName:
          type: string
          description: The source the problem is about, when it is about one.
        range:
          $ref: "#/components/schemas/Range"
          description: Where in `modelPath` the problem is. Absent when the problem has no position.
          readOnly: true
        replacement:
          type: string
          description: A suggested fix, the text that replaces `range`. Absent when the problem has no mechanical fix.
      readOnly: true

    PublisherConnection:
      type: object
      description: >
        Malloy Publisher proxy connection. Proxies SQL to a remote Publisher server instead of connecting to a warehouse
        directly. The remote server owns authentication, access control, and read-only enforcement.
      properties:
        accessToken:
          type: string
          description: Bearer token for the remote server (user-scoped, short-lived)
          writeOnly: true
        connectionUrl:
          type: string
          description: The URL of a connection on another Publisher's v0 API, for example
            `https://org.data.example.com/api/v0/environments/<env>/connections/<name>`. The server reads it through
            v0's routes and response shapes, so a v1 connection URL does not work here yet.
      required:
        - connectionUrl
      additionalProperties: false

    Query:
      type: object
      description: Named model query definition
      properties:
        name:
          type: string
          description: Name of the query
        sourceName:
          type: string
          description: Name of the source this query operates on
        annotations:
          type: array
          description: Annotations attached to the query
          items:
            type: string
      required:
        - name
      readOnly: true

    QueryClass:
      type: string
      enum:
        - interactive
        - materialize
        - index
        - ops
      description: "The class of work a statement belongs to, attached as the `class` query-metadata property: `interactive`
        (a user or application query), `materialize` (a persist-source build), `index` (a build or scan of a Malloy
        `#(index)` dimension index, not the discovery index), `ops` (platform maintenance). Attribution's primary axis:
        a backend bill separates traffic from builds only if every statement says which it is."

    QueryMetadata:
      type: object
      additionalProperties:
        type: string
      description: >-
        Per-query metadata: a flat bag of string properties attached to the statements a query issues, for the backend's
        own reporting — cost attribution, workload classification, tracing. Each backend applies it through a per-query
        mechanism: Snowflake a per-statement `QUERY_TAG` (the bag as JSON, so its properties are queryable in
        `QUERY_HISTORY`) — except on a `storage=` build, whose read goes through DuckDB's query-passthrough and so sets
        the tag for the SESSION, which means the driver's own connection probes carry the build's bag too, BigQuery
        per-job `labels` (queryable in `INFORMATION_SCHEMA.JOBS`), and every other backend a leading SQL comment (`--
        team="finance"`, visible in query history / `pg_stat_activity`). It never affects results, and it is excluded
        from connection fingerprints and from build identity, so changing a property never re-addresses or rebuilds
        anything.

        The contract, which every backend can render and which the connector enforces at dispatch: property names are
        ASCII alphanumerics and underscore (<=128 chars), values are printable ASCII without `"` (<=256 chars), and a
        bag holds at most 20 properties. Declare a name starting with a LETTER: BigQuery drops a name it cannot fit to
        its label grammar while other backends keep it.

        Layers, most specific wins per property: connection default < package `queryMetadata` < model-file `##
        queryMetadata.*` < source `#@ queryMetadata.*` < per-request `queryMetadata`, and over all of them the
        connection's `queryMetadataEnforced`, which none can override. The `materialization.` spellings of the package
        and model-file layers are deprecated and still read; where a file declares both, the canonical one wins per
        property. The publisher's own context (`class`, `environment`, `package`, `model`, `source`, `trigger`,
        `run_id`, `query_id`, `version`) is applied on top and cannot be overwritten — it is what the server is actually
        doing, and a caller must not be able to relabel it. Those names are also RESERVED against a MODEL-SIDE
        declaration: a package block, a model file or a `#@ persist` annotation declaring one has it DROPPED rather than
        attached. Context only overwrites a name it has a value for, and a served query has no `source`, `trigger` or
        `run_id` — so a declared one would otherwise ride interactive traffic and read, in the backend's own history,
        exactly like a build. A connection default and a per-request bag are not covered: a request setting `queryClass`
        is a caller describing its own call, while a model-side declaration rides every query against that source,
        including ones its author never sees. Put no secrets or personal data here: a tag is visible to anyone who can
        read the backend's query history, and on a backend with no native tag mechanism it is visible in the statement
        text.

    QueryPath:
      type: object
      description: "The path report: what answered a query and why. Agents read it to learn whether a materialized table
        answered, and if not, what would let one. Tables are named by `tableId`; a source name alone is ambiguous across
        a package's models."
      required:
        - query
        - servedBy
        - considered
        - notConsidered
        - joins
        - warnings
      properties:
        query:
          $ref: "#/components/schemas/QueryShape"
          readOnly: true
        servedBy:
          $ref: "#/components/schemas/QueryPathServer"
          readOnly: true
        considered:
          type: array
          description: Every materialized table the router tried for this query, in the order it tried them, the one that served
            it included. Empty when the queried source has no materialized table.
          items:
            $ref: "#/components/schemas/QueryPathCandidate"
        notConsidered:
          type: array
          description: "Materialized tables near the queried source that the router does not try for it: a sibling's (one sharing
            an ancestor, off the queried source's chain), or one on a source that extends the queried one. Nearest
            first, at most ten. They say what the model has that this query cannot use, and where moving the query, or
            an annotation, would let a table answer."
          items:
            $ref: "#/components/schemas/QueryPathNearby"
        joins:
          type: array
          description: How each join the query used was resolved. Empty when it used none.
          items:
            $ref: "#/components/schemas/QueryPathJoin"
        warnings:
          type: array
          description: "Why a table on the queried source's chain answers no query: the serve verdict of an annotation that is
            well-formed but cannot be honoured here, so its source answers live. Filtered to what the caller may see.
            Empty when there are none."
          items:
            $ref: "#/components/schemas/QueryPathWarning"
      readOnly: true

    QueryPathWarning:
      type: object
      description: Why a table on the queried source's chain answers no query.
      required:
        - code
        - tableId
        - message
      properties:
        code:
          type: string
          description: "The serve verdict's reason: `storage_mode` (built into storage, but the server routes no query to
            it), `unreachable` (no published source reaches it), `row_level_gate` (every published entry point over it
            carries a gate it cannot keep yet), `refused` (the package refuses to serve it) or `shadowed` (its storage
            table is bound to another source of the same name). An open set: treat a code you do not know as a warning
            like any other."
        tableId:
          type: string
          description: The table, as `considered` names it.
        sourceName:
          type: string
          description: The source a query names to reach the table; for a rollup, the source it rolls up.
        message:
          type: string
          description: A fixed sentence per code, for a person. Never carries a refusal's own text.
      readOnly: true

    QueryPathCandidate:
      type: object
      description: A materialized table the router tried for the query.
      required:
        - tableId
        - kind
        - outcome
      properties:
        tableId:
          type: string
        kind:
          $ref: "#/components/schemas/QueryPathTableKind"
        outcome:
          type: string
          enum:
            - used
            - skipped
          description: "`used`, the table answered; `skipped`, it could not, and `reason` says why."
        reason:
          $ref: "#/components/schemas/SkipReason"
        detail:
          type: string
          description: "For a skip, the specifics, for a person: the missing field's name, the grain the query needed, the time
            zones. Absent when `outcome` is `used`."
        code:
          type: string
          description: "On a `WARNED` skip, the serve verdict's reason (the codes `QueryPathWarning.code` lists). An open set,
            not an enum. Absent on any other outcome."
      readOnly: true

    QueryPathJoin:
      type: object
      description: How one join the query used was resolved.
      required:
        - join
        - resolved
      properties:
        join:
          type: string
          description: The join's dotted path from the queried source.
        resolved:
          type: string
          enum:
            - inline
            - table
            - live
          description: "`inline`, its fields were stored in the table that answered; `table`, it read the joined source's own
            materialized table (or a rollup at the join key); `live`, it read the joined source live."
        tableId:
          type: string
          description: The table the join read. Present exactly when `resolved` is `table`.
      readOnly: true

    QueryPathNearby:
      type: object
      description: A materialized table near the queried source that the router does not try for this query.
      required:
        - tableId
        - kind
        - sourceName
        - relationship
        - built
      properties:
        tableId:
          type: string
        kind:
          $ref: "#/components/schemas/QueryPathTableKind"
        sourceName:
          type: string
          description: The source the table materializes.
        relationship:
          type: string
          enum:
            - sibling
            - below
          description: "`sibling`, its source shares an ancestor with the queried source but is off its chain; `below`, its source
            extends the queried one."
        built:
          type: boolean
          description: Whether the table has been built.
      readOnly: true

    QueryPathServer:
      type: object
      description: What answered the query.
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/QueryPathTableKind"
        tableId:
          type: string
          description: The table that answered. Each generation of a table is its own table, so this also names the generation.
            Absent when `kind` is `live`.
        dataAsOf:
          type: string
          format: date-time
          description: The moment the table's rows reflect, as on its manifest entry. Absent when `kind` is `live`, whose rows are
            read now.
          readOnly: true
      readOnly: true

    QueryPathTableKind:
      type: string
      enum:
        - view
        - rollup
        - materialized
        - live
      description: "What kind of answer: `view`, a persisted view's table; `rollup`, a pre-aggregation; `materialized`, a
        materialized source's table; `live`, the source's own warehouse."

    QueryRequest:
      type: object
      description: "One of two shapes: `query` alone (ad-hoc Malloy compiled in the model's context), or `queryName` without
        `query` (a view when `sourceName` is set, a model-level named query when it is not). `givens` ride on either."
      properties:
        query:
          type: string
          description: One `run:` statement after any definitions. Text with more than one run statement is 400.
        sourceName:
          type: string
          description: A source name exactly as the model lists it; quoted by the server, sent bare.
        queryName:
          type: string
          description: A view or named-query name exactly as the model lists it.
        givens:
          $ref: "#/components/schemas/GivenValues"
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
        queryClass:
          $ref: "#/components/schemas/QueryClass"
        rowLimit:
          type: integer
          description: Cap pushed into the SQL. The query's own limit or the server default applies when omitted.
        include:
          type: array
          description: Larger parts of the result to include. `malloyResult` is the full Malloy result the renderer needs.
          items:
            type: string
            enum:
              - malloyResult
              - sql

    QueryResult:
      type: object
      description: Rows always; the full Malloy result only when asked for.
      required:
        - rows
        - metadata
      properties:
        rows:
          type: array
          description: One object per row, keyed by column name. Nested results are nested arrays of objects.
          items:
            type: object
            additionalProperties: true
        metadata:
          allOf:
            - $ref: "#/components/schemas/QueryResultMetadata"
            - type: object
              required:
                - versionId
              properties:
                versionId:
                  $ref: "#/components/schemas/VersionId"
        malloyResult:
          type: object
          additionalProperties: true
          description: "Malloy's full result with type metadata, as an object. Present only with `include: [\"malloyResult\"]`."
        sql:
          type: string
          description: 'The SQL that ran. Present only with `include: ["sql"]`.'
      readOnly: true

    QueryResultMetadata:
      type: object
      description: How a result was produced, and the row cap it was produced under.
      required:
        - rowLimit
        - rowLimitSource
        - rowLimitHit
        - elapsedMs
      properties:
        versionId:
          $ref: "#/components/schemas/VersionId"
          description: The version that answered, with `latest` resolved, since `latest` can move between a model read and a
            query. Always present on a query's result; on SQL, present under a version and absent at environment scope.
        rowLimit:
          type: integer
          description: The most rows the result could hold.
        rowLimitSource:
          type: string
          enum:
            - query
            - request
            - server_default
          description: "Where `rowLimit` came from: the query's own limit (`query`), the request's `rowLimit` (`request`), or the
            server's default (`server_default`)."
        rowLimitHit:
          type: boolean
          description: True when the result stopped at `rowLimit`, so the query has more rows than it holds.
        elapsedMs:
          type: integer
          description: How long the server took to produce the result, in milliseconds.
        path:
          $ref: "#/components/schemas/QueryPath"
          description: "What answered the query and why: the table that served it, every table considered with the reason each was
            skipped, nearby tables that were not considered, how each join resolved, and the warnings on the annotations
            the query touched. Always present on a query's result; absent on SQL, which no table serves. Replaces v0's
            `servedFrom`, which said only where an answer came from, never why."
          readOnly: true
        scannedBytes:
          type: integer
          description: Warehouse bytes scanned, as the backend reported them. Absent when not reported, never zero.
        queryCorrelationId:
          type: string
          description: The id the server attached to the warehouse statement (as its query tag or label), so the warehouse's own
            logs can be matched to this query. One request can run several statements; `X-Request-Id` names the request.
        renderLogs:
          type: array
          description: The renderer's messages about the result's render tags.
          items:
            $ref: "#/components/schemas/Problem"
      readOnly: true

    QueryShape:
      type: object
      description: The query's shape, as routing reads it. A query that starts from a view names it in `viewName`; the rest
        describe the stage that touches the data.
      required:
        - sourceName
        - groupedBy
        - filteredBy
        - measures
      properties:
        sourceName:
          type: string
          description: The source the query reads.
        viewName:
          type: string
          description: The view the query is an exact call of, or starts from. Absent for a query written inline.
        groupedBy:
          type: array
          description: The dimensions the query groups by, as dotted paths from `sourceName`.
          items:
            type: string
        filteredBy:
          type: array
          description: The dimensions the query's filters read, as dotted paths from `sourceName`.
          items:
            type: string
        measures:
          type: array
          description: The measures the query aggregates, as dotted paths from `sourceName`.
          items:
            type: string
        timeZone:
          type: string
          description: The query's time zone, when it sets one. A table built in another time zone is skipped (`TIME_ZONE`).
      readOnly: true

    Range:
      type: object
      description: "A span of a file, as the Malloy compiler reports it: 0-based lines and characters, as in LSP, `end` exclusive."
      required:
        - start
        - end
      properties:
        start:
          $ref: "#/components/schemas/Position"
          readOnly: true
        end:
          $ref: "#/components/schemas/Position"
          readOnly: true
      readOnly: true

    Realization:
      type: string
      enum:
        - snapshot
        - copy
      description: "`snapshot`: a warehouse clone or snapshot. `copy`: `CREATE TABLE AS SELECT`."

    RefusalReason:
      type: string
      enum:
        - FREE_PARAMETER
        - GIVEN_IN_PERSISTED_QUERY
        - DYNAMIC_PROJECTION
        - DYNAMIC_JOIN
        - DYNAMIC_JOINED_WHERE
        - PARTITION_WITHOUT_STORAGE
        - PARTITION_COLUMN_UNKNOWN
        - PARTITION_COLUMN_NOT_PUBLIC
        - MERGE_KEY_SCOPE_UNRESOLVED
        - PREAGGREGATE_OVER_DYNAMIC_SOURCE
        - AUTHORIZE
        - READ_ONLY_DIALECT
      description: Why the eligibility check refused a persisted source at compile time. A run's build-time refusals add their
        own codes on `SourceFailure.reason`.

    RefusedSource:
      type: object
      description: One `#@ persist` source refused at compile time, and why. It is computed from the same tier-appropriate
        eligibility check the build enforces, so a source reported refused is refused for the tier it would actually
        build under. A refusal of a source whose `kind` is `preaggregate` can coexist with an entry for the same source
        in `BuildPlan.sources`; for a `persist` source a refusal means it is absent from `sources`.
      required:
        - sourceName
        - tier
        - kind
        - reason
        - message
      properties:
        modelPath:
          type: string
          description: Version-relative path of the `.malloy` model that declares this source, mirroring
            `PersistSourcePlan.modelPath`. Absent if the model path could not be resolved.
        tier:
          type: string
          enum:
            - storage
            - colocated
          description: The tier the source would have built in.
        reason:
          $ref: "#/components/schemas/RefusalReason"
          description: "Why the source is refused, decided at compile time: `FREE_PARAMETER`; `AUTHORIZE`; four that say where a
            given the build could not strip sits (`GIVEN_IN_PERSISTED_QUERY`, `DYNAMIC_PROJECTION`, `DYNAMIC_JOIN`,
            `DYNAMIC_JOINED_WHERE`); three that name an unusable `partition=` (`PARTITION_WITHOUT_STORAGE`,
            `PARTITION_COLUMN_UNKNOWN`, `PARTITION_COLUMN_NOT_PUBLIC`); `MERGE_KEY_SCOPE_UNRESOLVED` (a `merge_key=`
            whose caller scope cannot be expressed over the stored table's own columns);
            `PREAGGREGATE_OVER_DYNAMIC_SOURCE` (a rollup whose base is scoped by a given); and `READ_ONLY_DIALECT` (a
            colocated `#@ persist` on a dialect that cannot create tables). `GIVEN_IN_PERSISTED_QUERY` means the build
            would substitute a given's value, so the table would hold one caller's slice; a given in the source's extend
            block is applied per caller at read and is admitted. The build-time refusals are on the run's
            `SourceFailure.reason`."
        message:
          type: string
          description: The full, human-readable refusal message the eligibility assert produced — the same text a build attempting
            this source would fail with.
        sourceName:
          type: string
          description: The source's declared name.
        kind:
          $ref: "#/components/schemas/PersistedSourceKind"
          description: What declared the refused source, as on `PersistSourcePlan.kind`.
      readOnly: true

    Report:
      description: A `ReportSummary` plus what a viewer needs to draw it, which is the compiled document.
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - $ref: "#/components/schemas/CompiledDocument"
        - type: object
          properties:
            content:
              type: string
              description: The report file's whole text. On a read, present only with `?include=content`; on a write, the text to
                write, and the one field a write sets.

    ReportLayout:
      type: string
      enum:
        - grid
        - linear
      description: "How a report is laid out: `grid`, a dashboard scanned at a glance, or `linear`, one column read top to bottom."

    ReportList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    ReportSummary:
      type: object
      description: A `.malloy` file carrying an `## artifact` tag, wherever it lives in the version.
      required:
        - resource
        - path
        - layout
        - title
        - versionId
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        path:
          $ref: "#/components/schemas/PathPattern"
          description: The report's version-relative path, its identity. A client that shows a short label takes the basename of
            `path` itself.
          readOnly: true
        layout:
          $ref: "#/components/schemas/ReportLayout"
          readOnly: true
        title:
          type: string
          description: "The report's title: the `## artifact` tag's title, else the file's `#\"` doc comment, else the file's name."
          readOnly: true
        description:
          type: string
          description: The file's unnamed `"` notes above the `## artifact` tag, else the ones below it. Absent when it has none.
          readOnly: true
        readOnly:
          type: boolean
          default: false
          description: The report builder cannot write this file back, so it opens read-only (a report whose tiles it cannot
            splice). The report write refuses it the same way.
          readOnly: true
        contentHash:
          type: string
          description: "SHA-256 (hex) of the file's text, `content`. The server sets it on every read; a write sends it back as
            read, and is refused with 409 `CONTENT_CHANGED` when the file no longer hashes to it, so a write over a
            newer text is refused rather than lost. A write without it creates the file. The one field the server sets
            that a client also sends, as Google's `etag` field is, and the report's revision: a report has no
            `revision`, and the report write takes no `If-Match`. It is separate from the HTTP `ETag`, which covers the
            compiled report."
        error:
          $ref: "#/components/schemas/EmbeddedError"
          description: Present when the report did not compile.
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.

    ReportTile:
      type: object
      description: One tile of a report. A `query` tile (the default) runs a query; a `text` tile shows markdown and runs
        nothing, so a caller that runs a report's tiles skips the ones with `kind` `text`.
      properties:
        kind:
          type: string
          enum:
            - query
            - text
          default: query
          description: "`query` runs `query` through the model query operation; `text` shows `markdown`."
        name:
          type: string
          description: "A text tile's name: the bare word in `tiles=[…]` and on its `##|(markdown) name` block. Absent on a query
            tile."
        markdown:
          type: string
          description: A text tile's body, the text of its `##|(markdown) name` block without the opener. Empty when the file has
            no such block. Absent on a query tile.
        query:
          type: string
          description: Absent on a text tile. The run expression exactly as written in `tiles=[…]`, for example "orders ->
            by_month". An EXPRESSION rather than a name, so it goes in the `query` field of a `POST
            …/models/{path}:query` body, prefixed with `run:`.
        restricted:
          type: boolean
          description: "Set on a tile of a compiled document (`CompileResult.document`) whose source the caller may not read. The
            tile carries its `query`, the layout its own entry in `tiles=[…]` sets, and nothing derived from the source:
            no `givenNames`, no tags from the view."
        givenNames:
          type: array
          items:
            type: string
          description: |
            Names of the givens this tile's compiled query reads: through its
            view, its source's `where:`, a joined source's `where:`, a
            dimension or measure it uses, and its source's `#(authorize)` and
            `#(access_filter)` gates. A control not listed does not change the
            tile, which is what a viewer's "Doesn't respond to" chip says. It
            also tells a caller which tiles a changed control needs to re-run;
            running a tile with the report's whole control row also works,
            because an unreferenced given is ignored. Absent when discovery
            could not resolve the tile (its expression neither compiles nor is
            a plain `source -> view` or named query the static walk reads), in
            which case send the whole control row. One such tile
            widens `Report.givens` to every given the entry file
            surfaces, rather than the union over the resolvable tiles, so that
            the row actually contains the givens that tile filters by.
        label:
          type: string
          description: Heading for the tile, from a `# label` on the view or query it names. Absent when it carries none, in which
            case a viewer derives one from the run expression.
        subtitle:
          type: string
          description: Second line under the heading, from a `# subtitle` on the view or query it names.
        colspan:
          type: integer
          description: Grid columns this tile spans, from `colspan=N` on the tile's entry in `tiles=[…]`, or else from a `#
            colspan=N` on the view or query it names. The entry wins, so one view can sit at a different width on each
            report. Clamped to the report's `columnCount` at render time. Absent means one column.
        break:
          type: boolean
          description: Start a new grid row at this tile, from `break` on the tile's entry in `tiles=[…]`, or else from a `#
            break` on the view or query it names; `break=false` on the entry turns off the view's. Named for the tag, so
            every per-tile field on this schema is spelled the way an author writes it. A generated client escapes the
            attribute where the word is reserved (the Python client exposes `break_`) while the wire key stays `break`.
        borderless:
          type: boolean
          description: Draw the result with no card around it, from a `# borderless` on the view or query it names. Together with
            `label`, `subtitle`, `colspan` and `break` this is the whole per-child tag set `@malloydata/render` resolves
            for a `# dashboard` nest child, read the same way here so one view presents identically as a tile and as a
            nest.
        rowspan:
          type: integer
          description: The tile's height in grid rows, from `rowspan=N` on its entry in `tiles=[…]`; only the entry sets it. A row
            is 80px, and a tile N rows tall also spans the N-1 row gaps between them. Absent, the tile is as tall as its
            result, up to the viewer's cap; on a placed report (see `row`), 5 rows for a query tile and 2 for a text
            tile. A grid report only.
        row:
          type: integer
          description: "The grid row the tile's top sits in, counted from 1, from `row=N` on its entry in `tiles=[…]`. A report
            where any tile has a `row` is placed: its rows are fixed 80px tracks, and each tile sits at its `row` and
            `col` rather than flowing. A placed tile with no `row` or `col` fills the first free cell. On a narrow
            screen tiles stack in one column, ordered by row then column."
        col:
          type: integer
          description: The grid column the tile's left edge sits in, counted from 1, from `col=N` on its entry in `tiles=[…]`. See
            `row`.
      readOnly: true

    ResourcePath:
      type: string
      readOnly: true
      pattern: ^[^/\s][^\s]*$
      description: The canonical path of the resource this object represents or describes, relative to the API's base path,
        with no leading slash and with the resolved version id in place of `latest` (for example
        `environments/acme/packages/sales/versions/1.4.0/models/orders.malloy`). A `GET` of the base path joined with it
        reads the resource. It is relative so that it stays right behind a gateway that serves the API under another
        prefix. Use it as a link and a stable key; never parse it.

    ResultTooLargeDetails:
      type: object
      description: "`details` of a `RESULT_TOO_LARGE`: which cap the result passed. Narrow the query or lower `rowLimit`;
        resending the same request fails the same way."
      required:
        - capType
      properties:
        capType:
          type: string
          enum:
            - rows
            - bytes
            - unserializable
          description: "`rows`: the server's row cap. `bytes`: the server's result-size cap. `unserializable`: a value the result
            holds cannot be written as JSON."
      readOnly: true

    Revision:
      readOnly: true
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency counter on every mutable resource. Every read of the resource returns it in the body
        and as the `ETag` header (`"<revision>"`); a `PATCH` or `DELETE` may send it back as `If-Match`, and answers 412
        `REVISION_MISMATCH` when the resource has moved on.

    RevisionMismatchDetails:
      type: object
      description: "`details` of a `REVISION_MISMATCH`: the revision the resource has now, to read again before retrying."
      required:
        - currentRevision
      properties:
        currentRevision:
          $ref: "#/components/schemas/Revision"
          readOnly: true
      readOnly: true

    Run:
      type: object
      description: One attempt to build a slot's persisted sources.
      required:
        - resource
        - runId
        - versionId
        - mode
        - scope
        - createdAt
        - updatedAt
        - revision
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        runId:
          type: string
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionRef"
          x-immutable: true
          description: The version the run builds. Required on create, where `latest` and `live` are accepted; every read returns
            the resolved id. Never changed.
        status:
          $ref: "#/components/schemas/RunStatus"
          default: pending
          description: "`committed` is the only success: the manifest is visible and the bindings moved. Ignored on create; a
            `PATCH` may set only `cancelled`."
        trigger:
          type: string
          enum:
            - on_demand
            - scheduler
            - publish
          default: on_demand
          x-immutable: true
          description: "What started the run: an explicit request, the caller's scheduler, or a package publish. Set on create and
            never changed; the run's record and the `trigger` query-metadata property of every statement it issues carry
            this one value."
        callerRunId:
          type: string
          x-immutable: true
          description: The caller's own id for this run, set on create and never changed, attached as the `run_id` query-metadata
            property so every statement of one build groups together in the warehouse's query history.
        mode:
          readOnly: true
          type: string
          enum:
            - auto
            - orchestrated
          description: "Derived: `orchestrated` when the run was created with `buildInstructions`, `auto` otherwise."
        scope:
          readOnly: true
          $ref: "#/components/schemas/SlotScope"
          description: The version's `materialization.scope` when the run was created, recorded.
        options:
          $ref: "#/components/schemas/RunOptions"
          x-immutable: true
          description: How to run the build. Set on create; never changed.
        buildInstructions:
          $ref: "#/components/schemas/BuildInstructions"
          writeOnly: true
          x-immutable: true
          description: "An orchestrator's orders: which tables to build, under which names. Accepted on create and never returned;
            the run's manifest records what was built. A run created with them is `mode: orchestrated`."
        startedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the run began building. Absent while it is `pending`.
        completedAt:
          type: string
          format: date-time
          readOnly: true
          description: "When the run settled: `committed`, `failed` or `cancelled`. Absent until then."
        error:
          $ref: "#/components/schemas/EmbeddedError"
          readOnly: true
          description: Present when the run failed.
        summary:
          readOnly: true
          $ref: "#/components/schemas/RunOutcome"
        revision:
          readOnly: true
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    RunList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    RunManifest:
      type: object
      description: What a run produced, one entry per source. A document of the run, so it is not paged.
      required:
        - resource
        - entries
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEntry"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/SourceFailure"
      readOnly: true

    RunOptions:
      type: object
      description: How to run a build. Set on create; never changed.
      properties:
        forceRefresh:
          type: boolean
          default: false
          description: Build even when a source's `sourceEntityId` is unchanged. Never re-seeds an incremental source; ask for
            that with `reseed`.
        reseed:
          type: boolean
          default: false
          description: Rebuild every in-scope incremental source from scratch and re-derive its boundary. A build instruction's
            own `reseed` reseeds its one source as well; a source is reseeded when either says so.
        sourceEntityIds:
          type: array
          items:
            type: string
          description: "Only these sources, by the `sourceEntityId` the version's build plan keys them by. Only for a run with
            `mode: auto`; an orchestrated run names its sources in `buildInstructions`. Absent builds every persisted
            source."

    RunOutcome:
      type: object
      description: What a run did, counted per source. Each count is 0 when none.
      required:
        - builtCount
        - reusedCount
        - refusedCount
        - failedCount
      properties:
        builtCount:
          type: integer
          description: Sources this run built.
        reusedCount:
          type: integer
          description: "Sources whose table an earlier run built and this run kept, unchanged (`refreshed: none` included)."
        refusedCount:
          type: integer
          description: "Sources the eligibility check refused. On a run with `mode: auto` they are the version's
            `BuildPlan.refusedSources` and are not in `RunManifest.failures`; on an orchestrated run each is an
            instructed source, in `RunManifest.failures` with its `reason`, and counted in `failedCount` too."
        failedCount:
          type: integer
          description: Sources whose build failed, an orchestrated run's refused sources among them; each is in
            `RunManifest.failures`.
      readOnly: true

    RunStatus:
      type: string
      enum:
        - pending
        - running
        - committed
        - failed
        - cancelled
      description: Where a run is. `pending` and `running` are unsettled; `committed` is the only success, `failed` and
        `cancelled` the other settled states.

    S3Connection:
      type: object
      description: AWS S3 connection configuration for DuckDB
      properties:
        provider:
          type: string
          enum:
            - config
            - credential_chain
          default: config
          description: How credentials are obtained. `config` uses the accessKeyId and secretAccessKey on this object, which are
            then required. `credential_chain` resolves them from the host instead (an instance profile, a web-identity
            token, or the environment), so no key is stored, and supplying one is rejected. Chain resolution happens
            when the connection is attached, so a host that cannot supply credentials fails there rather than on first
            object access.
        chain:
          type: string
          description: "Ordered list of credential providers to try, semicolon-separated, for `provider: credential_chain`
            (DuckDB's CHAIN). Recognized providers are env, config, sts, instance, sso, process, and web_identity. Omit
            to use Publisher's default order, which covers the environment, a web-identity token, and an instance
            profile. Rejected under `provider: config`, where the key pair beside it is what grants access."
        accessKeyId:
          type: string
          description: "AWS access key ID (required for `provider: config`)"
        secretAccessKey:
          type: string
          description: "AWS secret access key (required for `provider: config`)"
          writeOnly: true
        region:
          type: string
          default: us-east-1
          description: "AWS region (for example `us-east-1`). A bucket in another region must set it: leaving it out reaches
            `us-east-1` and fails as a missing bucket rather than as a misconfiguration."
        endpoint:
          type: string
          description: "Custom S3-compatible endpoint (optional, for MinIO, etc.): `host[:port]`, `https://host[:port]`, or
            `http://host[:port]`, which is the one form that turns TLS off and is refused with `provider:
            credential_chain`, whose requests carry the host's credentials. No userinfo, query, fragment or whitespace."
        sessionToken:
          type: string
          description: AWS session token for temporary credentials (optional)
          writeOnly: true
      additionalProperties: false

    Schema:
      description: A schema name in a Connection.
      type: object
      properties:
        name:
          type: string
          description: Name of the schema
        default:
          type: boolean
          description: Whether this schema is the default schema
        hidden:
          type: boolean
          description: Whether this schema is hidden
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, on a read under a version; absent at environment scope.
      required:
        - name
      readOnly: true

    SchemaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schema"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    ServerStatus:
      type: object
      description: "The server's state, and every version it knows with its serving state: what an orchestrator reconciles
        from. The one unpaged snapshot in the API, narrowable with `?environmentName=`. Reading it loads nothing. Not a
        resource, so it carries no `resource`."
      required:
        - status
        - serverVersion
        - hostname
        - generatedAt
        - environments
      properties:
        status:
          type: string
          enum:
            - initializing
            - serving
            - draining
            - throttled
          description: "`initializing` while the server loads; `serving` once ready; `draining` while it shuts down; `throttled`
            when the memory governor refuses new loads and queries. A throttled server still answers for what it already
            serves."
        serverVersion:
          type: string
          description: This server's release, for example `1.2.0`.
        hostname:
          type: string
          description: The host this server runs on (`os.hostname()`; the pod name on Kubernetes). Stable identity for an
            orchestrator.
        bootId:
          type: string
          description: One UUID per process start.
        generatedAt:
          type: string
          format: date-time
          description: When the server took this snapshot.
          readOnly: true
        readOnly:
          type: boolean
          description: "Whether `resources.readOnly` is on, so every environment, connection, package, version and report write
            answers 403 `READ_ONLY`. Runs, `:reload`, `:load` and `:unload` stay available: they change what is built or
            served, not the catalog."
        versionPromotion:
          type: string
          enum:
            - on-publish
            - explicit
          description: "Who moves a package's `latestVersionId`, this server's `versionPromotion` setting; every mention of
            promotion elsewhere means this field. `on-publish` (the default): a publish moves it to the new version
            unless a higher version is already latest, and a report write moves it to the version the write made.
            `explicit`: a publish and a report write never move it; only `PATCH …/packages/{packageName}` does, for an
            orchestrator that decides when a version is ready to serve, so a package has no latest version until one is
            set that way."
        storage:
          $ref: "#/components/schemas/StorageStatus"
          readOnly: true
        initError:
          $ref: "#/components/schemas/EmbeddedError"
          description: Present only when initialization failed; `status` then stays `initializing`.
          readOnly: true
        loadErrors:
          type: array
          description: Versions that did not load, or that serve a model older than their content (`stale`). A version that loaded
            but is stale also says so in its own `VersionStatus` (`stale`, with `error`).
          items:
            $ref: "#/components/schemas/LoadError"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/EnvironmentStatus"
      readOnly: true

    Severity:
      type: string
      enum:
        - error
        - warn
        - info
        - debug
      description: How serious a problem, warning or log message is. `error` is a failure; `warn` is valid but worth
        attention; `info` and `debug` are for people reading logs.

    Skill:
      type: object
      readOnly: true
      description: "An agent skill with its full Markdown body. Not composed from `SkillSummary`: as an item of `Agent.skills`
        it carries no `resource` or `versionId`, and its `origin` adds `agent`."
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          description: The skill's path. Always present from `GET …/skills/{skillName}`; absent on `Agent.skills`, whose skills
            have no read of their own.
          readOnly: true
        name:
          type: string
          description: The skill's name.
        description:
          type: string
          description: One line saying when to read this skill.
        content:
          type: string
          description: The skill's `SKILL.md` text, always present.
        origin:
          type: string
          enum:
            - bundled
            - package
            - agent
          description: "Where this skill came from. `bundled`: shipped with this server. `package`: shipped under the version's
            `skills/`, replacing a bundled one of the same name. `agent`: one of an agent's own skills, on
            `Agent.skills`."
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillFile"
          description: The files the skill ships beside its `SKILL.md`, by path; each carries its `content` only when the skill is
            read with its files.
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved. Always present from `GET …/skills/{skillName}`; absent
            on `Agent.skills`, where it is the agent's.
      required:
        - name
        - description
        - content
        - origin

    SkillFile:
      type: object
      readOnly: true
      description: "One file a skill ships beside its `SKILL.md`: a reference file it loads on demand, or an asset an agent
        copies into an app it builds."
      properties:
        path:
          type: string
          description: The file's path relative to the skill's directory (for example `reference/joins.md`, `assets/app.html`).
        content:
          type: string
          description: "The file's text. Present only when the skill is read with its files: `?include=files`, on a skill or on an
            agent."
        sizeBytes:
          type: integer
          description: Size of the file's text in UTF-8 bytes.
        kind:
          type: string
          enum:
            - reference
            - asset
          description: "`reference`: text the skill loads on demand. `asset`: a file to copy, not to read."
      required:
        - path
        - kind
        - sizeBytes

    SkillList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    SkillSummary:
      type: object
      readOnly: true
      description: One agent skill in force for the version, without its body. This is what a caller reads to decide which
        skill to fetch.
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          type: string
          description: The skill's name, the identifier for reading it.
        description:
          type: string
          description: One line saying when to read this skill. Empty when the package author omitted it, which is also reported
            as a `VersionStatus.warnings` entry.
        origin:
          type: string
          enum:
            - bundled
            - package
          description: "`bundled` = shipped with this server. `package` = shipped by the package under `skills/`, which includes a
            package skill whose name matches a bundled one and therefore REPLACES it for this package. Present so a
            caller can tell a replaced skill from the original, which is otherwise invisible."
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, with `latest` resolved.
      required:
        - resource
        - name
        - description
        - origin
        - versionId

    SkipReason:
      type: string
      enum:
        - NOT_BUILT
        - WARNED
        - MISSING_FIELD
        - CONTRACT
        - GRAIN_TOO_COARSE
        - TIME_ZONE
        - CROSS_CONNECTION
        - COUNT_SEMANTICS
        - STALE
        - RUN_FAILED
      description: Why a table could not answer a query. `NOT_BUILT`, it has not been built; `WARNED`, its annotation carries
        a publish warning and serves live; `MISSING_FIELD`, the query reads a field the table lacks; `CONTRACT`,
        answering from it would bypass an access control on the queried source; `GRAIN_TOO_COARSE`, a rollup's grain
        does not cover the query's groups or filters; `TIME_ZONE`, it was built in another time zone than the query's;
        `CROSS_CONNECTION`, the query needs a join the table's connection cannot reach; `COUNT_SEMANTICS`, a count the
        table cannot reproduce as the live query computes it; `STALE`, it is past its freshness window; `RUN_FAILED`, it
        was chosen but reading it failed at run time, and its freshness fallback allowed live. Like every `reason` in
        this API, a code from a closed list; new codes may be added, so a client treats an unknown one as a skip it
        cannot explain.

    SlotScope:
      type: string
      enum:
        - package
        - version
      description: "What one run at a time may build: the package (`package`) or one version (`version`)."

    SnowflakeConnection:
      type: object
      description: Snowflake database connection configuration
      properties:
        account:
          type: string
          description: Snowflake account identifier
        username:
          type: string
          description: Snowflake username for authentication
        password:
          type: string
          description: Snowflake password for authentication
          writeOnly: true
        privateKey:
          type: string
          description: Snowflake private key for authentication
          writeOnly: true
        privateKeyPass:
          type: string
          description: Passphrase for the Snowflake private key
          writeOnly: true
        warehouse:
          type: string
          description: Snowflake warehouse name
        database:
          type: string
          description: Snowflake database name. Absent connects with no current database, so names must be fully qualified as
            DATABASE.SCHEMA.TABLE and schema discovery spans the account.
        schema:
          type: string
          description: Snowflake schema name. Sets the session default schema and forms part of the connection's identity, so it
            determines what a materialization build runs as. It does not restrict which schemas are discoverable.
        role:
          type: string
          description: Snowflake role name
        queryTimeoutMs:
          type: integer
          description: Query response timeout in milliseconds
      additionalProperties: false

    Source:
      type: object
      description: A Malloy source defined in a model
      properties:
        name:
          type: string
          description: Name of the source
        annotations:
          type: array
          description: Annotations attached to the source
          items:
            type: string
        views:
          type: array
          description: Views defined in this source
          items:
            $ref: "#/components/schemas/View"
        gates:
          type: array
          description: The source's effective access gates, `#(authorize)` and `#(access_filter)` alike, told apart by each gate's
            `route`, in the one shape `SourceEntities.gates` uses. A gate states that the source is locked or filtered;
            the server decides, per request, whether a caller passes. Absent when the source has no gate.
          items:
            $ref: "#/components/schemas/EntityGate"
      required:
        - name
      readOnly: true

    SourceEntities:
      type: object
      readOnly: true
      description: What a model states about one source. See `ModelEntities.sources`.
      required:
        - modelPath
        - name
        - joinOnly
        - agentHidden
        - queryable
      properties:
        modelPath:
          type: string
          description: "The model file the facts are filed under: the reporting model, or, for a `joinOnly` source declared in
            another file, that file."
        name:
          type: string
          description: The source's name. Dotted (`orders.customer`) for a source that exists only inside a join.
        joinOnly:
          type: boolean
          description: "Reached only through a join. Only its gates with `route: authorize` are reported."
        doc:
          type: string
          description: The source's own `#(doc)` text, when it has any.
        agentHidden:
          type: boolean
          description: The source, or the model file declaring it, carries `#(agent-hidden)`.
        queryable:
          type: boolean
          description: Whether this server runs a query against the source directly. False for a source outside the package's
            query surface.
        servedSource:
          $ref: "#/components/schemas/EntitySourceAddress"
          readOnly: true
        gates:
          type: array
          description: "The source's effective access gates, `#(authorize)` and `#(access_filter)` alike, told apart by each
            gate's `route`: file-level ones first, then its own, `authorize` before `access_filter`. Absent when the
            source has no gate."
          items:
            $ref: "#/components/schemas/EntityGate"
        table:
          $ref: "#/components/schemas/EntityTable"
          description: The warehouse table the source reads, the same for every field of the source. Absent when the source is not
            a table (a query or a SQL source).
          readOnly: true

    SourceFailure:
      description: "One source that failed to materialize, and why. Kept beside the entries because a failed source names no
        table that exists: its address is the table the source was headed for. Only an instructed or planned source,
        which has a `sourceEntityId`, is here: on a run with `mode: auto` a refused source is not a failure but a
        `BuildPlan.refusedSources` entry, counted in `RunOutcome.refusedCount`."
      allOf:
        - $ref: "#/components/schemas/TableAddress"
        - type: object
          required:
            - sourceEntityId
            - message
          properties:
            sourceEntityId:
              type: string
            sourceName:
              type: string
            modelPath:
              type: string
              description: The model file that declares the source, since a `sourceName` can repeat across model files.
            message:
              type: string
              description: Why this source failed, in the words the warehouse or compiler reported, redacted against the source's
                connection.
            reason:
              description: "Present exactly when the eligibility check refused the source before any build ran, so retrying returns
                the same answer until the model changes: the check's reason. Either one of `RefusedSource.reason`'s
                compile-time codes (`RefusalReason`), or a build-time one: `NOT_DUCKDB_PORTABLE` (the built table's
                captured shape does not compile in DuckDB, so a storage destination cannot serve it) or
                `PUBLIC_SURFACE_UNKNOWN` (the source's public columns could not be determined, so a storage build
                refuses rather than store columns the source hides)."
              anyOf:
                - $ref: "#/components/schemas/RefusalReason"
                - type: string
                  enum:
                    - NOT_DUCKDB_PORTABLE
                    - PUBLIC_SURFACE_UNKNOWN
            callerTableId:
              type: string
              description: The caller's own table id from the instruction, so an orchestrator can match the failure to what it
                dispatched.
      readOnly: true

    SourceSchema:
      type: object
      readOnly: true
      required:
        - name
        - annotations
        - fields
      properties:
        name:
          type: string
        annotations:
          type: array
          items:
            type: string
          description: The annotations declared on the source itself.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SourceSchemaField"
      description: "One source's schema as the discovery index embeds it: its name, its own annotations, and its public fields."

    SourceSchemaField:
      type: object
      readOnly: true
      required:
        - kind
        - name
      properties:
        kind:
          $ref: "#/components/schemas/FieldKind"
        name:
          type: string
        type:
          type: string
        annotations:
          type: array
          items:
            type: string
        fields:
          type: array
          description: A join's or a view's own fields.
          items:
            $ref: "#/components/schemas/SourceSchemaField"
      description: "One public field of a source as the discovery index embeds it: its kind, name and type, its own
        annotations, and a join's or view's own fields."

    SqlRequest:
      type: object
      description: Ad-hoc SQL against a connection, for the schema browser and for operators.
      required:
        - statement
      properties:
        statement:
          type: string
          description: The one SQL statement to run or describe, in the connection's dialect.
        mode:
          type: string
          enum:
            - run
            - describe
          default: run
          description: "`run` executes and returns rows. `describe` compiles the statement and returns its result columns without
            running it."
        queryClass:
          $ref: "#/components/schemas/QueryClass"
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
        rowLimit:
          type: integer
          description: Cap on rows returned by `run`. The server's default applies when omitted.

    SqlResult:
      type: object
      description: What a SQL statement returned, or for `describe` the columns it would return.
      required:
        - columns
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rows:
          type: array
          description: "Present for `run`: one object per row, keyed by column name."
          items:
            type: object
            additionalProperties: true
        metadata:
          $ref: "#/components/schemas/QueryResultMetadata"
          description: "The query metadata that applies to SQL: the row limit fields, `elapsedMs`, and `scannedBytes` and
            `queryCorrelationId` where reported. `versionId` is present on `run-sql-in-version` and absent at
            environment scope, which names no version. `path` and `renderLogs` never apply and are absent."
          readOnly: true
      readOnly: true

    SqlserverConnection:
      type: object
      description: "Microsoft SQL Server connection configuration: a SQL Server login over TCP. Field names are the
        connector's own (`@malloydata/db-sqlserver`), so a value here reaches the driver unchanged. The dialect is
        experimental upstream; Publisher accepts it on the model author's behalf, so a model needs no `##!
        experimental.dialect.sqlserver` pragma. The connection is read-only: a `#@ persist` on a SQL Server source is
        refused at load (see `RefusedSource.reason`)."
      properties:
        server:
          type: string
          description: SQL Server host name or IP address
        port:
          type: integer
          default: 1433
          description: TCP port. Not used when `instanceName` is set.
        database:
          type: string
          description: Name of the database to open
        user:
          type: string
          description: SQL Server login name
        password:
          type: string
          description: SQL Server login password
          writeOnly: true
        encrypt:
          type: boolean
          description: Encrypt the connection with TLS. On when omitted, as the driver defaults it; a server that requires
            encryption refuses a connection with it off.
        trustServerCertificate:
          type: boolean
          description: Accept a server certificate the client cannot verify, such as a self-signed one on a local or test server.
            Off when omitted. Leave it off for any server you do not control; a certificate the client cannot verify
            then fails the connection rather than being trusted.
        hostNameInCertificate:
          type: string
          description: The host name the server's certificate is issued to, when it is not `server` (a server reached by IP
            address, or through a tunnel). Checked against the certificate when `encrypt` is on and
            `trustServerCertificate` is off.
        instanceName:
          type: string
          description: A named instance, located through the SQL Browser service (UDP 1434); `port` is then not used.
      additionalProperties: false

    SshProxy:
      type: object
      description: SSH bastion / jump-host config for reaching a database inside a private network via an SSH local
        port-forward. Authentication is public-key only.
      required:
        - host
        - username
      properties:
        host:
          type: string
          description: Bastion hostname or IP address (the SSH jump host)
        port:
          type: integer
          default: 22
          description: Bastion SSH port (defaults to 22)
        username:
          type: string
          description: SSH username on the bastion
        privateKey:
          type: string
          description: PEM-encoded SSH private key used to authenticate to the bastion. The customer authorizes the matching
            public key in the bastion's authorized_keys; public-key auth only. Required on create.
          writeOnly: true
        privateKeyPass:
          type: string
          description: Passphrase for the encrypted private key, if any.
          writeOnly: true
        hostKey:
          type: string
          description: |
            Optional pinned bastion host public key(s), as one or more OpenSSH
            known_hosts lines (or bare base64 blobs), verified on every connect.
            List multiple lines to pin a load-balanced/HA bastion that presents a
            different key per backend — any listed key is accepted; a mismatch
            fails the connection closed. Plain and hashed (`|1|…`) lines both work
            — only the key blob is compared, never the hostname. When omitted, the
            tunnel connects without host-key verification (the self-service
            default); the SSH transport is still encrypted.
      additionalProperties: false

    StorageStatus:
      type: object
      description: The storage layer's own state, on `/status`.
      properties:
        schemaVersion:
          type: integer
          description: The last migration applied to the catalog.
        gc:
          $ref: "#/components/schemas/StorageSweep"
          readOnly: true
      readOnly: true

    StorageSweep:
      type: object
      description: The storage layer's last reachability sweep.
      properties:
        lastRunAt:
          type: string
          format: date-time
          description: When the last sweep ran.
          readOnly: true
        collected:
          $ref: "#/components/schemas/StorageSweepCounts"
          readOnly: true
      readOnly: true

    StorageSweepCounts:
      type: object
      description: What the last sweep removed, counted per store. A store it did not sweep is absent.
      properties:
        contentCount:
          type: integer
          description: Content blobs no version references.
        checkoutCount:
          type: integer
          description: Checkout directories no version's tree names.
        tableCount:
          type: integer
          description: Built tables no manifest entry references.
        derivedCount:
          type: integer
          description: Derived rows (compiled models, index artifacts) for content no version references.
        tempDirectoryCount:
          type: integer
          description: Temporary directories left by builds that did not finish.
      readOnly: true

    Table:
      description: A `TableSummary` with its columns, which a table's own read always carries.
      allOf:
        - $ref: "#/components/schemas/TableSummary"
        - type: object
          required:
            - columns
          properties:
            columns:
              type: array
              description: The table's columns, always present on a table's own read.
              items:
                $ref: "#/components/schemas/Column"
            rowCount:
              type: integer
              description: Absent when the warehouse does not report it.
      readOnly: true

    TableAddress:
      type: object
      description: "Where a built table lives: its `tableName`, and exactly one of `connectionName` (a `colocated` table, in
        the source's own connection) or `destinationName` (a `storage` table, in a destination). Which one is set is the
        table's tier."
      required:
        - tableName
      properties:
        tableName:
          type: string
          description: "The table's name in the warehouse, schema-qualified where the connection has schemas (`analytics.orders`):
            what a reader outside Publisher queries, and what an orchestrator sends in a build instruction. Unlike a
            connection's `Table`, read under its schema in the path, a materialized table is named by this one qualified
            string."
        connectionName:
          type: string
          description: The connection a `colocated` table lives in. Absent for a `storage` table.
        destinationName:
          type: string
          description: The destination a `storage` table lives in. Absent for a `colocated` table.

    TableList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TableSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    TableOwnedElsewhereDetails:
      type: object
      description: "`details` of a `TABLE_OWNED_ELSEWHERE`: who owns the table the instruction named."
      required:
        - ownerPackageName
      properties:
        ownerPackageName:
          type: string
          description: The package whose slot owns the table.
        ownerVersionId:
          $ref: "#/components/schemas/VersionId"
          description: "The version whose slot owns the table, present exactly when that slot is a version (`scope: version`);
            absent when the package owns it (`scope: package`)."
      readOnly: true

    TableSummary:
      type: object
      description: A table as a schema listing names it.
      required:
        - resource
        - name
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
          description: Present only with `?include=columns`.
        versionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version that answered, on a read under a version; absent at environment scope.
      readOnly: true

    TrinoConnection:
      type: object
      description: Trino database connection configuration
      properties:
        server:
          type: string
          description: The coordinator's URL (`http://` or `https://`).
        port:
          type: integer
          description: The coordinator's port. Used only when `server` carries none.
        catalog:
          type: string
          description: Trino catalog name
        schema:
          type: string
          description: Trino schema name
        user:
          type: string
          description: Trino username for authentication
        password:
          type: string
          description: Trino password for authentication
          writeOnly: true
        peakaKey:
          type: string
          description: Peaka API key for authentication with Peaka-hosted Trino clusters
          writeOnly: true
      additionalProperties: false

    UpstreamTable:
      description: An already-materialized upstream a run may read but does not rebuild, by its table address.
      allOf:
        - $ref: "#/components/schemas/TableAddress"
        - type: object
          required:
            - sourceEntityId
          properties:
            sourceEntityId:
              type: string
              description: The upstream source's content address.

    Version:
      type: object
      description: "An immutable snapshot of a package's content. Its content never changes; its lifecycle fields (`archived`,
        `pinned`, `manifestLocation`) do, through `PATCH`. Whether a server holds it in memory is not on the record:
        that is `VersionStatus.status`, changed with `:load` and `:unload`."
      required:
        - resource
        - versionId
        - origin
        - createdAt
        - updatedAt
        - revision
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          readOnly: true
        versionId:
          readOnly: true
          $ref: "#/components/schemas/VersionId"
        origin:
          type: string
          enum:
            - publish
            - republish
            - edit
            - migration
          readOnly: true
          description: "`publish`: the author's. `republish`: a publish whose declared version already existed with other content,
            named `<parent>+republish.N`. `edit`: a report write. `migration`: imported from a pre-v1 store."
        parentVersionId:
          $ref: "#/components/schemas/VersionId"
          readOnly: true
          description: The version a server-made version was made from; undo is pointing `latestVersionId` back at it.
        source:
          $ref: "#/components/schemas/PackageSource"
          x-immutable: true
          description: Where the version was fetched from. Set on publish and never changed. Absent on the publish means the
            package's recorded source; sent, it becomes the package's recorded `source`.
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
          readOnly: true
          description: The per-query metadata the version's `publisher.json` declares at its root.
        description:
          type: string
          readOnly: true
          description: The version's `publisher.json` description.
        materialization:
          readOnly: true
          $ref: "#/components/schemas/MaterializationConfig"
        archived:
          type: boolean
          default: false
          description: 'Out of service: its content reads answer 410, while its record, its status and `PATCH` (`{"archived":
            false}` restores it) stay available. Refused while it is `latest`, the last active version, or building.'
        pinned:
          type: boolean
          default: false
          description: Exempt from server-made-version retention. Set with `PATCH`.
        manifestLocation:
          type: string
          description: "The location of an externally computed manifest bound to this version: a JSON array of `ManifestEntry`
            with its read-only fields left out. Absent when none is bound, and the version serves from the warehouse.
            Set with `PATCH`; `null` clears it."
        gitCommitSha:
          type: string
          readOnly: true
          description: The git commit the version was published from. Absent for a source that is not git.
        revision:
          $ref: "#/components/schemas/Revision"
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the version's record (archived, pinned, its manifest binding) last changed; its content never does,
            and loading or unloading it is not a change of the record.
        archivedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the version was archived. Absent while it is not archived.

    VersionId:
      type: string
      pattern: ^(live|\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$
      description: "A resolved version: a semantic version, or `live` for a live (watched) package, which has no stored
        versions. `live` names content, not a record: it is never listed by `GET …/versions`, `GET …/versions/live`
        answers 404, and `PATCH`, `DELETE`, `:load` and `:unload` on it answer 409 `PACKAGE_IS_LIVE`."

    VersionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
      readOnly: true

    VersionLoadFailedDetails:
      type: object
      description: "`details` of a `VERSION_LOAD_FAILED`: why the version named could not load, so nothing answered. The
        request is not at fault: the stored version no longer compiles (against a drifted warehouse schema, say) or
        cannot be read. Fix the cause and publish a version, or `:reload` it once the warehouse is fixed; retrying the
        same request fails the same way."
      required:
        - problems
      properties:
        problems:
          type: array
          description: The problems the load found, each located by `modelPath` and `range` where it has a place; a failure that
            is not a compile's (the stored content cannot be read) is one `error` problem with no location.
          items:
            $ref: "#/components/schemas/Problem"
      readOnly: true

    VersionRef:
      type: string
      pattern: ^(latest|live|\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$
      description: "A version in a path: the version's id (a semantic version, build metadata included, so `1.4.0+edit.3`
        names a server-made version), the reserved word `latest` for the package's latest version, or the reserved word
        `live`, the one pseudo-version of a live (watched) package, which `latest` resolves to there. A request that
        names `latest` on a package with none answers 404 `VERSION_NOT_FOUND`."

    VersionStatus:
      type: object
      description: "This server's serving state for one version right now. The same schema in two reads: per version under
        `GET /status`, and for one version at `GET …/versions/{versionId}/status`, where its status-only fields are also
        present. Reading it never loads the version."
      required:
        - resource
        - versionId
        - status
      properties:
        resource:
          $ref: "#/components/schemas/ResourcePath"
          description: The path of this version's own status read, `…/versions/{versionId}/status`.
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
        status:
          type: string
          enum:
            - loading
            - serving
            - unloaded
            - failed
          description: "The version's one serving state on this server, which is also what a content read will cost. `serving`: a
            compiled copy answers queries here now, even while a recompile runs. `loading`: the first load is in
            progress and nothing answers yet. `unloaded`: this server knows the version but has not loaded it, or
            unloaded it (`:unload`); the next content read or `:load` loads it. `failed`: the last load failed and
            nothing answers; `error` says why, and `/status` names it under `loadErrors`. A content read or `:load` of a
            `failed` version tries the load again, so a fixed dependency recovers with no other step, and answers 424
            `VERSION_LOAD_FAILED` when it fails again. Memory state is not on the version's record: `Version` carries
            none of it."
        loadingStartedAt:
          type: string
          format: date-time
          description: When the load or recompile in progress began. Absent when none is.
          readOnly: true
        lastReadAt:
          type: string
          format: date-time
          description: When a request last read this version here.
          readOnly: true
        inFlightQueryCount:
          type: integer
          description: Queries running against this version right now.
        compiledFrom:
          type: string
          enum:
            - compile
            - cache
          description: Whether the served models came from a fresh compile or from the compiled-model store.
        compiledAt:
          type: string
          format: date-time
          description: When the served models were compiled.
          readOnly: true
        schemaAsOf:
          type: string
          format: date-time
          description: When the warehouse schema the served models carry was read. Equals `compiledAt` unless the compile was a
            refresh.
          readOnly: true
        compiledModelBytes:
          type: integer
          format: int64
          description: Serialized size of the compiled-model entry, the cheapest honest memory proxy.
        manifestBinding:
          $ref: "#/components/schemas/ManifestBinding"
          readOnly: true
        stale:
          type: boolean
          description: True while the version serves a model older than its content because the newer content failed to compile;
            `status` stays `serving` and `error` says why. As `LoadError.stale` on `/status`.
        error:
          description: "Present when the last load or compile failed: with `status: failed`, why nothing answers; with `stale`,
            why the newer content did not compile while the last good compile keeps serving. Absent otherwise.
            `failedAt` is when it failed."
          allOf:
            - $ref: "#/components/schemas/EmbeddedError"
            - type: object
              required:
                - failedAt
              properties:
                failedAt:
                  type: string
                  format: date-time
                  readOnly: true
                  description: When the load or compile failed.
        loadId:
          type: string
          description: "On a version's own status read (`GET …/versions/{versionId}/status`) and in the answers of `:load` and
            `:reload`; left out of `GET /status`. An opaque identifier minted per load, which moves on every load and
            reload whether or not content changed. Not a `revision`: never send it as `If-Match`."
        contentHash:
          type: string
          description: On a version's own status read (`GET …/versions/{versionId}/status`) and in the answers of `:load` and
            `:reload`; left out of `GET /status`. SHA-256 (hex) over the model, skill and agent files being served; for
            a live package, whose version is always `live`, the receipt that an edit is served.
        bindings:
          type: array
          description: On a version's own status read (`GET …/versions/{versionId}/status`) and in the answers of `:load` and
            `:reload`; left out of `GET /status`. What this version serves per source.
          items:
            $ref: "#/components/schemas/Binding"
        warnings:
          type: array
          description: On a version's own status read and in the answers of `:load` and `:reload`, while a compiled copy is
            served; left out of `GET /status`. Non-fatal findings from the compile being served, as the version's
            `publisher.json`, models and reports produced it. Every load and reload computes them again, which is why
            they are here and not on the version's record.
          items:
            $ref: "#/components/schemas/Problem"
      readOnly: true

    View:
      type: object
      description: Named model view definition
      properties:
        name:
          type: string
          description: Name of the view
        annotations:
          type: array
          description: Annotations attached to the view
          items:
            type: string
      required:
        - name
      readOnly: true

    WarehouseHandleStatus:
      type: object
      description: "A connection or a destination as `/status` lists it: what an orchestrator compares with what it last
        pushed, and never its configuration. Read the configuration at `GET …/environments/{environmentName}`."
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          description: "The dialect: a `Connection.type`, or a `Destination.type`."
          enum:
            - postgres
            - bigquery
            - snowflake
            - trino
            - databricks
            - mysql
            - sqlserver
            - duckdb
            - motherduck
            - ducklake
            - publisher
        fingerprint:
          type: string
          description: The `Connection.fingerprint` the caller set. Connections only, and absent unless one was set; always absent
            for a destination, which has none.
        configStamp:
          type: string
          description: The `configStamp` last pushed with the configuration, exactly as sent. Absent when the last write sent none.
      readOnly: true

    WithheldFields:
      type: array
      readOnly: true
      items:
        type: string
      description: "Dotted paths of the stored write-only fields this response does not return: its credentials, and settings
        that can carry them (a connection's `setupSql`)."
