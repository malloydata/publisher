          $ref: "#/components/responses/Forbidden"
          description: "Refused by policy. `reason`: `READ_ONLY`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`, `VERSION_NOT_FOUND`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `CONTENT_CHANGED`, `FILE_EXISTS`,
            `FILE_NOT_WRITABLE`, `VERSION_NOT_LATEST`, `IDEMPOTENCY_KEY_REUSED`."
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: "The request body, or on a query or SQL operation the result, exceeds a size limit. Each operation names
            its reasons: `PAYLOAD_TOO_LARGE` is the request body (send less); `RESULT_TOO_LARGE` is the result (narrow
            the query or lower `rowLimit`; `details.capType` says which cap). `reason`: `PAYLOAD_TOO_LARGE`."
        "424":
          $ref: "#/components/responses/DependencyFailed"
          description: "Something the operation depends on failed, so nothing changed. Fix the dependency; retrying fails the same
            way. `reason`: `CONNECTION_AUTH_FAILED`, `CONNECTION_NOT_FOUND`, `VERSION_LOAD_FAILED`."
