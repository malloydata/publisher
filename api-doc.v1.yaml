# Malloy Publisher API v1. Drafted from the decisions in https://github.com/malloydata/publisher/issues/1562.

openapi: 3.1.0
info:
  title: Malloy Publisher API
  version: 1.0.0-draft
  description: >
    Publisher serves Malloy packages over one REST API. This is version 1 of that API, at `/api/v1`. The previous API,
    at

    `/api/v0`, is deprecated as a whole and takes bug fixes only; its retirement is announced in the release notes once
    every

    first-party client has moved. `GET /status` answers on both base paths: here in this shape, and on v0 in v0's shape
    with additive fields only.


    ## The model


    - An **environment** is a namespace for packages and connections.

    - A **connection** is a warehouse handle the models read. A **destination** is where materialization builds write;
    it is not a connection, models cannot name it, and it is set on the environment (`destinations`).

    - A **package** is a record with pointers: its source, its description, and `latestVersionId`. It holds no content.

    - A **version** is an immutable snapshot of a package's content. Every content read is of exactly one version, named
    in the path; `latest` is a reserved segment for the package's latest, and a live (watched) package has one
    pseudo-version, `live`, which names content and has no record. A publish and a report write each make a version;
    nothing edits one in place.

    - Under a version: **models** (compiled metadata, query, compile), **reports** (a `.malloy` file carrying an `##
    artifact` tag, grid or linear), **data apps**, **data files**, **agents**, **skills**, its **entities**,
    **classification**, **index**, **build plan**, **status** (with the **bindings** it serves per source), and its one
    own **connection**, the in-memory `duckdb` sandbox over its data files.

    - Under a package: **runs**, each an attempt to build a slot's persisted sources, with a **manifest** of one entry
    per source, each naming the table it landed in. A **slot** is what one run at a time may build: the package under
    `scope: package`, one version under `scope: version`.


    ## The grammar


    - Paths are kebab-case; parameters and fields are camelCase. `{xName}` is a named resource, `{versionId}` and
    `{runId}` are ids, and `{path}` is a file's version-relative path (relative to the version's root, `/`-separated;
    every path in a body is version-relative too, but a data app's `path`, relative to `public/`, and a skill file's,
    relative to its skill's directory). `{path}` spans segments: send its `/` literally, never as `%2F`, and a `:verb`
    follows its last segment. A path has no empty, `.` or `..` segment, no leading `/`, and no `\`, `:` or control
    character.

    - A `GET` changes no record. It may load the version, or start work a `profile=light` publish deferred, which only
    `VersionStatus` and the deferred part's own `status` show. `:reload` recompiles a version from its files against the
    warehouse's current schemas and makes no version: on a live package it is the edit loop, on any other version a
    schema refresh. Publishing a version, from the recorded source or a new one, is `POST …/versions`; loading and
    unloading a version on this server are `:load` and `:unload`, which change no record (memory state is
    `VersionStatus.status`, never a field of `Version`).

    - `/status`, a version's `status`, the versions list, the version record, `:unload` and `…/index` never load a
    version that is not loaded; every other content read loads it on demand, as each such operation's description says.
    A version that cannot load (its models no longer compile, or its stored content cannot be read) answers 424
    `VERSION_LOAD_FAILED` with `details.problems` on every operation that loads it, `:load` and a run included, and its
    `VersionStatus.status` reads `failed`; the next such operation tries the load again. `:reload` is the exception:
    compiling is what it is asked to do, so a compile that fails is its 400 `COMPILE_ERROR`, and the version keeps
    serving its last good compile with `VersionStatus.stale` and `error` set. `:load`, `:unload` and `:reload` each
    answer the version's `VersionStatus`, whose `warnings` are the load's non-fatal findings.

    - State changes are fields: `PATCH …/versions/{versionId}` with `archived`, `pinned` or `manifestLocation`; `PATCH
    …/packages/{packageName}` with `latestVersionId`; `PATCH …/runs/{runId}` with `status: "cancelled"`. What is not a
    field of a record is an action: `POST` with a `:verb` suffix on the resource it acts on (`:load`, `:unload`,
    `:reload`, `:query`, `:compile`, `:run-sql`), so an action can never collide with a child's name; an unsaved
    connection is tested with `?dryRun=true` on create or update.

    - `PATCH` is JSON merge-patch: present fields are set, `null` unsets, absent fields are untouched, lists replace. A
    merge-patch body, its nested objects included, is not checked against the schema's `required`, and its `null` clears
    an optional field although no schema spells `null`. An orchestrator pushes an environment's desired state as a
    `PATCH` whose `connections` list replaces the stored one. `PUT` is used only by the report write, which replaces a
    file. `POST` on a collection answers 201 with the resource and a `Location`; `DELETE` answers 204. A create or a
    write takes its own resource's writable fields; an action that takes input (`:query`, `:compile`, `:run-sql`) takes
    an `…Request` body, since it creates no resource, and `:reload`, `:load` and `:unload` take none.

    - Every mutable resource but a report carries a `revision`, returned as `ETag` on reads; every `PATCH` and `DELETE`
    accepts `If-Match` and answers 412 when the resource has moved on. A report is revisioned by its `contentHash`,
    which is the report write's precondition in place of `If-Match`: a stale one answers 409 `CONTENT_CHANGED`, since
    the precondition travels in the body, not a header.

    - What only the server sets is `readOnly` (`resource`, `revision`, timestamps, and every run field but `versionId`,
    `trigger`, `callerRunId`, `options`, `buildInstructions` and `status`), and a write that sends it back as read
    ignores it, so a client can `PATCH` a resource it just read. A field set on create is writable on create and never
    changes after (`x-immutable`): a `name`, a package's and a version's `source`, and a run's `versionId`, `trigger`,
    `callerRunId`, `options` and `buildInstructions`. A write that sends an `x-immutable` field with a different value
    answers 400 `INVALID_REQUEST` naming it; the same value is accepted, so a read can be sent back. A field with a
    `default` need not be sent on create. A run's `status` is the one field a client changes later. One field is both
    set by the server and sent back: a report's `contentHash`, the precondition of the report write. An object schema no
    request can carry is `readOnly` as a whole.

    - A write body is the resource itself, one schema for reading and writing it. `required` describes a read: what
    every read of the object carries. In a request, a `readOnly` field is ignored and never required (OpenAPI 3.0's
    rule, adopted here because 3.1 dropped it), a field with a `default` is never `required` and a request may leave it
    out, though every read carries it, and a write-only field is never in `required`: a field a create needs says
    "Required on create." in its description. A `PATCH` body is a JSON merge-patch of the resource: any subset of its
    writable fields, `null` clearing an optional one; no schema spells `null`, since a read never returns it. Generated
    clients get request and response types from the one schema (openapi-typescript's `--read-write-markers
    --default-non-nullable false`).

    - Every `POST` that creates or starts something (an environment, a connection, a package, a version, a run), and the
    report write, accepts an `Idempotency-Key` header: a retry with the same key and body within 24 hours answers with
    the first response and does nothing again, and the same key with a different body answers 409
    `IDEMPOTENCY_KEY_REUSED`.

    - A delete that would delete other resources with it (an environment's packages, connections and destinations, a
    package's versions) requires `?force=true`, and answers 409 `RESOURCE_NOT_EMPTY` without it.

    - Field names are camelCase. A reference is `xName` or `xPath`; a file's path is `path` and its text `content`,
    while Malloy text that is not a file (a compile check's or a query's) is `source` or `query`. A hash is `…Hash` of
    what it hashes (a file's `contentHash`); a count ends in `Count` and a size in `Bytes`; a boolean has no `is`
    prefix. One word, one meaning: `origin` is provenance (what made the object), `kind` is what it is (a persisted
    source's `persist` or `preaggregate`), `live` is only the pseudo-version (serving from the source warehouse is
    `warehouse`), a version other than `live` is a stored version, a source discovery shows is exposed, and `manifest`
    is a run's manifest, or an external file of the same entries that `manifestLocation` names; a report's structure is
    its `layout`. A connection's own settings keep their warehouse's words.

    - Every timestamp is an RFC 3339 `date-time` in UTC, read-only, and absent until it has a value, never `null`. An
    event's time ends in `At` (`createdAt`, `startedAt`, `failedAt`); the moment some data reflects ends in `AsOf`
    (`dataAsOf`, `schemaAsOf`). Every stored resource, one with a `revision`, carries `createdAt` and `updatedAt`.
    Durations are integers whose name carries the unit (`elapsedMs`, `windowSeconds`).

    - Every resource a `GET` reads carries `resource`, except `/status`, which is a snapshot of the server, list
    envelopes, and an object embedded in another that has no read of its own (an agent's own skill): its canonical path
    relative to the API's base: no leading slash, and the resolved version id in place of `latest`
    (`environments/acme/packages/sales/versions/1.4.0/models/orders.malloy`). A list item carries it when its item has a
    `GET` of its own, so a data app, whose page is served outside the API, carries none. Relative, so it stays right
    behind a gateway that serves the API under another prefix; a link and a stable key, never parsed.

    - A resource read two ways is `X` from its own `GET` and `XSummary` in its list, and its list is `XList`; nothing
    else is named `…Summary`.

    - Every read but `/status` answers with an `ETag` and takes `If-None-Match`, answering 304 with no body when nothing
    changed. `Cache-Control` is `no-store` on `/status` and, on every other read, `private, no-cache`, because a
    compiled model under a concrete version can still change with `:reload`, and a read through `latest` or `live` can
    resolve differently next time.

    - A data app's page and the files it loads are not API content. `DataApp.url` names them on Publisher's static
    route, `/environments/{environmentName}/packages/{packageName}/versions/{versionId}/public/{path}` at the server's
    root, outside the API base, which serves only a version's `public/` files, each with its own media type: `private,
    max-age=31536000, immutable` under a stored version id, whose files never change, and `private, no-cache` through
    `latest` or `live`. v0's `/environments/{environmentName}/packages/{packageName}/{path}` stays as the latest
    version's short form. Nothing outside `public/` is served, so no model or data file is reachable around the query
    controls.

    - Every operation but `/status` may answer 429 `RATE_LIMITED`; 429 and 503 carry `Retry-After` in seconds. `/status`
    is never rate-limited and never answers 503, because it is the orchestrator's heartbeat: it reports `initializing`
    and `draining` in its body.

    - The server takes the caller's `X-Request-Id`, else the trace id of a W3C `traceparent`, else makes one; every
    response carries it as `X-Request-Id`, and every error body repeats it as `requestId`.

    - Lowercase snake_case, except a `reason`, which is always a code from a closed list in UPPER_SNAKE (an error's, an
    index's, a refused source's; free text is a `message`), a warning's or problem's `code`, a stable kebab-case name of
    the check that made the finding (`render-tag`, `report-layout-unknown`; the set is open), a value that echoes a
    setting's own value (`versionPromotion: on-publish`), values that name a response field (`include:
    ["malloyResult"]`), and values that echo another vocabulary (a setting's value, Postgres's `sslmode`).

    - Every list is `{items, nextCursor}`, paged with `limit` and `after`, in a stable order its operation states: by
    name or path ascending, except versions and runs, newest first, and a connection's schemas and tables, in the
    warehouse's order. `/status` is the one unpaged snapshot.

    - Query results are typed: `rows` always, and Malloy's full result, with column types and render metadata, only on
    request. Nothing is a JSON string inside JSON.

    - Every error is `{status, reason, message, requestId, details?}`. Branch on `status` and `reason`, never on
    `message`; treat a reason you do not know as the status's generic case. Each operation's error responses list the
    reasons it answers, and `details` has one shape per reason a client acts on. An error inside a successful response
    is an `EmbeddedError` (`message`, and a `reason` from that use's own list); every diagnostic, a compile problem, a
    load warning or a render log message, is a `Problem`, located by `modelPath` and a 0-based `range`.

    - A dry run (`?dryRun=true`) runs every check and stores nothing, and answers 200 with no `Location`, ignoring
    `Idempotency-Key`: a connection's answers its test result, a publish's the `Version` it would make, with no
    `resource`, `revision` or timestamps, although `Version` requires them, and with no `ETag`.

    - Booleans are JSON `true`/`false` in bodies and `true`/`false` in query strings; anything else is 400
    `INVALID_REQUEST`.


    Publisher authenticates nobody. Put it behind the gateway that authenticates your users before exposing it beyond
    localhost; see `docs/security-posture.md`. No operation here answers `401`: a gateway may answer `401` or `403` on
    its own before a request reaches Publisher, in its own body shape. Each operation declares only the codes its shape
    can produce: `404` when it names a resource, `409` on writes and on `:reload`, `:load` and `:unload`, `412` when it
    takes `If-Match`, `413` when it takes a body or its result can exceed a cap (`RESULT_TOO_LARGE`), `403` on a
    resource write under `resources.readOnly` and on an `#(authorize)` gate, `410` when it uses an archived version's
    content (a content read, an action on it, the report write, a run, or `latestVersionId`'s target), never on that
    version's record, its status, its `PATCH`, `DELETE` or `:unload`, or the index, and `424`, `502` and `504` when it
    loads a version or reaches a warehouse (424 `VERSION_LOAD_FAILED` on every operation that loads one).
servers:
  - url: /api/v1
    description: This server
tags:
  - name: server
    description: This server's state.
  - name: environments
    description: Namespaces for packages and connections; the unit of tenancy.
  - name: connections
    description: Warehouse handles the models read. Schema browsing and ad-hoc SQL hang under a connection. Where builds
      write is an environment's `destinations`, which are not connections.
  - name: packages
    description: A package's record and pointers; its content is a version.
  - name: versions
    description: Immutable snapshots of a package's content and their lifecycle state. Every content read is under a
      version, `latest` included.
  - name: models
    description: "Model files: compiled metadata, queries and compile checks."
  - name: reports
    description: "Reports: a `.malloy` file with an `## artifact` tag, grid or linear."
  - name: data-apps
    description: The catalog of HTML data apps under a version's `public/`; the pages are served outside the API.
  - name: data-files
    description: Data files embedded in a version.
  - name: agents
    description: Agents a version declares in `publisher.json`, resolved to their definition.
  - name: skills
    description: Agent skills in force for a version.
  - name: discovery
    description: What a version declares for an indexer, its classification summary, and its discovery index.
  - name: materialization
    description: Runs that build persisted sources, their manifests, and the version's build plan.
paths:


  /status:
    get:
      operationId: get-status
      tags:
        - server
      summary: Read the server's state and every version it knows
      parameters:
        - name: environmentName
          in: query
          description: Narrow the snapshot to one environment.
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
        - $ref: "#/components/parameters/requestId"
      responses:
        "200":
          description: The snapshot in the v1 shape. `/api/v0/status` keeps the v0 shape, with additive fields only.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "500":
          $ref: "#/components/responses/Internal"


  /environments:
    get:
      operationId: list-environments
      tags:
        - environments
      summary: List environments
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/requestId"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: A page of environments, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: create-environment
      tags:
        - environments
      summary: Create an environment
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Environment"
      responses:
        "201":
          description: Created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Refused by policy. `reason`: `READ_ONLY`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `CONFLICT`, `IDEMPOTENCY_KEY_REUSED`."
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: "The request body, or on a query or SQL operation the result, exceeds a size limit. Each operation names
            its reasons: `PAYLOAD_TOO_LARGE` is the request body (send less); `RESULT_TOO_LARGE` is the result (narrow
            the query or lower `rowLimit`; `details.capType` says which cap). `reason`: `PAYLOAD_TOO_LARGE`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    get:
      operationId: get-environment
      tags:
        - environments
      summary: Read an environment
      responses:
        "200":
          description: The environment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
      parameters:
        - $ref: "#/components/parameters/requestId"
        - $ref: "#/components/parameters/ifNoneMatch"
    patch:
      operationId: update-environment
      tags:
        - environments
      summary: Update an environment's fields
      description: JSON merge-patch. `connections` and `destinations` are lists, so each replaces the stored list when
        present, which is how an orchestrator pushes its desired state; an entry with a name and no configuration keeps
        that stored connection or destination, so a push need not resend credentials the server withholds. Use the
        connection routes to change one connection. Any change to the environment's connections or destinations, by this
        route or the connection routes, advances its `revision`.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Updated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Refused by policy. `reason`: `READ_ONLY`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `CONFLICT`."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: "The request body, or on a query or SQL operation the result, exceeds a size limit. Each operation names
            its reasons: `PAYLOAD_TOO_LARGE` is the request body (send less); `RESULT_TOO_LARGE` is the result (narrow
            the query or lower `rowLimit`; `details.capType` says which cap). `reason`: `PAYLOAD_TOO_LARGE`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: delete-environment
      tags:
        - environments
      summary: Delete an environment and everything in it
      description: Deletes its packages, their versions and runs, its connections and its destinations. Requires `?force=true`
        when it has any of them, destinations included.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - $ref: "#/components/parameters/force"
        - $ref: "#/components/parameters/requestId"
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Refused by policy. `reason`: `READ_ONLY`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `RESOURCE_NOT_EMPTY`."
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    get:
      operationId: list-connections
      tags:
        - connections
      summary: List connections
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/requestId"
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: A page of connections, by name, credentials withheld.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: create-connection
      tags:
        - connections
      summary: Create a connection
      parameters:
