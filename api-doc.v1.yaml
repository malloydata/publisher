# Malloy Publisher API v1. Drafted from the decisions in https://github.com/malloydata/publisher/issues/1562.
# Leaf schemas marked below as carried over keep their v0 definitions.

openapi: 3.1.0
info:
  title: Malloy Publisher API
  version: 1.0.0-draft
  description: >
    Publisher serves Malloy packages over one REST API. This is version 1 of that API, at `/api/v1`. The previous API,
    at

    `/api/v0`, is deprecated as a whole and takes bug fixes only; its retirement is announced in the release notes once
    every

    first-party client has moved. `GET /status` answers on both base paths: here in this shape, and on v0 in v0's shape
    with additive fields only.


    ## The model


    - An **environment** is a namespace for packages and connections.

    - A **connection** is a warehouse handle with a `role`: a source the models read, a destination materialization
    builds write to, or both.

    - A **package** is a record with pointers: its source, its description, and `latestVersionId`. It holds no content.

    - A **version** is an immutable snapshot of a package's content. Every content read is of exactly one version, named
    in the path; `latest` is a reserved segment for the package's latest, and a live (watched) package has one
    pseudo-version, `live`. A publish, a report write and a reload that finds changed content each make a version;
    nothing edits one in place.

    - Under a version: **models** (compiled metadata, query, compile), **reports** (a `.malloy` file carrying an `##
    artifact` tag, grid or linear), **data apps**, **data files**, **agents**, **skills**, its **entities**,
    **classification**, **index**, **build plan**, **bindings**, and its one own **connection**, the in-memory `duckdb`
    sandbox over its data files.

    - Under a package: **runs**, each an attempt to build a slot's persisted sources, with a **manifest** of one entry
    per source; under a connection: the physical **tables** those entries landed in.


    ## The grammar


    - Paths are kebab-case; parameters and fields are camelCase. `{path}` is a file inside a version; `{name}` a named
    resource.

    - `GET` never changes state. Reload is `POST …/reload`, which answers with what it did.

    - State changes are fields: `PATCH …/versions/{versionId}` with `archived`, `loaded`, `pinned` or
    `manifestLocation`; `PATCH …/packages/{packageName}` with `latestVersionId`; `PATCH …/runs/{runId}` with `status:
    "cancelled"`. The one explicit action is `POST …/connections/{connectionName}/test`.

    - `PATCH` is JSON merge-patch: present fields are set, `null` unsets, absent fields are untouched, lists replace.
    `PUT` replaces the whole resource where that is wanted (environments, for an orchestrator's push). `POST` on a
    collection answers 201 with the resource and a `Location`; `DELETE` answers 204.

    - Every mutable resource carries a `revision`, returned as `ETag` on reads; every write accepts `If-Match` and
    answers 412 when the resource has moved on.

    - Every list is `{items, nextCursor}`, paged with `limit` and `after`. `/status` is the one unpaged snapshot.

    - Query results are typed: `rows` always, `schema` always, Malloy's full result only on request. Nothing is a JSON
    string inside JSON.

    - Every error is `{status, reason, message, details?}` with `reason` from one closed enum. Branch on `status` and
    `reason`, never on `message`.

    - Booleans are JSON `true`/`false` in bodies and `true`/`false` in query strings; anything else is 400
    `INVALID_REQUEST`.


    Publisher authenticates nobody. Put it behind the gateway that authenticates your users before exposing it beyond
    localhost; see `docs/security-posture.md`.
servers:
  - url: /api/v1
    description: This server
tags:
  - name: server
    description: This server's state.
  - name: environments
    description: Namespaces for packages and connections; the unit of tenancy.
  - name: connections
    description: "Warehouse handles with a role: a source models read, a destination builds write to, or both. Schema
      browsing and ad-hoc SQL hang under a connection."
  - name: tables
    description: Tables the server created or serves in a connection, with their life cycle.
  - name: packages
    description: A package's record and pointers; its content is a version.
  - name: versions
    description: Immutable snapshots of a package's content and their lifecycle state. Every content read is under a
      version, `latest` included.
  - name: models
    description: "Model files: compiled metadata, queries, compile checks, and the report write."
  - name: reports
    description: "Documents: a `.malloy` file with an `## artifact` tag, grid or linear."
  - name: data-apps
    description: HTML data apps under a version's `public/`.
  - name: data-files
    description: Data files embedded in a version.
  - name: agents
    description: Agents a version declares in `publisher.json`, resolved to their definition.
  - name: skills
    description: Agent skills in force for a version.
  - name: discovery
    description: What a version declares for an indexer, its classification summary, and its discovery index.
  - name: materialization
    description: Runs that build persisted sources, their manifests, and what each version serves per source.
paths:


  /status:
    get:
      operationId: get-status
      tags:
        - server
      summary: Server state and every version it holds
      parameters:
        - name: environment
          in: query
          description: Narrow the snapshot to one environment.
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
      responses:
        "200":
          description: The snapshot in the v1 shape. `/api/v0/status` keeps the v0 shape, with additive fields only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments:
    get:
      operationId: list-environments
      tags:
        - environments
      summary: List environments
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
      responses:
        "200":
          description: A page of environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: create-environment
      tags:
        - environments
      summary: Create an environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Environment"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    get:
      operationId: get-environment
      tags:
        - environments
      summary: Read an environment
      responses:
        "200":
          description: The environment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: replace-environment
      tags:
        - environments
      summary: Replace an environment
      description: Whole-object replacement, for an orchestrator that pushes its desired state. `connections` replaces the
        stored list; an entry with a name and no config keeps the stored connection. Creates the environment when it
        does not exist (201).
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Replaced.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: update-environment
      tags:
        - environments
      summary: Update an environment's fields
      description: JSON merge-patch. `connections` is a list and so replaces when present; use the connection routes for one
        connection.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: delete-environment
      tags:
        - environments
      summary: Delete an environment and everything in it
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/reload:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    post:
      operationId: reload-environment
      tags:
        - environments
      summary: Reload every package in the environment
      responses:
        "200":
          description: One result per package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadResult"
        "202":
          description: Accepted; the reload runs in the background.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    get:
      operationId: list-connections
      tags:
        - connections
      summary: List connections
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
        - name: role
          in: query
          schema:
            type: string
            enum:
              - source
              - destination
              - both
          description: Only connections with this role (a destination is `destination` or `both`).
      responses:
        "200":
          description: A page of connections, credentials withheld.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: create-connection
      tags:
        - connections
      summary: Create a connection
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
          description: Validate and test the configuration without storing it; answers 200 with the test result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connection"
      responses:
        "200":
          description: Dry run; nothing stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections/{connectionName}:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/connectionName"
    get:
      operationId: get-connection
      tags:
        - connections
      summary: Read a connection
      responses:
        "200":
          description: The connection, credentials withheld.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: update-connection
      tags:
        - connections
      summary: Update a connection's fields
      description: JSON merge-patch. A credential left out keeps its stored value; sent, it replaces; sent `null`, it is cleared.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
          description: Test the merged configuration without storing it; answers 200 with the test result.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Connection"
      responses:
        "200":
          description: Updated (or, with `dryRun`, the test result).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Connection"
                  - $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: delete-connection
      tags:
        - connections
      summary: Delete a connection
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections/{connectionName}/test:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/connectionName"
    post:
      operationId: test-connection
      tags:
        - connections
      summary: Test a stored connection
      description: The one explicit action in the API; a test is not a state. To test an unsaved configuration, create or
        update with `?dryRun=true`.
      responses:
        "200":
          description: The result, whether or not the connection reached its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections/{connectionName}/tables:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/connectionName"
    get:
      operationId: list-connection-tables
      tags:
        - tables
      summary: Tables the server created or serves in this connection
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
        - name: state
          in: query
          schema:
            type: string
            enum:
              - staging
              - serving
              - superseded
              - reclaimable
              - dropped
        - name: ownerPackageName
          in: query
          schema:
            $ref: "#/components/schemas/IdentifierPattern"
      responses:
        "200":
          description: A page of physical tables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalTableList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/connections/{connectionName}/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/connectionName"
      - $ref: "#/components/parameters/tableId"
    get:
      operationId: get-connection-table
      tags:
        - tables
      summary: One physical table
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalTable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/packages:
    parameters:
      - $ref: "#/components/parameters/environmentName"
    get:
      operationId: list-packages
      tags:
        - packages
      summary: List packages
      description: Reads the catalog only; loads nothing.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
      responses:
        "200":
          description: A page of packages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: publish-package
      tags:
        - packages
      summary: Publish a package version from its source
      description: Fetches `source.location`, publishes the version its `publisher.json` declares, and creates the package if
        it does not exist. The same content under an existing version id is a placement (200); different content is 409
        `VERSION_CONFLICT`. With `dryRun`, every publish check runs and nothing is stored.
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Package"
      responses:
        "200":
          description: Placed (identical content already published), or a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "201":
          description: Published.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "424":
          $ref: "#/components/responses/ConnectionUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"


  /environments/{environmentName}/packages/{packageName}:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/packageName"
    get:
      operationId: get-package
      tags:
        - packages
      summary: Read a package's record
      responses:
        "200":
          description: The package.
          headers:
            ETag:
