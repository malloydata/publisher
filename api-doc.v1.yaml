          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: publish-version
      tags:
        - versions
      summary: Publish a new version of the package
      description: "Fetches a source and publishes the version its `publisher.json` declares, or `<parent>+republish.N`
        (`origin: republish`) when that version already exists with other content, whichever source it came from,
        re-applying the overlay of report writes. With no body it fetches the package's recorded `source` again, which
        is how a package published from a git branch or an object-store prefix picks up a change; when the fetched tree
        matches the current version (by git commit sha, object etag or md5, or the tree's hash) nothing is made and it
        answers 200 with that version. Whether `latestVersionId` moves to it is `ServerStatus.versionPromotion`. The
        body is a `Version`, `Version`'s writable fields: `source` to publish from a new location, which moves the
        package's recorded `source` to it (the one way to move it), `manifestLocation` to bind on publish, and `pinned`;
        a body with `archived: true` answers 400 `INVALID_REQUEST`, since a new version cannot be archived. A publish
        that moves the package's `source` or `latestVersionId` advances the package's `revision`. A live package answers
        409 `PACKAGE_IS_LIVE` (use `:reload`). A declared version that differs from a stored one only by letter case or
        leading zeros answers 409 `VERSION_CONFLICT`; a `publisher.json` with no `version` answers 400
        `PACKAGE_VERSION_MISSING`, and one that is not a semantic version 400 `PACKAGE_VERSION_INVALID`. With `dryRun`,
        every publish check runs and nothing is stored; the answer is always 200, with no `Location` and no `ETag`: the
        `Version` the publish would make, with no `resource`, `revision` or timestamps since nothing is stored, or the
        current `Version` when it would make nothing. The load's warnings are on the version's status (`GET
        …/versions/{versionId}/status`), not its record."
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/dryRun"
        - name: profile
          in: query
          schema:
            type: string
            enum:
              - full
              - light
            default: full
          description: "`light` compiles and runs the authorize validation, so a broken model still answers 4xx, and defers what a
            draft checkpoint does not need to serve: the build plan and preaggregation companions, render-tag prepares,
            report lint, the discovery-index build, and the per-file row counts of `data-files`. Each deferred part is
            derived on its first read. For a package whose every edit publishes a version."
        - $ref: "#/components/parameters/requestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: "Nothing new (the fetched content is the current version's): that `Version`, with its `ETag`. Every dry run
            also answers 200: the `Version` the publish would make, without `resource`, `revision` or timestamps, or the
            current `Version` when it would make nothing; a dry run's 200 has no `ETag`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
        "201":
          description: Published.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`,
            `COMPILE_ERROR`, `PACKAGE_VERSION_MISSING`, `PACKAGE_VERSION_INVALID`."
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Refused by policy. `reason`: `READ_ONLY`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `PACKAGE_IS_LIVE`, `VERSION_CONFLICT`,
            `IDEMPOTENCY_KEY_REUSED`."
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: "The request body, or on a query or SQL operation the result, exceeds a size limit. Each operation names
            its reasons: `PAYLOAD_TOO_LARGE` is the request body (send less); `RESULT_TOO_LARGE` is the result (narrow
            the query or lower `rowLimit`; `details.capType` says which cap). `reason`: `PAYLOAD_TOO_LARGE`."
        "424":
          $ref: "#/components/responses/DependencyFailed"
          description: "Something the operation depends on failed, so nothing changed. Fix the dependency; retrying fails the same
            way. `reason`: `CONNECTION_AUTH_FAILED`, `CONNECTION_NOT_FOUND`, `MANIFEST_UNAVAILABLE`."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/DatabaseUnreachable"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"


  /environments/{environmentName}/packages/{packageName}/versions/{versionId}:reload:
    parameters:
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/packageName"
      - $ref: "#/components/parameters/versionId"
    post:
      operationId: reload-version
      tags:
        - versions
      summary: Recompile a version from its files against the warehouse's current schemas, and wait
      description: "Recompiles the version now, with the schema cache bypassed, replaces its compiled-model store entry, and
        answers when it is done, with the compile errors if it failed (the version then keeps serving its last good
        compile, and its status says `stale`). It answers the version's status, as `:load` and `:unload` do: for a live
        package, the receipt that the edit is served (`contentHash`, `loadId`), with the load's `warnings`. It changes
        no record, so it sends no `ETag`; a `PATCH` after it sends the `ETag` of `GET …/versions/{versionId}`. A compile
        that fails answers 400 `COMPILE_ERROR`, not 424, because compiling is what a reload is asked to do. On a live
        package (`live`, which `latest` resolves to) it first re-reads the author's files, settling any recompile the
        watcher already started: the handshake an edit loop needs, since watch mode recompiles in the background and
        skips a save that does not compile without saying so. On a stored version the files cannot change, so a reload
        is a schema refresh. No version is made. Loads the version if it is not loaded. 409 `VERSION_BUILDING` while a
        run is building it. To pick up a changed source, publish a version (`POST …/versions`)."
      responses:
        "200":
          description: Recompiled; the version's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionStatus"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The request is malformed, or the Malloy or SQL in it was refused. `reason`: `INVALID_REQUEST`,
            `COMPILE_ERROR`."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Something the request names does not exist. `reason`: `NOT_FOUND`, `VERSION_NOT_FOUND`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The request conflicts with the state of what it names. `reason`: `VERSION_BUILDING`."
        "410":
