          description: Larger parts to include. `content` includes the report file's text, which the report write takes.
        - $ref: "#/components/parameters/requestId"
        - $ref: "#/components/parameters/ifNoneMatch"
      description: A report that does not compile answers 200 with `error` set, and `tiles`, `givens` and `preamble` empty, so
        a viewer can show why. Loads the version when it is not loaded (a hydrate when the compiled-model store has an
        entry).
      responses:
        "200":
          description: The report, with what a viewer needs to draw it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
