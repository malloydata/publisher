          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: update-version
      tags:
        - versions
      summary: Change a version's lifecycle state
      description: "JSON merge-patch over `archived`, `loaded`, `pinned` and `manifestLocation`, each independent. `archived:
        true` is refused with 409 on a live package's `live` (`PACKAGE_IS_LIVE`), and while the version is `latest`
        (`VERSION_IS_LATEST`), the last active version (`VERSION_IS_LAST_ACTIVE`) or building (`VERSION_BUILDING`).
        `loaded: false` drains and unloads; 409 while a run holds the version. `manifestLocation` binds an external
        manifest (`null` clears it and the version serves live); a bind failure leaves the previous binding and answers
        424."
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: Updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "424":
          $ref: "#/components/responses/ConnectionUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: delete-version
      tags:
        - versions
      summary: Delete a version for good
      description: Refused with 409 on a live package's `live` (`PACKAGE_IS_LIVE`), and while it is `latest` and other
        versions remain, or the last active version while archived ones remain. Deleting the only version deletes the
        package.
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
