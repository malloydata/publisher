components:
  parameters:
    environmentName:
      name: environmentName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
    packageName:
      name: packageName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VersionRef"
      description: A version id, or `latest`. Every content read is of exactly one version; the response carries the id
        `latest` resolved to.
    connectionName:
      name: connectionName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
    schemaName:
      name: schemaName
      in: path
      required: true
      schema:
        type: string
    tableName:
      name: tableName
      in: path
      required: true
      schema:
        type: string
    tableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierPattern"
      description: A named resource's name.
    path:
      name: path
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PathPattern"
      description: A file's path inside the version, `/`-separated, as the listing returned it.
    includeHidden:
      name: includeHidden
      in: query
      schema:
        type: boolean
        default: false
      description: Also return files and sources the package's `index.malloy` does not expose.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Page size.
    after:
      name: after
      in: query
      schema:
        $ref: "#/components/schemas/Cursor"
      description: Continue after this cursor.
    ifMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: The resource's `ETag` as last read (`"<revision>"`). The write is refused with 412 when it no longer matches.
  headers:
    ETag:
      description: The resource's revision, quoted. Send it back as `If-Match` on a write.
      schema:
        type: string
    Location:
      description: The URL of the created resource.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed, or the Malloy text does not compile (`reason` `INVALID_REQUEST`, `COMPILE_ERROR`,
        `QUERY_REJECTED`, or a `VERSION_*`/`MANIFEST_*` validation reason).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The gateway in front of this server refused the caller (`UNAUTHORIZED`). Publisher itself authenticates nobody.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Refused by policy: `READ_ONLY` under `resources.readOnly`, or `FORBIDDEN` from an authorize gate."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (`NOT_FOUND`, `VERSION_NOT_FOUND`, `CONNECTION_NOT_FOUND`, `TABLE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The write conflicts with the resource's state (`CONFLICT`, `VERSION_CONFLICT`, `VERSION_IS_LATEST`,
        `VERSION_IS_LAST_ACTIVE`, `VERSION_BUILDING`, `FILE_EXISTS`, `RUN_ACTIVE`, `TABLE_OWNED_ELSEWHERE`,
        `INVALID_TRANSITION`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: "`If-Match` did not match the resource's revision (`REVISION_MISMATCH`; `details.currentRevision` carries
        it), or a required `If-Match` was missing (428 `REVISION_REQUIRED`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The version is archived (`VERSION_ARCHIVED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request or the response exceeds a size limit (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConnectionUnavailable:
      description: The connection is misconfigured, so nothing ran (`CONNECTION_AUTH_FAILED`, `CONNECTION_NOT_FOUND`). Fix the
        connection; retrying fails the same way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DatabaseUnreachable:
      description: The database could not be reached (`CONNECTION_FAILED`), so nothing ran. Retry once, then report it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: The database did not answer in time (`GATEWAY_TIMEOUT`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed (`INTERNAL`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The server is initializing, draining, or refusing load under memory back-pressure (`UNAVAILABLE`,
        `ADMISSION_REFUSED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Agent:
      type: object
      readOnly: true
      description: An agent a package declares, resolved to its instructions, skill files and schedules. Adopt it only when
        the user asks for it by name.
      properties:
        name:
          type: string
        description:
          type: string
        model:
          type: string
          description: The model the agent asks for; `inherit` when the manifest sets none.
        instructions:
          type: string
          description: The instructions file's Markdown, at most 16 KB.
        skills:
          type: array
          description: The agent's own skill files, sorted by `relative_filepath`.
          items:
            $ref: "#/components/schemas/AgentSkillFile"
        asset_roots:
          type: object
          description: For each skill that ships assets, the package-relative directory holding it. Absent when no skill does. Not
            in the `skills=summary` view.
          additionalProperties:
            type: string
        assets:
          type: array
          description: Every asset the agent's skills ship, listed without contents and sorted by `relative_filepath`. Absent when
            there are none and in the `skills=summary` view.
          items:
            $ref: "#/components/schemas/AgentAsset"
        asset_counts:
          type: object
          description: "Only in the `skills=summary` view, and only when there are assets: how many assets each skill ships."
          additionalProperties:
            type: integer
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/AgentSchedule"
        budget:
          $ref: "#/components/schemas/AgentBudget"
        warnings:
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/AgentSource"
    AgentAsset:
      type: object
      readOnly: true
      description: A text file a skill ships under `<skill>/assets/` for an agent to copy into an app it builds and not read.
        Listed without its contents; fetch one with `GET .../agents/{agentName}/skills/{relative_filepath}`.
      properties:
        relative_filepath:
          type: string
          description: "`<skill>/assets/...`, relative to the agent's skill roots."
        bytes:
          type: integer
          description: Size in UTF-8 bytes, under 1 MiB.
        sha256:
          type: string
          description: SHA-256 of the file's bytes.
    AgentBudget:
      type: object
      readOnly: true
      description: "The run limits an agent declares. Validated and exposed only: the server never enforces them. A platform
        that runs the agent decides how to apply them and may clamp each to its own maximum. Every field is optional and
        only the fields the manifest sets are present; an unset field keeps the platform's default. Absent when the
        manifest sets none."
      properties:
        turns:
          type: integer
          minimum: 1
        wall_clock_minutes:
          type: integer
          minimum: 1
        llm_tokens:
          type: integer
          minimum: 1
        job_minutes:
          type: integer
          minimum: 1
    AgentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    AgentSchedule:
      type: object
      readOnly: true
      description: "A cron schedule an agent declares. Validated and exposed only: the server never runs it."
      properties:
        cron:
          type: string
          description: A 5-field UNIX cron expression, evaluated in UTC.
        task:
          type: string
          description: Package-relative path of the task file, as written in the manifest.
        taskContent:
          type: string
          description: The task file's Markdown. Only on the resolved agent, not the listing.
    AgentSkillFile:
      type: object
      readOnly: true
      description: One of an agent's skill files. The snake_case keys (`relative_filepath`, `file_contents`) mirror the MCP
        `get_agent` tool the shape is shared with, unlike the camelCase used elsewhere in this API.
      properties:
        relative_filepath:
          type: string
          description: Path relative to the agent's skills directory, for example `analyst-conventions/SKILL.md` or
            `analyst-conventions/reference/glossary.md`.
        file_contents:
          type: string
          description: A `SKILL.md` is re-emitted with only a quoted `name` and `description` in its frontmatter; reference files
            are served raw. Absent when the agent was fetched with `skills=summary`.
        name:
          type: string
          description: A `SKILL.md`'s name. Only in the `skills=summary` view.
        description:
          type: string
          description: A `SKILL.md`'s description. Only in the `skills=summary` view.
        bytes:
          type: integer
          description: Size of `file_contents` in UTF-8 bytes. Only in the `skills=summary` view.
    AgentSkillRead:
      type: object
      readOnly: true
      description: One agent skill file or asset, with the pin of the definition it belongs to.
      properties:
        relative_filepath:
          type: string
        file_contents:
          type: string
        source:
          $ref: "#/components/schemas/AgentSource"
    AgentSource:
      type: object
      readOnly: true
      description: What a resolved agent was read from, so a runner can prove which bytes ran.
      properties:
        versionId:
          $ref: "#/components/schemas/VersionIdPattern"
          description: The version the definition was read from. After `latest` moves, the same definition is at
            `…/versions/{versionId}/agents/{name}`.
        sourceContentSha:
          type: string
          description: The package's `sourceContentSha` at the load this definition came from.
        definitionSha:
          type: string
          description: SHA-256 over this agent's canonical config, instructions, skill files and task files. Editing another
            agent, or a model, does not move it.
        servedRevision:
          type: string
          description: The package's `servedRevision` at the load this definition came from.
        environmentName:
          type: string
        packageName:
          type: string
    AgentSummary:
      type: object
      readOnly: true
      description: One agent a package declares, without its instructions or skills.
      properties:
        name:
          type: string
          description: The agent's name (its key in the manifest's `agents` object).
        description:
          type: string
        model:
          type: string
          description: The model the agent asks for; `inherit` when the manifest sets none.
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/AgentSchedule"
        budget:
          $ref: "#/components/schemas/AgentBudget"
    AttachedDatabase:
      type: object
      description: Attached DuckDB database
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          example: test_connection, _connection, test_connection_1
        type:
          type: string
          description: Type of database connection
          enum:
            - bigquery
            - snowflake
            - postgres
            - gcs
            - s3
            - azure
        attributes:
          $ref: "#/components/schemas/ConnectionAttributes"
        bigqueryConnection:
          $ref: "#/components/schemas/BigqueryConnection"
        snowflakeConnection:
          $ref: "#/components/schemas/SnowflakeConnection"
        postgresConnection:
          $ref: "#/components/schemas/PostgresConnection"
        gcsConnection:
          $ref: "#/components/schemas/GCSConnection"
        s3Connection:
          $ref: "#/components/schemas/S3Connection"
        azureConnection:
          $ref: "#/components/schemas/AzureConnection"
    AzureConnection:
      type: object
      description: >
        Azure Data Lake Storage (ADLS Gen2) / Blob Storage connection configuration Supports https://, http://,
        abfss://, and az:// URL schemes.
      properties:
        authType:
          type: string
          enum:
            - service_principal
            - sas_token
          description: Authentication method for Azure Storage
        sasUrl:
          type: string
          description: >
            Full SAS URL including token; required for sas_token auth. Supports single file, directory glob (*.ext), or
            recursive (**) patterns. Example:
            https://account.blob.core.windows.net/container/path/*.parquet?sp=rl&st=...
        tenantId:
          type: string
          description: Azure AD tenant ID (required for service_principal)
        clientId:
          type: string
          description: Azure AD application (client) ID (required for service_principal)
        clientSecret:
          type: string
          description: Azure AD client secret (required for service_principal)
        accountName:
          type: string
          description: Azure Storage account name (required for service_principal)
        fileUrl:
          type: string
          description: >
            Azure file URL to query; required for service_principal auth. Supports single file, directory glob (*.ext),
            or recursive (**) patterns. Example: https://account.blob.core.windows.net/container/path/**
      required:
        - authType
    BigqueryConnection:
      type: object
      description: Google BigQuery database connection configuration
      properties:
        defaultProjectId:
          type: string
          description: Default BigQuery project ID for queries
        billingProjectId:
          type: string
          description: BigQuery project ID for billing purposes
        location:
          type: string
          description: BigQuery dataset location/region
        serviceAccountKeyJson:
          type: string
          description: JSON string containing Google Cloud service account credentials
        impersonateServiceAccount:
          type: string
          description: Email of a Google Cloud service account this connection impersonates for every BigQuery call, via
            short-lived tokens from the IAM Service Account Credentials API. The publisher's own credential (ADC) must
            hold roles/iam.serviceAccountTokenCreator on the target service account, and iamcredentials.googleapis.com
            must be enabled in the calling project. Mutually exclusive with serviceAccountKeyJson; set billingProjectId
            explicitly, since project auto-detection resolves through the impersonated credential. Not supported on
            DuckDB attachedDatabases entries or federated builds from a BigQuery source through DuckDB, which require a
            service account key.
        maximumBytesBilled:
          type: string
          description: Maximum bytes to bill for query execution (prevents runaway costs)
        queryTimeoutMilliseconds:
          type: string
          description: Query timeout in milliseconds
        dbmeta:
          type: boolean
          default: false
          description: Copy table and column descriptions from BigQuery onto the schema as `#(dbmeta)` annotations.
    Binding:
      type: object
      description: What a version serves for one source right now.
      required:
        - sourceEntityId
        - origin
        - tableId
        - boundAt
      properties:
        sourceEntityId:
          type: string
        sourceName:
          type: string
        modelPath:
          type: string
        origin:
          type: string
          enum:
            - run
            - external
        runId:
          type: string
          description: The run whose manifest entry this binding points at. Absent for an external manifest.
        entryId:
          type: string
        tableId:
          type: string
        tier:
          type: string
          enum:
            - colocated
            - storage
        boundAt:
          type: string
          format: date-time
    BindingList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    BuildGraph:
      type: object
      required:
        - connectionName
        - nodes
      properties:
        connectionName:
          type: string
        nodes:
          type: array
          description: A single level holding every persist source of the graph, in build order. Each node's `dependsOn` names
            every source on every table it reads, so the edges are complete without walking anything.
          items:
            type: array
            items:
              $ref: "#/components/schemas/BuildNode"
    BuildInstruction:
      type: object
      required:
        - sourceEntityId
        - tableName
        - realization
      properties:
        sourceEntityId:
          type: string
        tableId:
          type: string
          description: The caller's own id for the table, echoed on the manifest entry's `callerTableId`.
        tableName:
          type: string
          description: Logical, fully-qualified, unquoted table name to create; the server quotes each segment for the dialect.
        connectionName:
          type: string
          description: The destination connection to build into. Absent means the source's own connection (colocated).
        realization:
          $ref: "#/components/schemas/Realization"
        reseed:
          type: boolean
          default: false
    BuildInstructions:
      type: object
      description: An orchestrated run's orders, derived from the version's build plan.
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BuildInstruction"
        referenceManifest:
          type: array
          description: Already-materialized upstreams the built sources may read but which this run does not rebuild.
          items:
            $ref: "#/components/schemas/ManifestReference"
        strictUpstreams:
          type: boolean
          default: false
        ledger:
          type: array
          description: The incremental boundaries for this run, supplied by a caller that owns the ledger. Present (even empty),
            it replaces the server's.
          items:
            $ref: "#/components/schemas/IncrementalBoundaryInput"
    BuildNode:
      type: object
      required:
        - sourceID
      properties:
        sourceID:
          type: string
          description: sourceName@modelURL
        dependsOn:
          type: array
          description: sourceIDs of the sources on the tables this source reads. Sources on one table (a source and its
            extensions) read none of each other. A source Malloy cannot plan, which is refused rather than built, lists
            none.
          items:
            type: string
    BuildPlan:
      type: object
      description: |
        The package's persist build plan, from Malloy's build targets: the order
        its persist sources build in, the tables each reads, and the minimal
        per-source detail a caller needs to assign identity/naming/realization.
        Policy and connection capability are intentionally omitted until they
        carry real data.
      required:
        - graphs
        - sources
      properties:
        graphs:
          type: array
          description: "Dependency-ordered build graphs. One per connection per model, not one per connection: a model contributes
            a graph for each connection its persist sources use, and a package's plan concatenates every model's, so the
            same source appears in the graph of every model that imports it."
          items:
            $ref: "#/components/schemas/BuildGraph"
        sources:
          type: object
          description: Map of sourceID ("sourceName@modelURL") to per-source plan.
          additionalProperties:
            $ref: "#/components/schemas/PersistSourcePlan"
        refusedSources:
          type: object
          description: "Map of sourceID (\"sourceName@modelURL\") to the sources the package declared `#@ persist` on but that are
            ineligible to build, so they carry no entry in `sources`. A SEPARATE collection rather than a field on
            `PersistSourcePlan`: constructing that plan entry requires the source's SQL and content address, and a
            free-parameter or given-referencing source cannot produce either, so a refused source needs a wire shape
            that requires neither. Lets a host distinguish \"this package declares no persist source\" (both maps empty)
            from \"every persist source was refused\" (empty `sources`, populated `refusedSources`) — silence otherwise
            reads as the former."
          additionalProperties:
            $ref: "#/components/schemas/RefusedSource"
    BuildPlanResult:
      type: object
      description: The version's persist build plan, as the last load derived it. A read, never a command.
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - ready
            - empty
            - unavailable
          description: "`ready`: `plan` is present. `empty`: the version declares no persist source. `unavailable`: the plan could
            not be derived at load; reload the package to derive it again."
        plan:
          $ref: "#/components/schemas/BuildPlan"
        message:
          type: string
    ClassificationSummary:
      type: object
      readOnly: true
      required:
        - sources
      description: "Server-computed, read-only, as `GET …/packages/{packageName}/classification` returns it: for each
        published entry point, the classes its `#(carries)` declares and how many of its fields carry each class
        (`#(classification)`, declared or inherited). Covers only the sources discovery shows, so it reveals nothing
        curation hides; a source locked to every caller is left out. A field's own classes, and what they were inherited
        from, are on its `get_context` card. `sources` is empty when no published field carries a class."
      properties:
        sources:
          type: array
          description: Sorted by model path, then name.
          items:
            $ref: "#/components/schemas/ClassificationSummarySource"
    ClassificationSummarySource:
      type: object
      readOnly: true
      required:
        - modelPath
        - name
        - fields
        - unclassified
        - classCounts
      properties:
        modelPath:
          type: string
        name:
          type: string
        carries:
          type: array
          description: The classes the source's `#(carries)` lists, sorted, inherited through `extend` like a gate. Absent when it
            declares none.
          items:
            type: string
        fields:
          type: integer
          description: The dimensions and measures a caller can reach from the source, through joins included.
        unclassified:
          type: integer
          description: How many of those carry no class.
        classCounts:
          type: object
          description: How many of those fields carry each class, keyed by class. A field under several classes counts under each.
          additionalProperties:
            type: integer
    Column:
      type: object
      description: Database column definition
      properties:
        name:
          type: string
          description: Name of the column
        type:
          type: string
          description: Data type of the column
    CompiledDocument:
      type: object
      description: The document a compiled text describes, in the shape it serves once saved. Present only when the text
        carries a model-level `## artifact` tag and compiled far enough to read.
      properties:
        layout:
          type: string
          enum:
            - grid
            - linear
        title:
          type: string
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/ReportTile"
        columns:
          type: integer
        startingGivens:
          $ref: "#/components/schemas/EncodedGivenValues"
        autorun:
          type: boolean
        givens:
          type: array
          items:
            $ref: "#/components/schemas/Given"
    CompiledModel:
      type: object
      description: "One model file compiled: its sources, named queries and givens. Larger parts are included on request with
        `?include=`."
      required:
        - path
        - malloyVersion
        - sources
        - queries
        - givens
      properties:
        resource:
          type: string
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        path:
          type: string
        malloyVersion:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        queries:
          type: array
          items:
            $ref: "#/components/schemas/Query"
        givens:
          type: array
          items:
            $ref: "#/components/schemas/Given"
        sourceText:
          type: string
          description: The file's Malloy text, verbatim. Included with `?include=sourceText`; omitted when the text names a source
            the file does not publish, unless `includeHidden` is set.
        modelInfo:
          type: object
          additionalProperties: true
          description: Malloy's own model structure, as an object. Included with `?include=modelInfo`. Its shape is the
            compiler's, not this API's.
        sourceInfos:
          type: array
          description: Malloy's own per-source structure, as objects. Included with `?include=sourceInfos`.
          items:
            type: object
            additionalProperties: true
    CompileProblem:
      type: object
      description: A compilation problem reported by the Malloy compiler
      properties:
        message:
          type: string
          description: Human-readable problem description
        severity:
          type: string
          description: Severity level of the problem
          enum:
            - error
            - warn
            - debug
        code:
          type: string
          description: Machine-readable error code
        model:
          type: string
          description: Package-relative path of the model file the problem points at, derived from `at.url`. Load-bearing at scope
            "package", where one array carries every file's problems; elsewhere it says when a diagnostic points at
            pre-existing content rather than the submitted source. Absent when the location is not a package file.
        at:
          type: object
          description: Source location of the problem
          properties:
            url:
              type: string
              description: URL of the source file
            range:
              type: object
              description: Character range within the source file
    CompileRequest:
      type: object
      description: Request body for compiling Malloy source code
      properties:
        source:
          type: string
          description: Malloy source code to compile; never executed. Required at scope "append" and "file"; optional at scope
            "package", where it acts as a what-if replacement for the model in the URL.
        scope:
          type: string
          enum:
            - append
            - file
            - package
          default: append
          description: >
            What the source means, and how far the check reaches. "append" (default) appends the source to the model in
            the URL and compiles it in that namespace — right for NEW definitions; an edit to an existing definition
            collides ("Cannot redefine"), and diagnostic positions land in the concatenated virtual file. "file"
            compiles the source AS that model, replacing its on-disk content for the check — validates an edit before
            saving, at true file coordinates. "package" runs the same worker compiler and file selection as reload over
            every .malloy file, without swapping the result into the served package; with a source, importers compile
            against the replacement. It also reports the render-tag findings (code "render-tag") and the dashboard,
            given and drill findings (code "dashboard-lint") a reload would put on the package's warnings, at their own
            severity and with no position. The package's other warnings (storage, persist, materialization, explores,
            surface and discovery warnings, among others) are not reported. Package diagnostics can name files hidden
            from discovery. No rows or SQL are returned, and caller-provided source remains subject to authorize gates.
            includeSql is not available at "package".

            "append" text is checked against the model's PUBLISHED surface, so it may not declare its own data roots:
            import, connection.table(…), connection.sql(…), given:, ##! compiler flags and the raw-SQL function forms
            (name!type(…), sql_number, sql_string and the rest of that family) are refused with a 400. Those belong in a
            model file, so validate text declaring them at "file" or "package", which are not restricted. "append" text
            must also stand alone as top-level Malloy: a bare view:, dimension: or measure:, and anything that only
            parses as a continuation of the model's last statement, is refused with a 400, because the check reads the
            submitted text by itself. Wrap a view body in a top-level query:, or a field in a throwaway source: check is
            <source> extend { … }. Compiling at "append" also requires the model named in the URL to load: a model that
            does not compile is a 400 carrying that model's own problems, and a model that does not exist is a 400 that
            deliberately says only that it could not be loaded. An invalid scope value is rejected with a 400 naming the
            valid set.

            "append" text that carries a model-level `## artifact` tag is a document, which other viewers run, and is
            also refused with a 400 for `# image`, `# link`, markup in a `# label`, `@env.` in an annotation, an
            annotation the tag parser rejects or that exceeds 8,192 characters, `except:` or `rename:` followed by a
            declaration of the same name in the same extend chain, and more than 1,000 annotations or 64 KB of them.
            Plain "append" text without that tag keeps those tags; a model file defines them itself, and its edit is
            checked at "file".
        includeSql:
          type: boolean
          default: false
          description: If true, returns the generated SQL alongside compilation results (only available at scope "append"/"file",
            when compilation succeeds and the source contains a runnable query).
        givens:
          $ref: "#/components/schemas/GivenValues"
        files:
          type: array
          description: "Package files read instead of, or beside, the package's own for this compile only, at scope \"file\" or
            \"package\" (a 400 at \"append\", which checks text against the package as published): an entry whose path
            names a package file replaces it, and one naming a new file adds it, so an import of it resolves. Nothing is
            written, cached or served to another request. At \"file\", an entry for the model in the URL may stand in
            for `source`; giving both is a 400. Overlay files are author content, read exactly as the package's own
            files: they are not restricted like ad-hoc text, and their `#(authorize)` and `#(access_filter)` annotations
            gate as written, so a host must offer `files` only to callers who may edit the package. An empty list is no
            overlay. Only `.malloy` files can be overlaid; data files and `publisher.json` are read from the package as
            published. A path that is absolute, has a \".\" or \"..\" segment or a backslash, names another kind of
            file, or appears twice is a 400; more than 500 files or 8 MiB of text is a 413."
          items:
            $ref: "#/components/schemas/OverlayFile"
    CompileResult:
      type: object
      description: Result of a Malloy source compilation check
      properties:
        status:
          type: string
          description: Overall compilation status — "error" if any problems have error severity
          enum:
            - success
            - error
        problems:
          type: array
          description: List of compilation problems (errors and warnings)
          items:
            $ref: "#/components/schemas/CompileProblem"
        sql:
          type: string
          description: Generated SQL for the compiled query. Only present when includeSql is true and compilation succeeds with a
            runnable query.
        document:
          $ref: "#/components/schemas/CompiledDocument"
    Connection:
      type: object
      description: "A warehouse handle: a source the models read, a destination materialized tables are written to, or both.
        Credential fields are write-only: accepted on create and update, never returned, and named in `withheldFields`
        so an editor can tell a set credential from an absent one. The dialect block matching `type` carries the
        configuration."
      required:
        - name
        - type
      properties:
        resource:
          type: string
          readOnly: true
        environmentName:
          type: string
          readOnly: true
        name:
          $ref: "#/components/schemas/IdentifierPattern"
        type:
          type: string
          enum:
            - postgres
            - bigquery
            - snowflake
            - trino
            - databricks
            - mysql
            - sqlserver
            - duckdb
            - motherduck
            - ducklake
            - publisher
        role:
          type: string
          enum:
            - source
            - destination
            - both
          default: source
          description: "`source`: models may read it. `destination`: materialization builds may write to it (a `#@ persist
            storage=` target) and it is never resolvable from a model. `both`: either."
        scope:
          type: string
          enum:
            - environment
            - version
          readOnly: true
          description: "`environment` for a connection of the environment. `version` for the one connection every loaded version
            has, its package-local DuckDB sandbox named `duckdb`, listed at `GET …/versions/{versionId}/connections` and
            read-only."
        withheldFields:
          type: array
          readOnly: true
          items:
            type: string
          description: Dotted paths of stored fields this response does not return (its credentials).
        managed:
          type: boolean
          default: false
          description: Serve this DuckLake connection as a catalog of its own tables, as an orchestrator that provisions catalogs
            does (search path set, statements metered, raw SQL limited to a single SELECT).
        fingerprint:
          type: string
          description: Opaque, stable fingerprint of the data the connection reaches, excluding credentials; part of every
            content-addressed build id. Derived locally when omitted.
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
        queryMetadataEnforced:
          $ref: "#/components/schemas/QueryMetadata"
        attributes:
          $ref: "#/components/schemas/ConnectionAttributes"
        proxy:
          $ref: "#/components/schemas/ConnectionProxy"
        postgresConnection:
          $ref: "#/components/schemas/PostgresConnection"
        bigqueryConnection:
          $ref: "#/components/schemas/BigqueryConnection"
        snowflakeConnection:
          $ref: "#/components/schemas/SnowflakeConnection"
        trinoConnection:
          $ref: "#/components/schemas/TrinoConnection"
        databricksConnection:
          $ref: "#/components/schemas/DatabricksConnection"
        mysqlConnection:
          $ref: "#/components/schemas/MysqlConnection"
        sqlserverConnection:
          $ref: "#/components/schemas/SqlserverConnection"
        duckdbConnection:
          $ref: "#/components/schemas/DuckdbConnection"
        motherduckConnection:
          $ref: "#/components/schemas/MotherDuckConnection"
        ducklakeConnection:
          $ref: "#/components/schemas/DucklakeConnection"
        publisherConnection:
          $ref: "#/components/schemas/PublisherConnection"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ConnectionAttributes:
      type: object
      description: Connection capabilities and configuration attributes
      properties:
        dialectName:
          type: string
          description: SQL dialect name for the connection
        isPool:
          type: boolean
          description: Whether the connection uses connection pooling
        canPersist:
          type: boolean
          description: Whether the connection supports persistent storage operations
        canStream:
          type: boolean
          description: Whether the connection supports streaming query results
    ConnectionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    ConnectionProxy:
      type: object
      description: Optional network proxy through which the connection is reached. Applies to any connection type whose
        database is not directly reachable (e.g. behind a bastion). The proxy is established below the driver, so the
        driver connects to a local endpoint transparently. Modeled as a discriminated union on `type` so additional
        proxy mechanisms can be added later. The trust control is host-key pinning (fail-closed); a proxy is authorized
        by whoever configures the connection, not by an env-flag gate.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ssh
          description: Proxy mechanism. Currently only SSH local port-forwarding.
        ssh:
          $ref: "#/components/schemas/SshProxyConfig"
    ConnectionTestResult:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: Why the test failed, redacted against the connection. Absent when `ok`.
        attributes:
          $ref: "#/components/schemas/ConnectionAttributes"
    Cursor:
      type: string
      description: Opaque position in a list. Send it back as `after` to continue; a list with no `nextCursor` is complete.
    DataApp:
      type: object
      required:
        - path
        - title
      properties:
        resource:
          type: string
          description: The page's URL under `…/versions/{versionId}/public/`.
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        path:
          type: string
          description: The HTML file's path under `public/`.
        title:
          type: string
        fit:
          type: string
          enum:
            - viewport
    DataAppList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataApp"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    DatabricksConnection:
      type: object
      description: Databricks SQL warehouse connection configuration
      properties:
        host:
          type: string
          description: Databricks workspace host (e.g. dbc-xxxxxxxx-xxxx.cloud.databricks.com)
        path:
          type: string
          description: SQL warehouse HTTP path (e.g. /sql/1.0/warehouses/<warehouse-id>)
        token:
          type: string
          description: Personal access token for authentication
        oauthClientId:
          type: string
          description: OAuth M2M client ID (service principal)
        oauthClientSecret:
          type: string
          description: OAuth M2M client secret (service principal)
        defaultCatalog:
          type: string
          description: Default Unity Catalog to use for queries
        defaultSchema:
          type: string
          description: Default schema to use for queries
        setupSQL:
          type: string
          description: SQL statements to run when the connection is established
    DataFile:
      type: object
      description: A data file embedded in the version (CSV, Parquet, JSON, Excel) that its models read through the version's
        DuckDB connection.
      required:
        - path
      properties:
        resource:
          type: string
        path:
          type: string
        format:
          type: string
          enum:
            - csv
            - parquet
            - json
            - ndjson
            - xlsx
        sizeBytes:
          type: integer
          format: int64
        info:
          $ref: "#/components/schemas/TableDescription"
        error:
          type: string
          description: When the file could not be read; `info` is then absent.
    DataFileList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataFile"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    DiscoveryIndex:
      type: object
      description: The state of the version's semantic discovery index, which `get_context` ranks against.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - lexical
            - indexing
            - ready
            - error
        progress:
          type: object
          properties:
            done:
              type: integer
            total:
              type: integer
        builtAt:
          type: string
          format: date-time
        error:
          type: string
    DuckdbConnection:
      type: object
      description: >
        DuckDB database connection configuration: attached foreign databases, and optional setup SQL for anything they
        do not cover (e.g. ATTACH commands for external lakehouses). Setup SQL must be enabled with
        PUBLISHER_ALLOW_DUCKDB_SETUP_SQL=true and is refused under EXTENSION_FETCH_POLICY=local-only. Database files,
        working directories, filesystem/network policy, extension loading, temp directories, and resource knobs remain
        owned by Publisher.
      properties:
        setupSQL:
          type: string
          description: >
            Optional initialization SQL script executed against the DuckDB session upon connection (e.g. ATTACH commands
            for external lakehouses). Multiple statements must be separated by a semicolon and newline (;\n). Use
            absolute paths: a relative path resolves against the server's working directory. Withheld from responses
            like a credential; an update that omits it keeps the stored script, and an empty string removes it. Refused
            unless the deployment sets PUBLISHER_ALLOW_DUCKDB_SETUP_SQL=true.
        attachedDatabases:
          type: array
          items:
            $ref: "#/components/schemas/AttachedDatabase"
    DucklakeConnection:
      type: object
      description: DuckLake lakehouse connection configuration
      properties:
        storage:
          type: object
          description: Data storage connection configuration (S3 or GCS)
          properties:
            bucketUrl:
              type: string
              description: "The catalog's data path, a URL of the storage location (e.g. s3://my-bucket/path or gs://my-bucket/path).
                Given, it is the path every attach uses, and the first read-write attach of a catalog that does not
                exist yet creates it there: the pre-existing behavior. Omitted, the catalog must already exist, every
                attach uses the data path the catalog recorded at its creation, and no attach ever creates a catalog:
                the shape for a catalog created elsewhere, through the admin API (admin-api-doc.yaml) or by another
                tool. Either way the storage secret is scoped to the data path, the given one or the recorded one: a
                read of any other object through this connection is unsigned, and on S3 the host's AWS_* environment
                never signs it either. A catalog with neither is not attached."
            s3Connection:
              $ref: "#/components/schemas/S3Connection"
              description: AWS S3 connection configuration for data storage
            gcsConnection:
              $ref: "#/components/schemas/GCSConnection"
              description: Google Cloud Storage connection configuration for data storage
        catalog:
          type: object
          description: Catalog metadata connection configuration
          properties:
            postgresConnection:
              $ref: "#/components/schemas/PostgresConnection"
              description: PostgreSQL connection for DuckLake metadata catalog
            metadataSchema:
              type: string
              description: >-
                Optional schema in the catalog database holding this DuckLake's metadata (`ducklake_*`) tables, passed
                to ATTACH as METADATA_SCHEMA. Absent means DuckLake's default — the catalog connection's default schema,
                typically `public` — which is the pre-existing behavior. Set it to run several independent DuckLake
                catalogs against ONE catalog database: each keeps its metadata in its own schema, so a catalog reads
                only the tables recorded in the schema it names. DuckLake creates the schema on a read-write attach if
                it does not exist; a read-only attach cannot, and fails until it does. Separating metadata does not
                separate data — give each catalog its own `storage.bucketUrl` prefix as well, since data-path-based
                maintenance (e.g. `ducklake_delete_orphaned_files`) treats a co-tenant catalog's files under a shared
                prefix as orphaned.

                This is an ORGANIZATIONAL boundary, not an access-control one. The separation is which schema a
                configuration names, so any config whose catalog role can reach a sibling schema could name it and read
                that catalog's metadata — and therefore its data-file paths. Where catalogs must be isolated from one
                another rather than merely kept tidy, grant each its own role with `USAGE` limited to its own schema; a
                database-per-catalog remains the strongest separation.

                Setting this on a catalog whose metadata already lives elsewhere does not move it: a read-write attach
                with a configured `storage.bucketUrl` CREATES a new empty catalog in the named schema (and materializes
                into it), while any other attach fails because there is nothing there yet. Must be a plain identifier
                (`[A-Za-z_][A-Za-z0-9_]*`) — the value reaches both a quoted string literal in the ATTACH and an
                identifier position in the catalog-format preflight, so it is validated at config load rather than
                escaped for two different contexts.
          required:
            - postgresConnection
        destinationSchema:
          type: string
          description: "Storage destinations only; ignored on a connection. The schema a destination builds its tables into and
            binds them from, so an orchestrator can keep the tables it owns apart from a catalog's `main` (where people
            put their own). Absent means `main`, the pre-existing layout. The schema must already exist in the catalog:
            a build does not create it. A `#@ persist name=` that already names a schema keeps that schema. Must be a
            plain identifier (`[A-Za-z_][A-Za-z0-9_]*`). Serving reads the schema configured now, not the one a table
            was built into, so changing it on a destination re-points every bound table at once: rebuild or rebind as
            you change it."
        readOnly:
          type: boolean
          default: true
          description: >
            Whether the serve-path attach is read-only. Absent or true keeps the pre-existing read-only attach, which
            every DuckLake connection a person registers should keep. False attaches the connection read-write, and then
            everything that runs on it runs read-write: every query, `.sql()` source, `sql_*` expression and the
            connection's SQL endpoints can create, drop and overwrite tables, write files with the storage credential
            (`COPY … TO`) and change the catalog's settings. Set it only where something else decides who may run SQL on
            the connection. A storage destination's build sessions attach read-write regardless; this field governs only
            the connection.
      required:
        - catalog
    EncodedGivenValues:
      type: object
      description: "Given values as a report declares them for its controls: a map of given name to its encoded value.
        `ReportManifest.startingGivens` and `CompiledDocument.startingGivens` carry this shape; URL parameters override
        it."
      additionalProperties:
        type: string
    EntitiesList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelEntities"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    EntityField:
      type: object
      readOnly: true
      description: One public field of a source. See `ModelEntities.fields`.
      required:
        - name
        - source
        - kind
        - code
        - annotations
        - table
      properties:
        name:
          type: string
          description: The field's name, or its join-qualified path (`people.name`) when it is reached through a join.
        source:
          type: string
          description: The runnable source to query the field from. For a join field it is the source declaring the join, dotted
            when that source is itself reached through a join.
        kind:
          type: string
          description: "One of `dimension`, `column`, `measure`, `view`, `join` or `hidden`. `column` is a dimension read straight
            from the table; `dimension` is one the model defines with `is`. `hidden` is a field the source hides with a
            `# hidden` tag. A later release may add a kind: skip a field whose kind you do not know."
        dataType:
          type: string
          description: The field's Malloy type, when it has one.
        code:
          type: string
          description: The Malloy text that declares the field.
        annotations:
          type: array
          items:
            type: string
          description: The field's annotations, trimmed, empty ones left out.
        doc:
          type: string
          description: The field's `#(doc)` text, when it has any.
        table:
          $ref: "#/components/schemas/EntityTable"
        join:
          $ref: "#/components/schemas/EntityJoin"
        indexFingerprint:
          $ref: "#/components/schemas/IndexFingerprint"
    EntityGate:
      type: object
      readOnly: true
      required:
        - expression
        - givenNames
      properties:
        expression:
          type: string
        givenNames:
          type: array
          items:
            type: string
          description: The `$NAME` givens the expression references.
        route:
          type: string
          description: "`authorize` or `access_filter`."
        terms:
          type: array
          description: On an `access_filter` gate, its `field <op> $GIVEN` terms, present only when the source's whole row filter
            reduces to such terms on queryable fields.
          items:
            $ref: "#/components/schemas/EntityGateTerm"
    EntityGateTerm:
      type: object
      readOnly: true
      required:
        - fieldPath
        - given
        - op
      properties:
        fieldPath:
          type: string
        given:
          type: string
        op:
          type: string
          description: "`=` or `in`."
    EntityJoin:
      type: object
      readOnly: true
      description: What a join field joins. Present only on a `join` field.
      required:
        - nested
      properties:
        sourceName:
          type: string
          description: The source the join reads, absent for a join read straight from a table.
        sourcePath:
          type: string
          description: Package-relative path of the file declaring that source.
        nested:
          type: boolean
          description: Whether the joined source exists only inside this join (an inline `extend` or a table read), so its fields
            are listed through it.
    EntitySourceAddress:
      type: object
      readOnly: true
      description: "The served source a non-queryable source stands for: a report's import of a served source, or a source it
        derives from one."
      required:
        - modelPath
        - sourceName
      properties:
        modelPath:
          type: string
        sourceName:
          type: string
    EntityTable:
      type: object
      readOnly: true
      description: The table behind the field's source, split from its table path. Every part is absent when the source is not
        read from a table.
      properties:
        connection:
          type: string
        catalog:
          type: string
        schema:
          type: string
        name:
          type: string
    Environment:
      type: object
      description: A namespace for packages and connections; the unit of tenancy.
      required:
        - name
      properties:
        resource:
          type: string
          readOnly: true
        name:
          $ref: "#/components/schemas/IdentifierPattern"
        description: "{ type: string }"
        readme:
          type: string
          description: Markdown shown on the environment's page.
        connections:
          type: array
          description: On a read, the environment's connections with credentials withheld. On `PUT`, the whole list, which
            replaces what is stored; a connection named with no config is kept as stored. On `PATCH`, absent means
            untouched.
          items:
            $ref: "#/components/schemas/Connection"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    EnvironmentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    EnvironmentStatus:
      type: object
      required:
        - name
        - packages
      properties:
        resource:
          type: string
        name:
          type: string
        connections:
          type: array
          description: The environment's connections as `GET …/connections` lists them, credentials withheld.
          items:
            $ref: "#/components/schemas/Connection"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageStatusEntry"
    Error:
      type: object
      description: "The one error body every operation answers with. Branch on `status` and `reason`, never on `message`: the
        message is for people, may change between releases, and is fixed text wherever the driver's own words could name
        a host or a user. `details` is typed per reason where a client acts on it."
      required:
        - status
        - reason
        - message
      properties:
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        reason:
          $ref: "#/components/schemas/ErrorReason"
        message:
          type: string
          description: What went wrong, for a person.
        details:
          type: object
          description: "Typed per reason. `COMPILE_ERROR`: `problems` (CompileProblem[]) located in the submitted text.
            `REVISION_MISMATCH`: `currentRevision`. `INVALID_TRANSITION`: `currentStatus`. `TABLE_OWNED_ELSEWHERE`:
            `ownerPackageName`, `ownerSlot`. `INVALID_REQUEST`: `field`, the request field that failed validation.
            Absent for the rest."
          additionalProperties: true
    ErrorReason:
      type: string
      description: The closed set of machine-readable reasons. Each operation lists the reasons it can answer. A client
        written against this spec may treat the enum as closed; a new reason is a new minor release of the spec and is
        announced as such.
      enum:
        - INVALID_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - READ_ONLY
        - NOT_FOUND
        - CONFLICT
        - REVISION_MISMATCH
        - REVISION_REQUIRED
        - INVALID_TRANSITION
        - COMPILE_ERROR
        - QUERY_REJECTED
        - PAYLOAD_TOO_LARGE
        - INTERNAL
        - UNAVAILABLE
        - ADMISSION_REFUSED
        - CONNECTION_FAILED
        - CONNECTION_AUTH_FAILED
        - CONNECTION_NOT_FOUND
        - TABLE_NOT_FOUND
        - GATEWAY_TIMEOUT
        - MANIFEST_VERSION_MISSING
        - MANIFEST_VERSION_INVALID
        - VERSION_ID_INVALID
        - VERSION_NOT_FOUND
        - VERSION_CONFLICT
        - VERSION_ARCHIVED
        - VERSION_IS_LATEST
        - VERSION_IS_LAST_ACTIVE
        - VERSION_BUILDING
        - VERSION_NOT_LATEST
        - PACKAGE_IS_LIVE
        - FILE_EXISTS
        - FILE_NOT_WRITABLE
        - RUN_ACTIVE
        - TABLE_OWNED_ELSEWHERE
    Freshness:
      type: object
      description: Freshness policy declared in publisher.json's `materialization.freshness` block. Fields are surfaced
        verbatim; invalid values are dropped (reported as absent), never defaulted.
      properties:
        window:
          type: string
          description: Maximum acceptable staleness of the package's materialized sources, as a duration string (e.g. "24h"). The
            control plane schedules refreshes to meet it.
        fallback:
          type: string
          enum:
            - live
            - stale_ok
            - fail
          description: "Declared query-time behavior when the freshness window is missed: serve live, serve the stale table, or
            fail the query."
    GCSConnection:
      type: object
      description: Google Cloud Storage connection configuration for DuckDB
      properties:
        keyId:
          type: string
          description: GCS HMAC access key ID
        secret:
          type: string
          description: GCS HMAC secret key
      required:
        - keyId
        - secret
    Given:
      type: object
      description: |
        A given (runtime parameter) declared on a Malloy model via the
        `given:` keyword. Surfaced on `CompiledModel.givens` and `Source.givens`
        so callers can introspect what runtime values a model accepts.

        `givens` always names a collection of these declarations. Values keyed
        by given name are `GivenValues` (or `EncodedGivenValues` in the form
        that survives a URL), and a bare list of names is spelled `givenNames`.

        It also carries how the given should be presented as an input control
        (`label`, `description`, `control`, `rangeMin`, `rangeMax`, `suggest`),
        derived from the declaration's own tags. That contract belongs to the
        given rather than to any one surface, which is what lets a notebook and
        an SDK host render the same control without restating it. Each of those
        six is present only when the declaration carries the tag it reads, so a
        given tagged with none of them carries none of them. A tag whose value is
        not one this contract accepts is dropped the same way rather than
        reported, so an unrecognized `control`, or a `rangeMin`/`rangeMax` that is
        not a number, is absent here and indistinguishable from never having been
        written.
      properties:
        name:
          type: string
          description: Name as declared in the model
        type:
          type: string
          description: Rendered Malloy type for the given (e.g. string, number, boolean, date, timestamp, filter<string>)
        annotations:
          type: array
          description: Annotations attached to the given declaration
          items:
            type: string
        secure:
          type: boolean
          description: "True when the declaration carries `#(secure)`: its value is the host's to set. The builder withholds its
            control only when it edits a document held as text; a saved dashboard or notebook renders it as before.
            Absent otherwise."
        required:
          type: boolean
          description: True when the given declares no default, so a query that reads it fails until a value is supplied ("Given
            'X' has no value and no default"). A report's reader asks for it before running the tiles that read it,
            rather than showing that error. Absent otherwise.
        default:
          type: string
          description: The given's default value as a Malloy source literal (e.g. `'WN'`, `2003`, `@2024-01-01`, `f'WN'`), exactly
            as written in the model. Omitted when the given declares no default. Consumers render or prefill it per the
            given's `type` (e.g. unquote a string literal for a text input).
        label:
          type: string
          description: Display label from the declaration's `# label=` tag
        description:
          type: string
          description: Helper text from the declaration's `# description=` tag. Distinct from the older `#(description="…")`
            annotation, which is not derived into this field and instead stays on `annotations` for the client that
            already parses it. The tag form is also the one that compiles without a `malformed-route` warning, because
            Malloy reads an annotation's route up to the first whitespace.
        control:
          type: string
          enum:
            - select
            - multiselect
          description: How the control renders when the choice is between a single-pick and a multi-pick list. Omitted means infer
            from the given's type. A slider is not one of these values; it is signalled by `rangeMin` and `rangeMax`
            instead, per the rule on those fields.
        rangeMin:
          type: number
          description: Slider lower bound from `# range_min=`. The two bounds are what signal a slider, so a `number` or
            `filter<number>` given renders as one when BOTH are present and as a plain number input otherwise, so a lone
            bound changes nothing about the control.
        rangeMax:
          type: number
          description: Slider upper bound from `# range_max=`. See `rangeMin` for the rule that turns the pair into a slider.
        suggest:
          $ref: "#/components/schemas/GivenSuggest"
    GivenSuggest:
      type: object
      description: |
        Where a select or multiselect control gets its options: a named `query`,
        a `source` + `dimension` pair, or a `query` with a `dimension` naming
        which of its columns to read. All three run through the ordinary query
        endpoint.

        With `query` alone the first column of each row is used, so a
        single-column `group_by` needs no `dimension`. Give `dimension`
        alongside `query` when the query returns more than one column.
      properties:
        query:
          type: string
        source:
          type: string
        dimension:
          type: string
        givenNames:
          type: array
          items:
            type: string
          description: |
            The givens the suggest query needs in its request to run: the ones
            the source it reads is scoped by (a source-level `where: … ~ $X`)
            or gated by (an authorize gate reading `$X`), plus, for the `query`
            form, the named query's own. A client sends the current values of
            exactly these, so a gated source's options load while the option
            list still does not depend on the page's other filters. Absent
            when the query needs none.
    GivenValues:
      type: object
      description: |
        Given *values* keyed by given name: what a caller sends, as distinct
        from `Given`, which describes what the model *accepts*. A collection of
        declarations is a plain array of `Given`, never this.

        Values are decoded and must match the declared type: a `number` given
        takes a JSON number, a `date` takes a bare `YYYY-MM-DD` string, a
        `timestamp` an ISO string with no zone, a `timestamptz` a full ISO
        string. `EncodedGivenValues` is the string-encoded counterpart.
      additionalProperties: true
    IdentifierPattern:
      type: string
      pattern: ^[a-zA-Z0-9_-]+$
      description: Standard identifier pattern for resource names
    IncrementalBoundary:
      type: object
      description: For a table refreshed incrementally, the `covered_through` boundary in force and the source definition it
        was measured under.
      required:
        - coveredThrough
        - coveredThroughType
        - watermark
        - strategy
        - sourceEntityId
      properties:
        coveredThrough:
          type: string
        coveredThroughType:
          type: string
          enum:
            - date
            - timestamp
            - number
            - string
        watermark:
          type: string
        mergeKeys:
          type: array
          items:
            type: string
        strategy:
          type: string
          enum:
            - merge
            - range_replace
        sourceEntityId:
          type: string
        advancedByRunId:
          type: string
        advancedAt:
          type: string
          format: date-time
    IncrementalBoundaryInput:
      type: object
      description: An `IncrementalBoundary` a previous run reported, returned verbatim with the table it belongs to.
      required:
        - connectionName
        - tableName
        - coveredThrough
        - coveredThroughType
        - watermark
        - strategy
        - sourceEntityId
      properties:
        connectionName:
          type: string
        tableName:
          type: string
        coveredThrough:
          type: string
        coveredThroughType:
          type: string
          enum:
            - date
            - timestamp
            - number
            - string
        watermark:
          type: string
        mergeKeys:
          type: array
          items:
            type: string
        strategy:
          type: string
          enum:
            - merge
            - range_replace
        sourceEntityId:
          type: string
    IndexFingerprint:
      type: object
      readOnly: true
      description: The definitional fingerprint of an `#(index)`-tagged dimension. Two loads that compile the dimension's
        canonical index query to the same SQL report the same fingerprint, so a host can reuse one index across versions
        and across sources that extend each other. Absent when that query did not compile.
      required:
        - sqlHash
        - requiredFilterDimensions
      properties:
        sqlHash:
          type: string
          description: Lowercase hex SHA-256 of the compiled index query's SQL.
        requiredFilterDimensions:
          type: array
          items:
            type: string
          description: "The dimensions the index is partitioned by: the source's required filters, in declaration order, then its
            `#(access_filter)` term columns."
    JoinedTerms:
      type: object
      required:
        - alias
        - source
        - terms
      description: A join to a given-scoped source, declared on a persisted source and read per caller through the joined
        source's own artifact.
      properties:
        alias:
          type: string
          description: The join's alias as the author wrote it. Dotted for a join reached through another such join (`grant.team`).
        source:
          type: string
          description: The joined source's name — itself a persisted source.
        terms:
          type: array
          items:
            $ref: "#/components/schemas/StrippedTerm"
          description: The joined source's own stripped terms, which its binding re-applies with the caller's values.
    LoadWarning:
      type: object
      required:
        - message
        - severity
      properties:
        model:
          type: string
          description: Package-relative path of the file the finding is on; absent for a package-wide finding.
        subject:
          type: string
        message:
          type: string
        code:
          type: string
          description: A stable identifier for the finding's family. The families are listed in docs/packages.md.
        severity:
          type: string
          enum:
            - error
            - warn
    LogMessage:
      type: object
      description: A log message from render tag validation
      properties:
        url:
          type: string
          description: URL of the source file related to this message
        range:
          type: object
          description: Source location range for this message
          properties:
            start:
              type: object
              properties:
                line:
                  type: integer
                character:
                  type: integer
            end:
              type: object
              properties:
                line:
                  type: integer
                character:
                  type: integer
        severity:
          type: string
          description: Severity level of the log message
          enum:
            - debug
            - info
            - warn
            - error
        message:
          type: string
          description: Human-readable log message
    ManifestEntry:
      type: object
      description: One source a run built, and the table it landed in.
      required:
        - entryId
        - sourceEntityId
        - sourceName
        - tableId
        - realization
      properties:
        entryId:
          type: string
        sourceEntityId:
          type: string
          description: Content address of the source definition; the identity across plan, instructions, manifest and bindings.
        sourceName:
          type: string
        modelPath:
          type: string
        origin:
          type: string
          enum:
            - persist
            - preaggregate
          default: persist
        tableId:
          type: string
          description: The physical table, at `GET …/connections/{connectionName}/tables/{tableId}`.
        connectionName:
          type: string
          description: The connection the table lives in.
        tier:
          type: string
          enum:
            - colocated
            - storage
        realization:
          $ref: "#/components/schemas/Realization"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rowCount:
          type:
            - integer
            - "null"
        buildDurationMs:
          type:
            - integer
            - "null"
        queryCostBytes:
          type:
            - integer
            - "null"
        upstreamReuse:
          type: string
          enum:
            - reused
            - recomputed
        upstreamRecomputeReason:
          type: string
        dataAsOf:
          type: string
          format: date-time
        freshnessWindowSeconds:
          type: integer
          format: int64
        freshnessFallback:
          type: string
          enum:
            - live
            - stale_ok
            - fail
        incremental:
          $ref: "#/components/schemas/IncrementalBoundary"
        refresh:
          type: string
          enum:
            - delta
            - full
            - none
    ManifestReference:
      type: object
      required:
        - sourceEntityId
        - tableName
      properties:
        sourceEntityId:
          type: string
        tableName:
          type: string
        connectionName:
          type: string
    Model:
      type: object
      required:
        - path
      properties:
        resource:
          type: string
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        path:
          type: string
          description: The file's path within the version, its identity.
        hidden:
          type: boolean
          description: "True for a file listed only because the request set `includeHidden`: one the package's `index.malloy` does
            not expose."
        isReport:
          type: boolean
          description: True when the file carries an `## artifact` tag and is also listed under `reports`.
        error:
          type: string
    ModelEntities:
      type: object
      readOnly: true
      description: What one `.malloy` model file declares, in the form an indexer reads. See `GET …/entities`.
      required:
        - modelPath
      properties:
        modelPath:
          type: string
          description: Package-relative path of the model file.
        error:
          type: string
          description: "Why the model has no entities: its compile error, or the server's failure to extract it (see `errorKind`).
            When present, every other list is empty."
        errorKind:
          type: string
          enum:
            - compile
            - extraction
          description: "Present with `error`. `compile`: the model did not compile, which its author fixes. `extraction`: it
            compiled but the server could not extract its entities, a server fault an indexer should not read as the
            model having none."
        fields:
          type: array
          description: Every public field of every source the model surfaces, its imported sources included. A field reachable
            only through a join (a joined source declared inline, or one the model's imports do not surface on their
            own) is listed under the runnable source it is reached from, its `name` the join-qualified path.
          items:
            $ref: "#/components/schemas/EntityField"
        sources:
          type: array
          description: "The facts the model states about each of its sources: docs, visibility, queryability, filters and access
            gates. Includes a source reached only through a join, with `joinOnly: true`, when the model gates or
            declares givens for it."
          items:
            $ref: "#/components/schemas/SourceEntities"
        givens:
          type: array
          description: Every given the model surfaces, those its imports surface included. They apply to every source in `sources`.
          items:
            $ref: "#/components/schemas/Given"
        sourceSchemas:
          type: array
          description: "The schema of each source the model surfaces, in declaration order: its own annotations and its public
            fields, a join's fields nested under it."
          items:
            $ref: "#/components/schemas/SourceSchema"
    ModelList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    ModelWriteRequest:
      type: object
      description: The whole text of a report file to write into a version, making a new version.
      required:
        - source
      properties:
        source:
          type: string
        expectedHash:
          type: string
          description: SHA-256 (hex) of the text the caller read. Refused with 409 when the file no longer hashes to it. Omit to
            create; a create finds a file already there is 409 `FILE_EXISTS`.
    ModelWriteResult:
      type: object
      required:
        - path
        - contentHash
        - created
        - version
      properties:
        path:
          type: string
        contentHash:
          type: string
          description: SHA-256 (hex) of the text as written; the next write's `expectedHash`.
        created:
          type: boolean
        version:
          $ref: "#/components/schemas/Version"
          description: The version the write made, which is now `latest` unless promotion is `explicit`.
    MotherDuckConnection:
      type: object
      description: MotherDuck database connection configuration
      properties:
        accessToken:
          type: string
          description: MotherDuck access token
        database:
          type: string
          description: MotherDuck database name
    MysqlConnection:
      type: object
      description: MySQL database connection configuration
      properties:
        host:
          type: string
          description: MySQL server hostname or IP address
        port:
          type: integer
          description: MySQL server port number
        database:
          type: string
          description: Name of the MySQL database
        user:
          type: string
          description: MySQL username for authentication
        password:
          type: string
          description: MySQL password for authentication
    OverlayFile:
      type: object
      description: One file of a request's `files` overlay.
      required:
        - path
        - content
      properties:
        path:
          type: string
          description: The file's path relative to the package root, `/`-separated, ending in `.malloy`.
          example: orders/orders.malloy
        content:
          type: string
          description: The file's whole text.
    Package:
      type: object
      description: "A package's identity and pointers. It holds no content: content is a Version. Its own fields
        (`description`, `latestVersionId`, `source`) are the only ones a client may change."
      required:
        - name
        - source
      properties:
        resource:
          type: string
          readOnly: true
        environmentName:
          type: string
          readOnly: true
        name:
          $ref: "#/components/schemas/IdentifierPattern"
        description:
          type:
            - string
            - "null"
          description: Server-owned. When null, readers fall back to the latest version's `publisher.json` description.
        source:
          $ref: "#/components/schemas/PackageSource"
        latestVersionId:
          oneOf:
            - $ref: "#/components/schemas/VersionId"
            - type: "null"
          description: The version served when a request names `latest`. Null under `explicit` promotion until it is set. Moved
            with `PATCH` under `If-Match`; moving it back to a parent version is the undo of a server-made version.
        manifestLocation:
          type:
            - string
            - "null"
          writeOnly: true
          description: On publish only, a manifest to bind the published version to. Afterwards it is a field of the version.
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    PackageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Package"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    PackageMaterializationConfig:
      type: object
      description: Package-level Malloy Persistence policy from publisher.json's `materialization` block. Surfaced verbatim so
        the control plane can drive scheduled version-level re-materialization without re-reading the package files. The
        object is emitted whenever the package is loaded, even when no policy is declared (all fields null), so its
        presence is an authoritative "the manifest says this" signal rather than "policy missing".
      properties:
        schedule:
          type:
            - string
            - "null"
          description: "5-field UNIX cron controlling how often the control plane re-materializes this package's published
            versions. Null = no scheduled re-materialization declared in the manifest (publish / on-demand only). A cron
            is the power tier of artifact-anchored scheduling and is package-root-only: it is valid only when the
            package declares `scope: version` (a package-scoped lineage is reused across versions, so a single
            per-version cadence is meaningless), and it is mutually exclusive with freshness — declare either a
            `schedule` (power tier) or `freshness` (objective tier), never both. A schedule on a `scope: package`
            package, or alongside any freshness, is rejected at publish."
        freshness:
          oneOf:
            - $ref: "#/components/schemas/Freshness"
            - type: "null"
          description: The manifest's `materialization.freshness` block, verbatim. Null = no freshness policy declared. `window`
            is the control plane's refresh objective for the package's materialized sources; `fallback` is the declared
            query-time behavior when the objective is missed. The publisher only surfaces the values — the control plane
            owns the scheduling and gating logic.
        queryMetadata:
          oneOf:
            - $ref: "#/components/schemas/QueryMetadata"
            - type: "null"
          description: >-
            DEPRECATED home for the package's per-query metadata; read `Package.queryMetadata`, which is canonical. Null
            = none declared.

            NOT the manifest's `materialization.queryMetadata` verbatim: it is the RESOLVED winner across both manifest
            homes, and it is synthesized for a package whose manifest has no `materialization` block at all — a package
            that declares tags the canonical way has no build policy to carry them, and its tags must not be lost for
            want of one. Both homes are populated on read, so this and `Package.queryMetadata` agree.

            The package-level layer of per-query metadata: it applies to every statement the package's sources issue — a
            build and a served query alike — and a model-file, source or per-request declaration overrides it property
            by property.
    PackageSource:
      type: object
      description: Where a package's content comes from.
      required:
        - location
      properties:
        kind:
          type: string
          enum:
            - local
            - git
            - gcs
            - s3
            - zip
            - live
          readOnly: true
          description: Derived from `location`. `live` is a watched environment's package, read in place.
        location:
          type: string
          description: A local path, a git or GitHub URL, a `gs://` or `s3://` URI, or a `.zip`. What a reload fetches again.
        credentialsRef:
          type: string
          description: Name of a stored secret used to fetch a private location. Write-only.
    PackageStatusEntry:
      type: object
      required:
        - name
        - versions
      properties:
        resource:
          type: string
        name:
          type: string
        latestVersionId:
          oneOf:
            - $ref: "#/components/schemas/VersionId"
            - type: "null"
        versions:
          type: array
          description: One entry per version this server holds, loaded or not.
          items:
            $ref: "#/components/schemas/ServingState"
    PathPattern:
      type: string
      pattern: ^[a-zA-Z0-9_/.-]+$
      description: Path pattern supporting slashes, dots, and dashes
    PersistSourcePlan:
      type: object
      required:
        - name
        - sourceID
        - connectionName
        - sourceEntityId
        - sql
        - columns
      properties:
        name:
          type: string
        sourceID:
          type: string
        connectionName:
          type: string
        dialect:
          type: string
        origin:
          type: string
          enum:
            - persist
            - preaggregate
          default: persist
          description: >-
            Which authoring annotation produced this plan entry. `persist` — the modeler wrote `#@ persist` on the
            source; every entry on a deployment that uses no pre-aggregation, and the meaning of an absent value.
            `preaggregate` — the modeler wrote `#@ preaggregate` on measures of `preaggregate.baseSourceName`, and the
            publisher SYNTHESIZED this rollup source to serve them.


            Note that BOTH kinds carry a `#@ persist` annotation by the time they reach this plan, because synthesis
            emits one (see `annotationFields`). So this reports which surface the AUTHOR used, not which annotation sits
            on the source — which is the question worth answering, since a `preaggregate` entry's `name` appears in no
            model file and without this field an operator or orchestrator sees a source nobody wrote with no way to tell
            it from one they did.


            Everything downstream is deliberately indifferent to it: a synthesized entry is built, identified,
            manifested, shared and garbage-collected exactly like a hand-written one.
        preaggregate:
          oneOf:
            - $ref: "#/components/schemas/PreaggregatePlan"
            - type: "null"
          description: >-
            What the synthesized rollup covers: the base source it was derived from, the one grain it is built at, and
            the measures served there. Present only when `origin` is `preaggregate`; null otherwise.


            Coverage is complete by construction — a measure that cannot be correctly re-aggregated is refused at
            publish rather than dropped from the rollup — so there is no per-measure omission list to reconcile against
            the model.
        sourceEntityId:
          type: string
          description: Stable, content-addressed identity of this persisted source. A deterministic UUID5 derived from the
            source's scope, its connection `fingerprint`, and its canonical compiled SQL — deliberately independent of
            package version, so it changes only when the source's data identity changes. Consumers treat it as an opaque
            token and use the supplied value verbatim.
        sql:
          type: string
          description: The source's build SQL (with the build manifest applied for upstream rewrites).
        partition:
          type: array
          items:
            type: string
          description: >-
            The source's declared `#@ persist partition=` columns, resolved against its public projection and reported
            in the author's order, which is the order the stored table's directories nest in. Absent or empty means the
            table is written unpartitioned, which is the default and what every source built before this field existed
            means.


            A layout, not an access control. Every term the build strips from a source is re-applied when the artifact
            is read whether or not its column is partitioned, so a list omitting the column a caller is scoped by costs
            a full scan and never widens what that caller sees. Consumers should not infer isolation from it.


            `partition=` requires `storage=`; declared without one it is a publish refusal rather than an ignored key,
            so this is empty for every colocated source.
        strippedTerms:
          type: array
          items:
            $ref: "#/components/schemas/StrippedTerm"
          description: >-
            The source's extend-block `where:` conjuncts that reference a given — the terms Malloy leaves OUT of the
            build and that must be re-applied, with the caller's own values, whenever the artifact is read. Absent or
            empty means the artifact is the whole relation and needs no re-application.


            Reported so a consumer that supplies its own serve bindings can tell that this artifact is under-filtered on
            its own, and which givens a reader has to bind for it to be served correctly. The publisher's own serve path
            re-derives these from the compiled model rather than from here.
        joinedTerms:
          type: array
          items:
            $ref: "#/components/schemas/JoinedTerms"
          description: >-
            The joins declared on this source whose TARGET is scoped by a given — one entry per such join, naming the
            joined source and the terms its own artifact re-applies. Absent or empty means no field of this source reads
            a caller-scoped join.


            These terms are not stripped from THIS artifact: a join is not part of a persist source's build, so this
            table holds the same rows with or without it. They are what makes a field reading through the join answer
            per caller (a visibility dimension that null-checks a grant table, say), and they are applied only by the
            joined source's own binding. So a reader serving this artifact must bind the joined source too; without it,
            the join cannot be re-emitted and any query reading through the alias must be served live.
        refresh:
          type:
            - string
            - "null"
          description: "The source's declared `#@ persist ... refresh=...` value, reported verbatim; null = unset (which means
            \"full\"). Read and VALIDATED by the publisher, no longer an inert pass-through: a value outside {\"full\",
            \"incremental\"} is a publish rejection, and `refresh=\"incremental\"` additionally requires a `watermark=`
            naming one output dimension (see `annotationFields`). An incremental source advances its serving table by a
            bounded delta in place instead of being rebuilt, so the mode also governs the build path — which is why it
            is validated rather than passed through."
        freshness:
          oneOf:
            - $ref: "#/components/schemas/Freshness"
            - type: "null"
          description: >-
            The source's EFFECTIVE freshness objective after most-specific-wins resolution (source > model-file >
            package). Null = unset at every level; the control plane applies the platform default. Reported verbatim
            (invalid fields dropped, never defaulted). Valid in both scope modes. (Per-source `sharing`/`schedule` were
            retired: scope is a single package-level mode and a schedule is package-root-only — declaring either on a
            source is a publish-time manifest error.)


            A synthesized rollup (`origin: preaggregate`) declares nothing of its own and gets no freshness policy of
            its own: it INHERITS its base's, so what is reported here is the base source's effective objective resolved
            by the rule above. A rollup and its base therefore go stale together, which is what makes "serve the base
            when the rollup is stale" a safe degradation rather than a change of answer.
        queryMetadata:
          oneOf:
            - $ref: "#/components/schemas/QueryMetadata"
            - type: "null"
          description: "The source's EFFECTIVE per-query metadata after most-specific-wins resolution per property (`#@
            queryMetadata.*` > model-file `## queryMetadata.*` > package `queryMetadata`; the deprecated
            `materialization.` spellings of the last two are still read and lose to the canonical ones). Null = declared
            at no level. The publisher attaches it — merged under its own context — to every statement it issues while
            building this source AND to every query served from it, and reports it here so a caller can see how the
            source's traffic will be tagged. Reported as DECLARED, not as attached: a property whose name the server
            owns (`class`, `environment`, `package`, `model`, `source`, `trigger`, `run_id`, `query_id`, `version`)
            appears here and is then dropped rather than attached. Copying this bag onto a request does NOT reproduce
            that drop: the reservation covers a MODEL-SIDE declaration only, so a `source`, `trigger` or `run_id` sent
            on a request layer ATTACHES, and the statement then reads, in the backend's own history, exactly like a
            build of this source. Strip the server-owned names before reusing it. Observability only: excluded from
            `sourceEntityId`, so editing it never re-addresses the source or orphans its table."
        columns:
          type: array
          description: Output schema of the source.
          items:
            $ref: "#/components/schemas/Column"
        annotationFields:
          type: object
          additionalProperties:
            type: string
          description: >-
            All key=value fields of the source's `#@ persist` annotation (e.g. `name`, `realization`). The control plane
            uses `name` as the materialized table name (it may carry a dialect container path like `dataset.table`).
            Returned as the full set so new persist directives need no publisher change; an unrecognized key rides
            through here and is reported as a package warning, never a rejection.


            Recognized keys beyond `name`/`realization`/`storage`, both read from the EFFECTIVE merged tag (a source
            extending a persisted parent inherits the parent's keys, and its own keys merge over them per key):


            * `watermark` — one output dimension name, monotone non-decreasing. Required by `refresh="incremental"`; the
            platform derives each refresh's half-open range from it. Must be a single quoted string naming a column of
            `columns`.


            * `merge_key` — comma-separated output dimension names, none of them the watermark. Declares row identity
            for a source whose rows are restated with a LATER watermark value, which selects a MERGE apply; omitted, the
            delta replaces the range instead. Compound keys go in one quoted string (`merge_key="order_id, region"`).


            Both are validated at publish against the compiled output schema, so a dangling or stale name is rejected
            rather than deferred to a build. Neither participates in `sourceEntityId`: adding a watermark to an existing
            source must not re-address its table.


            For a synthesized rollup (`origin: preaggregate`) the annotation was generated by the publisher rather than
            authored, so this reports what synthesis emitted. It is still the annotation that governs the build, which
            is why it is reported the same way: a rollup is an ordinary persist source whose `#@ persist` nobody typed.
        modelPath:
          type: string
          description: >-
            Package-relative path of the `.malloy` model that declares this source (e.g. `order_rollup.malloy`). The
            source's sourceID embeds an absolute `file://` modelURL with no package boundary, so this is the only place
            the relative path is exposed; callers use it to deep-link the source back to its model.


            A synthesized rollup (`origin: preaggregate`) is declared by no model, so this is the model of its base —
            the file holding the `#@ preaggregate` annotations it was synthesized from, which is where an author would
            go to change it.
    PhysicalTable:
      type: object
      description: A table the server created or serves in a connection, with its life cycle. The one place a table has a
        name; everything else refers to it by `tableId`.
      required:
        - tableId
        - connectionName
        - baseName
        - generation
        - tableName
        - ownership
        - state
      properties:
        resource:
          type: string
        tableId:
          type: string
        environmentName:
          type: string
        connectionName:
          type: string
        schemaName:
          type:
            - string
            - "null"
        baseName:
          type: string
          description: The stable name the API, the Console and `#@ persist name=` speak.
        generation:
          type: integer
          format: int64
        tableName:
          type: string
          description: "The name in the warehouse: `<baseName>__g<generation>` for a server-owned table, verbatim for a
            caller-owned one."
        ownership:
          type: string
          enum:
            - server
            - caller
          description: Caller-owned tables (built from `buildInstructions`) are never renamed or reclaimed by the server.
        ownerPackageName:
          type: string
        ownerSlot:
          type: string
          description: "`<package>` or `<package>@<version>`: the slot that owns the table."
        state:
          type: string
          enum:
            - staging
            - serving
            - superseded
            - reclaimable
            - dropped
        processScoped:
          type: boolean
          description: "True for a table in a version's in-memory DuckDB: it exists only while this server process does."
        createdByRunId:
          type: string
        stateChangedAt:
          type: string
          format: date-time
        incremental:
          $ref: "#/components/schemas/IncrementalBoundary"
    PhysicalTableList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhysicalTable"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    PostgresConnection:
      type: object
      description: PostgreSQL database connection configuration
      properties:
        host:
          type: string
          description: PostgreSQL server hostname or IP address
        port:
          type: integer
          description: PostgreSQL server port number
        databaseName:
          type: string
          description: Name of the PostgreSQL database
        userName:
          type: string
          description: PostgreSQL username for authentication
        password:
          type: string
          description: PostgreSQL password for authentication
        connectionString:
          type: string
          description: Complete PostgreSQL connection string (alternative to individual parameters)
        sslmode:
          type: string
          enum:
            - disable
            - no-verify
            - verify-ca
            - verify-full
          description: TLS mode for the connection. On a connection reached through a `proxy` (SSH bastion), the driver connects
            to a local tunnel endpoint, so the cert hostname can't be checked from the tunnel address alone; use
            `verify-full` to check it against the real host. `verify-ca` validates the server cert chain against the
            trusted CA bundle (e.g. the baked Amazon RDS roots) without the hostname, `verify-full` validates the chain
            AND the hostname against the real host (verified via SNI through the tunnel; requires the target's CA to be
            trusted by Node's bundled CA roots or NODE_EXTRA_CA_CERTS), `no-verify` encrypts without verifying, and
            `disable` uses no TLS. A `storage=` build of a proxied source applies the same mode through its own tunnel,
            `verify-full` included. Note `verify-full` trusts a broader CA set than `verify-ca` here — ambient roots
            plus NODE_EXTRA_CA_CERTS, rather than the pinned NODE_EXTRA_CA_CERTS bundle that `verify-ca` uses — so it is
            intentionally not a strict superset; it adds the hostname check without narrowing CA trust. The server
            defaults it to `no-verify` when a proxy is set (so a force-SSL target isn't rejected for plaintext) — a
            server-applied default, not a schema default. On a direct connection the same modes apply against the
            configured host; when omitted, the deployment PGSSLMODE applies. Ignored when connectionString is set, which
            carries its own sslmode. Applies to a DuckLake catalog connection as well.
        statementTimeoutMilliseconds:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Maximum run time of each statement on the database, in milliseconds. The database cancels a statement that
            exceeds it. When omitted, the database's own statement_timeout applies. Not applied to a DuckLake catalog
            connection.
    PreaggregatePlan:
      type: object
      description: >-
        Provenance for a rollup source synthesized from `#@ preaggregate` annotations. A query never names a rollup,
        never changes shape because one exists, and gets the same answer whether one is used or not, so this is the only
        place the set of rollups and the coverage of each is visible at all.


        **This object describes ONE rollup table, at ONE grain.** A rollup is a single `GROUP BY`, so a grain is a
        property of the table, not of the individual measures in it: `grainDimensions` lists the dimensions of that one
        grain, and `measures` are the measures served at it.


        That inverts how the grain was authored, which is worth knowing before reading a plan. The modeler declares per
        measure — `#@ preaggregate grain="order_day, category"` — and may declare a measure at SEVERAL grains by writing
        several annotation lines on it, each of which is its own rollup. The publisher then packs every measure
        declaring the same (grain, connection, base source) into a single synthesized source, because ten measures at
        one grain should be one table and one CTAS rather than ten. So the plan has one entry per DISTINCT grain
        declared anywhere on the source, which is neither the number of annotated measures nor the number of
        annotations: a measure declared at two grains appears in two entries, and two measures sharing a grain appear in
        one. To recover the per-measure view that was written, iterate `buildPlan.sources`, keep the `origin:
        preaggregate` entries, and invert each entry's grain-to-measures pairing.


        Choosing between two rollups and one at the combined grain is a size judgement, not a correctness one — see
        `grainDimensions`.
      required:
        - baseSourceName
        - grainDimensions
        - measures
      properties:
        baseSourceName:
          type: string
          description: The source whose measures carry the `#@ preaggregate` annotations this rollup was synthesized from. Queries
            name THIS source; the rollup is selected behind it, or bypassed, per grain coverage.
        grainDimensions:
          type: array
          items:
            type: string
          description: >-
            The dimensions of the ONE grain this rollup is built at — the parsed form of a single `grain=` annotation
            value, so `grain="order_day, category"` reports as two entries here and not as two grains.


            **Every entry is a dimension the base source itself declares**, never a truncation written inline.
            `grain="order_time.day"` is refused at publish: a stored column of truncated values either shadows the
            base's own `order_time` and answers untruncated queries from truncated rows, or is named something no query
            references and serves nothing. So time grains are reached by declaring `dimension: order_day is
            order_time.day` on the source and naming `order_day` here.


            **Sorted, and canonically so.** Synthesis derives the rollup's name and identity from the sorted grain, so
            two authors who write the same dimensions in different orders get one table rather than two. Compare grains
            as sets using this list; never by the annotation's original string, which is not canonical.


            A query can be answered here only if this grain covers it: every dimension the query groups by is in this
            list, or is a coarser truncation of one (a `month` of a stored `order_day` is derivable and does route; a
            `day` of a stored `order_month` is not). Which makes the set of grains ACROSS a package the whole
            performance story, and the reason adding a rollup per query shape is the documented way to spend more on
            builds than you save.


            Note that covering does not require an exact match: a query grouping by a SUBSET of these dimensions — or by
            none of them — is served here too, by re-aggregating across the ones it omits. So one rollup at the finest
            grain an author needs does subsume every coarser one, and a combined grain is often the economical choice.


            That subsumption is about coverage, though, not cost, and it is why a measure may still be declared at
            several grains. A combined grain has roughly the PRODUCT of its dimensions' cardinalities, so `customer_id,
            order_day` can approach the base table's row count and save almost nothing, while `order_day` alone is tiny.
            Two rollups then beat one, each query reading the smallest that covers it, at the price of two tables to
            build and refresh. Correctness is identical either way; the choice is size against build cost.
        measures:
          type: array
          items:
            type: string
          description: >-
            The measures served at this rollup's grain, under their original names — the names a query uses, not the
            names of the partial-aggregate columns stored to serve them. A query using only these, at a grain this
            rollup covers, is eligible to be served from its table.


            These are the measures whose `#@ preaggregate` named THIS grain. A measure declared at a different grain is
            not missing: it is in the plan entry for that grain. Do not read this list as the base source's full set of
            pre-aggregated measures — that is the union of these lists across every entry sharing a `baseSourceName`.


            **Every measure that declared this grain is here.** There is no partial rollup and no per-measure omission
            to check: a measure that cannot be correctly re-aggregated is refused at publish, so a rollup that exists
            carries everything that asked to be in it.
    PublisherConnection:
      type: object
      description: >
        Malloy Publisher proxy connection. Proxies SQL to a remote Publisher dataplane instead of connecting to a
        warehouse directly. The remote dataplane owns authentication, access control, and read-only enforcement.
      properties:
        connectionUri:
          type: string
          description: The URL of a connection on another Publisher, for example
            `https://org.data.example.com/api/v1/environments/<env>/connections/<name>`.
        accessToken:
          type: string
          description: Bearer token for the remote dataplane (user-scoped, short-lived)
      required:
        - connectionUri
    Query:
      type: object
      description: Named model query definition
      properties:
        name:
          type: string
          description: Name of the query
        sourceName:
          type: string
          description: Name of the source this query operates on
        annotations:
          type: array
          description: Annotations attached to the query
          items:
            type: string
    QueryClass:
      type: string
      enum:
        - interactive
        - materialize
        - index
        - ops
      description: "The class of work a statement belongs to, attached as the `class` query-metadata property: `interactive`
        (a user or application query), `materialize` (a persist-source build), `index` (an index build or scan), `ops`
        (platform maintenance). Attribution's primary axis — a backend bill separates traffic from builds only if every
        statement says which it is."
    QueryMetadata:
      type: object
      additionalProperties:
        type: string
      description: >-
        Per-query metadata: a flat bag of string properties attached to the statements a query issues, for the backend's
        own reporting — cost attribution, workload classification, tracing. Each backend applies it through a per-query
        mechanism: Snowflake a per-statement `QUERY_TAG` (the bag as JSON, so its properties are queryable in
        `QUERY_HISTORY`) — except on a `storage=` build, whose read goes through DuckDB's query-passthrough and so sets
        the tag for the SESSION, which means the driver's own connection probes carry the build's bag too, BigQuery
        per-job `labels` (queryable in `INFORMATION_SCHEMA.JOBS`), and every other backend a leading SQL comment (`--
        team="finance"`, visible in query history / `pg_stat_activity`). It never affects results, and it is excluded
        from connection fingerprints and from build identity, so changing a property never re-addresses or rebuilds
        anything.

        The contract, which every backend can render and which the connector enforces at dispatch: property names are
        ASCII alphanumerics and underscore (<=128 chars), values are printable ASCII without `"` (<=256 chars), and a
        bag holds at most 20 properties. Declare a name starting with a LETTER: BigQuery drops a name it cannot fit to
        its label grammar while other backends keep it.

        Layers, most specific wins per property: connection default < package `queryMetadata` < model-file `##
        queryMetadata.*` < source `#@ queryMetadata.*` < per-request `queryMetadata`. The `materialization.` spellings
        of the package and model-file layers are deprecated and still read; where a file declares both, the canonical
        one wins per property. The publisher's own context (`class`, `environment`, `package`, `model`, `source`,
        `trigger`, `run_id`, `query_id`, `version`) is applied on top and cannot be overwritten — it is what the server
        is actually doing, and a caller must not be able to relabel it. Those names are also RESERVED against a
        MODEL-SIDE declaration: a package block, a model file or a `#@ persist` annotation declaring one has it DROPPED
        rather than attached. Context only overwrites a name it has a value for, and a served query has no `source`,
        `trigger` or `run_id` — so a declared one would otherwise ride interactive traffic and read, in the backend's
        own history, exactly like a build. A connection default and a per-request bag are not covered: a request setting
        `queryClass` is a caller describing its own call, while a model-side declaration rides every query against that
        source, including ones its author never sees. Put no secrets or personal data here: a tag is visible to anyone
        who can read the backend's query history, and on a backend with no native tag mechanism it is visible in the
        statement text.
    QueryRequest:
      type: object
      description: "One of two shapes: `query` alone (ad-hoc Malloy compiled in the model's context), or `queryName` without
        `query` (a view when `sourceName` is set, a model-level named query when it is not). `givens` ride on either."
      properties:
        query:
          type: string
          description: One `run:` statement after any definitions. Text with more than one run statement is 400.
        sourceName:
          type: string
          description: A source name exactly as the model lists it; quoted by the server, sent bare.
        queryName:
          type: string
          description: A view or named-query name exactly as the model lists it.
        givens:
          $ref: "#/components/schemas/GivenValues"
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
        queryClass:
          $ref: "#/components/schemas/QueryClass"
        rowLimit:
          type: integer
          description: Cap pushed into the SQL. The query's own limit or the server default applies when omitted.
        include:
          type: array
          description: Larger parts of the result to include. `malloyResult` is the full Malloy result the renderer needs.
          items:
            type: string
            enum:
              - malloyResult
              - sql
    QueryResult:
      type: object
      description: Rows always; the full Malloy result only when asked for.
      required:
        - rows
        - schema
        - metadata
      properties:
        rows:
          type: array
          description: One object per row, keyed by column name. Nested results are nested arrays of objects.
          items:
            type: object
            additionalProperties: true
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ResultColumn"
        metadata:
          $ref: "#/components/schemas/QueryResultMetadata"
        malloyResult:
          type: object
          additionalProperties: true
          description: "Malloy's full result with type metadata, as an object. Present only with `include: [\"malloyResult\"]`."
        sql:
          type: string
          description: 'The SQL that ran. Present only with `include: ["sql"]`.'
    QueryResultMetadata:
      type: object
      required:
        - rowLimit
        - rowLimitSource
        - rowLimitHit
        - elapsedMs
      properties:
        rowLimit:
          type: integer
        rowLimitSource:
          type: string
          enum:
            - query
            - request
            - server_default
        rowLimitHit:
          type: boolean
        elapsedMs:
          type: integer
        servedFrom:
          type:
            - string
            - "null"
          enum:
            - live
            - storage
            - colocated
            - live_fallback
            - null
          description: "How the answer was produced: `live` from the source warehouse, `storage` or `colocated` from a
            materialized table, `live_fallback` when a storage read failed and the freshness policy allowed the
            warehouse. Null when the server cannot tell."
        costBytes:
          type:
            - integer
            - "null"
          description: Warehouse bytes scanned, as the backend reported them. Null is "not reported", never zero.
        queryCorrelationId:
          type:
            - string
            - "null"
        renderLogs:
          type: array
          items:
            $ref: "#/components/schemas/LogMessage"
    Realization:
      type: string
      enum:
        - SNAPSHOT
        - COPY
      description: SNAPSHOT = warehouse clone/snapshot; COPY = CREATE TABLE AS SELECT.
    RefusedSource:
      type: object
      description: One `#@ persist` source refused at compile time, and why. Computed from the SAME tier-appropriate
        eligibility assert the build path itself enforces (the colocated tier's post-relaxation admission for a proven
        row-level, fully-attributed authorize gate applies here too), so a source this reports as refused is refused for
        the tier it would actually build under — never the unconditional `storage=`-destination check applied to a
        source that declares no `storage=`. A `preaggregate`-tier entry can coexist with an entry of the same sourceID
        in `BuildPlan.sources` — the one tier where refused-and-present-in-sources is the correct, intended state,
        unlike `storage`/`colocated` where a refusal means absence from `sources`.
      required:
        - name
        - sourceID
        - tier
        - reason
        - message
      properties:
        name:
          type: string
          description: The source's declared name.
        sourceID:
          type: string
          description: sourceName@modelURL — matches this entry's map key.
        modelPath:
          type: string
          description: Package-relative path of the `.malloy` model that declares this source, mirroring
            `PersistSourcePlan.modelPath`. Absent if the model path could not be resolved.
        tier:
          type: string
          enum:
            - storage
            - colocated
            - preaggregate
          description: "Which build path this source was evaluated against: `storage` for a source declaring `#@ persist
            storage=<ref>` (evaluated against the full storage-destination eligibility gate, which never admits an
            authorize-gated source); `colocated` for a plain `#@ persist` (evaluated against the colocated gate, which
            admits a proven row-level, fully-attributed gate); `preaggregate` for a `#@ preaggregate` rollup (evaluated
            against the pre-aggregation gate, which refuses unconditionally when the rollup's base is authorize-gated —
            rollups group away the gate column, so there is no row-level admission the way colocated has)."
        reason:
          type: string
          enum:
            - free_parameter
            - given
            - given_in_persisted_query
            - dynamic_projection
            - dynamic_join
            - dynamic_joined_where
            - partition_without_storage
            - partition_column_unknown
            - partition_column_not_public
            - merge_key_scope_unresolved
            - preaggregate_over_dynamic_source
            - authorize
            - not_duckdb_portable
            - public_surface_unknown
            - read_only_dialect
          description: >-
            The bounded refusal reason. Only the compile-time reasons can appear here — `free_parameter`, `authorize`,
            the four that name where a given the build could not strip sits (`given_in_persisted_query`,
            `dynamic_projection`, `dynamic_join`, `dynamic_joined_where`), the three that name an unusable `partition=`
            (`partition_without_storage`, `partition_column_unknown`, `partition_column_not_public`),
            `merge_key_scope_unresolved` (a `merge_key=` whose caller scope cannot be expressed over the stored table's
            own columns), `preaggregate_over_dynamic_source` (a rollup whose base is scoped by a given, which has no
            read-time re-application to put the term back), and `read_only_dialect` (a colocated `#@ persist` on a
            source whose dialect cannot create tables; SQL Server today, whose connection reports `canPersist: false`) —
            those being the only reasons the two compile-time eligibility asserts this collection is computed from
            produce.


            `given_in_persisted_query` is raised by BOTH gates, for one condition: the BUILD would substitute a given's
            value, so the artifact holds one caller's slice. On colocated that is a build that runs and lies; on a
            storage destination the same placement also leaves nothing for the read to re-apply. A given in the source's
            extend block is neither — it is left out of the build and applied per caller at read — and is admitted on
            both tiers.


            `given` is retained for records that already carry it and is no longer produced. It was the storage tier's
            blanket refusal of any given reference, and the positional reasons above replaced it: where a given sits
            decides the outcome, so a single reason covering every placement can no longer be raised.
            `not_duckdb_portable` is decided against the post-build captured schema, which does not exist at compile
            time, and `public_surface_unknown` is raised by the build-time narrowing of a stored table to the source's
            public columns; both are listed only because they share the enum the runtime eligibility metric uses.
        message:
          type: string
          description: The full, human-readable refusal message the eligibility assert produced — the same text a build attempting
            this source would 422 with.
    ReloadResult:
      type: object
      description: What a reload did.
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - unchanged
            - published
            - recompiled
          description: "`unchanged`: the source fingerprint matched and nothing was made. `published`: the source changed and
            `version` is the version it made. `recompiled`: a live package was recompiled in place."
        package:
          $ref: "#/components/schemas/Package"
        version:
          $ref: "#/components/schemas/Version"
        versions:
          type: array
          description: On an environment reload, one result per package.
          items:
            $ref: "#/components/schemas/ReloadResult"
    Report:
      type: object
      description: A `.malloy` file carrying an `## artifact` tag, wherever it lives in the version.
      required:
        - path
        - name
        - layout
        - title
      properties:
        resource:
          type: string
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        path:
          type: string
          description: The report's identity.
        name:
          type: string
          description: The basename without extension; a display label only.
        layout:
          type: string
          enum:
            - grid
            - linear
        title:
          type: string
        description: "{ type: string }"
        error:
          type: string
    ReportList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    ReportManifest:
      description: A `Report` plus what a viewer needs to draw it.
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          properties:
            tiles:
              type: array
              items:
                $ref: "#/components/schemas/ReportTile"
            columns:
              type: integer
              description: Grid width; 1 on a linear report.
            startingGivens:
              $ref: "#/components/schemas/EncodedGivenValues"
            autorun:
              type: boolean
            givens:
              type: array
              description: The control row, one entry per given the tiles read.
              items:
                $ref: "#/components/schemas/Given"
    ReportTile:
      type: object
      description: One tile of a report. A `query` tile (the default) runs a query; a `text` tile shows markdown and runs
        nothing, so a caller that runs a report's tiles skips the ones with `kind` `text`.
      properties:
        kind:
          type: string
          enum:
            - query
            - text
          description: "`query` runs `query` through the model query endpoint; `text` shows `markdown`. Absent means `query`."
        name:
          type: string
          description: "A text tile's name: the bare word in `tiles=[…]` and on its `##|(markdown) name` block. Absent on a query
            tile."
        markdown:
          type: string
          description: A text tile's body, the text of its `##|(markdown) name` block without the opener. Empty when the file has
            no such block. Absent on a query tile.
        query:
          type: string
          description: Absent on a text tile. The run expression exactly as written in `tiles=[…]`, for example "orders ->
            by_month". An EXPRESSION rather than a name, so it goes in the `query` field of a `POST
            …/models/{path}/query` body, prefixed with `run:`.
        restricted:
          type: boolean
          description: "Set on a tile of a compiled document (`CompileResult.document`) whose source the caller may not read. The
            tile carries its `query`, the layout its own entry in `tiles=[…]` sets, and nothing derived from the source:
            no `givenNames`, no tags from the view."
        givenNames:
          type: array
          items:
            type: string
          description: |
            Names of the givens this tile's compiled query reads: through its
            view, its source's `where:`, a joined source's `where:`, a
            dimension or measure it uses, and its source's `#(authorize)` and
            `#(access_filter)` gates. A control not listed does not change the
            tile, which is what a viewer's "Doesn't respond to" chip says. It
            also tells a caller which tiles a changed control needs to re-run;
            running a tile with the dashboard's whole control row also works,
            because an unreferenced given is ignored. Absent when discovery
            could not resolve the tile (its expression neither compiles nor is
            a plain `source -> view` or named query the static walk reads), in
            which case send the whole control row. One such tile
            widens `ReportManifest.givens` to every given the entry file
            surfaces, rather than the union over the resolvable tiles, so that
            the row actually contains the givens that tile filters by.
        label:
          type: string
          description: Heading for the tile, from a `# label` on the view or query it names. Absent when it carries none, in which
            case a viewer derives one from the run expression.
        subtitle:
          type: string
          description: Second line under the heading, from a `# subtitle` on the view or query it names.
        colspan:
          type: integer
          description: Grid columns this tile spans, from `colspan=N` on the tile's entry in `tiles=[…]`, or else from a `#
            colspan=N` on the view or query it names. The entry wins, so one view can sit at a different width on each
            report. Clamped to `dashboardColumns` at render time. Absent means one column.
        break:
          type: boolean
          description: Start a new grid row at this tile, from `break` on the tile's entry in `tiles=[…]`, or else from a `#
            break` on the view or query it names; `break=false` on the entry turns off the view's. Named for the tag, so
            every per-tile field on this schema is spelled the way an author writes it. A generated client escapes the
            attribute where the word is reserved (the Python client exposes `break_`) while the wire key stays `break`.
        borderless:
          type: boolean
          description: Draw the result with no card around it, from a `# borderless` on the view or query it names. Together with
            `label`, `subtitle`, `colspan` and `break` this is the whole per-child tag set `@malloydata/render` resolves
            for a `# dashboard` nest child, read the same way here so one view presents identically as a tile and as a
            nest.
        rowspan:
          type: integer
          description: The tile's height in grid rows, from `rowspan=N` on its entry in `tiles=[…]`; only the entry sets it. A row
            is 80px, and a tile N rows tall also spans the N-1 row gaps between them. Absent, the tile is as tall as its
            result, up to the viewer's cap; on a placed report (see `row`), 5 rows for a query tile and 2 for a text
            tile. A grid report only.
        row:
          type: integer
          description: "The grid row the tile's top sits in, counted from 1, from `row=N` on its entry in `tiles=[…]`. A report
            where any tile has a `row` is placed: its rows are fixed 80px tracks, and each tile sits at its `row` and
            `col` rather than flowing. A placed tile with no `row` or `col` fills the first free cell. On a narrow
            screen tiles stack in one column, ordered by row then column."
        col:
          type: integer
          description: The grid column the tile's left edge sits in, counted from 1, from `col=N` on its entry in `tiles=[…]`. See
            `row`.
    ResultColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          description: The Malloy type (`string`, `number`, `date`, `timestamp`, `boolean`, `json`, `array`, `record`).
        fields:
          type: array
          description: For a nested result, its columns.
          items:
            $ref: "#/components/schemas/ResultColumn"
    Revision:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency counter on every mutable resource. Every read of the resource returns it in the body
        and as the `ETag` header (`"<revision>"`); every write may send it back as `If-Match` and answers 412
        `REVISION_MISMATCH` when the resource has moved on. A server may require it (428 `REVISION_REQUIRED`).
    Run:
      type: object
      description: One attempt to build a slot's persisted sources.
      required:
        - runId
        - versionId
        - status
        - trigger
        - mode
        - scope
        - createdAt
      properties:
        resource:
          type: string
        runId:
          type: string
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        slot:
          type: string
          description: "`<package>` under `scope: package`, `<package>@<version>` under `scope: version`."
        status:
          type: string
          enum:
            - pending
            - running
            - committed
            - failed
            - cancelled
          description: "`committed` is the only success: the manifest is visible and the bindings moved. A client may request only
            `cancelled`."
        trigger:
          type: string
          enum:
            - on_demand
            - scheduler
            - orchestrated
        mode:
          type: string
          enum:
            - auto
            - orchestrated
        scope:
          type: string
          enum:
            - package
            - version
        options:
          $ref: "#/components/schemas/RunOptions"
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        durationMs:
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
        summary:
          $ref: "#/components/schemas/RunSummary"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunContext:
      type: object
      description: Caller-supplied context for one materialization run, folded into the per-query metadata of the statements
        it issues (see `QueryMetadata`). Observability only — it never affects what gets built or how anything is
        addressed.
      properties:
        trigger:
          type: string
          enum:
            - publish
            - on_demand
            - scheduler
          description: "What started this run, attached as the `trigger` property: a package publish, an explicit request, or the
            caller's scheduler."
        runId:
          type: string
          description: The caller's id for this run, attached as the `run_id` property so every statement of one build groups
            together in the backend's query history.
    RunCreateRequest:
      type: object
      description: Start a run. Without `buildInstructions` the server builds every persist source of the version into tables
        it names (an auto-run). With them, the caller names the tables and the server builds exactly those (an
        orchestrated run).
      properties:
        versionId:
          $ref: "#/components/schemas/VersionRef"
          description: The version to build; `latest` when omitted.
        buildInstructions:
          $ref: "#/components/schemas/BuildInstructions"
        options:
          $ref: "#/components/schemas/RunOptions"
    RunList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    RunManifest:
      type: object
      description: What a run produced, one entry per source. A document of the run, so it is not paged.
      required:
        - runId
        - entries
      properties:
        runId:
          type: string
        builtAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEntry"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/SourceFailure"
    RunOptions:
      type: object
      properties:
        forceRefresh:
          type: boolean
          default: false
          description: Build even when a source's `sourceEntityId` is unchanged. Never re-seeds an incremental source; ask for
            that with `reseed`.
        reseed:
          type: boolean
          default: false
          description: Rebuild every in-scope incremental source from scratch and re-derive its boundary.
        sourceNames:
          type: array
          items:
            type: string
        runContext:
          $ref: "#/components/schemas/RunContext"
    RunSummary:
      type: object
      properties:
        sourcesBuilt:
          type: integer
        sourcesReused:
          type: integer
        sourcesRefused:
          type: integer
        refusedSources:
          type: array
          items:
            $ref: "#/components/schemas/RefusedSource"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/SourceFailure"
    S3Connection:
      type: object
      description: AWS S3 connection configuration for DuckDB
      properties:
        provider:
          type: string
          enum:
            - config
            - credential_chain
          description: How credentials are obtained; defaults to `config` when omitted. `config` uses the accessKeyId and
            secretAccessKey on this object, which are then required. `credential_chain` resolves them from the host
            instead — an instance profile, a web-identity token, or the environment — so no key is stored, and supplying
            one is rejected. Chain resolution happens when the connection is attached, so a host that cannot supply
            credentials fails there rather than on first object access.
        chain:
          type: string
          description: "Ordered list of credential providers to try, semicolon-separated, for `provider: credential_chain`
            (DuckDB's CHAIN). Recognized providers are env, config, sts, instance, sso, process, and web_identity. Omit
            to use Publisher's default order, which covers the environment, a web-identity token, and an instance
            profile. Rejected under `provider: config`, where the key pair beside it is what grants access."
        accessKeyId:
          type: string
          description: "AWS access key ID (required for `provider: config`)"
        secretAccessKey:
          type: string
          description: "AWS secret access key (required for `provider: config`)"
        region:
          type: string
          description: "AWS region (e.g., us-east-1). Optional, and Publisher falls back to us-east-1 when it is absent — but the
            fallback is applied in code, not by this schema: a `default:` here would be documentation only, since the
            generated clients leave an omitted property undefined rather than filling it. Stated this way so a caller
            reading the schema does not conclude the wire supplies it. A remote root in another region MUST set this;
            omitting it reaches us-east-1 and fails as a missing bucket rather than as a misconfiguration."
        endpoint:
          type: string
          description: "Custom S3-compatible endpoint (optional, for MinIO, etc.): `host[:port]`, `https://host[:port]`, or
            `http://host[:port]`, which is the one form that turns TLS off and is refused with `provider:
            credential_chain`, whose requests carry the host's credentials. No userinfo, query, fragment or whitespace."
        sessionToken:
          type: string
          description: AWS session token for temporary credentials (optional)
    Schema:
      description: A schema name in a Connection.
      type: object
      properties:
        name:
          type: string
          description: Name of the schema
        description:
          type: string
          description: Description of the schema
        isDefault:
          type: boolean
          description: Whether this schema is the default schema
        isHidden:
          type: boolean
          description: Whether this schema is hidden
    SchemaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schema"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    ServerStatus:
      type: object
      description: "The server's state, and every version it holds with its serving state: what an orchestrator reconciles
        from. The one unpaged snapshot in the API, narrowable with `?environment=`. Reading it loads nothing."
      required:
        - operationalState
        - version
        - hostname
        - timestamp
        - environments
      properties:
        operationalState:
          type: string
          enum:
            - initializing
            - serving
            - draining
            - throttled
          description: "`initializing` while the server loads; `serving` once ready; `draining` while it shuts down; `throttled`
            when the memory governor refuses new loads and queries. A throttled server still answers for what it already
            serves."
        version:
          type: string
          description: This server's release, for example `1.2.0`.
        hostname:
          type: string
          description: The host this server runs on (`os.hostname()`; the pod name on Kubernetes). Stable identity for an
            orchestrator.
        bootId:
          type: string
          description: One UUID per process start.
        timestamp:
          type: string
          format: date-time
        readOnly:
          type: boolean
          description: Whether `resources.readOnly` is on, so every resource write on this API answers 403 `READ_ONLY`.
        versionPromotion:
          type: string
          enum:
            - on-publish
            - explicit
        storage:
          type: object
          description: The storage layer's own state.
          properties:
            schemaVersion:
              type: integer
              description: The last migration applied to the catalog.
            gc:
              type: object
              description: The last reachability sweep.
              properties:
                lastRunAt:
                  type: string
                  format: date-time
                collected:
                  type: object
                  additionalProperties:
                    type: integer
        initError:
          type: string
          description: Present only when initialization failed; `operationalState` then stays `initializing`.
        loadErrors:
          type: array
          description: Versions that did not load, or that serve a model older than their content (`stale`). The only place either
            is reported.
          items:
            type: object
            required:
              - environmentName
              - message
            properties:
              environmentName:
                type: string
              packageName:
                type: string
              versionId:
                $ref: "#/components/schemas/VersionId"
              message:
                type: string
              stale:
                type: boolean
                description: The version still serves its last successful compile; the message says why the newer content did not
                  compile.
              failedAt:
                type: string
                format: date-time
        environments:
          type: array
          items:
            $ref: "#/components/schemas/EnvironmentStatus"
    ServingState:
      type: object
      description: "How this server holds one version right now. The same schema in two reads: per version under `GET
        /status`, and for one package at `GET …/packages/{packageName}/status`, where the per-package fields are also
        present. Reading it never loads the version."
      required:
        - versionId
        - status
        - loaded
      properties:
        resource:
          type: string
        environmentName:
          type: string
        packageName:
          type: string
        versionId:
          $ref: "#/components/schemas/VersionId"
        status:
          type: object
          required:
            - serving
            - loading
          properties:
            serving:
              type: boolean
              description: A compiled copy answers queries here now.
            loading:
              type: boolean
              description: A load or recompile is in progress here. A first load reports `loading` without `serving`.
            loadingSince:
              type: string
              format: date-time
        loaded:
          type: boolean
          description: Whether this server holds the version in memory.
        archived:
          type: boolean
        lastReadAt:
          type: string
          format: date-time
          description: When a request last read this version here.
        inFlightQueries:
          type: integer
          description: Queries running against this version right now.
        compiledFrom:
          type: string
          enum:
            - compile
            - cache
          description: Whether the served models came from a fresh compile or from the compiled-model store.
        compiledAt:
          type: string
          format: date-time
        schemaAsOf:
          type: string
          format: date-time
          description: When the warehouse schema the served models carry was read. Equals `compiledAt` unless the compile was a
            refresh.
        compiledModelBytes:
          type: integer
          format: int64
          description: Serialized size of the compiled-model entry, the cheapest honest memory proxy.
        manifestBinding:
          type: object
          description: Whether the version serves from materialized tables, and from which manifest.
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - unbound
                - bound
                - live_fallback
              description: "`unbound`: no manifest, the version serves live. `bound`: the configured manifest was applied.
                `live_fallback`: a manifest is configured but its fetch or bind failed, so what `location` names is
                still what is served."
            location:
              type:
                - string
                - "null"
              description: The manifest actually bound, which after a failed rebind differs from the configured one.
            entryCount:
              type: integer
        stale:
          type: object
          description: Present when the version serves a model older than its content because the newer content failed to compile.
          properties:
            since:
              type: string
              format: date-time
            message:
              type: string
        servedRevision:
          type: string
          description: Per-package read only. An identifier minted per load; moves on every reload whether or not content changed.
        sourceContentSha:
          type: string
          description: Per-package read only. SHA-256 over the model, skill and agent files being served; the reload receipt.
        bindings:
          type: array
          description: Per-package read only. What this version serves per source, as `GET …/versions/{versionId}/bindings` lists
            it.
          items:
            $ref: "#/components/schemas/Binding"
    Skill:
      type: object
      readOnly: true
      description: An agent skill with its full Markdown body.
      properties:
        name:
          type: string
          description: The skill's name.
        description:
          type: string
          description: One line saying when to read this skill.
        content:
          type: string
          description: The skill's full guidance, Markdown.
        origin:
          type: string
          enum:
            - bundled
            - package
          description: Where this skill came from. See SkillSummary.origin.
    SkillList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    SkillSummary:
      type: object
      readOnly: true
      description: One agent skill in force for a package, without its body. This is what a caller reads to decide which skill
        to fetch.
      properties:
        name:
          type: string
          description: The skill's name, and the identifier for fetching it. A name containing a slash (`<skill>/<stem>`) is one
            skill's on-demand reference file rather than a skill in its own right.
        description:
          type: string
          description: One line saying when to read this skill. Empty when the package author omitted it, which is also reported
            as a package warning.
        origin:
          type: string
          enum:
            - bundled
            - package
          description: "`bundled` = shipped with this server. `package` = shipped by the package under `skills/`, which includes a
            package skill whose name matches a bundled one and therefore REPLACES it for this package. Present so a
            caller can tell a replaced skill from the original, which is otherwise invisible."
    SnowflakeConnection:
      type: object
      description: Snowflake database connection configuration
      properties:
        account:
          type: string
          description: Snowflake account identifier
        username:
          type: string
          description: Snowflake username for authentication
        password:
          type:
            - string
            - "null"
          description: Snowflake password for authentication
        privateKey:
          type: string
          description: Snowflake private key for authentication
        privateKeyPass:
          type:
            - string
            - "null"
          description: Passphrase for the Snowflake private key
        warehouse:
          type: string
          description: Snowflake warehouse name
        database:
          type:
            - string
            - "null"
          description: Snowflake database name. Omitted or null connects with no current database, so names must be fully
            qualified as DATABASE.SCHEMA.TABLE and schema discovery spans the account.
        schema:
          type:
            - string
            - "null"
          description: Snowflake schema name. Sets the session default schema and forms part of the connection's identity, so it
            determines what a materialization build runs as. It does not restrict which schemas are discoverable.
        role:
          type:
            - string
            - "null"
          description: Snowflake role name
        responseTimeoutMilliseconds:
          type: integer
          description: Query response timeout in milliseconds
    Source:
      type: object
      description: A Malloy source defined in a model
      properties:
        name:
          type: string
          description: Name of the source
        annotations:
          type: array
          description: Annotations attached to the source
          items:
            type: string
        views:
          type: array
          description: Views defined in this source
          items:
            $ref: "#/components/schemas/View"
        givens:
          type: array
          description: Model-level givens (runtime parameters) available to queries on this source. Identical to
            `CompiledModel.givens`; repeated here for SDK ergonomics so consumers iterating sources can render inputs
            without a second lookup.
          items:
            $ref: "#/components/schemas/Given"
        authorize:
          type: array
          description: >-
            Effective `#(authorize)` expressions locking this source: a rule about the CALLER (`'literal' <op> $GIVEN`),
            or a whole-body `"true"`/`"false"` sentinel. It answers whether the caller may reach the source at all, so
            **a caller it does not admit is refused with HTTP 403** — not served zero rows. An empty or absent list
            means no lock.

            Reported whether the gate is declared on this source itself or carried in from elsewhere (the source it
            extends, a query-source base, a composite member). Where the gate registry cannot attribute an expression to
            a declaring source it reports `"false"` instead — a fail-closed placeholder, not something the author wrote,
            and one more reason to read this list only as "locked" rather than as a predicate.

            IMPORTANT for anything re-implementing the decision: this flat list is not a predicate you can evaluate, and
            it is not a count of one. A source may declare more than one gate of its OWN — repeats AND together — and
            the list also flattens every gate carried in, so several elements are normal; a query source over a
            composite reports the same authored gate twice, once from its base and once from the resolved member.
            Expressions from different declaring sources are likewise AND-ed rather than OR-ed. Treat the list as "at
            least these constraints apply": use it to decide THAT a source is locked, not to recompute WHETHER a given
            caller passes. Reading it as a pure disjunction grants where Publisher denies.

            Read the sentinels ELEMENT-WISE, never as a verdict on the list: a list is unlocked only when `"true"` is
            its SOLE element, because gates from different declaring sources are flattened in here and AND together, so
            `["true", "'finance' in $GROUPS"]` is a real shape and is locked. `"false"` needs no such care — anywhere in
            the list it denies.

            Givens are caller-asserted, so this is a boundary only behind a trusted tier — see docs/authorize.md.
          items:
            type: string
        accessFilter:
          type: array
          description: >-
            Effective `#(access_filter)` expressions filtering this source's rows: `field_path <op> $GIVEN`, grafted
            onto the source the query enters through. It answers which rows the caller may see, so **a caller it admits
            nowhere gets HTTP 200 with zero rows**, not a 403. An empty or absent list means no row filter.

            Do not read a 200 with zero rows as "no filter applied", and do not read a non-empty result as proof rows
            got through: an ungrouped aggregate is row-count-preserving over empty input, so `count()` returns one row
            reading 0 even when the filter admitted nothing.

            Same flattening, AND-not-OR and attribution caveats as `authorize` apply — this is a signal that the source
            is filtered, not a predicate to re-evaluate. There are no sentinels on this route: `true` and `false` belong
            to `authorize`. Givens are caller-asserted, so this is a boundary only behind a trusted tier — see
            docs/authorize.md.
          items:
            type: string
    SourceEntities:
      type: object
      readOnly: true
      description: What a model states about one source. See `ModelEntities.sources`.
      required:
        - modelPath
        - name
        - joinOnly
        - agentHidden
        - queryable
      properties:
        modelPath:
          type: string
          description: "The model file the facts are filed under: the reporting model, or, for a `joinOnly` source declared in
            another file, that file."
        name:
          type: string
          description: The source's name. Dotted (`orders.customer`) for a source that exists only inside a join.
        joinOnly:
          type: boolean
          description: Reached only through a join. Only `authorize` is reported for it.
        doc:
          type: string
          description: The source's own `#(doc)` text, when it has any.
        agentHidden:
          type: boolean
          description: The source, or the model file declaring it, carries `#(agent-hidden)`.
        queryable:
          type: boolean
          description: Whether this server runs a query against the source directly. False for a source outside the package's
            query surface.
        servedFrom:
          $ref: "#/components/schemas/EntitySourceAddress"
        authorize:
          type: array
          description: "The source's effective access gates: file-level ones first, then its own, `authorize` before
            `access_filter`."
          items:
            $ref: "#/components/schemas/EntityGate"
    SourceFailure:
      type: object
      description: One source that failed to materialize, and why. Kept beside the entries because a failed source names no
        table that exists.
      required:
        - sourceEntityId
        - reason
      properties:
        sourceEntityId:
          type: string
        sourceName:
          type: string
        reason:
          type: string
          description: Why this source failed, in the words the warehouse or compiler reported, redacted against the source's
            connection.
        callerTableId:
          type: string
          description: The caller's own table id from the instruction, so an orchestrator can match the failure to what it
            dispatched.
        tableName:
          type: string
          description: The table this source was headed for. Not a table that exists.
        connectionName:
          type: string
          description: The connection the table would have landed in.
        refused:
          type: boolean
          description: True when the eligibility gate refused the source before any build ran, so retrying returns the same answer
            until the model changes.
    SourceSchema:
      type: object
      readOnly: true
      required:
        - name
        - annotations
        - fields
      properties:
        name:
          type: string
        annotations:
          type: array
          items:
            type: string
          description: The annotations declared on the source itself.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SourceSchemaField"
    SourceSchemaField:
      type: object
      readOnly: true
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          description: One of `dimension`, `column`, `measure`, `view` or `join`; a later release may add one.
        name:
          type: string
        type:
          type: string
        annotations:
          type: array
          items:
            type: string
        fields:
          type: array
          description: A join's or a view's own fields.
          items:
            $ref: "#/components/schemas/SourceSchemaField"
    SqlRequest:
      type: object
      description: Ad-hoc SQL against a connection, for the schema browser and for operators.
      required:
        - statement
      properties:
        statement:
          type: string
        mode:
          type: string
          enum:
            - run
            - describe
          default: run
          description: "`run` executes and returns rows. `describe` compiles the statement and returns its result columns without
            running it."
        queryClass:
          $ref: "#/components/schemas/QueryClass"
        queryMetadata:
          $ref: "#/components/schemas/QueryMetadata"
        rowLimit:
          type: integer
          description: Cap on rows returned by `run`. The server's default applies when omitted.
    SqlResult:
      type: object
      required:
        - mode
        - columns
      properties:
        mode:
          type: string
          enum:
            - run
            - describe
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rows:
          type: array
          description: "Present for `run`: one object per row, keyed by column name."
          items:
            type: object
            additionalProperties: true
        rowLimitHit:
          type: boolean
        queryCorrelationId:
          type:
            - string
            - "null"
    SqlserverConnection:
      type: object
      description: "Microsoft SQL Server connection configuration: a SQL Server login over TCP. Field names are the
        connector's own (`@malloydata/db-sqlserver`), so a value here reaches the driver unchanged. The dialect is
        experimental upstream; Publisher accepts it on the model author's behalf, so a model needs no `##!
        experimental.dialect.sqlserver` pragma. The connection is read-only: a `#@ persist` on a SQL Server source is
        refused at load (see `RefusedSource.reason`)."
      properties:
        server:
          type: string
          description: SQL Server host name or IP address
        port:
          type: integer
          description: TCP port; 1433 when omitted. Not used when `instanceName` is set.
        database:
          type: string
          description: Name of the database to open
        user:
          type: string
          description: SQL Server login name
        password:
          type: string
          description: SQL Server login password
        encrypt:
          type: boolean
          description: Encrypt the connection with TLS. On when omitted, as the driver defaults it; a server that requires
            encryption refuses a connection with it off.
        trustServerCertificate:
          type: boolean
          description: Accept a server certificate the client cannot verify, such as a self-signed one on a local or test server.
            Off when omitted. Leave it off for any server you do not control; a certificate the client cannot verify
            then fails the connection rather than being trusted.
        hostNameInCertificate:
          type: string
          description: The host name the server's certificate is issued to, when it is not `server` (a server reached by IP
            address, or through a tunnel). Checked against the certificate when `encrypt` is on and
            `trustServerCertificate` is off.
        instanceName:
          type: string
          description: A named instance, located through the SQL Browser service (UDP 1434); `port` is then not used.
    SshProxyConfig:
      type: object
      description: SSH bastion / jump-host config for reaching a database inside a private network via an SSH local
        port-forward. Authentication is public-key only.
      required:
        - host
        - username
        - privateKey
      properties:
        host:
          type: string
          description: Bastion hostname or IP address (the SSH jump host)
        port:
          type: integer
          default: 22
          description: Bastion SSH port (defaults to 22)
        username:
          type: string
          description: SSH username on the bastion
        privateKey:
          type: string
          description: PEM-encoded SSH private key used to authenticate to the bastion. The customer authorizes the matching
            public key in the bastion's authorized_keys; public-key auth only.
        privateKeyPass:
          type: string
          description: Passphrase for the encrypted private key, if any.
        hostKey:
          type: string
          description: |
            Optional pinned bastion host public key(s), as one or more OpenSSH
            known_hosts lines (or bare base64 blobs), verified on every connect.
            List multiple lines to pin a load-balanced/HA bastion that presents a
            different key per backend — any listed key is accepted; a mismatch
            fails the connection closed. Plain and hashed (`|1|…`) lines both work
            — only the key blob is compared, never the hostname. When omitted, the
            tunnel connects without host-key verification (the self-service
            default); the SSH transport is still encrypted.
    StrippedTerm:
      type: object
      required:
        - code
        - givens
      description: One `where:` conjunct a storage build leaves out of the artifact and the read puts back. Its `code` is the
        author's verbatim expression, which is what a serve shape re-emits; `givens` are the names that expression
        reads, which is what the shape must declare for it to compile.
      properties:
        code:
          type: string
          description: The author's verbatim filter expression, e.g. `org_id = $ORG_ID`.
        givens:
          type: array
          items:
            type: string
          description: The given names this term reads, in first-seen order. A reader must bind these for the term to apply;
            binding none applies each given's declared default, as a live query would.
    TableDescription:
      type: object
      description: Database table structure and metadata
      properties:
        name:
          type: string
          description: Name of the table
        rowCount:
          type: integer
          description: Number of rows in the table
        columns:
          type: array
          description: List of columns in the table
          items:
            $ref: "#/components/schemas/Column"
    TableDetail:
      type: object
      description: A table with its columns.
      required:
        - name
        - columns
      properties:
        resource:
          type: string
        schemaName:
          type: string
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rowCount:
          type:
            - integer
            - "null"
    TableSummary:
      type: object
      description: A table as a schema listing names it.
      required:
        - name
      properties:
        resource:
          type: string
        schemaName:
          type: string
        name:
          type: string
    TableSummaryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TableSummary"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    TrinoConnection:
      type: object
      description: Trino database connection configuration
      properties:
        server:
          type: string
          description: Trino server hostname or IP address
        port:
          type: number
          description: Trino server port number
        catalog:
          type: string
          description: Trino catalog name
        schema:
          type: string
          description: Trino schema name
        user:
          type: string
          description: Trino username for authentication
        password:
          type: string
          description: Trino password for authentication
        peakaKey:
          type: string
          description: Peaka API key for authentication with Peaka-hosted Trino clusters
    Version:
      type: object
      description: An immutable snapshot of a package's content. Its content never changes; its lifecycle fields (`archived`,
        `loaded`, `pinned`, `manifestLocation`) do, through `PATCH`.
      required:
        - versionId
        - seq
        - origin
        - contentHash
        - archived
        - pinned
        - createdAt
      properties:
        resource:
          type: string
          readOnly: true
        environmentName:
          type: string
          readOnly: true
        packageName:
          type: string
          readOnly: true
        versionId:
          $ref: "#/components/schemas/VersionId"
        seq:
          type: integer
          format: int64
          readOnly: true
          description: Server-assigned order within the package. `latest` and retention follow it, not semver precedence.
        latest:
          type: boolean
          readOnly: true
        origin:
          type: string
          enum:
            - publish
            - reload
            - edit
            - migration
          readOnly: true
          description: "`publish`: the author's. `reload`: a re-fetch of the source that changed. `edit`: a report write.
            `migration`: imported from a pre-v1 store."
        parentVersionId:
          oneOf:
            - $ref: "#/components/schemas/VersionId"
            - type: "null"
          readOnly: true
          description: The version a server-made version was made from; undo is pointing `latestVersionId` back at it.
        contentHash:
          type: string
          readOnly: true
          description: SHA-256 over the version's effective content tree.
        sourceFingerprint:
          type:
            - string
            - "null"
          readOnly: true
          description: What a reload compares before fetching (a git commit sha, an object etag, or the source tree hash).
        description:
          type: string
          readOnly: true
          description: The version's `publisher.json` description.
        scope:
          type: string
          enum:
            - package
            - version
          readOnly: true
          description: The version's materialization scope, from its `publisher.json`.
        materialization:
          $ref: "#/components/schemas/PackageMaterializationConfig"
        archived:
          type: boolean
          description: Out of service; reads that name it answer 410. Set with `PATCH`; refused while it is `latest`, the last
            active version, or building.
        pinned:
          type: boolean
          description: Exempt from server-made-version retention. Set with `PATCH`.
        loaded:
          type: boolean
          description: 'Whether this server holds it in memory. `PATCH {"loaded": false}` unloads; a read loads. 409 while a run
            holds it.'
        manifestLocation:
          type:
            - string
            - "null"
          description: An externally computed manifest bound to this version, or null to serve live. Set with `PATCH`.
        warnings:
          type: array
          readOnly: true
          description: Non-fatal findings from the load, as the package's `publisher.json`, models and reports produced them.
          items:
            $ref: "#/components/schemas/LoadWarning"
        gitCommitSha:
          type:
            - string
            - "null"
          readOnly: true
        gitRef:
          type:
            - string
            - "null"
          readOnly: true
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        promotedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        demotedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
    VersionId:
      type: string
      pattern: ^(live|\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$
      description: "A resolved version: a semantic version, or `live` for a live (watched) package, which has no stored
        versions. A `live` version is never listed by `GET …/versions`, has no `seq`, and refuses `PATCH` and `DELETE`
        with 409 `PACKAGE_IS_LIVE`."
    VersionIdPattern:
      type: string
      pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$
      description: "A package version: a semantic version (SemVer 2.0), MAJOR.MINOR.PATCH with an optional pre-release suffix
        (`-rc1`, `-alpha.2`) and optional build metadata (`+20231120.deadbeef`). Pre-release and build suffixes are
        accepted so release-candidate builds can be published. A numeric identifier may have leading zeros (`01.0.0`),
        which strict SemVer 2.0 does not allow, so a version a system in front of Publisher validated with this same
        pattern is never refused. Such a version compares equal to the one without the zeros, and a package holds only
        one of the two: publishing the other is 409 `VERSION_CONFLICT`."
    VersionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    VersionRef:
      type: string
      pattern: ^(latest|live|\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$
      description: "A version in a path: the version's id (a semantic version, build metadata included, so `1.4.0+edit.3`
        names a server-made version), the reserved word `latest` for the package's latest version, or the reserved word
        `live`, the one pseudo-version of a live (watched) package, which `latest` resolves to there. A request that
        names `latest` on a package with none answers 404 `VERSION_NOT_FOUND`."
    View:
      type: object
      description: Named model view definition
      properties:
        name:
          type: string
          description: Name of the view
        annotations:
          type: array
          description: Annotations attached to the view
          items:
            type: string
